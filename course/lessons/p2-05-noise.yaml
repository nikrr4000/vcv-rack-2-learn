id: p2-05-noise
num: "2.5"
part: 2
title: "Шум: 7 цветов"
goal: Отличать цвета шума по картинке на Scope и на слух, выбирать выход Noise под задачу — ветер, шипение, хэт.
builds: Материал для ударных и атмосферы. Хэт, малый барабан и ветер в частях 3, 8 и 9 строятся на шуме.
minutes: 25
requires: [p1-01-sound-wave]
glossary: [шум, цвет шума, спектральный наклон]
sources: [vcv-free-manual, pc-learning-synthesis, lm-basic-concepts]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: "Шум: 7 цветов"
    page: |
      # 2.5 Шум: 7 цветов
      **Ты научишься:** отличать цвета [[шум|шума]] на экране **Scope** и на слух и выбирать нужный выход модуля **Noise**.
      **Ты соберёшь:** белый и красный шум на двух каналах Scope, красный — ещё и в колонки.
      **Понадобится:** 25 минут и тихая громкость: шум резкий.
      В части 3 шум станет ветром, в части 8 — хэтом и малым барабаном.
    figure: { template: table, rows: [["Выход", "Наклон", "Что сравнить"], ["White noise", "0 дБ/окт", "ровное шипение"], ["Red noise", "−6 дБ/окт", "низкий гул"], ["Violet noise", "+6 дБ/окт", "тонкий шип"]], caption: "Три цвета из семи. Наклон показывает, в какую сторону уходит энергия." }
    faq:
      - q: Зачем нужен шум, если есть VCO?
        a: Из VCO получаются ноты, а из шума ударные, ветер и дыхание. У шума нет высоты, поэтому он нужен для звуков без определённой ноты.
      - q: Шум будет громким?
        a: Да, он резкий. Начни с тихой громкости в системе и ручки Level у Audio. Демо звучит только в активном ряду.
      - q: Почему у шума есть «цвет»?
        a: Название взято из света. Белый свет содержит все цвета поровну, белый шум — все частоты. Цвет шума показывает, каких частот больше.

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса до объяснений. Ошибаться можно, ответы покажут, что разобрать в уроке.
    questions:
      - q: Что такое «цвет» шума?
        free: true
        options:
          - { text: Распределение энергии по частотам, correct: true, why: "Цвет показывает, каких частот в шуме больше и каких меньше. Цветом на экране он не виден." }
          - { text: "Высота тона, на которой шум «играет»", why: "У шума нет ноты: значения случайны и не повторяются. Есть только окраска." }
          - { text: Оттенок линии на экране Scope, why: "Название образное. Scope рисует напряжение во времени одним цветом." }
      - q: Какой выход Noise даст самый низкий гул?
        options:
          - { text: Red noise, correct: true, why: "У красного шума наклон −6 дБ на октаву, низких частот в нём больше всего." }
          - { text: Violet noise, why: "Фиолетовый наклонён в другую сторону, +6 дБ на октаву. Он колючий, а не гудящий." }
          - { text: White noise, why: "Белый шум ровный по частотам, не низкий. Он шипит и звучит ярче красного." }
      - q: Почему у модуля Noise нет ручек?
        options:
          - { text: "Цвет выбирается выходом, а громкость и тембр делают другие модули", correct: true, why: "У Noise семь выходов, по одному на цвет. Кабель сам выбирает цвет." }
          - { text: Ручки скрыты в контекстном меню, why: "Ручек у модуля нет вовсе, и меню их не добавляет." }
          - { text: Модуль загрузился не полностью, why: "Пустая панель здесь норма. Так устроен модуль." }

  - id: b3
    type: story
    preset: story
    title: Шум и его цвет
    page: |
      # Шум без ноты
      Волна VCO повторяется, поэтому у неё есть нота. [[шум|Шум]] не повторяется: значения случайны.
      Ноты у него нет, есть только окраска. Её называют [[цвет шума|цветом]].
      Цвет показывает, каких частот в шуме больше. В белом они ровные. В красном больше низа, в фиолетовом больше верха.
      Шум не звучит как инструмент. Он материал для ветра, дыхания, хэта и малого барабана.
    figure: { template: table, rows: [["Цвет", "Куда уходит энергия", "Пример"], ["Белый", "поровну", "шипение"], ["Красный", "вниз", "рокот ветра"], ["Фиолетовый", "вверх", "хэт"]], caption: "Три цвета и что из них делают." }
    simpler: Представь воду. Белый шум — ровный дождь по крыше. Красный — далёкий прибой, в нём больше низких ударов. Фиолетовый — тонкий звон капель.
    faq:
      - q: Если у шума нет ноты, зачем его настраивать?
        a: "Настраивать нечего. Шум меняют обработкой: фильтром оставляют часть частот, огибающей задают, когда он звучит. Это части 3 и 8."
      - q: Цвет шума — это про цвет на экране?
        a: Нет. Название образное. На экране видна рваная или плавная линия, а цвет определяет распределение частот.
      - q: Шум случайный. Звучит каждый раз по-разному?
        a: Значения случайны, но окраска одна и та же. На слух белый шум всегда ровно шипит, хотя точные значения не повторяются.

  - id: b4
    type: story
    preset: story
    title: Наклон спектра
    page: |
      # Наклон спектра
      Цвета различаются [[спектральный наклон|наклоном спектра]]: на сколько децибел меняется мощность с каждой октавой.
      - **Белый** — 0 дБ на октаву, ровно.
      - **Розовый** — −3 дБ, чуть больше низа.
      - **Красный** — −6 дБ, низкий гул.
      - **Синий** — +3 дБ, чуть больше верха.
      - **Фиолетовый** — +6 дБ, колючий шип.
      Серый выровнен по восприятию громкости. Чёрный в этом модуле — равномерные случайные числа.
    figure: { template: table, rows: [["Цвет", "Наклон"], ["Красный", "−6 дБ"], ["Розовый", "−3 дБ"], ["Белый", "0 дБ"], ["Синий / фиолетовый", "+3 / +6 дБ"]], caption: "От красного к фиолетовому: баланс уходит от низа к верху." }
    faq:
      - q: Что значит «−6 дБ на октаву»?
        a: С каждой октавой вверх мощность в шуме падает на 6 децибел. Низких частот много, высоких мало. Поэтому красный шум гудит.
      - q: Чёрный шум — это тишина?
        a: В этом модуле нет. Black noise — равномерные случайные числа. Название в разных источниках трактуют по-разному.
      - q: Чем серый отличается от розового?
        a: "Серый шум выровнен под чувствительность уха: на слух кажется ровным по громкости. Розовый определяется наклоном в −3 дБ. Сравни их на слух."

  - id: b5
    type: live
    preset: live
    title: Белый и красный
    page: |
      # Белый и красный
      **Noise** отдаёт белый шум в **Ch 1** у Scope и красный в **Ch 2**. Красный идёт ещё и в колонки.
      Сравни картинки. У белого линия рваная и частая. У красного колебания плавнее и медленнее.
      Слушай красный: низкий гул. Потом переложи кабель, который идёт в Audio, на `Violet noise` и сравни на слух.
    modules:
      - { ref: noise, plugin: Fundamental, slug: Noise }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "20" }, Gain 1: { display: "10" }, Gain 2: { display: "10" } }
    cables:
      - { from: [noise, White noise], to: [scope, Ch 1] }
      - { from: [noise, Red noise], to: [scope, Ch 2] }
      - { from: [noise, Red noise], to: [audio, "To \"device output 1\""] }
    notes:
      - after: noise
        text: "Семь выходов, семь цветов. Кабель сам выбирает цвет."
        targets: [{ module: noise, output: White noise }, { module: noise, output: Red noise }]
      - after: scope
        text: "**Time** 20 мс: видны детали линии. Шум не имеет периода, поэтому Trigger не нужен."
        targets: [{ module: scope, param: Time }]
    faq:
      - q: Картинка на Scope дёргается и не стоит. Это нормально?
        a: Да. У шума нет периода, останавливать нечего. Trigger здесь не помогает, смотри на характер линии, а не на положение.
      - q: Не слышу разницы между цветами.
        a: "Убедись, что звуковой кабель переложен. Сравни не по громкости, а по тому, где больше энергии: внизу (гул) или вверху (шип)."
      - q: Красный слишком тихий.
        a: Красный шум имеет большой размах только в низких частотах, уши слышат их хуже. Подними Level у Audio или переключись на Pink noise.

  - id: b6
    type: anatomy
    preset: anatomy
    title: Панель Noise
    page: |
      # Панель Noise
      У **Noise** нет ручек и входов. Только семь выходов, сверху вниз.
    module: { ref: noise, plugin: Fundamental, slug: Noise }
    notes:
      - { text: "**White noise** — 0 дБ на октаву: ровное шипение.", targets: [{ module: noise, output: White noise }] }
      - { text: "**Pink noise** (−3 дБ) и **Red noise** (−6 дБ): чем ниже наклон, тем больше низа.", targets: [{ module: noise, output: Pink noise }, { module: noise, output: Red noise }] }
      - { text: "**Blue noise** (+3 дБ) и **Violet noise** (+6 дБ): больше верха.", targets: [{ module: noise, output: Blue noise }, { module: noise, output: Violet noise }] }
      - { text: "**Gray noise** выровнен по громкости на слух.", targets: [{ module: noise, output: Gray noise }] }
      - { text: "**Black noise** — равномерные случайные числа.", targets: [{ module: noise, output: Black noise }] }
      - { text: "Громкость и тембр шума задают модули дальше по цепочке." }
    faq:
      - q: Выход Noise ничего не показывает на Scope.
        a: Выход отдаёт сигнал, только когда в него воткнут кабель. Подключи нужный цвет к Scope.
      - q: Чем Pink noise хорош для начала?
        a: "Он ближе к тому, как мы слышим естественные шумы: дождь, ветер. Не такой резкий, как белый, и не такой гулкий, как красный."
      - q: Нужны ли мне все семь выходов?
        a: Нет. В курсе чаще всего используют красный для ветра и белый или фиолетовый для хэта. Остальные полезны для сравнения.

  - id: b7
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: Оба кабеля с `Red noise` идут в **Ch 2** и в Audio. Переложи их на `Pink noise`, потом на `Blue noise` и `Violet noise`.
        see: Линия всё мельче и резче. На слух гул превращается в шип.
      - do: Переложи оба кабеля на `Gray noise`, потом на `Pink noise` и послушай.
        see: Сравни, какой из двух кажется ровнее по громкости, и опиши разницу своими словами.
      - do: Поставь **Time** на 5, потом на 50 и на 500.
        see: На 5 мс видны детали, на 500 мс картина сливается в сплошную полосу.
      - do: Поверни **Gain 1** вверх и вниз.
        see: Линия растягивается по вертикали, звук не меняется.
      - do: Подключи `Black noise` к **Ch 2** и сравни с белым.
        see: Распределение значений другое. Сформулируй, чем картина отличается.
    modules:
      - { ref: noise, plugin: Fundamental, slug: Noise }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "20" }, Gain 1: { display: "10" }, Gain 2: { display: "10" } }
    cables:
      - { from: [noise, White noise], to: [scope, Ch 1] }
      - { from: [noise, Red noise], to: [scope, Ch 2] }
      - { from: [noise, Red noise], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: noise, text: "В шагах 1, 2 и 5 перекладывай кабели между выходами.", targets: [{ module: noise, output: Pink noise }, { module: noise, output: Black noise }] }
      - { after: scope, text: "Шаги 3 и 4 — Time и Gain 1.", targets: [{ module: scope, param: Time }, { module: scope, param: Gain 1 }] }
    faq:
      - q: Звук не изменился, хотя я переложил кабель на Scope.
        a: Звук идёт по другому кабелю, в Audio. Переложи и его на тот же выход. Кабель Scope меняет только картинку.
      - q: Что значит «детали» на 5 мс?
        a: При малом Time экран охватывает очень короткий отрезок, и видны отдельные скачки значений. При 500 мс скачки сливаются в полосу.
      - q: Какой цвет лучше всего подходит для ветра?
        a: Для рокота подойдёт красный, для более ровного шума ветра розовый. Выбери на слух и запомни, что цвет решает, где энергия.

  - id: b8
    type: practice
    preset: practice
    title: Практика — рокот ветра
    task: |
      Собери сравнение цветов между маркерами «Верстак».
      1. Поставь **Noise** и **Scope**.
      2. `White noise` → `Ch 1`, `Red noise` → `Ch 2` у Scope.
      3. `Red noise` ещё и в `To "device output 1"` у Audio. Убавь громкость.
      4. Сравни картинки и подумай: какой цвет ты возьмёшь для хэта, а какой для ветра.
      Потом нажми «Проверить».
    given: [audio]
    check: p2-05-noise
    hints:
      "cable:1":
        - "Сравнивать нечего: нет одной из линий."
        - Какой выход Noise идёт в первый вход Scope?
        - "`White noise` → вход `Ch 1` у Scope."
      "cable:2":
        - Красного шума на экране нет.
        - Какой выход Noise идёт во второй вход Scope?
        - "`Red noise` → вход `Ch 2` у Scope."
      "cable:3":
        - Красного шума не слышно.
        - Куда звук уходит из Noise наружу?
        - "`Red noise` → `To \"device output 1\"` у Audio."
      "probe:1":
        - На белом шуме нет сигнала.
        - Воткнут ли кабель в выход White noise?
        - "Проведи `White noise` в `Ch 1` у Scope: выход работает только с кабелем."
      "probe:2":
        - На красном шуме нет сигнала.
        - Воткнут ли кабель в выход Red noise?
        - "Проведи `Red noise` в `Ch 2` у Scope и в `To \"device output 1\"` у Audio."
    faq:
      - q: Один выход Noise может питать два кабеля?
        a: Да. Red noise идёт и в Scope, и в Audio. Выход один, кабелей два.
      - q: Шум слишком громкий. Что убавить?
        a: Ручку Level у Audio и громкость в системе. У Noise ручек нет, громкость задаётся дальше по цепочке.
      - q: Какой цвет брать для ветра, а какой для хэта?
        a: Для ветра красный или розовый, они гудят. Для хэта фиолетовый или белый, они шипят. Окончательный выбор на слух, в частях 3 и 8.

  - id: b9
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Красный шум звучит в колонках, но на втором канале Scope пусто.
      Найди одну ошибку и исправь её одним кабелем.
    modules:
      - { ref: noise, plugin: Fundamental, slug: Noise }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "20" }, Gain 1: { display: "10" }, Gain 2: { display: "10" } }
    cables:
      - { from: [noise, White noise], to: [scope, Ch 1] }
      - { from: [noise, Red noise], to: [scope, Ch 2] }
      - { from: [noise, Red noise], to: [audio, "To \"device output 1\""] }
    break: { remove_cable: [noise, Red noise, scope, Ch 2] }
    check: { kind: fixed, expect_cable: [noise, Red noise, scope, Ch 2] }
    hints:
      fixed:
        - Звук есть, а картинки красного шума нет. Куда идёт красный кабель?
        - Посмотри на второй вход Scope.
        - Соедини `Red noise` у Noise с `Ch 2` у Scope.
    faq:
      - q: Звук есть, значит с кабелем всё в порядке?
        a: Нет. Выход питает несколько кабелей независимо. Один кабель в Audio работает, а кабеля в Scope нет, поэтому картинки нет.

  - id: b10
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - Шум случаен, у него нет ноты, есть цвет.
      - Цвета различаются наклоном спектра: красный −6 дБ на октаву, розовый −3, белый 0, синий +3, фиолетовый +6.
      - Красный и розовый гудят, белый шипит, фиолетовый колет.
      - Цвет выбирается выходом Noise, у модуля нет ручек.
      Сохрани патч: ⌘S сохраняет твою копию урока.
      **Источники:** руководство VCV Free (Noise); обзор шума из серии «Learning Synthesis» (Perfect Circuit); курс «The Basic Concepts of Synthesis» (Learning Modular).
    questions:
      - q: Тебе нужен низкий рокот ветра. Какой выход берёшь?
        options:
          - { text: Red noise, correct: true, why: "У красного шума больше всего низких частот, он гудит. Для ветра это подходящая основа." }
          - { text: Violet noise, why: "Фиолетовый уходит вверх и колет. Для хэта он подходит, для ветра нет." }
          - { text: White noise, why: "Белый шипит ровно, в нём нет явного низа. Рокот красный." }
    next: |
      # Дальше: 3.1
      **VCF.** Фильтр убирает лишние частоты, и сырой звук превращается в тембр.
    faq:
      - q: Нужно ли помнить все семь цветов?
        a: "Нет. Запомни главное: красный гудит, белый шипит, фиолетовый колет. Остальные найдёшь по этой шкале."
      - q: Что повторить, если цвета не различаются?
        a: Ряд «Белый и красный». Сравни два цвета на Scope и на слух по очереди, потом добавь фиолетовый.
