id: p1-01-sound-wave
num: "1.1"
part: 1
title: Звук как волна
goal: Отличать четыре формы волны VCO на слух и на экране, понимать частоту, амплитуду и тембр, читать Scope.
builds: «Глаз» курса — VCO, подключённый к Scope и к выходу. Он нужен в каждом следующем уроке.
minutes: 25
requires: [p0-03-audio-out]
glossary: [частота, амплитуда, тембр, гармоники, форма волны]
sources: [sos-01, lm-basic-concepts, zwook-geogenik]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: Звук как волна
    page: |
      # 1.1 Звук как волна
      **Ты научишься:** отличать четыре формы волны на слух и на экране, читать **Scope** (осциллограф).
      **Ты соберёшь:** VCO → Scope → Audio — «глаз» курса. Он понадобится в каждом уроке.
      **Понадобится:** 25 минут, наушники или колонки на тихой громкости.
      Урок идёт рядами: один ряд — одна мысль. Кнопка «Дальше →» в Навигаторе или в панели справа переводит к следующему ряду.
    figure: { template: waveforms, shapes: [sine, triangle, saw, square], periods: 2, caption: Четыре формы волны одного VCO на одной частоте. }
    faq:
      - q: Зачем мне Scope, если я и так слышу звук?
        a: Ухо говорит «ярче» или «глуше», а Scope показывает почему — форму волны. Дальше по курсу ты будешь проверять свои патчи по экрану, а не только на слух.
      - q: Звук будет громким?
        a: Нет, если начать с тихой громкости. Сначала убавь звук в системе, потом поднимай ручку Level у модуля Audio. Демо в уроке звучит только в активном ряду.
      - q: Где кнопка «Дальше»?
        a: В Навигаторе — первом модуле этого ряда — и в панели справа. Там же список всех рядов урока.

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса до объяснений. Ошибаться можно: ответы покажут, о чём будет урок.
    questions:
      - q: Ты берёшь ту же ноту на октаву выше. Что изменилось в волне?
        free: true
        options:
          - { text: Частота выросла вдвое, correct: true, why: "Октава вверх — это удвоение частоты: период стал вдвое короче." }
          - { text: Амплитуда выросла вдвое, why: "Выше — не значит громче. Размах волны тот же, меняется только частота." }
          - { text: Изменилась форма волны, why: "Форма отвечает за тембр, а не за высоту. Пила на октаву выше — всё та же пила." }
      - q: Пила и синус звучат на одной частоте и одинаково громко, но по-разному. Почему?
        options:
          - { text: У них разный набор гармоник, correct: true, why: "В пиле много призвуков, кратных основной частоте, в синусе — только основной тон." }
          - { text: У пилы выше частота, why: "Частота одна и та же: высота тона совпадает. Различается состав звука." }
          - { text: У пилы больше амплитуда, why: "Размах одинаковый. Пила кажется громче, потому что ярче, но это тембр, а не громкость." }
      - q: Что отложено по горизонтальной оси экрана Scope?
        options:
          - { text: Время, correct: true, why: "Scope рисует напряжение во времени: слева направо идут миллисекунды." }
          - { text: Частота, why: "Так устроен анализатор спектра. Scope показывает, как напряжение меняется во времени." }
          - { text: Напряжение, why: "Напряжение — по вертикали. По горизонтали идёт время." }

  - id: b3
    type: story
    preset: story
    title: Частота и амплитуда
    page: |
      # Частота и амплитуда
      Звук — это колебание. Один повтор колебания — **период**. Число повторов в секунду — [[частота]], она измеряется в **герцах (Гц)**.
      Чем выше частота, тем выше тон. Октава вверх — частота вдвое больше: ля первой октавы — 440 Гц, ля второй — 880 Гц.
      У VCO в Rack ручка **Frequency** (частота) в середине даёт до первой октавы, около 261,63 Гц.
      [[амплитуда|Амплитуда]] — размах колебания, «высота» пика на экране. Для уха это громкость.
      У VCO размах постоянный, около ±5 В. Громкость ты будешь менять дальше по цепочке: сейчас ручкой Level у Audio, позже модулем VCA.
    figure: { template: waveforms, shapes: [sine, sine], periods: [2, 4], labels: [440 Гц, 880 Гц], caption: "Октава вверх: на том же отрезке времени вдвое больше периодов." }
    simpler: Представь качели. Сколько раз в секунду они проходят нижнюю точку — это частота. Как высоко взлетают — амплитуда. Чаще качаются — выше звук, выше взлетают — громче.
    faq:
      - q: Почему октава — это ровно вдвое?
        a: Так устроен слух. Два звука с частотами 1:2 мы слышим как одну ноту, только выше. Поэтому в Rack 1 В на входе высоты поднимает частоту ровно вдвое — об этом урок 1.3.
      - q: Громкость и амплитуда — одно и то же?
        a: Почти. Амплитуда — размах напряжения, громкость — то, как мы его слышим. Больше размах — громче звук, но ухо по-разному чувствует разные частоты.
      - q: Почему у VCO нет ручки громкости?
        a: Так принято в модульных системах. Генератор делает волну постоянного размаха, а громкость решают модули дальше по цепочке — VCA и Level у Audio.

  - id: b4
    type: story
    preset: story
    title: Тембр и гармоники
    page: |
      # Тембр и гармоники
      Две волны одной высоты и громкости могут звучать по-разному. Эта разница — [[тембр]].
      Любая повторяющаяся волна складывается из синусов, кратных основной частоте. Это [[гармоники]]: первая — основной тон, вторая вдвое выше, третья втрое.
      - **Синус** — только основной тон.
      - **Треугольник** — нечётные гармоники, они быстро слабеют.
      - **Пила** — все гармоники, каждая слабее предыдущей.
      - **Квадрат** — только нечётные, слабеют медленнее, чем у треугольника.
      Больше гармоник — ярче звук. В уроке 3.1 ты будешь убирать лишние гармоники фильтром.
    figure: { template: harmonics, shape: saw, count: 8, law: 1/n, caption: "Пила: все гармоники, сила каждой — 1/n." }
    simpler: Нота на гитаре и на флейте может быть одной высоты, но ты их не перепутаешь. Это и есть тембр. Гармоники — как специи в блюде, основа одна, а вкус разный.
    faq:
      - q: Если в пиле столько гармоник, почему я слышу одну ноту?
        a: Гармоники сливаются в один звук и определяют его окраску, а высоту задаёт основная частота. Отдельно их слышно, только если вслушиваться или убрать часть фильтром.
      - q: Квадрат и треугольник — оба с нечётными гармониками. Почему звучат по-разному?
        a: У треугольника гармоники слабеют очень быстро (как 1/n²), поэтому он мягкий, почти как синус. У квадрата они слабеют медленнее (1/n), и звук получается гулким и ярким.
      - q: Где взять гармоники, которых нет в волне?
        a: Их добавляют другие приёмы — синхронизация и частотная модуляция в уроке 2.2. Фильтр гармоники только убирает.

  - id: b5
    type: live
    preset: live
    title: Четыре формы волны
    page: |
      # Четыре формы волны
      Перед тобой **VCO**, подключённый к **Scope** и к выходу. Канал 1 показывает синус, канал 2 — пилу.
      Звучит пила. Кабель в **Audio** переложи из `Sawtooth` в `Square`, потом в `Triangle` и `Sine`. Экран при этом не меняется: на нём остаются синус и пила. Чтобы увидеть новую форму, переложи туда же кабель в `Ch 2`.
      Высота не меняется — меняется тембр. Сравни, что слышно и что видно на экране.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "10" }, Trigger: Enabled, Gain 1: { display: "10" }, Gain 2: { display: "10" } }
    cables:
      - { from: [vco, Sine], to: [scope, Ch 1] }
      - { from: [vco, Sawtooth], to: [scope, Ch 2] }
      - { from: [vco, Sawtooth], to: [audio, "To \"device output 1\""] }
    notes:
      - after: vco
        text: Четыре выхода — четыре формы волны. Кабель на звук идёт из `Sawtooth`.
        targets: [{ module: vco, output: Sine }, { module: vco, output: Sawtooth }]
      - after: scope
        text: "**Time** — сколько миллисекунд помещается на экран. Сейчас 10 мс: около двух периодов."
        targets: [{ module: scope, param: Time }]
      - after: scope
        text: "**Trigger** в положении Enabled держит картинку на месте."
        targets: [{ module: scope, param: Trigger }]
    faq:
      - q: Почему пила звучит ярче синуса?
        a: В пиле много гармоник — призвуков, кратных основной частоте. В синусе только одна. Больше гармоник — ярче тембр.
      - q: Переложил кабель на Sine — звук стал тише. Это нормально?
        a: Да. Синус без гармоник звучит мягко и кажется тише, хотя размах тот же. Сравни линии на Scope — высота пиков одинаковая.
      - q: Почему на экране две линии разного цвета?
        a: У Scope два канала. Канал 1 — синус из выхода Sine, канал 2 — пила из выхода Sawtooth. Так формы удобно сравнивать на одной частоте.

  - id: b6
    type: anatomy
    preset: anatomy
    title: Панель Scope
    page: |
      # Панель Scope
      **Scope** рисует напряжение во времени: по вертикали вольты, по горизонтали время.
      Подписи справа указывают на главные ручки. Остальные понадобятся позже.
    module: { ref: scope, plugin: Fundamental, slug: Scope }
    notes:
      - { text: "Входы **Ch 1** и **Ch 2** — два канала, две линии.", targets: [{ module: scope, input: Ch 1 }, { module: scope, input: Ch 2 }] }
      - { text: "**Time** — ширина экрана во времени. Меньше число — волна растянута.", targets: [{ module: scope, param: Time }] }
      - { text: "**Trigger**: Enabled — картинка стоит, Disabled — плывёт.", targets: [{ module: scope, param: Trigger }] }
      - { text: "**Trigger threshold** — напряжение, с которого стартует развёртка.", targets: [{ module: scope, param: Trigger threshold }] }
      - { text: "**Gain 1** — масштаб первого канала по вертикали. Подробнее в уроке 1.2.", targets: [{ module: scope, param: Gain 1 }] }
      - { text: "**Scope mode**: «1 x 2» — режим XY, он понадобится в части 4.", targets: [{ module: scope, param: Scope mode }] }
    later:
      - { what: Gain и Offset обоих каналов, lesson: "1.2" }
      - { what: "Вход External trigger", lesson: "5.1" }
      - { what: "Вход 1V/octave pitch у VCO", lesson: "1.3" }
    faq:
      - q: Волна на экране бежит. Что крутить?
        a: Переключатель Trigger в Enabled. Если не помогло, поставь Trigger threshold около 0 В — внутрь размаха волны.
      - q: Меняет ли Scope звук?
        a: Нет. Scope только смотрит на сигнал. Его ручки меняют картинку, звук остаётся прежним.
      - q: Зачем у Scope выходы Ch 1 и Ch 2?
        a: Чтобы вставить Scope в середину цепочки и вести сигнал дальше. В этом уроке они не нужны.

  - id: b7
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Поверни **Frequency** у VCO на октаву вверх, до 523,25 Гц."
        see: Тон выше, на экране вдвое больше периодов.
      - do: Поверни **Frequency** вниз, до 130,81 Гц.
        see: Тон ниже, периоды вдвое длиннее.
      - do: "Поставь **Time** у Scope на 5, потом на 500."
        see: Звук тот же, картинка сжимается и растягивается. Time меняет только вид.
      - do: "Переключи **Trigger** в Disabled и обратно."
        see: При Disabled картинка плывёт, при Enabled стоит. В звуке ничего не меняется.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "10" }, Trigger: Enabled, Gain 1: { display: "10" }, Gain 2: { display: "10" } }
    cables:
      - { from: [vco, Sine], to: [scope, Ch 1] }
      - { from: [vco, Sawtooth], to: [scope, Ch 2] }
      - { from: [vco, Sawtooth], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: vco, text: Крути эту ручку в шагах 1 и 2., targets: [{ module: vco, param: Frequency }] }
    faq:
      - q: Кручу Frequency, а ничего не меняется.
        a: Проверь, что крутишь ручку того VCO, от которого идут кабели к Scope. Если ручка в крайнем положении, частота вышла за удобный диапазон — верни её к середине.
      - q: Как поставить ровно 523,25 Гц?
        a: Наведи курсор на ручку — Rack покажет значение. Двойной щелчок по ручке сбрасывает её в середину, а правый щелчок открывает поле для точного числа.

  - id: b8
    type: practice
    preset: practice
    title: Практика — глаз курса
    task: |
      Собери на верстаке патч, где Scope показывает синус и пилу одной частоты.
      1. Поставь между маркерами **VCO** и **Scope**.
      2. `Sine` → `Ch 1`, `Sawtooth` → `Ch 2` у Scope.
      3. `Sawtooth` ещё и в `To "device output 1"` у Audio этого ряда.
      4. **Time** не больше 20, **Trigger** — Enabled.
      Потом нажми «Проверить».
    given: [audio]
    check: p1-01-sound-wave
    hints:
      "cable:1":
        - Какая линия на экране пустая?
        - Посмотри, в какой вход Scope должен прийти синус.
        - "Кабель из `Sine` у VCO во вход `Ch 1` у Scope."
      "cable:2":
        - Вторая линия на экране пустая?
        - Пила должна прийти во второй канал Scope.
        - "Кабель из `Sawtooth` у VCO во вход `Ch 2` у Scope."
      "cable:3":
        - Слышно ли пилу?
        - Один выход может питать два кабеля — к Scope и к Audio.
        - "Второй кабель из `Sawtooth` во вход `To \"device output 1\"` у Audio."
      "param:1":
        - Сколько периодов помещается на экране?
        - Ручка Time у Scope, значение должно быть не больше 20.
        - Поставь Time около 10.
      "param:2":
        - Картинка стоит на месте или плывёт?
        - Переключатель Trigger на Scope.
        - Выбери Enabled.
      "probe:1":
        - Двигается ли линия синуса?
        - Проверь кабель из Sine и ручку Frequency у VCO.
        - Верни Frequency в середину и проверь ещё раз.
    faq:
      - q: Можно взять VCO с другим выходом на звук?
        a: Для проверки нужен именно Sawtooth в Audio — так ты сравниваешь пилу на слух и на экране. Потом пробуй любые выходы.
      - q: Где брать модули?
        a: Щёлкни правой кнопкой по пустому месту между маркерами «Верстак» и найди VCO и Scope в браузере модулей.

  - id: b9
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Звук есть, а картинка на Scope плывёт и дёргается.
      Найди одну неверную настройку и исправь её. Кабели трогать не нужно.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "10" }, Trigger: Enabled, Gain 1: { display: "10" }, Gain 2: { display: "10" } }
    cables:
      - { from: [vco, Sine], to: [scope, Ch 1] }
      - { from: [vco, Sawtooth], to: [scope, Ch 2] }
      - { from: [vco, Sawtooth], to: [audio, "To \"device output 1\""] }
    break: { set_param: { module: scope, name: Trigger, value: Disabled } }
    check: { kind: fixed, expect_param: { module: scope, name: Trigger, display_in: [Enabled] } }
    hints:
      fixed:
        - Звук не изменился, изменился только вид. Какая ручка отвечает за неподвижную картинку?
        - Посмотри на переключатель синхронизации у Scope.
        - Поставь Trigger в Enabled.
    faq:
      - q: Почему звук не испортился, если картинка плывёт?
        a: Trigger — настройка экрана, а не звука. Он решает, с какой точки волны начинать рисовать. Звук от него не зависит.

  - id: b10
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - **Частота** — высота тона, **амплитуда** — громкость, **форма волны** — тембр.
      - Гармоники объясняют, почему пила ярче синуса.
      - Scope показывает напряжение во времени. Time меняет масштаб, Trigger останавливает картинку.
      Сохрани патч: ⌘S сохраняет твою копию урока.
      **Источники:** Gordon Reid, «Synth Secrets», ч. 1 (Sound On Sound); Chris Meyer, «The Basic Concepts of Synthesis» (Learning Modular); «VCV Rack: начало» (zwook).
    questions:
      - q: Ты поднял Frequency на октаву. Что покажет Scope при том же Time?
        options:
          - { text: Вдвое больше периодов, correct: true, why: "Частота выросла вдвое, значит на тот же отрезок времени помещается вдвое больше повторов." }
          - { text: Вдвое выше пики, why: "Высота пиков — амплитуда. От частоты она не зависит." }
          - { text: Ту же картинку, why: "Time тот же, а волна стала чаще — картинка изменится." }
    next: |
      # Дальше: 1.2
      **Напряжение — единственный язык.** Разберём, чем звук отличается от CV, гейта и триггера.
    faq:
      - q: Нужно ли запоминать числа частот?
        a: Нет. Запомни правило октавы — вдвое по частоте. Конкретные числа Rack показывает при наведении на ручку.
      - q: Что повторить, если что-то не понял?
        a: Вернись к ряду «Четыре формы волны» и сравни выходы VCO ещё раз — на слух и на экране.
