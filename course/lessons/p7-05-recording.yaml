id: p7-05-recording
num: "7.5"
part: 7
title: Запись в файл
goal: Записать 30 секунд своего патча в WAV-файл через Recorder и убедиться, что запись не перегружена.
builds: Это конец части 7. Инструменты трека в части 9 записываются тем же способом.
minutes: 30
requires: [p7-03-mixer-levels]
glossary: [запись в файл, формат и разрядность, запись по гейту, индикатор уровня записи, частота дискретизации]
sources: [vcv-recorder, pc-line-level, cdm-multitrack]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: Запись в файл
    page: |
      # 7.5 Запись в файл
      **Ты научишься:** писать звук патча в файл через **Recorder** и следить, чтобы запись не перегрузилась.
      **Ты соберёшь:** партию, VCMixer и два выхода — в Audio, чтобы слышать, и в Recorder, чтобы писать.
      **Понадобится:** 30 минут и урок 7.3 про уровни. Перед первым звуком убавь громкость.
    figure:
      template: flow
      layout: row
      nodes:
        - { id: mix, label: VCMixer, kind: audio }
        - { id: audio, label: Audio, kind: audio }
        - { id: rec, label: Recorder, kind: audio }
      edges:
        - { from: mix, to: audio, kind: audio }
        - { from: mix, to: rec, kind: audio }
      caption: Один сигнал идёт в двух направлениях. Audio его воспроизводит, Recorder пишет.
    faq:
      - q: Зачем подавать сигнал и в Audio, и в Recorder?
        a: Recorder только пишет и сам ничего не воспроизводит. Чтобы слышать, что пишешь, тот же сигнал подключают ещё и в Audio.
      - q: Мне нужно экспортировать трек. Это то же самое?
        a: Да. Recorder и есть способ вывести патч в файл. Сохранённый WAV можно открыть в любом плеере или редакторе.

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса про файл и индикатор. Ответы подскажут, что запомнить.
    questions:
      - q: В Recorder подключён только вход Left/mono. Каким будет файл?
        free: true
        options:
          - { text: "Моно, с одним каналом", correct: true, why: "Файл повторяет число занятых входов. Один вход — один канал." }
          - { text: "Стерео, правый канал будет копией", why: "Recorder сам канал не размножает. Для стерео нужен кабель и в Right." }
          - { text: "Файл не создастся", why: "Запись возможна и с одним входом. Просто файл будет моно." }
      - q: На индикаторе уровня Recorder загорелся красный. Что это значит?
        options:
          - { text: "Звук обрезается, уровень надо убавить", correct: true, why: "Красный сообщает о перегрузе. Обрезанные пики попадут в файл, и убрать их потом нельзя." }
          - { text: "Запись пошла", why: "Красный не сообщает о записи. Он показывает слишком высокий уровень." }
          - { text: "Файл заполнен", why: "Индикатор следит за уровнем сигнала, а не за диском." }
      - q: Какой вход Recorder переключает запись каждым импульсом?
        options:
          - { text: "Trigger, каждый импульс включает или выключает", correct: true, why: "Trigger переключает запись на каждый импульс. Gate держит запись, пока он высокий." }
          - { text: "Gate", why: "Gate включает запись, пока гейт высокий. Это другая логика." }
          - { text: "Right", why: "Right — аудиовход правого канала, а не управление." }

  - id: b3
    type: story
    preset: story
    title: Что пишет Recorder
    page: |
      # Что пишет Recorder
      [[запись в файл|Запись]] — это сохранение сигнала на диск. Позже ты откроешь файл как обычную музыку.
      У **Recorder** два аудиовхода: **Left/mono** и **Right**. Один подключён — файл моно, оба — стерео.
      Рядом ручка **Level** и [[индикатор уровня записи|индикатор]]. Красный свет означает, что звук обрезается.
      У записи два риска: тихо, и ты теряешь детали, или громко, и пики обрезаны. Второе уже не исправить.
    figure: { template: mixer, channels: [{ label: "тихо", level: 1 }, { label: "норма", level: 4 }, { label: "горячо", level: 11 }], headroom: 10, caption: "Три записи одного звука. Красный столбик вышел за предел, пики обрезаны в файле." }
    simpler: "Фотография. Если слишком темно, детали потеряны. Если пересвечено, белые пятна уже не вернуть. Запись звука устроена так же: пересвеченное не исправишь."
    faq:
      - q: Почему нельзя поправить громкость после записи?
        a: Можно сделать тише или громче в редакторе. Но обрезанные пики уже срезаны, и их форма потеряна навсегда. Поэтому уровень проверяют до записи.
      - q: Что значит «сигнал обрезается»?
        a: Пик выше предела срезается ровно сверху. Так появляется хриплый, жёсткий звук. В Rack предел около ±10 В, как в уроке 7.3.
      - q: Нужен ли Right, если я записываю один голос?
        a: Нет. С одним Left/mono файл будет моно, и это нормально. Правый вход нужен для стерео, как в уроке 7.4.

  - id: b4
    type: story
    preset: story
    title: Размер файла
    page: |
      # Размер файла
      WAV хранит звук без сжатия, поэтому размер можно посчитать.
      Байт в секунду равен частоте, умноженной на разрядность в байтах и на число каналов. Это [[формат и разрядность|формат и разрядность]] вместе с [[частота дискретизации|частотой дискретизации]].
      Пример: 44 100 отсчётов в секунду, 2 байта, 2 канала дают 176 400 байт в секунду. За 30 секунд — около 5,3 МБ.
      Моно вдвое меньше. Это числа для самопроверки, не обещание Recorder.
    figure:
      template: table
      rows:
        - ["Формат", "Каналы", "30 секунд"]
        - ["16 бит, 44,1 кГц", "стерео", "5,3 МБ"]
        - ["16 бит, 44,1 кГц", "моно", "2,6 МБ"]
        - ["24 бита, 48 кГц", "стерео", "8,6 МБ"]
      caption: Ожидаемый размер WAV-файла на 30 секунд записи.
    faq:
      - q: Как посчитать для 24 бит и 48 кГц?
        a: 48 000 отсчётов, 3 байта, 2 канала дают 288 000 байт в секунду. За 30 секунд получается около 8,6 МБ.
      - q: Разрядность влияет на звук?
        a: Да. 24 бита дают запас по тихим деталям, 16 бит достаточно для готового трека. Для записи, которую будешь обрабатывать, берут 24.
      - q: Размер файла не сходится с формулой. Почему?
        a: Возможно, файл моно, или записаны не ровно 30 секунд. Проверь число занятых входов Recorder и длительность записи.

  - id: b5
    type: live
    preset: live
    title: Путь к записи
    page: |
      # Путь к записи
      Партия идёт в **VCMixer**. Его выход **Mix** разветвляется: в Audio, чтобы слышать, и в **Left/mono** у Recorder.
      Запись не включена, ты только смотришь на уровень.
      Подними **Channel 1 level** к +6 dB: Mix на Scope растёт, и у Recorder загорелся бы красный индикатор.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { raw: -12 } } }
      - { ref: mix, plugin: Fundamental, slug: VCMixer, params: { Channel 1 level: { raw: 0.316228 } } }
      - { ref: rec, plugin: VCV-Recorder, slug: Recorder }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "500" } } }
    cables:
      - { from: [vco, Sawtooth], to: [mix, Channel 1] }
      - { from: [mix, Mix], to: [rec, Left/mono] }
      - { from: [mix, Mix], to: [audio, "To \"device output 1\""] }
      - { from: [mix, Mix], to: [scope, Ch 1] }
    notes:
      - { after: mix, text: "**Channel 1 level** — уровень партии. Сейчас −10 dB.", targets: [{ module: mix, param: Channel 1 level }] }
      - { after: rec, text: "**Left/mono** получает сумму. **Record** пока не нажата.", targets: [{ module: rec, input: Left/mono }, { module: rec, param: Record }] }
    faq:
      - q: Почему Record не нажата, ведь урок про запись?
        a: Нажатие создаёт файл на твоём диске. Сначала проверь путь сигнала и уровень, а Record нажмёшь сам в блоке «Покрути сам».
      - q: Почему красный индикатор «загорелся бы»?
        a: Он показывает уровень на входе Recorder и работает всегда. Если Mix выше предела, он загорится, даже когда запись остановлена.
      - q: Зачем −10 dB на канале?
        a: По правилу из урока 7.3 так остаётся запас до предела. Поэтому запись получится чистой.

  - id: b6
    type: anatomy
    preset: anatomy
    title: Панель Recorder
    page: |
      # Панель Recorder
      Recorder небольшой. Обойдём все органы, которые тебе понадобятся.
    module: { ref: rec, plugin: VCV-Recorder, slug: Recorder }
    notes:
      - { text: "**Left/mono** и **Right** — аудиовходы. Один подключён — файл моно, оба — стерео.", targets: [{ module: rec, input: Left/mono }, { module: rec, input: Right }] }
      - { text: "**Level** — усиление записи в dB, по умолчанию 0 dB. Рядом индикатор: красный — звук обрезается.", targets: [{ module: rec, param: Level }] }
      - { text: "**Record** — кнопка записи. Если путь не задан, Recorder спросит, куда сохранить.", targets: [{ module: rec, param: Record }] }
      - { text: "**Gate** — [[запись по гейту|запись]] идёт, пока гейт высокий. Удобно для коротких нот.", targets: [{ module: rec, input: Gate }] }
      - { text: "**Trigger** переключает запись каждым импульсом, например кнопкой контроллера.", targets: [{ module: rec, input: Trigger }] }
    later:
      - { what: "Запись отдельных партий и сведение в DAW", lesson: "9.5" }
    faq:
      - q: Где путь и формат файла?
        a: В контекстном меню Recorder, правый клик по модулю. Там пункт Output file и список форматов. Менять формат можно, пока запись остановлена.
      - q: Что такое Append -001, -002?
        a: Это нумерация записей. С ней каждая новая запись получает свой номер и не затирает прошлую. Найди строку в меню и посмотри, что выбрано.
      - q: Чем Gate отличается от Trigger?
        a: "Gate включает запись, пока гейт высок. Trigger переключает её каждым импульсом: первый включает, второй выключает."

  - id: b7
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Подними **Channel 1 level** у VCMixer к +6 dB, затем верни −10 dB."
        see: "На Scope растёт пик, индикатор Recorder краснеет. Убавь, пока он не потухнет."
      - do: "Открой меню Recorder правым кликом. Выбери WAV и посмотри разрядности."
        see: "Там же Output file. Формат меняй, пока запись остановлена, и запомни выбор для расчёта."
      - do: "Нажми **Record**, дождись 30 секунд и останови запись."
        see: "В выбранной папке появится файл с номером, например Recording-001."
      - do: "Найди файл и сравни его размер с формулой."
        see: "Для 16 бит, 44,1 кГц и моно ожидай около 2,6 МБ."
      - do: "Подключи **Mix** ещё и в **Right**, запиши ещё 10 секунд."
        see: "Новый файл стерео. На 10 секунд он занимает около 1,8 МБ."
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { raw: -12 } } }
      - { ref: mix, plugin: Fundamental, slug: VCMixer, params: { Channel 1 level: { raw: 0.316228 } } }
      - { ref: rec, plugin: VCV-Recorder, slug: Recorder }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "500" } } }
    cables:
      - { from: [vco, Sawtooth], to: [mix, Channel 1] }
      - { from: [mix, Mix], to: [rec, Left/mono] }
      - { from: [mix, Mix], to: [audio, "To \"device output 1\""] }
      - { from: [mix, Mix], to: [scope, Ch 1] }
    notes:
      - { after: rec, text: "Шаги 2–5 делаются здесь.", targets: [{ module: rec, param: Record }] }
    faq:
      - q: Я нажал Record, а ничего не происходит.
        a: Если путь не задан, Recorder откроет окно выбора файла. Выбери папку и имя, и запись пойдёт. Проверь также, что в Left/mono есть сигнал.
      - q: Файл записался, но тишина.
        a: Recorder пишет то, что подано в его входы. Проверь, что Mix идёт в Left/mono, и что партия звучит в момент записи.
      - q: Где искать файл?
        a: В папке из пункта Output file в меню Recorder. Если пути не помнишь, открой меню и посмотри строку.

  - id: b8
    type: practice
    preset: practice
    title: Практика — 30 секунд в WAV
    task: |
      Подготовь запись и сделай её сам.
      1. На верстак: **VCO**, **VCMixer** и **Recorder**.
      2. `Sawtooth` у VCO → `Channel 1` у VCMixer.
      3. `Mix` у VCMixer → `Left/mono` у Recorder и → вход 1 у Audio.
      4. **Mix level** не выше 0 dB, чтобы запись не получилась горячей.
      5. Нажми «Проверить». Потом сам нажми **Record**, запиши 30 секунд, останови и найди файл. Его размер сравни с формулой.
    given: [audio]
    check: p7-05-recording
    hints:
      "cable:1":
        - Recorder ничего не получает и запишет тишину.
        - Какой выход микшера ведёт в Recorder?
        - "Выход `Mix` у VCMixer → вход `Left/mono` у Recorder."
      "cable:2":
        - Ты записываешь то, чего не слышишь.
        - Куда ещё нужен тот же сигнал?
        - "Выход `Mix` у VCMixer → вход 1 у Audio."
      "param:1":
        - Запись выйдет горячей.
        - Что стоит на Mix level?
        - Поставь Mix level на 0 dB или ниже.
      "probe:1":
        - Сигнала на Mix нет.
        - "Звучат ли партии: кабели в каналах VCMixer и уровни выше минус бесконечности?"
        - Подай сигнал в Channel 1 и подними уровень, затем нажми «Проверить».
    faq:
      - q: Проверка не смотрит на файл. Как узнать, что он правильный?
        a: Сравни размер с формулой из блока про размер. Если файл вдвое меньше ожидаемого, он моно. Если сильно меньше, запись остановилась раньше.
      - q: Можно ли записывать, не слыша звука?
        a: Можно, но ты не заметишь перегруз на слух. Поэтому тот же сигнал идёт в Audio, а индикатор Recorder тоже подсказывает.
      - q: Нужно ли подключать Scope?
        a: Для проверки не нужно. Но Scope на выходе Mix показывает размах, пока ты ставишь уровни.

  - id: b9
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Звук в Audio идёт, а индикатор Recorder не реагирует: запись получила бы тишину.
      Найди одну ошибку и исправь её.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { raw: -12 } } }
      - { ref: mix, plugin: Fundamental, slug: VCMixer, params: { Channel 1 level: { raw: 0.316228 } } }
      - { ref: rec, plugin: VCV-Recorder, slug: Recorder }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "500" } } }
    cables:
      - { from: [vco, Sawtooth], to: [mix, Channel 1] }
      - { from: [mix, Mix], to: [rec, Left/mono] }
      - { from: [mix, Mix], to: [audio, "To \"device output 1\""] }
      - { from: [mix, Mix], to: [scope, Ch 1] }
    notes:
      - { after: rec, text: "Здесь что-то не так.", targets: [{ module: rec, input: Left/mono }] }
    break: { remove_cable: [mix, Mix, rec, Left/mono] }
    check: { kind: fixed, expect_cable: [mix, Mix, rec, Left/mono] }
    hints:
      fixed:
        - Звук идёт мимо Recorder.
        - Посмотри на вход Left/mono у Recorder.
        - "Соедини `Mix` у VCMixer со входом `Left/mono` у Recorder."
    faq:
      - q: Почему в Audio звук есть, а в Recorder нет?
        a: Recorder пишет только то, что подано в его собственные входы. Кабель в Audio никак на него не влияет.

  - id: b10
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - **Recorder** пишет то, что подано в его входы: один вход — моно, два — стерео.
      - Красный индикатор означает перегруз. Убавляй уровень до записи, потом исправить нельзя.
      - Размер несжатого файла считают по формуле: частота, разрядность и каналы.
      - **Gate** держит запись, пока он высокий, **Trigger** переключает её импульсами.
      Сохрани патч как `vcv-7.5.vcv`.
      **Источники:** документация VCV Recorder. Perfect Circuit, «Eurorack and Line Level Signals». Peter Kirn, «How to make a multitrack recording in VCV Rack» (CDM).
    questions:
      - q: Что решает, будет файл моно или стерео?
        options:
          - { text: "Сколько аудиовходов Recorder занято", correct: true, why: "Один занятый вход даёт один канал, оба входа дают два." }
          - { text: "Формат файла в меню", why: "Формат задаёт тип файла и разрядность, а не число каналов." }
          - { text: "Положение ручки Level", why: "Level меняет громкость записи, а не число каналов." }
    next: |
      # Дальше: 8.1
      **Бочка.** Начинается часть 8, инструменты трека. Первый инструмент — ударный.
    faq:
      - q: Что повторить, если запись хрипит?
        a: Убавь уровни каналов в микшере и проверь, что индикатор Recorder не краснеет. Правила уровней — в уроке 7.3.
      - q: Как это пригодится в части 9?
        a: "Там ты запишешь целый трек. Схема та же: микшер, Audio для прослушивания, Recorder для файла."
