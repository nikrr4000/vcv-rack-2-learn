id: p3-04-adsr
num: "3.4"
part: 3
title: Огибающая ADSR
goal: Управлять формой звука во времени одним ADSR и отличать гейт от триггера.
builds: Третий кирпич голоса. С ним VCA перестаёт быть вечно открытым, и в уроке 3.5 голос соберётся целиком.
minutes: 30
requires: [p1-02-voltage]
glossary: [огибающая, ADSR, гейт, триггер, ретриггер, VCA]
sources: [vcv-free-manual, sos-07, pc-learning-synthesis]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: Огибающая ADSR
    page: |
      # 3.4 Огибающая ADSR
      **Ты научишься:** задавать форму ноты четырьмя ручками [[ADSR]] и понимать, чем [[гейт]] отличается от [[триггер|триггера]].
      **Ты соберёшь:** Push → ADSR → Scope и увидишь форму ноты на экране.
      **Понадобится:** 30 минут и тихая громкость.
      Один и тот же ADSR даёт щелчок, удар и пэд. Меняется только четыре ручки.
    figure: { template: adsr, a: 0.1, d: 0.3, s: 0.5, r: 0.5, gate: 1.0, markers: true, caption: "Нота по стадиям: Attack, Decay, Sustain, пока кнопка нажата, и Release после." }
    faq:
      - q: Чем огибающая отличается от LFO?
        a: LFO качается всё время сам. Огибающая запускается гейтом, проходит свои стадии один раз и замирает. LFO похож на маятник, огибающая — на одну ноту.
      - q: Зачем мне ADSR, если есть Level у VCA?
        a: Level ты крутишь рукой. ADSR делает то же самое сам и точно, на каждую ноту. Так звук получает форму, а не просто громкость.
      - q: Звук будет громким?
        a: Начни с тихой громкости. Демо звучит только в активном ряду. Сначала смотри на экран Scope, потом слушай.

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса до объяснений. Ответы подскажут, на что смотреть.
    questions:
      - q: Ты нажал Push и держишь. Что делает выход Gate, а что Trigger?
        free: true
        options:
          - { text: "Gate держит 10 В, пока нажата кнопка. Trigger — короткий импульс", correct: true, why: "Гейт длится столько, сколько длится нота. Триггер — один короткий импульс в момент нажатия." }
          - { text: "Оба держат 10 В, пока кнопка нажата", why: "Так работает только гейт. Триггер заканчивается через миллисекунду, даже если кнопка зажата." }
          - { text: "Trigger держит 10 В, а Gate короткий", why: "Названия перепутаны. Гейт — широкий прямоугольник, триггер — узкая иголка." }
      - q: Как работают Attack, Decay и Release?
        options:
          - { text: "Это времена: нарастание, спад до Sustain и затухание после отпускания", correct: true, why: "Три ручки меряют время в миллисекундах. Только Sustain задаёт уровень." }
          - { text: "Это уровни громкости", why: "Уровень задаёт только Sustain. Остальные три ручки отвечают за скорость." }
          - { text: "Attack, Decay и Sustain задаются один раз, а Release меняется", why: "Ручки независимы. Любую можно менять в любой момент, и форма сразу изменится." }
      - q: Sustain = 0 %, клавиша нажата и удерживается. Что со звуком?
        options:
          - { text: "После атаки и спада напряжение упадёт до нуля, звук затихнет", correct: true, why: "Sustain — уровень, на котором нота держится. При нуле держаться нечему, и огибающая уходит в ноль." }
          - { text: "Звук будет держаться на максимуме", why: "Sustain — не «максимум». На максимуме нота держится только при 100 %." }
          - { text: "Огибающая не запустится", why: "Запуск происходит по гейту и не зависит от Sustain. Атака и спад пройдут в любом случае." }

  - id: b3
    type: story
    preset: story
    title: Форма ноты
    page: |
      # Форма ноты
      Нота не включается, как лампочка. У гитары звук нарастает, спадает и затухает. Эта форма отличает инструменты друг от друга.
      Форму задаёт [[огибающая]]: напряжение, которое меняется во времени. Её отправляют на [[VCA]] или фильтр.
      **ADSR** — четыре стадии. **Attack** — время подъёма до пика. **Decay** — время спада до Sustain.
      **Sustain** — уровень, на котором нота держится, пока клавиша нажата. Это уровень, а не время.
      **Release** — время затухания после отпускания.
    figure: { template: adsr, a: 0.2, d: 0.4, s: 0.6, r: 0.6, gate: 1.4, markers: true, caption: "Три стадии — это время, одна — уровень. Нажатие и отпускание задаёт гейт." }
    simpler: Представь, как ты нажимаешь педаль газа. Attack — как быстро ты давишь. Decay — как отпускаешь до ровной скорости. Sustain — на какой скорости едешь. Release — как долго катишься после того, как убрал ногу.
    faq:
      - q: Почему Sustain в процентах, а остальные в миллисекундах?
        a: Attack, Decay и Release — это время. Sustain — уровень напряжения, на котором огибающая замирает. Его меряют в процентах от пика.
      - q: Что происходит, если отпустить кнопку во время Attack?
        a: Огибающая сразу переходит в Release с того уровня, до которого успела подняться. До пика она не дойдёт, и нота получится тихой.
      - q: Как выглядит пик огибающей по напряжению?
        a: Пик — около 10 В. Это то самое напряжение, которое открывает VCA на полную. Когда огибающая идёт в CV, громкость повторяет её форму.

  - id: b4
    type: story
    preset: story
    title: Гейт и триггер
    page: |
      # Гейт и триггер
      Огибающая стартует по сигналу запуска. Таких сигнала два.
      [[гейт|Гейт]] — широкий прямоугольник. Он держится на 10 В, пока клавиша нажата.
      [[триггер|Триггер]] — короткий импульс, около 1 мс, только в момент нажатия.
    page2: |
      ADSR хочет гейт. Он должен знать, когда клавишу отпустили, чтобы запустить Release.
      Подай триггер вместо гейта: ADSR получит 1 мс «нажатия» и сразу уйдёт в Release. До пика огибающая не дойдёт.
      Получится короткий щелчок.
      Перезапуск атаки новым импульсом при высоком гейте — [[ретриггер]]. Для него у ADSR есть вход **Retrigger**.
    figure: { template: voltages, ranges: [{ label: гейт, min: 0, max: 10 }, { label: триггер, min: 0, max: 10 }, { label: огибающая, min: 0, max: 10 }], caption: Гейт держится 10 В, триггер — одна иголка. Пик огибающей — до 10 В. }
    simpler: "Гейт — это держать палец на звонке. Звонок звенит, пока держишь. Триггер — тапнуть по звонку: короткий звон и всё. Огибающей нужен палец на звонке, а не тап."
    faq:
      - q: Почему гейт — 10 В, а не 5?
        a: "Так принято в стандарте VCV Rack: гейты и триггеры дают 10 В, а длительность триггера около 1 мс. Модули опираются на это число при запуске."
      - q: Можно ли запустить ADSR триггером?
        a: Можно, но получится щелчок. Огибающая успеет только начать подъём и сразу пойдёт в Release. Для длинной ноты нужен гейт.
      - q: Что такое ретриггер?
        a: Перезапуск атаки новым импульсом, пока гейт ещё высок. Вход Retrigger у ADSR нужен, когда нота должна начинаться заново, не отпуская клавишу.

  - id: b5
    type: live
    preset: live
    title: Удар
    page: |
      # Удар
      Перед тобой Push, ADSR, VCA и Scope. **Hold** сейчас выключен: нажимай **Push** сам.
      Attack 1 мс, Sustain 0, Decay 300 мс. Звук бьёт и затихает, даже пока кнопка нажата.
      На Scope видна форма. Потом поставь **Sustain** на 70 % и нажми ещё раз.
    modules:
      - { ref: push, plugin: Fundamental, slug: Push, params: { Hold: { raw: 0 } } }
      - { ref: env, plugin: Fundamental, slug: ADSR, params: { Attack: { display: "1" }, Decay: { display: "300" }, Sustain: { display: "0" }, Release: { display: "200" } } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: vca, plugin: Fundamental, slug: VCA-1, params: { Level: { display: "100" } } }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "1000" } } }
    cables:
      - { from: [push, Gate], to: [env, Gate] }
      - { from: [env, Envelope], to: [scope, Ch 1] }
      - { from: [env, Envelope], to: [vca, CV] }
      - { from: [vco, Sawtooth], to: [vca, Channel] }
      - { from: [vca, Channel], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: push, text: "**Push** — нажми кнопку. **Hold** держит гейт без тебя.", targets: [{ module: push, param: Push }, { module: push, param: Hold }] }
      - { after: env, text: "**Sustain** 0 — после спада огибающая падает в ноль.", targets: [{ module: env, param: Sustain }] }
    faq:
      - q: Нажал Push, а звука нет. Почему?
        a: "Проверь, что Envelope идёт в CV у VCA, а Gate у Push — в Gate у ADSR. Если кабели на месте, нажми Push и подержи: гейт есть, только пока кнопка нажата."
      - q: Почему звук затихает, пока я держу кнопку?
        a: Sustain стоит на нуле. После Attack и Decay огибающая падает в ноль и остаётся там. Подними Sustain, и нота будет держаться.
      - q: Как получить щелчок вместо удара?
        a: Поставь Decay и Release около 50 мс. Нота станет короткой, останется только момент атаки. На Scope видно узкую иголку.

  - id: b6
    type: anatomy
    preset: anatomy
    title: Push
    page: |
      # Push
      Кнопка с двумя выходами. Пока ты не получил клавиатуру, это твоя «клавиша».
    module: { ref: push, plugin: Fundamental, slug: Push }
    notes:
      - { text: "**Push** — кнопка. Нажата — гейт включён.", targets: [{ module: push, param: Push }] }
      - { text: "**Hold** — держит гейт после отпускания. Сними — гейт погаснет.", targets: [{ module: push, param: Hold }] }
      - { text: "Выход **Gate** — 10 В, пока кнопка нажата или Hold включён.", targets: [{ module: push, output: Gate }] }
      - { text: "Выход **Trigger** — один короткий импульс в момент нажатия.", targets: [{ module: push, output: Trigger }] }
      - { text: "Входы **Push** и **Hold** — те же кнопки, но от чужого сигнала.", targets: [{ module: push, input: Push }, { module: push, input: Hold }] }
    faq:
      - q: Что делает Hold?
        a: Hold = 1 удерживает гейт без нажатия. Так огибающая доходит до Sustain и остаётся там. Сними Hold, и начнётся Release.
      - q: Есть ли что-то посложнее Push?
        a: Pulses — десять таких кнопок в одном модуле, у каждой свои Trigger и Gate. Он пригодится для ударных и секвенсера.
      - q: Почему кнопка не отпускается?
        a: Включён Hold. Он держит гейт, пока не снимешь его. Нажми Hold ещё раз, чтобы выключить.

  - id: b7
    type: anatomy
    preset: anatomy
    title: Панель ADSR
    page: |
      # Панель ADSR
      Четыре ручки, вход гейта и выход огибающей. Остальное — входы CV для частей огибающей. Огибающую смотри на Scope: Time 1000 мс на экран, Gain 1 оставь как есть.
    module: { ref: env, plugin: Fundamental, slug: ADSR }
    notes:
      - { text: "**Attack**, **Decay**, **Release** — времена от 1 мс до 10 с.", targets: [{ module: env, param: Attack }, { module: env, param: Decay }, { module: env, param: Release }] }
      - { text: "**Sustain** — уровень удержания от 0 до 100 %. Это не время.", targets: [{ module: env, param: Sustain }] }
      - { text: "Вход **Gate** — запуск и остановка. Сюда идёт гейт от Push.", targets: [{ module: env, input: Gate }] }
      - { text: "Вход **Retrigger** — перезапуск атаки, пока гейт высок.", targets: [{ module: env, input: Retrigger }] }
      - { text: "Выход **Envelope** — сама огибающая, 0…10 В. Её отправляют на CV.", targets: [{ module: env, output: Envelope }] }
    later:
      - { what: "Входы CV для Attack, Decay, Sustain, Release", lesson: "4.1" }
    faq:
      - q: Что за кнопка Push на самом ADSR?
        a: Это параметр самого ADSR, ручной гейт. Он работает как кнопка Push-модуля, но ничего не отдаёт наружу. Ею удобно запустить огибающую без кабеля.
      - q: Какие значения у ручек по умолчанию?
        a: Attack, Decay и Release — по 100 мс, Sustain — 50 %. Это спокойный средний вариант, с него удобно начинать.
      - q: Зачем ручки Attack CV, Decay CV и остальные?
        a: Они позволяют двигать времена напряжением, например от LFO. Пока оставь их на нуле. Вернёмся в части 4.

  - id: b8
    type: try
    preset: try
    title: Три формы
    steps:
      - do: "Поставь **Attack** 1 мс, **Decay** 50 мс, **Sustain** 0, **Release** 50 мс. Нажми **Push**."
        see: "Щелчок: на Scope узкий пик, звук короткий."
      - do: "Поставь **Decay** 300 мс, **Release** 200 мс. Нажми **Push**."
        see: "Удар: быстрый подъём и спад. Звук затихает, пока кнопка нажата."
      - do: "Поставь **Attack** 800 мс, **Decay** 500 мс, **Sustain** 70 %, **Release** 1500 мс. Включи **Hold**, затем сними."
        see: "Пэд: звук вплывает, держится и тянется хвостом."
      - do: "Включи **Hold** и подними **Sustain** до 100 %."
        see: "Нота держится без спада. Снимешь Hold, и начнётся Release."
    modules:
      - { ref: push, plugin: Fundamental, slug: Push, params: { Hold: { raw: 0 } } }
      - { ref: env, plugin: Fundamental, slug: ADSR, params: { Attack: { display: "1" }, Decay: { display: "50" }, Sustain: { display: "0" }, Release: { display: "50" } } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: vca, plugin: Fundamental, slug: VCA-1, params: { Level: { display: "100" } } }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "1000" } } }
    cables:
      - { from: [push, Gate], to: [env, Gate] }
      - { from: [env, Envelope], to: [scope, Ch 1] }
      - { from: [env, Envelope], to: [vca, CV] }
      - { from: [vco, Sawtooth], to: [vca, Channel] }
      - { from: [vca, Channel], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: env, text: "Шаги 1–4 — ручки этого ADSR.", targets: [{ module: env, param: Attack }, { module: env, param: Decay }, { module: env, param: Sustain }, { module: env, param: Release }] }
    faq:
      - q: Пэд звучит, но нет хвоста после Hold. Почему?
        a: Скорее всего, Release слишком короткий. Поставь 1500 мс и повтори. Хвост начинается после снятия Hold, а не во время.
      - q: На Scope ничего не видно в шаге 1.
        a: Щелчок очень короткий. Уменьши Time у Scope или нажимай Push чаще. Если линия всё равно ровная, проверь, что Envelope идёт в Ch 1.
      - q: Что такое «щелчок атаки»?
        a: Это резкий короткий звук в начале ноты. Его даёт очень быстрая Attack. В ударных он создаёт ощущение удара.

  - id: b9
    type: practice
    preset: practice
    title: Практика — пэд
    task: |
      Собери огибающую сам, между маркерами «Верстак».
      1. **Push**, **ADSR** и **Scope**.
      2. Гейт запускает огибающую: `Gate` у Push → `Gate` у ADSR.
      3. Огибающая на экран: `Envelope` у ADSR → `Ch 1` у Scope.
      4. Настрой пэд: **Attack** от 300 мс до 3 с, **Sustain** не меньше 60 %, **Release** не меньше 500 мс.
      5. Включи **Hold** у Push и нажми «Проверить».
    check: p3-04-adsr
    hints:
      "cable:1":
        - Огибающая не знает, когда начинать.
        - Какой выход Push держит сигнал, пока нажата кнопка?
        - "`Gate` у Push → вход `Gate` у ADSR."
      "cable:2":
        - На Scope нечего смотреть.
        - Куда подать выход ADSR, чтобы увидеть огибающую?
        - "`Envelope` у ADSR → вход `Ch 1` у Scope."
      "param:1":
        - Пэд вплывает медленно. Быстрая или медленная атака сейчас?
        - Сколько миллисекунд показывает Attack?
        - Поставь **Attack** от 300 до 3000 мс.
      "param:2":
        - Что держится после атаки и спада?
        - Сколько процентов у Sustain сейчас?
        - Поставь **Sustain** не меньше 60 %.
      "param:3":
        - Что слышно после отпускания кнопки?
        - Сколько миллисекунд у Release?
        - Поставь **Release** не меньше 500 мс.
      "probe:1":
        - Огибающая стоит на нуле.
        - Идёт ли гейт, и включён ли Hold у Push?
        - Включи **Hold** у Push (или держи кнопку) и нажми «Проверить» ещё раз.
    faq:
      - q: Нужно ли подключать VCO и VCA?
        a: Для проверки не нужно. Но если хочешь слышать, подай VCO в VCA, а Envelope в CV у VCA, как в живом демо. Огибающая тогда станет громкостью.
      - q: Проверка говорит, что огибающая стоит, хотя кабели на месте.
        a: "Скорее всего, гейта нет: Hold выключен, а кнопка отпущена. Включи Hold у Push и повтори проверку."
      - q: Какую форму получает пэд?
        a: Нота медленно вплывает, держится высоко и долго затухает после отпускания. Поэтому для неё нужны медленная Attack, высокий Sustain и длинный Release.

  - id: b10
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Пэд должен вплывать и держаться, а слышен только короткий щелчок.
      Найди одну ошибку и исправь её одним кабелем.
    modules:
      - { ref: push, plugin: Fundamental, slug: Push, params: { Hold: { raw: 1 } } }
      - { ref: env, plugin: Fundamental, slug: ADSR, params: { Attack: { display: "800" }, Decay: { display: "500" }, Sustain: { display: "70" }, Release: { display: "1500" } } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: vca, plugin: Fundamental, slug: VCA-1, params: { Level: { display: "100" } } }
    cables:
      - { from: [push, Trigger], to: [env, Gate] }
      - { from: [push, Gate], to: [env, Gate] }
      - { from: [env, Envelope], to: [vca, CV] }
      - { from: [vco, Sawtooth], to: [vca, Channel] }
      - { from: [vca, Channel], to: [audio, "To \"device output 1\""] }
    break: { remove_cable: [push, Gate, env, Gate] }
    check: { kind: fixed, expect_cable: [push, Gate, env, Gate] }
    hints:
      fixed:
        - Звук короткий, хотя Hold включён. Какой сигнал запускает ADSR?
        - Посмотри на выход Push, из которого идёт кабель в Gate у ADSR.
        - Подключи выход `Gate` у Push ко входу `Gate` у ADSR вместо `Trigger`.
    faq:
      - q: Почему триггер вместо гейта даёт щелчок?
        a: Триггер длится около 1 мс. ADSR видит, что «клавишу» отпустили, и сразу идёт в Release. До пика и Sustain он не доходит.
      - q: Как на Scope отличить гейт от триггера?
        a: Подай оба на Ch 1 и Ch 2. Гейт — широкое плато, триггер — узкая иголка. Огибающая от триггера — маленький бугорок.

