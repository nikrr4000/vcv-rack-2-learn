id: p5-01-clock-tempo
num: "5.1"
part: 5
title: Такт и темп
goal: Задать темп в BPM, получить из одного главного такта несколько делений и вернуть всё на первую долю сбросом.
builds: «Метроном» будущего трека — от одного такта в частях 8–9 шагают бас, ритм-секция и лид.
minutes: 30
requires: [p1-02-voltage]
glossary: [такт, темп, деление такта, сброс, гейт]
sources: [ne-clocks, impromptu-clocked, vcv-voltage-standards, doepfer-tech]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: Такт и темп
    page: |
      # 5.1 Такт и темп
      **Ты научишься:** задавать [[темп]] в BPM, делить главный [[такт]] на более редкие и возвращать всё на начало [[сброс|сбросом]].
      **Ты соберёшь:** **Clocked** с тремя выходами и два **Scope**, на которых видно деление.
      **Понадобится:** 30 минут и урок про напряжение (1.2). Звука в этом уроке нет — только картинка на экранах.
      Такт — метроном всей части 5. Секвенсоры, переключатели и логика дальше шагают по его импульсам.
    figure: { template: clock, bpm: 120, divisions: [1, 2, 4], bars: 2, caption: "Главный такт и два деления: каждый второй импульс и каждый четвёртый." }
    faq:
      - q: Зачем в уроке про ритм нет звука?
        a: Такт сам по себе не звучит. Это сигнал «сейчас», как взмах дирижёра. Звук появится в следующем уроке, когда такт начнёт двигать секвенсор.
      - q: Что такое Clocked?
        a: "Модуль-генератор такта из набора Impromptu Modular. У него одна ручка темпа и три выхода с отдельными делениями. Такой «пульт» удобен: темп меняешь в одном месте, а все деления подстраиваются сами."
      - q: Чем такт отличается от гейта?
        a: "По форме ничем: те же 0 и 10 В. Отличается роль. Гейт говорит «событие длится», а такт — «сейчас, шагай дальше». Модули читают его по переднему фронту."

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса про такт. Ошибаться можно: ответы покажут, что разобрать в уроке.
    questions:
      - q: Темп 120 BPM. Сколько долей проходит за одну секунду?
        free: true
        options:
          - { text: Две, correct: true, why: "В минуте 60 секунд. 120 долей за минуту — это 2 доли за секунду, то есть 2 Гц." }
          - { text: Сто двадцать, why: "120 — доли в минуту, а не в секунду. Чтобы получить секунды, раздели на 60." }
          - { text: Половина доли, why: "Полсекунды — длина одной доли, а не их число. Частота и период — обратные величины." }
      - q: Что делает сигнал Reset у секвенсора?
        options:
          - { text: "Возвращает его на первый шаг, а темп не трогает", correct: true, why: "Reset двигает только указатель шага. Скорость задаёт такт, и сброс на неё не влияет." }
          - { text: Останавливает секвенсор, why: "Остановка — это Run. Сброс не останавливает, а возвращает на начало." }
          - { text: Возвращает ручку темпа в исходное положение, why: "Reset не крутит ручки. Он работает с позицией, а не с настройками." }
      - q: У главного такта 120 BPM, а на одном выходе деление на 2. Что на этом выходе?
        options:
          - { text: Один импульс на каждые два импульса мастера, correct: true, why: "Деление делает такт реже. Вдвое реже значит как 60 BPM." }
          - { text: Импульсы вдвое чаще, why: "Это умножение. Деление, наоборот, пропускает часть импульсов." }
          - { text: "Те же импульсы, но вдвое тише", why: "Деление меняет частоту импульсов, а не напряжение. Высота импульса остаётся 10 В." }

  - id: b3
    type: story
    preset: story
    title: Такт и темп
    page: |
      # Такт и темп
      [[Такт]] — ровная цепочка коротких импульсов. Каждый импульс говорит модулям: «сейчас».
      [[Темп]] — сколько импульсов проходит за минуту, это **BPM**. Чтобы получить герцы, раздели BPM на 60.
      120 BPM — это 2 Гц, 60 BPM — 1 Гц.
      В Rack такт — обычный сигнал вроде [[гейт|гейта]]: 0 В и 10 В. Нужны чёткий фронт и уровень не выше 10 В.
    figure: { template: clock, bpm: 120, divisions: [1], bars: 2, caption: "120 BPM: две доли в секунду, импульс каждые 0,5 с." }
    simpler: Представь метроном на пианино. Он тикает ровно, и ты играешь под тики. Темп — число тиков в минуту. Больше тиков, быстрее музыка.
    faq:
      - q: Почему BPM делят именно на 60?
        a: В минуте 60 секунд. 120 долей за минуту — это 120 / 60 = 2 доли за секунду. Так же переводят любой темп, например 90 BPM равно 1,5 Гц.
      - q: Нужно ли ставить такт ровно 10 В?
        a: Не обязательно. Модулям нужен чёткий скачок вверх, а 10 В — стандарт Rack. В железных модулях часто ходят 5 В, и это тоже работает.
      - q: Чем такт в герцах отличается от LFO?
        a: "Ничем по сути: квадратная волна LFO — тот же такт. Поставь Frequency у LFO на 2 Гц, и получишь 120 BPM. Clocked просто удобнее: темп задан в BPM."

  - id: b4
    type: story
    preset: story
    title: Деление и сброс
    page: |
      # Деление и сброс
      Из главного такта делают более редкие. [[Деление такта|Деление]] на 2 даёт каждый второй импульс, деление на 4 — каждый четвёртый.
      Обратная операция даёт более частые импульсы. Это умножение.
      [[Сброс]] — отдельный импульс «начни с начала». После него делители и секвенсоры снова стоят на первой доле.
      Темп сброс не меняет. Он двигает только положение на линии времени.
    figure: { template: clock, bpm: 120, divisions: [1, 2, 4], bars: 2, caption: "Три строки: мастер, деление на 2 и деление на 4. Все начинаются с общей первой доли." }
    simpler: Представь хоровод. Все хлопают в ладоши в такт. Один хлопает на каждый счёт, другой — на каждый второй, третий — на каждый четвёртый. Сброс — команда «все начали заново».
    faq:
      - q: Зачем делить такт, если можно завести отдельные такты?
        a: Деления идут от одного мастера, поэтому не расходятся. Два независимых такта через минуту окажутся не в такт. Деления привязаны к одной доле и держатся вместе.
      - q: Деление и умножение — это одно и то же?
        a: "Нет. Деление делает импульсы реже, умножение — чаще. На панели Clocked смотри на Scope: где импульсов меньше, чем у мастера, там деление."
      - q: Сброс останавливает такт?
        a: Нет. После сброса такт продолжает идти, просто счёт начинается с первой доли. Остановка — отдельная кнопка Run.

  - id: b5
    type: live
    preset: live
    title: Мастер и деления
    page: |
      # Мастер и деления
      Перед тобой **Clocked** на 120 BPM и два **Scope**. Мастер и три выхода разведены по четырём каналам.
      На первом Scope — мастер и **Clock 1**. На втором — **Clock 2** и **Clock 3**.
      Clock 2 и Clock 3 стоят на разных коэффициентах: один из них делит, другой умножает. Найди, какой из них реже мастера.
    modules:
      - { ref: clk, plugin: ImpromptuModular, slug: Clocked, params: { Master clock: { display: "120" }, Clk 2 ratio: { display: "2" }, Clk 3 ratio: { display: "-2" } } }
      - { ref: scope_a, plugin: Fundamental, slug: Scope, params: { Time: { display: "2000" } } }
      - { ref: scope_b, plugin: Fundamental, slug: Scope, params: { Time: { display: "2000" } } }
    cables:
      - { from: [clk, Master clock], to: [scope_a, Ch 1] }
      - { from: [clk, Clock 1], to: [scope_a, Ch 2] }
      - { from: [clk, Clock 2], to: [scope_b, Ch 1] }
      - { from: [clk, Clock 3], to: [scope_b, Ch 2] }
    notes:
      - { after: clk, text: "**Master clock** — темп в BPM. Поверни и смотри, как теснеют импульсы на всех экранах.", targets: [{ module: clk, param: Master clock }] }
      - { after: clk, text: "**Clk 2 ratio** и **Clk 3 ratio** сдвинуты в разные стороны от середины. Сравни их выходы с мастером.", targets: [{ module: clk, param: Clk 2 ratio }, { module: clk, param: Clk 3 ratio }] }
      - { after: scope_a, text: "Верхняя линия — мастер, нижняя — Clock 1. Они идут вместе, потому что коэффициент 1.", targets: [{ module: scope_a, input: Ch 1 }, { module: scope_a, input: Ch 2 }] }
    faq:
      - q: Как увидеть больше долей на экране?
        a: "Увеличь Time у Scope: он задаёт, сколько миллисекунд помещается на экран. Сейчас там 2000 мс, то есть около четырёх долей при 120 BPM."
      - q: Как понять, какой выход делит, а какой умножает?
        a: Сравни с мастером на первом Scope. Где импульсов в кадре меньше, там деление. Где больше, там умножение. Не гадай по ручке, смотри на картинку.
      - q: Линии на Scope плоские. Что случилось?
        a: "Скорее всего, такт стоит. Посмотри на кнопку Run у Clocked: каждое нажатие переключает ход, идёт или стоит. Нажми Run один раз."

  - id: b6
    type: anatomy
    preset: anatomy
    title: Панель Clocked
    page: |
      # Панель Clocked
      **Clocked** — центр такта. Одна ручка задаёт темп, три выхода берут из него деления.
      Остальные ручки пока только называем.
    module: { ref: clk, plugin: ImpromptuModular, slug: Clocked }
    notes:
      - { text: "**Master clock** — темп от 30 до 300 BPM. Ручка шаговая: показание всегда целое.", targets: [{ module: clk, param: Master clock }] }
      - { text: "**Clk 1 ratio**, **Clk 2 ratio**, **Clk 3 ratio** — коэффициенты трёх выходов. В середине стоит 1: выход идёт в такт мастеру. В стороны — деление и умножение, до 96.", targets: [{ module: clk, param: Clk 1 ratio }, { module: clk, param: Clk 2 ratio }, { module: clk, param: Clk 3 ratio }] }
      - { text: "Выходы **Master clock**, **Clock 1**, **Clock 2** и **Clock 3** отдают импульсы 0 и 10 В.", targets: [{ module: clk, output: Master clock }, { module: clk, output: Clock 1 }, { module: clk, output: Clock 2 }, { module: clk, output: Clock 3 }] }
      - { text: "**Run** — запуск и остановка: каждое нажатие переключает ход. Если выходы стоят, нажми Run.", targets: [{ module: clk, param: Run }] }
      - { text: "**Reset** — сброс: все выходы снова начинают с первой доли. Тот же сигнал принимает вход **Reset**.", targets: [{ module: clk, param: Reset }, { module: clk, input: Reset }] }
      - { text: "**Pulse width clk 1** — доля периода, которую выход держит 10 В. Темп не меняется, импульс становится шире или уже.", targets: [{ module: clk, param: Pulse width clk 1 }] }
    later:
      - { what: "Свинг (Swing clk) и задержка выходов (Delay clk)", lesson: "9.1" }
      - { what: "Вход BPM CV / Ext clock — подчинить Clocked чужому такту", lesson: "9.1" }
      - { what: "Режим темпа (Bpm mode prev, Bpm mode next)", lesson: "9.1" }
    faq:
      - q: Что такое Unused 1–4 на входах?
        a: Служебные гнёзда без функции. Кабели в них не нужны. Рабочие входы — Reset, Run и BPM CV / Ext clock.
      - q: Для чего вход BPM CV / Ext clock?
        a: Через него Clocked подстраивается под чужой такт или получает темп напряжением. Пока оставь его пустым, к нему вернёмся в части 9.
      - q: Почему у Clocked четыре выхода такта, а не три?
        a: Три деления — Clock 1, 2 и 3. Четвёртый — Master clock, сам мастер. Ещё есть выходы Reset и Run, они передают сброс и ход другим модулям.

  - id: b7
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Поверни **Master clock** от 60 до 180 BPM."
        see: "Импульсы на всех экранах теснее. Деления подстраиваются сами, ручки коэффициентов трогать не надо."
      - do: "Сдвинь **Clk 2 ratio** на один щелчок в одну сторону, потом в другую."
        see: "С одной стороны Clock 2 реже мастера, с другой чаще. Запомни, какая сторона какая."
      - do: "Измени **Pulse width clk 2** от 0,1 до 0,9."
        see: "Импульсы Clock 2 становятся уже или шире. Расстояние между ними остаётся тем же."
      - do: "Нажми **Reset** у Clocked в разные моменты."
        see: "После нажатия все выходы снова начинают вместе с общей первой доли."
    modules:
      - { ref: clk, plugin: ImpromptuModular, slug: Clocked, params: { Master clock: { display: "120" }, Clk 2 ratio: { display: "2" }, Clk 3 ratio: { display: "-2" } } }
      - { ref: scope_a, plugin: Fundamental, slug: Scope, params: { Time: { display: "2000" } } }
      - { ref: scope_b, plugin: Fundamental, slug: Scope, params: { Time: { display: "2000" } } }
    cables:
      - { from: [clk, Master clock], to: [scope_a, Ch 1] }
      - { from: [clk, Clock 1], to: [scope_a, Ch 2] }
      - { from: [clk, Clock 2], to: [scope_b, Ch 1] }
      - { from: [clk, Clock 3], to: [scope_b, Ch 2] }
    notes:
      - { after: clk, text: "Шаги 1–3 — ручки Clocked. Шаг 4 — кнопка Reset.", targets: [{ module: clk, param: Master clock }, { module: clk, param: Pulse width clk 2 }, { module: clk, param: Reset }] }
    faq:
      - q: Master clock не двигается плавно, а прыгает. Это нормально?
        a: Да. Ручка шаговая, показание всегда целое число BPM. Темп 120, 121, 122 — без дробных значений.
      - q: Я нажал Reset, а картинка на Scope не изменилась.
        a: Если все линии уже шли с общей первой доли, сброс незаметен. Подожди, пока деления разойдутся, и нажми ещё раз.
      - q: Pulse width clk 2 поменял картинку, а темп нет. Так и должно быть?
        a: Да. Ширина импульса — это длительность гейта внутри периода, а не частота. Расстояние между импульсами задают Master clock и коэффициент.

  - id: b8
    type: practice
    preset: practice
    title: Практика — пульт тактов
    task: |
      Собери пульт тактов сам, между маркерами «Верстак».
      1. Поставь **Clocked** и два **Scope**. **Master clock** — от 80 до 140 BPM.
      2. Кабели: `Master clock` → `Ch 1` первого Scope, `Clock 1` → `Ch 2` первого Scope.
      3. `Clock 2` → `Ch 1` второго Scope, `Clock 3` → `Ch 2` второго Scope.
      4. Подбери коэффициенты: Clock 1 в такт мастеру, Clock 2 вдвое реже, Clock 3 вчетверо реже. Проверяй по картинке на Scope.
      5. Убедись, что такт идёт, и нажми «Проверить».
    check: p5-01-clock-tempo
    hints:
      "module:clk":
        - Нужен генератор такта с тремя делениями.
        - Он из набора Impromptu Modular, а не из Fundamental.
        - "Поставь на верстак **Clocked** (плагин ImpromptuModular)."
      "module:scopeA":
        - Мало экранов для четырёх линий.
        - Для четырёх сигналов нужны два осциллографа по два канала.
        - Поставь первый **Scope** из Fundamental на верстак.
      "module:scopeB":
        - Второй экран ещё не стоит.
        - Нужен второй осциллограф для Clock 2 и Clock 3.
        - Поставь второй **Scope** из Fundamental на верстак.
      "cable:1":
        - Главный такт не виден на экране.
        - Какой выход Clocked даёт мастера и в какой вход первого Scope его подать?
        - "`Master clock` у Clocked → `Ch 1` первого Scope."
      "cable:2":
        - Первое деление не выведено.
        - Какой выход Clocked идёт сразу после мастера?
        - "`Clock 1` у Clocked → `Ch 2` первого Scope."
      "cable:3":
        - Второе деление не выведено.
        - Второй Scope ждёт сигнал на первом канале.
        - "`Clock 2` у Clocked → `Ch 1` второго Scope."
      "cable:4":
        - Третье деление не выведено.
        - Второй Scope ждёт сигнал и на втором канале.
        - "`Clock 3` у Clocked → `Ch 2` второго Scope."
      "param:1":
        - Для упражнения нужен умеренный темп.
        - Посмотри на ручку Master clock. Медленнее 80 BPM деления не уместятся в кадр, быстрее 140 слипнутся.
        - Поставь Master clock от 80 до 140 BPM.
      "probe:1":
        - На Scope плоские линии, импульсов нет.
        - Идёт ли Clocked? Посмотри на кнопку Run.
        - Run переключает ход при каждом нажатии. Если такт стоит, нажми Run один раз.
    faq:
      - q: Как понять, что Clock 2 вдвое реже мастера?
        a: Смотри на два Scope. Между двумя соседними импульсами Clock 2 помещаются ровно два импульса мастера. Если помещается три или один, подбери другой коэффициент.
      - q: Проверка не смотрит на коэффициенты. Зачем их ставить?
        a: "Кабели и темп проверяются автоматически, а деления ты сверяешь глазами по Scope. Без разных делений урок теряет смысл: мастер и три копии выглядели бы одинаково."
      - q: Можно использовать один Scope?
        a: Для проверки нужны два, как в задании. Один Scope имеет только два канала, а выходов в схеме четыре.

  - id: b9
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      На втором Scope пропал сигнал деления. Мастер и остальные выходы на месте.
      Найди одну ошибку и исправь её одним кабелем.
    modules:
      - { ref: clk, plugin: ImpromptuModular, slug: Clocked, params: { Master clock: { display: "120" }, Clk 2 ratio: { display: "2" }, Clk 3 ratio: { display: "-2" } } }
      - { ref: scope_a, plugin: Fundamental, slug: Scope, params: { Time: { display: "2000" } } }
      - { ref: scope_b, plugin: Fundamental, slug: Scope, params: { Time: { display: "2000" } } }
    cables:
      - { from: [clk, Master clock], to: [scope_a, Ch 1] }
      - { from: [clk, Clock 1], to: [scope_a, Ch 2] }
      - { from: [clk, Clock 2], to: [scope_b, Ch 1] }
      - { from: [clk, Clock 3], to: [scope_b, Ch 2] }
    break: { remove_cable: [clk, Clock 2, scope_b, Ch 1] }
    check: { kind: fixed, expect_cable: [clk, Clock 2, scope_b, Ch 1] }
    hints:
      fixed:
        - Одна линия на втором Scope лежит на нуле, хотя такт идёт. Чего ей не хватает?
        - Посмотри на вход Ch 1 у второго Scope. К нему ведёт кабель?
        - "Соедини `Clock 2` у Clocked с `Ch 1` у второго Scope."
    faq:
      - q: Линия плоская. Это значит, что такт остановлен?
        a: Нет. Остальные линии идут, значит Clocked работает. Плоская линия на одном канале — повод проверить кабель именно к этому входу.
      - q: Почему на Scope без кабеля просто ноль?
        a: Пустой вход передаёт 0 В, а Scope рисует напряжение. Нет сигнала — нет и импульсов, только прямая на нуле.

  - id: b10
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - [[Такт]] — ровные импульсы «сейчас». [[Темп]] в BPM переводят в герцы делением на 60.
      - Один главный такт даёт деления: выход реже мастера держится с ним в одной доле.
      - [[Сброс]] возвращает всё на первую долю, а темп не меняет. Остановка — это Run.
      - Нет импульсов на экране: сначала проверь, идёт ли такт.
      Сохрани патч: Clocked понадобится в каждом уроке части 5.
      **Источники:** Noise Engineering, «Getting Started: Clocks»; руководство Impromptu Modular по модулю Clocked; страница VCV «Voltage Standards»; Doepfer, «A-100 Technical Details».
    questions:
      - q: Как перевести 3 Гц в BPM?
        options:
          - { text: "Умножить на 60, получится 180 BPM", correct: true, why: "В минуте 60 секунд: 3 импульса в секунду дают 180 импульсов в минуту." }
          - { text: "Разделить на 60, получится 0,05 BPM", why: "Так переводят BPM в герцы, а не наоборот. Здесь нужно обратное действие." }
          - { text: "Число не меняется: 3 Гц это 3 BPM", why: "Герцы считают в секунду, BPM — в минуту. Разные единицы, нужен пересчёт на 60." }
      - q: Что вернёт все деления на общую первую долю?
        options:
          - { text: Reset, correct: true, why: "Сброс отправляет делители и секвенсоры в начало. Темп остаётся прежним." }
          - { text: Run, why: "Run останавливает или запускает такт, а положение на линии времени не возвращает." }
          - { text: Master clock, why: "Эта ручка меняет темп. Положение долей она не сбрасывает." }
    next: |
      # Дальше: 5.2
      **SEQ 3.** Такт начнёт двигать секвенсор: восемь ручек задают мелодию, кнопки — ритм.
    faq:
      - q: Что важнее запомнить из урока?
        a: Один темп, много делений, один сброс. Это связка, на которой строятся секвенсоры, переключатели и логика в следующих уроках.
      - q: Что повторить, если деления путаются?
        a: Вернись к живому ряду с двумя Scope и сравни выходы с мастером. Где импульсов в кадре меньше, там деление.
