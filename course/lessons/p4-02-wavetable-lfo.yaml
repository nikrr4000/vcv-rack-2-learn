    cables:
      - { from: [lfo, Triangle], to: [wlfo, Wavetable position] }
      - { from: [wlfo, Wavetable], to: [vcf, Frequency] }
      - { from: [vco, Sawtooth], to: [vcf, Audio] }
      - { from: [vcf, Lowpass filter], to: [audio, "To \"device output 1\""] }
      - { from: [wlfo, Wavetable], to: [scope, Ch 1] }
    break: { set_param: { module: wlfo, name: Frequency, value: { display: "300" } } }
    check: { kind: fixed, expect_param: { module: wlfo, name: Frequency, display_max: 8 } }
    hints:
      fixed:
        - "Посмотри на Scope: плавная кривая или частокол?"
        - Какая ручка Wavetable LFO задаёт скорость цикла?
        - Поставь Frequency у Wavetable LFO не выше 8 Гц.
    faq:
      - q: Почему на 300 Гц получается шероховатый звук?
        a: Wavetable LFO вышел на звуковую частоту и сам начал давать окраску, а не медленный свип. Модуль создан для CV, а не для звука.
      - q: Можно ли оставить высокую частоту ради тембра?
        a: Для тембра есть Wavetable VCO. Здесь Wavetable LFO нужен как модулятор, поэтому держи Frequency в диапазоне 0,2–8 Гц.

  - id: b10
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - Wavetable LFO читает форму из таблицы. Выход один, **Wavetable**, и это CV.
      - Положение в таблице выбирает форму. Скорость цикла остаётся прежней.
      - Один LFO может двигать положение другого. Это модуляция модуляции.
      - Wavetable position CV на 0 % отключает вход.
      Сохрани патч: приём «LFO в положение таблицы» ещё пригодится.
      **Источники:** руководство VCV Rack Free (раздел Wavetable LFO); Perfect Circuit, «Learning Synthesis: LFOs».
    questions:
      - q: Что значит «модулировать модулятор» и зачем это нужно?
        options:
          - { text: "Один LFO двигает параметр другого, и рисунок сигнала эволюционирует", correct: true, why: "Форма второго LFO плавно меняется, и модуляция не повторяется ровно." }
          - { text: "Два LFO складываются в один звук", why: "LFO не звучат. Здесь один управляет положением в таблице другого." }
          - { text: "LFO делают быстрее", why: "Скорость задаёт Frequency. Положение в таблице меняет форму, а не скорость." }
    next: |
      # Дальше: 4.3
      **Смешивание и масштабирование.** Несколько модуляторов сложатся в один сигнал, а его диапазон придётся ограничить.
    faq:
      - q: Что повторить, если запутался?
        a: Урок 4.1 про LFO и урок 2.4 про Wavetable VCO. Главное — различать скорость и положение в таблице.
      - q: Пригодится ли Wavetable LFO дальше?
        a: Да, в пэдах и басах части 8. Там срез фильтра ходит по рисунку, который сам эволюционирует.
