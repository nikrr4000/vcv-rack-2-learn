id: p1-03-volt-per-octave
num: "1.3"
part: 1
title: 1V/oct
goal: "Задавать высоту ноты напряжением: 0 В — C4, 1 В — октава вверх, полутон — 1/12 В; выкладывать октаву и квинту постоянными вольтами."
builds: "Язык высоты, на котором говорят секвенсор, квантайзер и MIDI в частях 5 и 6. Мелодия там — это последовательность напряжений."
minutes: 25
requires: [p1-02-voltage]
glossary: [1V/oct, транспонирование]
sources: [vcv-voltage-standards, lm-glossary, sos-16]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: 1V/oct
    page: |
      # 1.3 1V/oct
      **Ты научишься:** задавать высоту ноты вольтами и считать, сколько вольт в октаве, полутоне и квинте.
      **Ты соберёшь:** цепочку 8vert → Octave → VCO, которая играет заданную ноту без клавиатуры.
      **Понадобится:** 25 минут. Звук тихий, синус из VCO.
    figure: { template: keyboard, from: C3, to: C5, marks: [{ note: C3, volts: -1 }, { note: C4, volts: 0 }, { note: C5, volts: 1 }], caption: "Нота C4 лежит на 0 В. Каждый вольт вверх или вниз — октава." }
    faq:
      - q: Мне нужно знать теорию музыки?
        a: "Нет. Хватит двух фактов: в октаве 12 полутонов, а октава вверх — вдвое выше по частоте. Остальное ты будешь считать вольтами."
      - q: Зачем задавать ноту напряжением, если есть клавиатура?
        a: Секвенсор, квантайзер и MIDI-модули выдают именно напряжения. Поняв стандарт, ты прочтёшь любую мелодию в патче как набор чисел.
      - q: Звук будет громким?
        a: Нет, если начать с тихой громкости. Демо звучит только в активном ряду, а уровень задаёт ручка Level у Audio.

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса про высоту и вольты. Ответы покажут, что объясняется в уроке.
    questions:
      - q: На вход высоты VCO подали на 1 В больше. Что стало с частотой?
        free: true
        options:
          - { text: "Выросла вдвое, на октаву", correct: true, why: "Один вольт — одна октава, то есть удвоение частоты. Закон одинаков при любой исходной ноте." }
          - { text: "Выросла на 1 Гц", why: "Зависимость не линейная. Вольт умножает частоту на два, а не прибавляет к ней герцы." }
          - { text: "Выросла на 261,63 Гц", why: "261,63 Гц — частота ноты при 0 В. К шагу в один вольт это число отношения не имеет." }
      - q: Сколько вольт в одном полутоне?
        options:
          - { text: "1/12 В, около 0,083 В", correct: true, why: "В октаве 12 полутонов, а октава занимает 1 В. Значит, на полутон приходится одна двенадцатая вольта." }
          - { text: "1 В", why: "Это целая октава, то есть 12 полутонов сразу." }
          - { text: "0,1 В", why: "Круглое число не подходит: 0,1 В — не одна двенадцатая. Нота вышла бы заметно фальшивой." }
      - q: Какое напряжение даёт квинту вверх от C4?
        options:
          - { text: "7/12 В, около 0,583 В", correct: true, why: "Квинта — 7 полутонов. Каждый стоит 1/12 В, поэтому 7/12 В." }
          - { text: "0,5 В", why: "Квинта — не половина октавы. Половина октавы, 6 полутонов, звучит как тритон." }
          - { text: "7 В", why: "Семь вольт — это семь октав. Семь полутонов — всего 7/12 В." }

  - id: b3
    type: story
    preset: story
    title: Один вольт — одна октава
    page: |
      # Один вольт — одна октава
      Стандарт [[1V/oct]] такой: плюс 1 В — частота вдвое выше. При 0 В VCO играет C4, около 261,63 Гц.
      Напряжение подают на вход `1V/octave pitch` у VCO. Оно прибавляется к ноте, которую задаёт ручка **Frequency**.
      Формула: частота = 261,63 Гц × 2 в степени V. Минус 1 В даёт 130,81 Гц, плюс 1 В — 523,25 Гц, плюс 2 В — 1046,50 Гц.
      Ручка **Frequency** в середине показывает те же 261,63 Гц. Весь её ход — около ±4,5 октавы. Вольты с входа добавляются к нему.
      Расчёт в Rack точный, строй не «уплывает».
    figure: { template: keyboard, from: C3, to: C6, marks: [{ note: C3, volts: -1 }, { note: C4, volts: 0 }, { note: C5, volts: 1 }, { note: C6, volts: 2 }], caption: "Вольты и ноты: каждая октава — на 1 В выше." }
    simpler: Представь лифт с этажами-октавами. Каждый вольт — один этаж вверх. Высота этажа в герцах растёт, но по лестнице вольтов ты всегда шагаешь ровно на один пролёт.
    faq:
      - q: Почему частота растёт не на ту же величину за каждый вольт?
        a: "Ухо слышит октаву как умножение частоты на два. Поэтому за каждый вольт частота удваивается: 261,63, 523,25, 1046,50 Гц. Шаг в герцах растёт, шаг на слух остаётся равным."
      - q: Что такое C4?
        a: Нота до первой октавы. В Rack она принята за ноль вольт, около 261,63 Гц. Это точка отсчёта для всех остальных нот.
      - q: Значит, ручка Frequency и вход складываются?
        a: Да. Ручка задаёт стартовую ноту, вход прибавляет к ней вольты. Если ручка на 130,81 Гц, а на входе плюс 1 В, получится снова 261,63 Гц.

  - id: b4
    type: story
    preset: story
    title: Полутон и квинта
    page: |
      # Полутон и квинта
      В октаве 12 полутонов, а октава занимает 1 В. Значит, [[полутон как 1/12 В|полутон]] — это 1/12 В, около 0,083 В.
      Квинта — 7 полутонов, то есть 7/12 В, около 0,583 В. От C4 это нота G4, примерно 392,00 Гц.
      Большая терция — 4/12 В: нота E4, около 329,63 Гц.
      [[транспонирование|Транспонирование]] — сдвиг всей мелодии на один и тот же интервал. В напряжениях это сложение: плюс 1 В — вся мелодия на октаву выше.
      Квантайзер из урока 5.3 подгоняет случайное напряжение к таким двенадцатым долям вольта.
    figure: { template: table, rows: [[Интервал, Полутонов, Вольт, "Нота от C4"], [октава, "12", "1", C5], [квинта, "7", "0,583", G4], [терция, "4", "0,333", E4], [полутон, "1", "0,083", "C#4"]], caption: "Интервалы от ноты C4 в вольтах." }
    simpler: Вольт делится на 12 деления, как линейка на 12 сантиметров. Один сантиметр — полутон. Нужную ноту ты ищешь, отсчитав деления от нуля.
    faq:
      - q: Почему квинта — не 0,5 В?
        a: Квинта — 7 полутонов из 12, а не половина октавы. Половина октавы, 6 полутонов, это 0,5 В — звучит как тритон, резкий интервал.
      - q: Нужно ли считать вольты вручную?
        a: Редко. Секвенсор и квантайзер сделают это за тебя. Считать полезно, чтобы понимать, что на кабеле, и находить ошибки на слух и на Scope.
      - q: Почему в таблице 0,083, а в тексте 1/12?
        a: "1/12 — точное значение, 0,083 — округление до тысячных. Для ручек Rack округления хватает: разница меньше цента."

  - id: b5
    type: live
    preset: live
    title: Вольт сдвигает ноту
    page: |
      # Вольт сдвигает ноту
      Перед тобой два **VCO** и **8vert**. VCO A стоит на 261,63 Гц и ни к чему не подключён — это контрольный тон.
      VCO B получает вольты из 8vert. Сейчас на входе плюс 1 В, и на Scope у B вдвое больше периодов, чем у A.
      Звучит VCO B. Поставь **Row 1 gain** на 0, на −1, на 0.583 (правый щелчок, число) и сравни ноту с контрольной.
    modules:
      - { ref: vcoa, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: v8, plugin: Fundamental, slug: 8vert, params: { Row 1 gain: { display: "1" } } }
      - { ref: vcob, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "10" }, Trigger: Enabled, Gain 1: { display: "10" }, Gain 2: { display: "10" } }
    cables:
      - { from: [vcoa, Sine], to: [scope, Ch 1] }
      - { from: [v8, Row 1], to: [vcob, 1V/octave pitch] }
      - { from: [vcob, Sine], to: [scope, Ch 2] }
      - { from: [vcob, Sine], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: vcoa, text: "VCO A — контрольный тон, 261,63 Гц.", targets: [{ module: vcoa, param: Frequency }] }
      - { after: v8, text: "**Row 1 gain** — вольты для VCO B. 1 В — октава вверх.", targets: [{ module: v8, param: Row 1 gain }] }
      - { after: vcob, text: "Вход `1V/octave pitch` прибавляет вольты к ручке **Frequency**.", targets: [{ module: vcob, input: 1V/octave pitch }] }
      - { after: scope, text: "Сравни периоды: у B их вдвое больше, чем у A.", targets: [{ module: scope, input: Ch 2 }] }
    faq:
      - q: Я не трогал Frequency, а B звучит выше. Почему?
        a: Вход `1V/octave pitch` прибавляет к ручке вольты. Плюс 1 В поднимает ноту на октаву, сколько бы ручка ни показывала.
      - q: Что будет при Row 1 gain, равном нулю?
        a: Оба тона совпадут. Ноль вольт ничего не добавляет, и VCO B играет ту же ноту, что стоит на ручке.
      - q: На Scope почти не видно разницу в полутон. Это ошибка?
        a: Нет. Полутон — 6 процентов по частоте, на экране это едва заметно. Зато на слух разница отчётливая.

  - id: b6
    type: anatomy
    preset: anatomy
    title: Вход высоты у VCO
    page: |
      # Вход высоты у VCO
      Полный разбор VCO будет в части 2. Сейчас нужны три элемента: ручка, вход высоты и выход.
    module: { ref: vco, plugin: Fundamental, slug: VCO }
    notes:
      - { text: "**Frequency** — стартовая нота. В середине 261,63 Гц, крайние значения — 11,562 и 5919,9 Гц.", targets: [{ module: vco, param: Frequency }] }
      - { text: "Вход **1V/octave pitch** — вольты прибавляются к ноте с ручки: 1 В — октава.", targets: [{ module: vco, input: 1V/octave pitch }] }
      - { text: "Выход **Sine** — синус для Audio и Scope.", targets: [{ module: vco, output: Sine }] }
    later:
      - { what: "Остальные выходы и режим FM mode", lesson: "2.1" }
      - { what: "Вход Frequency modulation", lesson: "1.5" }
    faq:
      - q: Какой вход выбрать для высоты, если их несколько?
        a: "Для нот нужен `1V/octave pitch`. Остальные входы VCO управляют другими вещами: частотной модуляцией, синхронизацией, шириной импульса."
      - q: Что произойдёт, если ручку Frequency сдвинуть, а кабель оставить?
        a: Сложатся оба. Ручка сдвинет стартовую ноту, кабель прибавит свои вольты. Итог — сумма в октавах.

  - id: b7
    type: anatomy
    preset: anatomy
    title: Панель Octave
    page: |
      # Панель Octave
      Octave прибавляет к входящей высоте целые октавы. Модуль маленький: два входа, одна ручка, один выход.
    module: { ref: oct, plugin: Fundamental, slug: Octave }
    notes:
      - { text: "Вход **1V/octave pitch** — высота, которую нужно сдвинуть.", targets: [{ module: oct, input: 1V/octave pitch }] }
      - { text: "**Shift** сдвигает на целые октавы, от −4 до +4. Шаги только целые.", targets: [{ module: oct, param: Shift }] }
      - { text: "Вход **Octave shift CV** — тот же сдвиг, но от управляющего напряжения.", targets: [{ module: oct, input: Octave shift CV }] }
      - { text: "Выход **Pitch** — исходная высота плюс сдвиг. Его кабель идёт в VCO.", targets: [{ module: oct, output: Pitch }] }
    later:
      - { what: "Управление сдвигом по CV", lesson: "4.1" }
    faq:
      - q: Чем Octave лучше, чем просто добавить 1 В через 8vert?
        a: Результат тот же, но Octave сдвигает точно на целые октавы. Ручка Shift не может дать полуоктаву по ошибке, а 8vert — может.
      - q: Что на выходе Pitch, если на входе пусто?
        a: Только сдвиг. При Shift, равном 1, на выходе плюс 1 В, при 0 — ноль вольт.

  - id: b8
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Поставь **Row 1 gain** на 1, потом на 2, потом на −1. Нажимай правый щелчок и вписывай число."
        see: Каждый вольт — октава. Период B на Scope то вдвое короче периода A, то вчетверо, то вдвое длиннее.
      - do: "Поставь **Row 1 gain** на 0.083, потом на 0.167, потом на 0.25."
        see: Ноты идут ступенями в полутон, тон и малую терцию. Их хорошо слышно на фоне VCO A.
      - do: "Поставь **Row 1 gain** на 0.583."
        see: "B звучит квинтой над контрольным тоном: G4, около 392 Гц."
      - do: "Верни **Row 1 gain** на 1 и опусти **Frequency** у VCO B до 130.81."
        see: Ручка опускает ноту на октаву, вольт поднимает. Итог — снова 261,63 Гц, тона совпали.
      - do: "Верни **Frequency** на 261.63, поставь **Row 1 gain** на 0.583 и меняй **Shift** у Octave: −1, 0, 1, 2."
        see: Нота сдвигается целыми октавами, а интервал над контрольным тоном внутри октавы сохраняется.
    modules:
      - { ref: vcoa, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: v8, plugin: Fundamental, slug: 8vert, params: { Row 1 gain: { display: "0" } } }
      - { ref: oct, plugin: Fundamental, slug: Octave, params: { Shift: { display: "0" } } }
      - { ref: vcob, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "10" }, Trigger: Enabled, Gain 1: { display: "10" }, Gain 2: { display: "10" } }
    cables:
      - { from: [vcoa, Sine], to: [scope, Ch 1] }
      - { from: [v8, Row 1], to: [oct, 1V/octave pitch] }
      - { from: [oct, Pitch], to: [vcob, 1V/octave pitch] }
      - { from: [vcob, Sine], to: [scope, Ch 2] }
      - { from: [vcob, Sine], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: v8, text: "Шаги 1–4 — здесь.", targets: [{ module: v8, param: Row 1 gain }] }
      - { after: oct, text: "Шаг 5 — здесь.", targets: [{ module: oct, param: Shift }] }
    faq:
      - q: Звук не меняется, когда я меняю Row 1 gain.
        a: "Проверь цепочку: 8vert идёт в Octave, Octave — в VCO B, а в Audio звучит VCO B. Если кабель стоит в VCO A, ты слушаешь контрольный тон."
      - q: Как ввести 0.083 точно?
        a: Правый щелчок по ручке Row 1 gain открывает поле. Впиши число с точкой и подтверди. Значение под курсором Rack показывает сам.

  - id: b9
    type: practice
    preset: practice
    title: Практика — нота из вольтов
    task: |
      Собери цепочку, которая играет G5 без клавиатуры.
      1. Поставь между маркерами **8vert**, **Octave** и **VCO**.
      2. `Row 1` у 8vert → `1V/octave pitch` у Octave. `Pitch` у Octave → `1V/octave pitch` у VCO.
      3. `Sine` у VCO → Audio этого ряда.
      4. **Row 1 gain** — на квинту, 7/12 В: около 0.583. **Shift** у Octave — на 1.
      Потом нажми «Проверить» и назови в чате ноту, частоту и сумму вольт на входе VCO.
    given: [audio]
    check: p1-03-volt-per-octave
    hints:
      "cable:1":
        - Куда идёт напряжение из 8vert, чтобы его сдвинули на октаву?
        - Вход высоты у Octave.
        - "Кабель из `Row 1` у 8vert во вход `1V/octave pitch` у Octave."
      "cable:2":
        - Как VCO узнаёт новую высоту?
        - Выход Octave идёт в вход высоты VCO.
        - "Кабель из `Pitch` у Octave во вход `1V/octave pitch` у VCO."
      "cable:3":
        - Слышна ли нота?
        - Звук VCO идёт в Audio.
        - "Кабель из `Sine` у VCO во вход `To \"device output 1\"` у Audio."
      "param:1":
        - Сколько вольт в семи полутонах?
        - Семь двенадцатых, около 0.583. Правый щелчок по Row 1 gain даёт поле ввода.
        - Впиши 0.583 в Row 1 gain у 8vert.
      "param:2":
        - На сколько октав выше надо подняться?
        - Ручка Shift у Octave, шаги целые.
        - Поставь Shift на 1.
      "probe:1":
        - Сколько вольт должно быть на выходе Pitch?
        - Сложи 7/12 В от 8vert и сдвиг в одну октаву.
        - "0,583 + 1 = 1,583 В: проверь обе ручки и нажми «Проверить» ещё раз."
    faq:
      - q: Нужно ли вручную набирать ровно 0.583?
        a: Нужно близкое число. Проверка принимает значения от 0.56 до 0.61, то есть чуть левее и чуть правее точной 7/12.
      - q: Можно ли сдвинуть октаву ручкой Frequency у VCO вместо Octave?
        a: Звучать будет похоже, но проверка ждёт именно Shift = 1 у Octave. Здесь ты учишься складывать напряжения, а не ручки.

  - id: b10
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      VCO B должен звучать квинтой над VCO A, но звучит резким интервалом. На Scope периоды не в отношении 3 к 2.
      Найди одну неверную настройку и исправь её. Кабели трогать не нужно.
    modules:
      - { ref: vcoa, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: v8, plugin: Fundamental, slug: 8vert, params: { Row 1 gain: { display: "0.583" } } }
      - { ref: vcob, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "10" }, Trigger: Enabled, Gain 1: { display: "10" }, Gain 2: { display: "10" } }
    cables:
      - { from: [vcoa, Sine], to: [scope, Ch 1] }
      - { from: [v8, Row 1], to: [vcob, 1V/octave pitch] }
      - { from: [vcob, Sine], to: [scope, Ch 2] }
      - { from: [vcob, Sine], to: [audio, "To \"device output 1\""] }
    break: { set_param: { module: v8, name: Row 1 gain, value: { display: "0.5" } } }
    check: { kind: fixed, expect_param: { module: v8, name: Row 1 gain, display_min: 0.56, display_max: 0.61 } }
    hints:
      fixed:
        - Сколько вольт в семи полутонах квинты?
        - Посмотри на значение Row 1 gain у 8vert.
        - Поставь Row 1 gain около 0.583, это 7/12 В.
    faq:
      - q: На сколько вольт ошибка?
        a: "На 1/12 В, около 0,083 В. Это ровно один полутон: вместо 7 на ручке получилось 6."
      - q: Почему 0,5 В звучит так резко?
        a: 0,5 В — шесть полутонов, тритон. Это не квинта, частоты не стоят в простом отношении 3 к 2, и ухо слышит резкий диссонанс.

