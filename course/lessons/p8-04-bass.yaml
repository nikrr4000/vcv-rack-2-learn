  - id: b12
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - Бас — голос из урока 3.5 с огибающей ещё и на срезе фильтра.
      - Cutoff frequency CV задаёт глубину огибающей, Resonance — остроту квакания.
      - Акцент открывает резонанс на выбранных шагах: CV 2 → Resonance.
      - Слайд скользит на шагах с высоким CV 3: Glide у Process, время — Slew.
      Сохрани патч (⌘S): твоя копия урока 8.4 понадобится в части 9.
      **Источники:** MusicRadar, «Producer's Guide to the Roland TB-303». MusicRadar, «Make an Acid Bassline». Блог Noise Engineering, «Gamut Repetitor Acid Basslines». Omri Cohen, «TB-303 in VCV Rack».
    questions:
      - q: "Чем отличаются выходы Slew и Glide у Process?"
        options:
          - { text: "Glide скользит при высоком Gate, Slew при низком", correct: true, why: "Для acid-слайда нужен Glide: он скользит только на шагах, где CV 3 высокий." }
          - { text: "Slew скользит быстрее Glide", why: "Скорость задаёт ручка Slew, а не выбор выхода. Выходы различаются состоянием Gate." }
          - { text: "Glide работает с аудио, Slew с CV", why: "Оба выхода работают с напряжением мелодии. Различает их Gate." }
    next: |
      # Дальше: 8.5
      **Лид и арпеджио.** Тот же голос сыграет мелодию, а квантизатор подберёт ноты аккорда по очереди.
    faq:
      - q: "Что повторить, если бас не квакает?"
        a: "Проверь кабель Envelope → Frequency у VCF и ручку Cutoff frequency CV. Если она у нуля, огибающая не двигает срез."
      - q: "Зачем сохранять патч?"
        a: "В части 9 бас встанет в одну тональность с пэдом. Твоя копия урока 8.4 понадобится как готовый инструмент."
