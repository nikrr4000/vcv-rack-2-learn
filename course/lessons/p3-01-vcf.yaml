id: p3-01-vcf
num: "3.1"
part: 3
title: VCF
goal: Закрывать яркую пилу фильтром и слышать, как гармоники уходят, а высота ноты остаётся.
builds: Первый из трёх кирпичей голоса — тембр. После него идут громкость (VCA) и огибающая (ADSR).
minutes: 30
requires: [p2-01-vco]
glossary: [фильтр, частота среза, фильтр нижних частот, фильтр верхних частот, резонанс, драйв, гармоники]
sources: [vcv-free-manual, sos-06, pc-learning-synthesis]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: Фильтр
    page: |
      # 3.1 Фильтр (VCF)
      **Ты научишься:** убирать верхние [[гармоники]] у пилы и слышать, как звук темнеет, а нота остаётся прежней.
      **Ты соберёшь:** VCO → VCF → Audio и закроешь пилу так, чтобы она стала глухой, но не пропала.
      **Понадобится:** 30 минут, наушники или колонки на тихой громкости.
      [[фильтр|Фильтр]] — первый кирпич голоса. Дальше добавятся громкость и огибающая.
    figure: { template: filter, type: lp, cutoff: 1000, resonance: 0.2, caption: Фильтр нижних частот. Всё левее частоты среза проходит, правее — ослабляется. }
    faq:
      - q: Зачем фильтр, если у VCO уже четыре формы волны?
        a: Форма волны задаёт набор гармоник, а фильтр меняет его на ходу. Одной ручкой звук идёт от яркого к глухому и обратно. У VCO такой плавности нет.
      - q: Фильтр меняет высоту ноты?
        a: Нет. Высоту задаёт VCO. Фильтр только ослабляет часть гармоник, поэтому нота та же, а звук темнее. Проверь это на Scope в живом демо.
      - q: Звук будет громким?
        a: Начни с тихой громкости в системе. Демо звучит только в активном ряду. Если Level у Audio высоко, убавь его до того, как слушать.

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса до объяснений. Ошибаться можно: ответы покажут, о чём урок.
    questions:
      - q: Что фильтр нижних частот делает со звуком пилы?
        free: true
        options:
          - { text: "Ослабляет верхние гармоники, звук темнеет, нота та же", correct: true, why: "Фильтр убирает высокие частоты, но частоту самой ноты не трогает. Поэтому высота остаётся прежней." }
          - { text: "Понижает ноту на октаву", why: "Высоту меняет VCO, а фильтр работает с набором гармоник. Нота остаётся на месте, меняется яркость." }
          - { text: "Делает звук тише, а тембр не меняет", why: "Фильтр не регулятор громкости. Он убирает часть гармоник, и тембр становится глуше. Громкостью занимается VCA." }
      - q: Пила идёт во VCF, а частоту среза довели до самого низа. Что будет?
        options:
          - { text: Звук почти пропадёт, correct: true, why: "Срезано всё выше очень низкой частоты, а на ней у пилы почти ничего нет." }
          - { text: "Звук станет басовым, как на октаву ниже", why: "Срез не тянет ноту за собой. Он только убирает гармоники, а основной тон остаётся там, где его поставил VCO." }
          - { text: "Ничего не изменится, пока не подан CV", why: "Ручка Cutoff frequency работает сама, без кабеля. CV нужен только чтобы двигать срез напряжением." }
      - q: Что делает ручка Resonance?
        options:
          - { text: "Усиливает частоты возле среза, появляется пик", correct: true, why: "Возле частоты среза растёт горб. Он даёт звуку окраску и при высоких значениях свист." }
          - { text: Добавляет реверберацию, why: "Реверберация — это эхо помещения, у фильтра её нет. Резонанс звенит только возле частоты среза." }
          - { text: "Поднимает громкость на всех частотах", why: "Резонанс усиливает узкую полосу возле среза, а не весь спектр." }

  - id: b3
    type: story
    preset: story
    title: Что остаётся от пилы
    page: |
      # Что остаётся от пилы
      Пила звучит ярко, потому что в ней много [[гармоники|гармоник]]: основной тон и ряд призвуков выше него.
      [[фильтр|Фильтр]] решает, какие из них пройдут. Одни частоты он пропускает, другие ослабляет.
      Так устроен вычитающий синтез: берёшь звук, богатый гармониками, и убираешь лишнее. Тембр меняется, а высота нет.
    figure: { template: harmonics, shape: saw, count: 12, law: 1/n, caption: Гармоники пилы. Фильтр срезает правые столбики, левые остаются. }
    simpler: Представь решето с ситом. Мелкая пыль проходит, крупные камни остаются. Фильтр тоже сортирует, только по частоте. Яркие призвуки застревают, а нота остаётся.
    faq:
      - q: Если фильтр убирает гармоники, почему звук не пропадает совсем?
        a: Основной тон лежит ниже частоты среза и проходит целиком. Пропадают только высокие призвуки. Звук исчезает, лишь если срез опущен ниже самой ноты.
      - q: А если подать на фильтр синус?
        a: Синус — это один основной тон, срезать у него нечего. Пока срез выше ноты, звук не изменится, а ниже — просто затихнет. Яркой окраски не будет.
      - q: Чем фильтр отличается от эквалайзера?
        a: Эквалайзер поднимает и опускает отдельные полосы. Фильтр в модуле — одна ручка среза, которая ослабляет всё по одну сторону от неё. Он проще и легче управляется.

  - id: b4
    type: story
    preset: story
    title: Срез и резонанс
    page: |
      # Срез и резонанс
      [[частота среза|Частота среза]] — граница, с которой фильтр начинает ослаблять звук. В Rack её ручка называется **Cutoff frequency**.
      [[фильтр нижних частот|Фильтр нижних частот]] (ФНЧ) оставляет низы и срезает верх. [[фильтр верхних частот|Фильтр верхних частот]] (ФВЧ) делает наоборот.
      В VCV оба выхода у одного модуля: **Lowpass filter** и **Highpass filter**.
    page2: |
      [[резонанс|Резонанс]] усиливает частоты возле среза. На графике растёт горб, а звук окрашивается.
      Если резонанс почти на максимуме, фильтр начинает свистеть. Об этом будет урок 3.2.
      [[драйв|Драйв]] подпитывает вход. Ниже 100 % звук чище, выше — плотнее.
    figure: { template: filter, type: lp, cutoff: 800, resonance: 0.6, caption: Тот же ФНЧ с резонансом. Возле среза появился горб. }
    simpler: Срез — это дверь в узком коридоре. Низкие частоты проходят, высокие упираются в стену. Резонанс — сквозняк прямо у двери, он на секунду сильнее подталкивает тех, кто рядом.
    faq:
      - q: Какой выход брать, Lowpass filter или Highpass filter?
        a: Чтобы сделать пилу темнее, бери Lowpass filter. Highpass filter убирает басы и оставляет шипение. Оба выхода работают одновременно, это два кабеля из одного фильтра.
      - q: Что значит число под ручкой Cutoff frequency?
        a: Это частота в герцах. Середина хода — 261,63 Гц, нота C4. Вся шкала идёт от 8,556 до 8000 Гц. Чем число меньше, тем темнее звук.
      - q: Резонанс — это та же реверберация?
        a: Нет. Реверберация — это эхо помещения. Резонанс усиливает узкую полосу возле среза и больше ничего. Если слышишь звон, это он.

  - id: b5
    type: live
    preset: live
    title: Пила под фильтром
    page: |
      # Пила под фильтром
      Перед тобой VCO, VCF и Scope. Пила идёт через фильтр на выход.
      Крути **Cutoff frequency** от 8000 к 100 Гц. Звук темнеет, волна на Scope округляется.
      Высота при этом не меняется: период волны остаётся тем же.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: vcf, plugin: Fundamental, slug: VCF, params: { Cutoff frequency: { display: "1000" }, Resonance: { display: "0" } } }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "5" } } }
    cables:
      - { from: [vco, Sawtooth], to: [vcf, Audio] }
      - { from: [vcf, Lowpass filter], to: [scope, Ch 1] }
      - { from: [vcf, Lowpass filter], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: vco, text: "Пила — самая яркая форма. Ей есть что срезать.", targets: [{ module: vco, output: Sawtooth }] }
      - { after: vcf, text: "**Cutoff frequency** — граница среза. Сейчас 1000 Гц, крути вниз.", targets: [{ module: vcf, param: Cutoff frequency }] }
      - { after: vcf, text: "С **Lowpass filter** уходит тёмный звук. Перенеси кабель на **Highpass filter** — услышишь обратное.", targets: [{ module: vcf, output: Lowpass filter }, { module: vcf, output: Highpass filter }] }
      - { after: scope, text: "Период волны на экране не меняется — нота та же.", targets: [{ module: scope, param: Time }] }
    faq:
      - q: Звук стал совсем тихим. Фильтр сломался?
        a: Нет. Когда срез ниже ноты, остаётся почти один основной тон, и он тихий. Подними Cutoff frequency, и яркость вернётся.
      - q: Я перенёс кабель на Highpass filter, а звук стал тонким. Так и должно быть?
        a: Да. ФВЧ убирает низ и оставляет верх. Нота при этом не пропадает, но басов нет. Верни кабель на Lowpass filter.
      - q: Почему на Scope волна не стала синусом?
        a: Пока срез выше основной частоты, часть гармоник ещё проходит. Чем ниже срез, тем ближе форма к синусу. Опусти его до 300 Гц и посмотри.

  - id: b6
    type: anatomy
    preset: anatomy
    title: Панель VCF
    page: |
      # Панель VCF
      Обойдём главное. Входы и ручки для управления напряжением оставим урокам 3.2 и 4.1.
    module: { ref: vcf, plugin: Fundamental, slug: VCF }
    notes:
      - { text: "Вход **Audio** — сюда идёт звук, который нужно обработать.", targets: [{ module: vcf, input: Audio }] }
      - { text: "Выход **Lowpass filter** — тёмная часть звука, низы остаются.", targets: [{ module: vcf, output: Lowpass filter }] }
      - { text: "Выход **Highpass filter** — светлая часть, остаётся верх.", targets: [{ module: vcf, output: Highpass filter }] }
      - { text: "**Cutoff frequency** — частота среза в герцах. Середина хода — 261,63 Гц.", targets: [{ module: vcf, param: Cutoff frequency }] }
      - { text: "**Resonance** — усиление возле среза. Рядом с максимумом фильтр свистит.", targets: [{ module: vcf, param: Resonance }] }
      - { text: "**Drive** — подпитка входа: 100 % — как есть, выше — плотнее.", targets: [{ module: vcf, param: Drive }] }
    later:
      - { what: "Входы Frequency, Resonance, Drive и ручки CV", lesson: "3.2" }
    faq:
      - q: Вход Resonance и ручка Resonance — это одно и то же?
        a: Нет, названия совпадают. Ручка Resonance задаёт значение сама. Вход Resonance принимает напряжение и двигает значение, но ему нужна ручка Resonance CV.
      - q: Что за ручка без подписи на панели?
        a: "Так в Rack отображается служебный параметр. Её не трогаем, для звука она ничего не делает."
      - q: С какого значения Drive начинать?
        a: С 100 %. Это нейтральная отметка. Ниже звук чище и тише, выше — плотнее и с лёгким насыщением.

  - id: b7
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Опусти **Cutoff frequency** от 8000 до 100 Гц при **Resonance** 0 %."
        see: "Звук темнеет, потом пропадает. На Scope пила округляется, потом размах падает."
      - do: "Поставь **Cutoff frequency** около 500 Гц и подними **Resonance** до 50 %."
        see: "Звук окрашивается: слышен звон возле среза. На Scope виден звон на гранях зубцов."
      - do: "Верни **Resonance** в 0 % и подними **Drive** с 100 до 200 %."
        see: "Звук плотнее и громче. Верхушки зубцов на Scope сглаживаются."
      - do: "Перенеси кабель с **Lowpass filter** на **Highpass filter** и повтори шаг 1."
        see: "При низком срезе слышно почти всё. При высоком остаётся шипение."
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: vcf, plugin: Fundamental, slug: VCF, params: { Cutoff frequency: { display: "8000" }, Resonance: { display: "0" } } }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "5" } } }
    cables:
      - { from: [vco, Sawtooth], to: [vcf, Audio] }
      - { from: [vcf, Lowpass filter], to: [scope, Ch 1] }
      - { from: [vcf, Lowpass filter], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: vcf, text: "Шаги 1–3 — ручки этого VCF.", targets: [{ module: vcf, param: Cutoff frequency }, { module: vcf, param: Resonance }, { module: vcf, param: Drive }] }
    faq:
      - q: Поднял Resonance, и фильтр засвистел. Что делать?
        a: Верни Resonance ниже 50 %. Свист — это фильтр, который начал звучать сам. Его мы разберём в уроке 3.2. Сейчас он только мешает слушать.
      - q: Drive на 0 %, и звука почти нет. Это норма?
        a: Да. Drive подаёт сигнал на вход фильтра. При 0 % подавать нечего. Верни 100 %, это нейтральное значение.
      - q: После шага 4 нет звука при высоком срезе. Почему?
        a: Highpass filter срезает низы. Если срез высокий, остаётся только самый верх, он тихий. Опусти срез, и вернётся основная часть.

  - id: b8
    type: practice
    preset: practice
    title: Практика — тёмная пила
    task: |
      Собери цепочку сам, между маркерами «Верстак».
      1. **VCO** и **VCF**.
      2. Пила в фильтр: `Sawtooth` → `Audio` у VCF.
      3. Тёмный звук на выход: `Lowpass filter` → вход 1 у Audio.
      4. **Cutoff frequency** — от 100 до 250 Гц: ниже ноты VCO, но не в самом низу.
      5. Подвигай **Resonance** и реши, что делает звук интереснее. Нажми «Проверить».
    given: [audio]
    check: p3-01-vcf
    hints:
      "cable:1":
        - Фильтру нечего фильтровать.
        - Какой выход VCO даёт пилу и какой вход у VCF принимает звук?
        - "`Sawtooth` у VCO → вход `Audio` у VCF."
      "cable:2":
        - Фильтр работает, но звук не доходит до выхода.
        - Какой выход VCF отдаёт тёмную часть звука?
        - "`Lowpass filter` у VCF → `To \"device output 1\"` у Audio этого ряда."
      "param:1":
        - Срез сейчас не в нужном окне.
        - Задача — закрыть пилу так, чтобы срез оказался ниже ноты VCO. Что показывает число под ручкой?
        - "Поставь **Cutoff frequency** от 100 до 250 Гц."
      "probe:1":
        - На выходе фильтра почти нет сигнала.
        - Срез упал в самый низ, и фильтр срезал всё. Звучит ли VCO?
        - Подними **Cutoff frequency** хотя бы до 100 Гц и нажми «Проверить» ещё раз.
    faq:
      - q: Можно оставить Resonance на нуле?
        a: "Можно. Проверка Resonance не смотрит. Но попробуй поднять его немного: звук станет выразительнее. Выше 50 % он начнёт свистеть."
      - q: Звук есть, а проверка не проходит. Почему?
        a: Скорее всего, Cutoff frequency вне окна 100–250 Гц. Посмотри на число под ручкой. Если выше 250 Гц, звук ещё слишком яркий для задачи.
      - q: Можно взять выход Highpass filter?
        a: Для этой проверки нужен именно Lowpass filter. Задача — получить тёмный звук. С Highpass filter получится обратное.

  - id: b9
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Этот фильтр молчит, хотя VCO звучит.
      Найди одну ошибку и исправь её одним кабелем.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: vcf, plugin: Fundamental, slug: VCF, params: { Cutoff frequency: { display: "1000" }, Resonance: { display: "0" } } }
    cables:
      - { from: [vco, Sawtooth], to: [vcf, Audio] }
      - { from: [vcf, Lowpass filter], to: [audio, "To \"device output 1\""] }
    break: { remove_cable: [vco, Sawtooth, vcf, Audio] }
    check: { kind: fixed, expect_cable: [vco, Sawtooth, vcf, Audio] }
    hints:
      fixed:
        - Фильтр стоит на месте, а звука нет. Что ему нужно на входе?
        - Посмотри на вход Audio у VCF. Он пустой?
        - Соедини `Sawtooth` у VCO с `Audio` у VCF.
    faq:
      - q: Почему фильтр без кабеля на входе молчит?
        a: Фильтру нечего пропускать. Он работает только с тем, что пришло на вход Audio. Исключение — резонанс у максимума, об этом урок 3.2.
      - q: Откуда мне знать, что вход пустой?
        a: "Если из гнезда не идёт кабель, вход свободен. Проследи пилу от VCO: она должна прийти в Audio фильтра."

  - id: b10
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - ФНЧ пропускает низы и срезает верх, ФВЧ — наоборот. Выходы Lowpass filter и Highpass filter у одного VCF.
      - **Cutoff frequency** — граница среза в герцах. Чем ниже, тем темнее звук. Высота ноты не меняется.
      - **Resonance** усиливает частоты возле среза, **Drive** подпитывает вход.
      Сохрани патч как `vcv-3.1.vcv`.
      **Источники:** руководство VCV Free (Fundamental), раздел VCF; Gordon Reid, «Synth Secrets», ч. 6 (Sound On Sound); Perfect Circuit, «Learning Synthesis».
    questions:
      - q: Какую часть звука пропускает ФНЧ?
        options:
          - { text: Низкие частоты, correct: true, why: "ФНЧ оставляет низы и ослабляет всё выше среза. Для пилы это значит более тёмный звук." }
          - { text: Высокие частоты, why: "Так работает ФВЧ. Он оставляет верх и срезает низы." }
      - q: Что произойдёт с высотой ноты, если опустить Cutoff frequency?
        options:
          - { text: "Ничего, нота та же", correct: true, why: "Срез убирает гармоники, а не двигает основной тон. Высоту задаёт VCO." }
          - { text: Нота станет ниже, why: "Это путают с ручкой Frequency у VCO. Срез на высоту не влияет." }
    next: |
      # Дальше: 3.2
      **VCF под управлением.** Срез начнёт двигаться напряжением от LFO, а потом фильтр запоёт сам.
    faq:
      - q: Что повторить, если фильтр звучит непонятно?
        a: Урок 2.1 про VCO и форму пилы. Фильтру нужен богатый звук, а на синусе он почти ничего не меняет.
      - q: Нужно ли знать крутизну спада в децибелах?
        a: Пока нет. Для урока достаточно знать, что за срезом звук ослабляется. Числа появятся, когда будешь выбирать фильтр под задачу.
