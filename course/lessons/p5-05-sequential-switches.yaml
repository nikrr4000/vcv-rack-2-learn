id: p5-05-sequential-switches
num: "5.5"
part: 5
title: Последовательные переключатели
goal: Использовать один такт, чтобы по очереди переключаться между четырьмя источниками, и собрать фразу из четырёх случайных нот.
builds: Основа структуры трека в части 9 — так чередуются фразы и слои.
minutes: 35
requires: [p5-02-seq3]
glossary: [последовательный переключатель, канал, случайное напряжение, секвенсор, сброс]
sources: [vcv-free-manual, ne-seq-switches, loopop-sh-switch]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: Последовательные переключатели
    page: |
      # 5.5 Последовательные переключатели
      **Ты научишься:** раздавать один сигнал на четыре выхода и собирать четыре входа в один по такту.
      **Ты соберёшь:** фразу из четырёх нот: **Random Values** → **Sequential Switch 4 to 1** → **VCO**.
      **Понадобится:** 35 минут, урок 5.2 про [[секвенсор]]. Начни с тихой громкости.
      [[Последовательный переключатель]] — маленький [[секвенсор]] для готовых сигналов.
    figure: { template: flow, layout: row, nodes: [{ id: clk, label: Clocked, kind: gate }, { id: sw, label: "Switch 4 to 1", kind: cv }, { id: vco, label: VCO, kind: audio }, { id: out, label: Audio, kind: audio }], edges: [{ from: clk, to: sw, kind: gate }, { from: sw, to: vco, kind: cv }, { from: vco, to: out, kind: audio }], caption: "Такт переключает каналы, выход переключателя управляет высотой." }
    faq:
      - q: Чем переключатель отличается от секвенсора?
        a: "Секвенсор хранит ноты в своих ручках. Переключатель ничего не хранит, а лишь по очереди пропускает готовые сигналы. Поэтому в него можно подать что угодно: ноты, ритмы, модуляцию."
      - q: Зачем нужны оба направления?
        a: Раздача (1 в 4) отправляет один сигнал на разные выходы по очереди. Сбор (4 в 1) выбирает один из четырёх входов. В уроке мы собираем фразу, поэтому нужен второй.
      - q: Откуда берутся четыре источника?
        a: "Из Random Values: он выдаёт несколько случайных напряжений, которые меняются, когда ты нажимаешь Push или подаёшь импульс. Между нажатиями значения держатся."

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса про переключатели. Ошибаться можно: ответы покажут, что разобрать.
    questions:
      - q: Какой переключатель раздаёт один вход на четыре выхода?
        free: true
        options:
          - { text: "Sequential Switch 1 to 4", correct: true, why: "Название читается как «из одного в четыре»: один вход, четыре выхода." }
          - { text: "Sequential Switch 4 to 1", why: "Это обратное направление: четыре входа, один выход." }
          - { text: "Mutes", why: "Mutes включает и выключает линии, но не выбирает один из четырёх." }
      - q: Что делает сигнал на входе Reset у переключателя?
        options:
          - { text: "Возвращает его на первый канал", correct: true, why: "На следующем такте включится второй канал. Reset двигает указатель." }
          - { text: "Останавливает и отключает все каналы", why: "Reset не останавливает. Он возвращает указатель на начало." }
          - { text: "Стирает значения в источниках", why: "Сброс не трогает источники. Он работает только с указателем." }
      - q: У Sequential Switch 4 to 1 стоит Steps = 3. Что произойдёт?
        options:
          - { text: "Цикл из трёх каналов, четвёртый вход пропускается", correct: true, why: "Steps ограничивает число каналов в цикле." }
          - { text: "Звук станет в три раза громче", why: "Steps не влияет на уровень сигнала." }
          - { text: "Переключатель сделает три цикла и остановится", why: "Steps — это длина цикла, а не число повторов." }

  - id: b3
    type: story
    preset: story
    title: Раздача и сбор
    page: |
      # Раздача и сбор
      [[Последовательный переключатель]] по очереди направляет сигнал. Каждый импульс такта переводит указатель на следующий [[канал]].
      После четвёртого канала указатель возвращается к первому.
      **Раздача (1 в 4):** один вход, четыре выхода. Сигнал приходит только на один выход.
      **Сбор (4 в 1):** четыре входа, один выход. На выход попадает только один вход.
    figure: { template: flow, layout: two-rows, nodes: [{ id: clk, label: Clock, kind: gate }, { id: main, label: Main, kind: cv }, { id: c1, label: Channel 1, kind: cv }, { id: c2, label: Channel 2, kind: cv }], edges: [{ from: clk, to: main, kind: gate }, { from: main, to: c1, kind: cv }, { from: main, to: c2, kind: cv }], caption: "Раздача: один Main, выходы Channel 1…4 включаются по очереди." }
    simpler: Представь вокзальное табло. Один указатель переходит от платформы к платформе по сигналу. В раздаче он показывает, куда уйдёт поезд. В сборе — с какой платформы поезд заедет на выход.
    faq:
      - q: Что значит «активен один канал»?
        a: В каждый момент работает только один канал. У раздачи остальные выходы стоят на 0 В. У сбора остальные входы игнорируются, их сигнал до выхода не доходит.
      - q: Что делает ручка Steps?
        a: "Задаёт длину цикла: 2, 3 или 4 канала. При Steps = 3 указатель идёт по каналам 1, 2, 3 и возвращается к первому."
      - q: Откуда переключатель знает, когда менять канал?
        a: От входа Clock. Каждый нарастающий фронт на нём — шаг вперёд. Без кабеля в Clock указатель стоит на месте.

  - id: b4
    type: story
    preset: story
    title: Замороженная случайность
    page: |
      # Замороженная случайность
      **Random Values** выдаёт несколько [[случайное напряжение|случайных напряжений]]. Они меняются, когда ты нажимаешь **Push** или подаёшь импульс на **Trigger**.
      Между нажатиями значения держатся ровно.
      Если подать четыре из них в Sequential Switch 4 to 1, получится фраза из четырёх нот. Она повторяется по кругу.
      Нажал Push — фраза новая, но тоже из четырёх нот. Пока не нажмёшь, она не меняется.
    figure: { template: steps, values: [3, 9, 1, 6], gates: [1, 1, 1, 1], caption: "Четыре значения, запомненные Random Values. Переключатель играет их по кругу." }
    simpler: Представь четыре бумажки с числами и пальцем, который тыкает в них по кругу. Нажал кнопку, и числа на бумажках стёрлись и написались заново. Палец продолжает ходить по тем же четырём.
    faq:
      - q: Почему фраза не меняется сама?
        a: Random Values обновляет значения только по Push или по импульсу на Trigger. Между ними он держит свои числа, и переключатель каждый раз читает те же четыре.
      - q: Звучит слишком разбросанно. Что делать?
        a: Диапазон случайных высот может быть широким. В уроке 5.3 такие значения сводили в тональность квантизатором. Поставь его между переключателем и VCO.
      - q: Можно ли хранить больше четырёх нот?
        a: Одним переключателем нет, но можно собрать два. Такой приём пригодится в части 9. Пока хватит четырёх, их можно услышать отдельно.

  - id: b5
    type: live
    preset: live
    title: Раздача по каналам
    page: |
      # Раздача по каналам
      **Clocked** отдаёт такт в **Clock** переключателя 1 в 4. Сам мастер-такт идёт в **Main**.
      Каналы **Channel 1** и **Channel 2** смотрят на **Scope**. Импульс мастера уходит то в первый, то во второй, то в третий и четвёртый.
      Следи за Scope: импульсы появляются по очереди только на одном канале.
    modules:
      - { ref: clk, plugin: ImpromptuModular, slug: Clocked, params: { Master clock: { display: "120" } } }
      - { ref: sw, plugin: Fundamental, slug: SequentialSwitch1, params: { Steps: { display: "4" } } }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "2000" } } }
    cables:
      - { from: [clk, Clock 1], to: [sw, Clock] }
      - { from: [clk, Master clock], to: [sw, Main] }
      - { from: [sw, Channel 1], to: [scope, Ch 1] }
      - { from: [sw, Channel 2], to: [scope, Ch 2] }
    notes:
      - { after: clk, text: "**Clock 1** тактирует переключатель. **Master clock** — то, что он раздаёт.", targets: [{ module: clk, output: Clock 1 }, { module: clk, output: Master clock }] }
      - { after: sw, text: "**Main** — вход раздачи. **Channel 1…4** — выходы, активен один.", targets: [{ module: sw, input: Main }, { module: sw, output: Channel 1 }] }
      - { after: sw, text: "**Steps** — число каналов в цикле. Поставь 2: сигнал пойдёт только по двум.", targets: [{ module: sw, param: Steps }] }
    faq:
      - q: На Scope импульсы только на одном канале. Это ошибка?
        a: Нет. Раздача в каждый момент включает один канал. Подожди несколько тактов, и импульсы появятся на соседнем.
      - q: Не вижу ни одного импульса. Что проверить?
        a: "Возможно, Clocked остановлен: Run переключает ход при каждом нажатии. Нажми Run один раз. Проверь также кабель в Clock."
      - q: Почему каналов 3 и 4 нет на Scope?
        a: У Scope два входа, поэтому показаны только Channel 1 и Channel 2. Переставь кабель на другой выход переключателя и найди остальные.

  - id: b6
    type: live
    preset: live
    title: Фраза из четырёх нот
    page: |
      # Фраза из четырёх нот
      **Random Values** держит четыре напряжения. **Sequential Switch 4 to 1** по такту берёт их по очереди.
      Выход **Main** идёт в высоту **VCO**: получается фраза из четырёх нот по кругу.
      Нажми **Push** у Random Values. Фраза станет другой, но останется из четырёх нот.
    modules:
      - { ref: clk, plugin: ImpromptuModular, slug: Clocked, params: { Master clock: { display: "120" } } }
      - { ref: rv, plugin: Fundamental, slug: RandomValues }
      - { ref: sw, plugin: Fundamental, slug: SequentialSwitch2, params: { Steps: { display: "4" } } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "130.81" } } }
    cables:
      - { from: [clk, Clock 1], to: [sw, Clock] }
      - { from: [rv, Random 1], to: [sw, Channel 1] }
      - { from: [rv, Random 2], to: [sw, Channel 2] }
      - { from: [rv, Random 3], to: [sw, Channel 3] }
      - { from: [rv, Random 4], to: [sw, Channel 4] }
      - { from: [sw, Main], to: [vco, 1V/octave pitch] }
      - { from: [vco, Triangle], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: rv, text: "**Push** обновляет все случайные значения. **Random 1…4** идут в каналы переключателя.", targets: [{ module: rv, param: Push }, { module: rv, output: Random 1 }] }
      - { after: sw, text: "**Steps** = 4: цикл из четырёх нот. Поставь 3 — четвёртая нота пропадёт.", targets: [{ module: sw, param: Steps }] }
      - { after: sw, text: "**Main** отдаёт текущий канал. Он управляет высотой VCO.", targets: [{ module: sw, output: Main }] }
    faq:
      - q: Фраза слишком разбросана по высоте. Это ошибка?
        a: Нет. Диапазон случайных значений широкий. Вернись к уроку 5.3 и поставь квантизатор между переключателем и VCO, чтобы свести ноты в шкалу.
      - q: Ноты не повторяются по кругу.
        a: Проверь, что кабель в Clock на месте, а Clocked идёт. Без такта переключатель стоит на одном канале и играет одну ноту.
      - q: Где у фразы начало?
        a: У канала 1. Если фраза сбилась, подай сброс на вход Reset, и следующий такт снова возьмёт Channel 1.

  - id: b7
    type: anatomy
    preset: anatomy
    title: Sequential Switch 1 to 4
    page: |
      # Sequential Switch 1 to 4
      Раздача: один вход, четыре выхода. Активен один канал.
    module: { ref: sw, plugin: Fundamental, slug: SequentialSwitch1 }
    notes:
      - { text: "**Clock** — такт переключения. Каждый нарастающий фронт переводит на следующий канал.", targets: [{ module: sw, input: Clock }] }
      - { text: "**Reset** возвращает указатель на первый канал.", targets: [{ module: sw, input: Reset }] }
      - { text: "**Main** — то, что раздаём. Подай сюда любой сигнал.", targets: [{ module: sw, input: Main }] }
      - { text: "**Channel 1…4** — выходы. Активный канал получает сигнал, остальные держат 0 В.", targets: [{ module: sw, output: Channel 1 }, { module: sw, output: Channel 2 }, { module: sw, output: Channel 3 }, { module: sw, output: Channel 4 }] }
      - { text: "**Steps** — число каналов в цикле, от 2 до 4.", targets: [{ module: sw, param: Steps }] }
    faq:
      - q: Для чего раздача на практике?
        a: "Чтобы по очереди запускать разные события одним тактом: например, отправлять гейт то на бочку, то на хэт. Структуру трека так и строят."
      - q: Неактивные выходы выдают 0 В или тишину?
        a: 0 В. Для огибающей это значит «нет гейта», для VCA — закрытый вход.
      - q: Можно ли подать на Main аудио?
        a: Можно. Тогда звук будет по очереди появляться на разных выходах. Для четырёх разных голосов вокруг одного звука это тоже рабочий приём.

  - id: b8
    type: anatomy
    preset: anatomy
    title: Sequential Switch 4 to 1
    page: |
      # Sequential Switch 4 to 1
      Сбор: четыре входа, один выход. Это модуль для фразы из четырёх нот.
    module: { ref: sw, plugin: Fundamental, slug: SequentialSwitch2 }
    notes:
      - { text: "**Clock** и **Reset** работают так же, как у раздачи.", targets: [{ module: sw, input: Clock }, { module: sw, input: Reset }] }
      - { text: "**Channel 1…4** — входы. Подай сюда четыре источника: напряжения, гейты или звук.", targets: [{ module: sw, input: Channel 1 }, { module: sw, input: Channel 2 }, { module: sw, input: Channel 3 }, { module: sw, input: Channel 4 }] }
      - { text: "**Main** — выход. Он повторяет сигнал активного канала.", targets: [{ module: sw, output: Main }] }
      - { text: "**Steps** — число каналов в цикле, от 2 до 4. Неактивные входы игнорируются.", targets: [{ module: sw, param: Steps }] }
    faq:
      - q: Что на Main при Steps = 3?
        a: Цикл из первых трёх входов, четвёртый пропускается. Подключённый вход Channel 4 просто не читается.
      - q: Чем сбор полезен кроме нот?
        a: "Через него можно чередовать любые сигналы: четыре разных ритма, четыре уровня громкости или четыре сигнала на фильтр. Переключатель не знает, что внутри."
      - q: Что будет, если вход Channel 2 оставить пустым?
        a: Когда очередь дойдёт до него, на Main придёт 0 В. Для высоты это нота C4, поэтому фраза будет с «провалом» на второй ноте.

  - id: b9
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Уменьши **Steps** у переключателя с 4 до 2."
        see: "Фраза из двух нот, остальные пропущены."
      - do: "Нажми **Push** у Random Values."
        see: "Фраза новая, но снова из тех же четырёх каналов. Пока не нажмёшь, она не меняется."
      - do: "Нажми кнопку на модуле **Push** (он подаёт **сброс**) посреди фразы."
        see: "Фраза начинается сначала с первой ноты."
      - do: "Измени **Master clock** от 60 до 180 BPM."
        see: "Фраза быстрее, ноты те же."
    modules:
      - { ref: clk, plugin: ImpromptuModular, slug: Clocked, params: { Master clock: { display: "120" } } }
      - { ref: rv, plugin: Fundamental, slug: RandomValues }
      - { ref: sw, plugin: Fundamental, slug: SequentialSwitch2, params: { Steps: { display: "4" } } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "130.81" } } }
      - { ref: push, plugin: Fundamental, slug: Push }
    cables:
      - { from: [clk, Clock 1], to: [sw, Clock] }
      - { from: [rv, Random 1], to: [sw, Channel 1] }
      - { from: [rv, Random 2], to: [sw, Channel 2] }
      - { from: [rv, Random 3], to: [sw, Channel 3] }
      - { from: [rv, Random 4], to: [sw, Channel 4] }
      - { from: [sw, Main], to: [vco, 1V/octave pitch] }
      - { from: [vco, Triangle], to: [audio, "To \"device output 1\""] }
      - { from: [push, Trigger], to: [sw, Reset] }
    notes:
      - { after: push, text: "Модуль **Push** подаёт импульс сброса. Нажми его кнопку.", targets: [{ module: push, param: Push }, { module: push, output: Trigger }] }
    faq:
      - q: Кнопок Push две. Какую нажимать?
        a: "Одна у Random Values: она обновляет значения. Другая на отдельном модуле Push: она подаёт сброс переключателю. Смотри на подпись модуля."
      - q: При Steps = 2 фраза всё равно кажется длинной.
        a: Две ноты по кругу при 120 BPM — это 1 секунда на круг. Подожди несколько циклов и убедись, что третья и четвёртая не играют.
      - q: Сброс не меняет фразу.
        a: Сброс вернул указатель на первый канал, а значения остались. Чтобы изменить их, нажми Push у Random Values.

  - id: b10
    type: practice
    preset: practice
    title: Практика — фраза из четырёх нот
    task: |
      Собери фразу из четырёх нот сам, между маркерами «Верстак».
      1. **Clocked**, **Random Values**, **Sequential Switch 4 to 1**, **VCO**. Steps — 4.
      2. Такт: `Clock 1` у Clocked → `Clock` у переключателя.
      3. Источники: `Random 1`…`Random 4` → `Channel 1`…`Channel 4` по порядку.
      4. Фраза: `Main` → `1V/octave pitch` у VCO, `Triangle` → вход 1 у Audio.
      5. Нажми Push у Random Values, чтобы значения стали разными, и нажми «Проверить».
    given: [audio]
    check: p5-05-sequential-switches
    hints:
      "module:clk":
        - Нужен источник такта.
        - Генератор такта из набора Impromptu Modular.
        - "Поставь на верстак **Clocked**."
      "module:rv":
        - Нужны четыре источника напряжения.
        - Модуль называется как то, что он выдаёт.
        - "Поставь на верстак **Random Values**."
      "module:sw":
        - Нужен переключатель, который собирает четыре входа в один.
        - Его название содержит «4 to 1».
        - "Поставь на верстак **Sequential Switch 4 to 1**."
      "module:vco":
        - Нужен источник звука.
        - Осциллятор из набора Fundamental.
        - "Поставь на верстак **VCO**."
      "module:out":
        - Нужен выход звука.
        - Модуль Audio уже стоит в ряду.
        - "Не убирай Audio из ряда и подключай кабель к его первому входу."
      "cable:1":
        - Переключатель не знает, когда менять канал.
        - Какой выход Clocked ведёт в Clock переключателя?
        - "`Clock 1` у Clocked → `Clock` у переключателя."
      "cable:2":
        - Источник 1 не подключён.
        - Где каналы переключателя и какой выход Random Values идёт первым?
        - "`Random 1` → `Channel 1`."
      "cable:3":
        - Источник 2 не подключён.
        - Возьми следующий выход Random Values.
        - "`Random 2` → `Channel 2`."
      "cable:4":
        - Источник 3 не подключён.
        - Возьми следующий выход Random Values.
        - "`Random 3` → `Channel 3`."
      "cable:5":
        - Источник 4 не подключён.
        - Возьми четвёртый выход Random Values.
        - "`Random 4` → `Channel 4`."
      "cable:6":
        - Мелодия не доходит до высоты.
        - Какой выход переключателя ведёт в VCO?
        - "`Main` у переключателя → `1V/octave pitch` у VCO."
      "cable:7":
        - Тишина.
        - Куда должен идти звук VCO?
        - "`Triangle` у VCO → `To \"device output 1\"` у Audio этого ряда."
      "param:1":
        - Фраза должна быть из четырёх нот.
        - Посмотри на ручку Steps у переключателя.
        - Поставь Steps на 4.
      "probe:1":
        - Выход Main стоит на месте.
        - Идёт ли такт у Clocked и нажимал ли ты Push у Random Values?
        - "Нажми Push у Random Values, чтобы значения стали разными. Если Clocked остановлен, нажми Run один раз."
    faq:
      - q: Я нажал Push, но фраза звучит почти одинаково.
        a: Возможно, новые случайные значения близки к старым. Нажми Push ещё раз и послушай. Проверка смотрит на изменение напряжения на Main, и пара нажатий обычно хватает.
      - q: Проверка ждёт Steps = 4. А если я хочу три ноты?
        a: "Для проверки нужно четыре. Три ноты попробуй после проверки: поставь Steps = 3 и послушай, как фраза сокращается."
      - q: Нужен ли кабель к Trigger у Random Values?
        a: Нет. Значения можно обновлять вручную кнопкой Push. Кабель с Clock на Trigger сделал бы новую фразу каждый такт, но это уже другой приём.

  - id: b11
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Фраза застыла на одной ноте. Такт идёт, значения на месте.
      Найди одну ошибку и исправь её одним кабелем.
    modules:
      - { ref: clk, plugin: ImpromptuModular, slug: Clocked, params: { Master clock: { display: "120" } } }
      - { ref: rv, plugin: Fundamental, slug: RandomValues }
      - { ref: sw, plugin: Fundamental, slug: SequentialSwitch2, params: { Steps: { display: "4" } } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "130.81" } } }
    cables:
      - { from: [clk, Clock 1], to: [sw, Clock] }
      - { from: [rv, Random 1], to: [sw, Channel 1] }
      - { from: [rv, Random 2], to: [sw, Channel 2] }
      - { from: [rv, Random 3], to: [sw, Channel 3] }
      - { from: [rv, Random 4], to: [sw, Channel 4] }
      - { from: [sw, Main], to: [vco, 1V/octave pitch] }
      - { from: [vco, Triangle], to: [audio, "To \"device output 1\""] }
    break: { remove_cable: [clk, Clock 1, sw, Clock] }
    check: { kind: fixed, expect_cable: [clk, Clock 1, sw, Clock] }
    hints:
      fixed:
        - Такт идёт, а переключатель стоит. Что двигает указатель?
        - Посмотри на вход Clock у переключателя.
        - "Соедини `Clock 1` у Clocked с `Clock` у переключателя."
    faq:
      - q: Почему без такта звучит одна нота?
        a: Указатель не движется и стоит на одном канале. Main повторяет один и тот же вход, поэтому высота не меняется.
      - q: Как быстро понять, что виноват такт?
        a: Если ноты есть, но не меняются, смотри на вход Clock. Значения в источниках и кабели к VCO здесь ни при чём.

  - id: b12
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - [[Последовательный переключатель]] по такту берёт один из четырёх [[канал|каналов]]. Раздача — один вход на четыре выхода, сбор — наоборот.
      - Steps задаёт длину цикла от 2 до 4.
      - Reset возвращает указатель на первый канал.
      - Четыре значения Random Values и сбор 4 в 1 дают повторяющуюся фразу из четырёх нот.
      **Источники:** руководство VCV Free (переключатели); Noise Engineering, «Getting Started: Sequential Switches»; Loopop о хранении случайных мелодий.
    questions:
      - q: Чем Sequential Switch 1 to 4 отличается от 4 to 1?
        options:
          - { text: "1 в 4 раздаёт, 4 в 1 собирает", correct: true, why: "Направление разное. У раздачи один вход, у сбора один выход." }
          - { text: "Они одинаковые, различаются только названием", why: "У них разные наборы входов и выходов, и ставят их в разные места цепи." }
          - { text: "4 в 1 раздаёт, а 1 в 4 собирает", why: "Название читается как «откуда куда». 1 в 4 раздаёт." }
      - q: Как получить повторяющуюся фразу из четырёх случайных значений?
        options:
          - { text: "Random 1…4 в Channel 1…4 у сбора и такт в Clock", correct: true, why: "Значения держатся между Push, а такт обходит их по кругу." }
          - { text: "Все четыре значения в один канал", why: "Тогда указатель будет читать одно и то же." }
          - { text: "Random Values прямо в VCO", why: "Так VCO получит одно значение. Переключатель нужен, чтобы выбирать из четырёх." }
    next: |
      # Дальше: 5.6
      **Живое управление.** Мьюты и кнопки сброса дают играть патч руками.
    faq:
      - q: Как использовать раздачу вместе со сбором?
        a: Раздачу можно поставить на гейт, а сбор на высоту, оба от одного такта. Тогда одна нота играет одним голосом, другая другим. Подробнее — в части 9.
      - q: Что повторить, если фраза не меняется?
        a: Проверь кабель в Clock, ход Clocked и Push у Random Values. Затем вспомни, что значения обновляются только по Push.
