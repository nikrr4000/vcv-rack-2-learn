id: p1-02-voltage
num: "1.2"
part: 1
title: Напряжение — единственный язык
goal: Понимать, что кабель несёт только напряжение, узнавать аудио, CV, гейт и триггер по уровню и по Scope, получать константу из 8vert.
builds: "Умение читать сигнал на кабеле. Оно нужно в каждом уроке: огибающая, секвенсор и ударные — всё это напряжения разной роли."
minutes: 25
requires: [p1-01-sound-wave]
glossary: [напряжение, аудиосигнал, CV, гейт, триггер, константа напряжения]
sources: [vcv-voltage-standards, sos-07, doepfer-tech, lm-glossary]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: Напряжение — единственный язык
    page: |
      # 1.2 Напряжение — единственный язык
      **Ты научишься:** узнавать разные сигналы на кабеле по уровню и по картинке на Scope.
      **Ты соберёшь:** VCO, 8vert, Scope и Viz — три сигнала разной природы на одном экране.
      **Понадобится:** 25 минут. Звук тихий, синус из VCO.
    figure: { template: voltages, ranges: [{ label: аудио, min: -5, max: 5 }, { label: CV, min: 0, max: 10 }, { label: гейт, min: 0, max: 10 }, { label: биполяр. CV, min: -5, max: 5 }], caption: "Типичные размахи сигналов в VCV по вертикали, в вольтах." }
    faq:
      - q: Зачем знать вольты, если я просто соединяю модули?
        a: Вольты объясняют, почему один кабель «открывает» звук, а другой двигает фильтр. Когда патч молчит, ты проверяешь напряжение на кабеле Scope-ом, а не гадаешь.
      - q: Нужен ли тут новый модуль для звука?
        a: Нет. Звучит тот же VCO из урока 1.1. Новые модули — 8vert и Viz — сами не звучат, они дают и показывают напряжение.

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса про сигналы. Не страшно ошибиться: ответы подскажут, куда смотреть в уроке.
    questions:
      - q: Чем аудиосигнал отличается от CV в Rack?
        free: true
        options:
          - { text: "Физически ничем, это то же напряжение", correct: true, why: "Кабель несёт только вольты. Различаются роль сигнала и скорость, с которой он меняется." }
          - { text: "У них разные кабели и разъёмы", why: "Кабель в Rack один. Тип сигнала задаёт то, куда он подключён, а не сам провод." }
          - { text: "CV всегда лежит в диапазоне 0…1 В", why: "Такого правила нет. В VCV CV обычно идёт в диапазоне 0…10 В или ±5 В." }
      - q: Как ведёт себя гейт, пока клавиша нажата?
        options:
          - { text: "Держится высоким, около 10 В", correct: true, why: "Гейт говорит «включено» всё время, пока событие длится. Отпустили клавишу — вернулся к 0 В." }
          - { text: "Даёт короткий импульс около 1 мс", why: "Это триггер. Он сообщает «сейчас» и сразу заканчивается." }
          - { text: "Плавно нарастает", why: "Так ведёт себя огибающая. Гейт переключается резко, без плавности." }
      - q: Что выдаст 8vert с пустым входом и ручкой Row 1 gain вправо?
        options:
          - { text: "Постоянное положительное напряжение, до 10 В", correct: true, why: "8vert сам подаёт 10 В на пустой вход, а ручка выбирает долю от них." }
          - { text: "Тишину, ведь входного сигнала нет", why: "Без кабеля вход всё равно получает 10 В. Выход 8vert не молчит." }
          - { text: "Звуковой сигнал", why: "Постоянное напряжение не колеблется. Звуком оно не станет, но Scope его покажет." }

  - id: b3
    type: story
    preset: story
    title: Кабель несёт напряжение
    page: |
      # Кабель несёт напряжение
      Посмотри на любой кабель в Rack. По нему идёт одно и то же — [[напряжение]] в вольтах.
      Модуль читает вход и пишет выход. Больше кабель ничего не передаёт.
      Кабель из VCO в Audio и кабель из LFO в VCO одинаковы. Различается роль сигнала и скорость его изменения.
      [[аудиосигнал|Аудиосигнал]] — быстро меняющееся напряжение, которое потом становится звуком. В Rack его размах ±5 В, то есть 10 В от пика до пика.
      Синус из VCO в уроке 1.1 как раз такой.
    simpler: Кабель — труба, напряжение — вода. Труба одна и та же, но вода может крутить мельницу или наполнять бочку. Что она делает, решает то, к чему труба подключена.
    faq:
      - q: Чем кабель с аудио отличается от кабеля с CV?
        a: Ничем. Оба несут напряжение. Аудио меняется быстро и попадает в колонки, CV меняется медленнее и двигает параметр другого модуля.
      - q: Можно ли подать аудио на CV-вход?
        a: Можно, Rack не запретит. Модуль примет любое напряжение, а результат ты услышишь сам. Так устроена частотная модуляция из урока 2.2.
      - q: Почему у аудио ±5 В, а у CV до 10 В?
        a: Так договорились в стандарте VCV. Модули читают любые вольты, а договорённость нужна, чтобы модули разных авторов понимали друг друга.

  - id: b4
    type: story
    preset: story
    title: CV, гейт и триггер
    page: |
      # CV, гейт и триггер
      Остальные сигналы — управляющие. Они не звучат, а двигают параметры других модулей.
      [[CV]] — напряжение, которое меняет параметр: частоту, громкость, срез фильтра. В VCV оно обычно в диапазоне 0…10 В или ±5 В.
      [[гейт|Гейт]] — сигнал «включено», пока событие длится. Нажатая клавиша держит 10 В, отпущенная — 0 В. По стандарту VCV: "Gates should produce 10 V when active."
      [[триггер|Триггер]] — короткий импульс «сейчас», около 1 мс. Он запускает событие, но не держит его: удар барабана, шаг секвенсора.
      В железных системах гейт часто бывает 5 В. На курсе берём уровни VCV.
    figure: { template: table, rows: [[Сигнал, Размах, Вид на Scope, Пример], [аудио, ±5 В, быстрая волна, VCO], [CV, 0…10 В, медленное движение, LFO], [гейт, 0 / 10 В, плоская полка, Push], [триггер, 0 / 10 В, острый пик, Push]], caption: Четыре сигнала в VCV. }
    simpler: "Гейт — свет в комнате: горит, пока кто-то держит выключатель. Триггер — вспышка фотоаппарата: мигнула и погасла. CV — ручка яркости, которую плавно двигают."
    faq:
      - q: Чем гейт отличается от триггера?
        a: Длительностью. Гейт держится высоким, пока событие идёт, — например, пока нажата клавиша. Триггер длится около 1 мс и только сообщает, что событие началось.
      - q: Гейт — это тоже CV?
        a: "По вольтам да, это напряжение с двумя значениями: 0 и 10 В. Отдельное имя нужно из-за роли: гейт отвечает «включено или нет», а CV — «насколько»."
      - q: Почему в железе гейт 5 В, а здесь 10 В?
        a: Производители принимали разные уровни. VCV выбрал 10 В. Модули Rack ждут именно его, поэтому на курсе все гейты и триггеры идут на этом уровне.

  - id: b5
    type: live
    preset: live
    title: Три сигнала на одном экране
    page: |
      # Три сигнала на одном экране
      Перед тобой **VCO**, **8vert**, **Scope** и **Viz**. На Scope две линии: синус из VCO и ровная линия у верхнего края.
      Ровная линия — [[константа напряжения|константа напряжения]]. 8vert выдаёт её без входного кабеля: ручка просто задаёт вольты.
      Поверни **Row 1 gain** вниз и вверх. Линия поедет за ручкой. Второй выход 8vert идёт во Viz.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: v8, plugin: Fundamental, slug: 8vert, params: { Row 1 gain: { display: "10" }, Row 2 gain: { display: "5" } } }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "10" }, Trigger: Enabled, Gain 1: { display: "10" }, Gain 2: { display: "20" } }
      - { ref: viz, plugin: Fundamental, slug: Viz }
    cables:
      - { from: [vco, Sine], to: [scope, Ch 1] }
      - { from: [vco, Sine], to: [audio, "To \"device output 1\""] }
      - { from: [v8, Row 1], to: [scope, Ch 2] }
      - { from: [v8, Row 2], to: [viz, Polyphonic] }
    notes:
      - { after: vco, text: "Синус ±5 В: аудио. Идёт в `Ch 1` и в Audio.", targets: [{ module: vco, output: Sine }] }
      - { after: v8, text: "**Row 1 gain** на 10: ровные +10 В, как у гейта.", targets: [{ module: v8, param: Row 1 gain }, { module: v8, output: Row 1 }] }
      - { after: v8, text: "**Row 2 gain** на 5: середина шкалы CV. Выход идёт во Viz.", targets: [{ module: v8, param: Row 2 gain }] }
      - { after: scope, text: "**Gain 2**: при 20 В на экран видны все ±10 В.", targets: [{ module: scope, param: Gain 2 }] }
      - { after: viz, text: "**Viz** показывает напряжение входящего кабеля.", targets: [{ module: viz, input: Polyphonic }] }
    faq:
      - q: Линия 8vert совсем плоская. Так и надо?
        a: Да. Напряжение не меняется, и рисовать нечего, кроме прямой. Плоская линия на Scope — признак константы.
      - q: Откуда 8vert берёт вольты, если вход пустой?
        a: Без кабеля вход сам подаёт 10 В, а ручка Row gain берёт от них долю от −1 до +1. Поэтому Row 2 gain на 5 даёт 5 В.
      - q: Я слышу только синус. Где гейт?
        a: "В Audio идёт один синус. Константу слушать нечего: она не колеблется. Её видно на Scope и во Viz."

  - id: b6
    type: anatomy
    preset: anatomy
    title: Gain и Offset у Scope
    page: |
      # Gain и Offset у Scope
      **Time** и **Trigger** ты знаешь из урока 1.1. Остальные ручки Scope управляют вертикалью, у каждого канала своя пара.
    module: { ref: scope, plugin: Fundamental, slug: Scope }
    notes:
      - { text: "**Gain 1** — сколько вольт помещается на экран по высоте. По умолчанию 20 В: видно ±10 В.", targets: [{ module: scope, param: Gain 1 }] }
      - { text: "**Offset 1** сдвигает линию первого канала вверх или вниз, от −10 до +10 В. Сигнал на кабеле не меняется.", targets: [{ module: scope, param: Offset 1 }] }
      - { text: "**Gain 2** — то же для второго канала.", targets: [{ module: scope, param: Gain 2 }] }
      - { text: "**Offset 2** — сдвиг второго канала.", targets: [{ module: scope, param: Offset 2 }] }
      - { text: "**Time** и **Trigger** — из урока 1.1: время на экран и неподвижность картинки.", targets: [{ module: scope, param: Time }, { module: scope, param: Trigger }] }
    later:
      - { what: "Выходы Ch 1 и Ch 2", lesson: "1.5" }
      - { what: "Вход External trigger", lesson: "5.1" }
    faq:
      - q: Я сдвинул Offset. Изменился ли сигнал?
        a: Нет. Offset двигает только картинку, на кабеле напряжение прежнее. Scope смотрит на сигнал, а не правит его.
      - q: Линия ушла за край экрана. Что делать?
        a: Верни Gain к 20 В на экран или опусти Offset. При 2,5 В на экран помещается лишь ±1,25 В, остальное за краем.

  - id: b7
    type: anatomy
    preset: anatomy
    title: Панель 8vert
    page: |
      # Панель 8vert
      8vert — восемь одинаковых строк. В каждой вход, ручка и выход. Двух строк хватит, остальные такие же.
    module: { ref: v8, plugin: Fundamental, slug: 8vert }
    notes:
      - { text: "Вход **Row 1**. Без кабеля он подаёт 10 В, поэтому ручка работает как источник напряжения.", targets: [{ module: v8, input: Row 1 }] }
      - { text: "**Row 1 gain** — ручка от −10 до +10 В. Правый щелчок по ней открывает поле для точного числа.", targets: [{ module: v8, param: Row 1 gain }] }
      - { text: "Выход **Row 1**: вход, умноженный на ручку. Пустой вход даёт ровно значение ручки.", targets: [{ module: v8, output: Row 1 }] }
      - { text: "**Row 2 gain** управляет только второй строкой. Строки друг от друга не зависят.", targets: [{ module: v8, param: Row 2 gain }] }
    later:
      - { what: "Viz и многоканальные кабели", lesson: "6.4" }
      - { what: "8vert как аттенюверт с внешним сигналом", lesson: "1.4" }
    faq:
      - q: Чем 8vert отличается от ручки на панели другого модуля?
        a: Ручка модуля правит его параметр. 8vert выдаёт напряжение на кабель, так что одной ручкой можно управлять любым входом.
      - q: Как поставить точное число, например 3,3 В?
        a: Правый щелчок по ручке открывает поле ввода. Впиши число и подтверди. Наведя курсор на ручку, ты увидишь текущее значение.

  - id: b8
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Поверни **Row 1 gain** до упора вправо, потом влево."
        see: Линия на Scope идёт до верхнего края, потом вниз до −10 В.
      - do: "Поставь **Row 1 gain** на 2. Уменьшай **Gain 2** у Scope: 20, 10, 5."
        see: Линия поднимается на экране, а напряжение остаётся 2 В. Gain меняет масштаб, не сигнал.
      - do: "Подвигай **Offset 2** вверх и вниз."
        see: Линия смещается. Напряжение на кабеле прежнее — Offset правит только картинку.
      - do: "Правый щелчок по **Row 2 gain**: впиши 3.3."
        see: Выход Row 2 даёт ровно 3,3 В, показание Viz меняется.
      - do: "Подними **Frequency** у VCO до упора вправо."
        see: Синус на Ch 1 частый, но его размах остаётся в пределах ±5 В. Частота размах не меняет.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: v8, plugin: Fundamental, slug: 8vert, params: { Row 1 gain: { display: "10" }, Row 2 gain: { display: "5" } } }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "10" }, Trigger: Enabled, Gain 1: { display: "10" }, Gain 2: { display: "20" } }
      - { ref: viz, plugin: Fundamental, slug: Viz }
    cables:
      - { from: [vco, Sine], to: [scope, Ch 1] }
      - { from: [vco, Sine], to: [audio, "To \"device output 1\""] }
      - { from: [v8, Row 1], to: [scope, Ch 2] }
      - { from: [v8, Row 2], to: [viz, Polyphonic] }
    notes:
      - { after: v8, text: "Шаги 1, 2 и 4 — здесь.", targets: [{ module: v8, param: Row 1 gain }, { module: v8, param: Row 2 gain }] }
    faq:
      - q: Я кручу Row 1 gain, а линия не двигается.
        a: Проверь кабель из выхода `Row 1` у 8vert во вход `Ch 2` у Scope. Если линия ушла за край, верни Gain 2 к 20.
      - q: Что покажет Viz при Row 2 gain, равном нулю?
        a: Нулевое напряжение. Постоянный ноль — тоже сигнал, просто пустой.

  - id: b9
    type: practice
    preset: practice
    title: Практика — три сигнала
    task: |
      Собери на верстаке аудио, гейт-подобную константу и средний CV.
      1. Поставь между маркерами **VCO**, **8vert**, **Scope** и **Viz**.
      2. `Sine` у VCO → `Ch 1` у Scope.
      3. `Row 1` у 8vert → `Ch 2` у Scope. **Row 1 gain** — на максимум.
      4. `Row 2` у 8vert → `Polyphonic` у Viz. **Row 2 gain** — около 5.
      Потом нажми «Проверить». Если Atlas запущен, назови репетитору три сигнала и их размахи.
    given: [audio]
    check: p1-02-voltage
    hints:
      "cable:1":
        - Какая линия Scope должна показывать звук?
        - Синус из VCO идёт в первый вход Scope.
        - "Кабель из `Sine` у VCO во вход `Ch 1` у Scope."
      "cable:2":
        - Что рисует вторая линия Scope?
        - Выход первой строки 8vert идёт во второй канал Scope.
        - "Кабель из `Row 1` у 8vert во вход `Ch 2` у Scope."
      "cable:3":
        - Viz пустой. Какой выход ему нужен?
        - Вторая строка 8vert идёт во Viz.
        - "Кабель из `Row 2` у 8vert во вход `Polyphonic` у Viz."
      "param:1":
        - Какое напряжение у гейта по стандарту VCV?
        - Ручка Row 1 gain у 8vert должна стоять на максимуме.
        - Поверни Row 1 gain вправо до упора, на 10 В.
      "param:2":
        - Какое значение лежит в середине шкалы 0…10 В?
        - Ручка Row 2 gain у 8vert, число около 5.
        - Правый щелчок по Row 2 gain, впиши 5.
      "probe:1":
        - Двигается ли синус на Scope?
        - Проверь кабель из Sine и ручку Frequency у VCO.
        - Верни Frequency в середину и нажми «Проверить» ещё раз.
      "probe:2":
        - Сколько вольт на выходе Row 1?
        - "Должно быть почти 10 В: проверь ручку Row 1 gain."
        - Поверни Row 1 gain до упора вправо.
      "probe:3":
        - Сколько вольт на выходе Row 2?
        - "Должно быть около 5 В: проверь ручку Row 2 gain."
        - Правый щелчок по Row 2 gain, впиши 5.
    faq:
      - q: Можно использовать вторую строку для обоих сигналов?
        a: "Нет. Проверке нужны две разные строки: Row 1 идёт в Scope, Row 2 — во Viz. Так ты видишь две константы с разными значениями."
      - q: Зачем Viz, если есть Scope?
        a: "Viz показывает напряжение без развёртки по времени. Для константы это удобнее: число видно сразу, не нужно считать деления на экране."

  - id: b10
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Гейт на Scope ушёл под ноль: линия лежит у нижнего края.
      Найди одну неверную настройку и исправь её. Кабели трогать не нужно.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: v8, plugin: Fundamental, slug: 8vert, params: { Row 1 gain: { display: "10" }, Row 2 gain: { display: "5" } } }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "10" }, Trigger: Enabled, Gain 1: { display: "10" }, Gain 2: { display: "20" } }
      - { ref: viz, plugin: Fundamental, slug: Viz }
    cables:
      - { from: [vco, Sine], to: [scope, Ch 1] }
      - { from: [v8, Row 1], to: [scope, Ch 2] }
      - { from: [v8, Row 2], to: [viz, Polyphonic] }
    break: { set_param: { module: v8, name: Row 1 gain, value: { display: "-10" } } }
    check: { kind: fixed, expect_param: { module: v8, name: Row 1 gain, display_min: 9 } }
    hints:
      fixed:
        - Гейт активен при высоком напряжении. На каком уровне сейчас линия?
        - Посмотри на ручку Row 1 gain у 8vert.
        - Поставь Row 1 gain на 10.
    faq:
      - q: Почему такой «гейт» не включит ничего?
        a: Гейт активен только высоким напряжением, около 10 В. При −10 В он ниже нуля, то есть закрыт. Нужно вернуть +10 В.

