  - id: b11
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - **Реверберация** — тысячи частых отражений, слитых в гаснущий хвост.
      - «Далеко» — меньше Dry level, больше Wet level, есть Pre-delay и мягче верха.
      - **Size** задаёт размер комнаты, **Decay** — как долго гаснет хвост.
      - **Hold** замораживает хвост, **Clear** обрывает его.
      Сохрани патч как `vcv-7.2.vcv`.
      **Источники:** документация Valley Plateau (Dale Johnson); Noise Engineering, «Getting Started: Mixers»; William Stokes, «Getting Wet: Using Effects» (Sound On Sound).
    questions:
      - q: Что отличает «далеко» от «близко»?
        options:
          - { text: "Меньше прямого звука, больше хвоста, есть пауза", correct: true, why: "Так слух понимает, что источник отошёл. Одной громкостью расстояние не передать." }
          - { text: "Звук просто тише", why: "Тихий звук остаётся близким. Расстояние задают хвост и пауза." }
          - { text: "Decay доведён до максимума", why: "Длинный хвост даёт заплывший звук, а не дальний." }
    next: |
      # Дальше: 7.3
      **Микшер и уровни.** Ты сложишь несколько партий и научишься не перегружать выход.
    faq:
      - q: "Чем реверберацию лучше подавать: на сам голос или отдельным каналом?"
        a: Для начала ставь за голосом, как здесь. В части 9 ты научишься подавать её отдельным каналом полностью мокрой и менять громкость возврата.
      - q: Что повторить, если хвост заплывает?
        a: Посмотри на Decay и Wet level. Выше 90 % хвост почти не гаснет, а высокий Wet заглушает сухой звук.
