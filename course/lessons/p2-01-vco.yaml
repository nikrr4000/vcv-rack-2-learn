id: p2-01-vco
num: "2.1"
part: 2
title: VCO
goal: Получить из VCO нужную форму волны, точно настроить ноту A4 (440 Гц) и проверить частоту по Scope, а не только на слух.
builds: Исходный звук каждого инструмента курса — бас, лид и пэд начинаются с VCO.
minutes: 30
requires: [p1-03-volt-per-octave]
glossary: [период и частота, форма волны, гармоники, 1V/oct]
sources: [vcv-free-manual, sos-01, pc-learning-synthesis]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: VCO
    page: |
      # 2.1 VCO
      **Ты научишься:** выбирать форму волны у **VCO** (генератора, управляемого напряжением), настраивать A4 = 440 Гц и проверять высоту по экрану.
      **Ты соберёшь:** VCO → Scope → Audio, а потом поймаешь ровно 11 периодов на экране — это 440 Гц.
      **Понадобится:** 30 минут и уроки про Scope и вольт на октаву за плечами.
      VCO — исходный звук. Без него в частях 3 и 8 нечего обрабатывать фильтром.
    figure: { template: waveforms, shapes: [sine, triangle, saw, square], periods: 2, caption: Четыре выхода VCO — четыре формы одной и той же частоты. }
    faq:
      - q: Чем VCO отличается от Scope? Оба же показывают волну.
        a: VCO создаёт сигнал, Scope только рисует его. Звук идёт от VCO, а Scope ничего в нём не меняет. Поэтому патч начинается с VCO.
      - q: Почему у VCO четыре выхода, а не один?
        a: Каждый выход отдаёт свою форму волны на той же частоте. Форма определяет тембр, поэтому можно выбрать подходящую кабелем, не трогая ручки.
      - q: Звук будет громким?
        a: Сначала убавь громкость в системе и ручку Level у Audio. Демо звучит только в активном ряду, остальные молчат.

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса до объяснений. Неверный ответ тоже полезен: он покажет, что разобрать в уроке.
    questions:
      - q: Что определяет, какую ноту ты слышишь?
        free: true
        options:
          - { text: Частота волны, correct: true, why: "Частота — число повторов волны в секунду. Больше повторов — выше нота." }
          - { text: Громкость волны, why: "Громкость — это размах. Тихая и громкая ноты могут быть одной высоты." }
          - { text: Форма волны, why: "Форма меняет окраску звука, а не ноту. Пила и синус на одной частоте дают одну ноту." }
      - q: Какая форма волны не содержит ничего, кроме основного тона?
        options:
          - { text: Синус, correct: true, why: "Синус — это одна гармоника, основная. Остальные формы — суммы нескольких синусов." }
          - { text: Пила, why: "Пила содержит все гармоники. Гладкий подъём на экране не делает спектр простым." }
          - { text: Прямоугольник, why: "Простой вид на экране не означает простой спектр. В нём много нечётных гармоник." }
      - q: Frequency стоит на 261,63 Гц. Какое напряжение на `1V/octave pitch` оставит ноту C4?
        options:
          - { text: 0 В, correct: true, why: "0 В — это C4, точка отсчёта. Каждый вольт сверху или снизу сдвигает ноту на октаву." }
          - { text: 1 В, why: "Отсчёт идёт от нуля. 1 В поднимает ноту на октаву, до C5." }
          - { text: 5 В, why: "±5 В — размах звука, а не высота. На высоту 5 В подняли бы ноту на пять октав." }

  - id: b3
    type: story
    preset: story
    title: Частота и период
    page: |
      # Частота и период
      Волна повторяется. Время одного повтора — **период** T. Число повторов в секунду — [[период и частота|частота]] f, она равна 1/T.
      Нота A4 — это 440 повторов в секунду. Один период длится около 2,27 мс.
      Октава вверх — частота вдвое больше. В Rack её даёт и ручка **Frequency** (частота), и напряжение по стандарту [[1V/oct|вольт на октаву]] на входе `1V/octave pitch`.
      Нулю вольт соответствует C4, около 261,63 Гц. Это середина ручки Frequency.
    page2: |
      # Считаем периоды
      Частоту можно прочитать с экрана.
      Развёртка **Time** у Scope — сколько миллисекунд помещается на экран. При 25 мс на экране 40 экранов укладываются в секунду.
      Посчитай периоды на экране и умножь на 40. Получится частота в герцах.
      11 периодов дают 440 Гц. 6,5 периода — около 260 Гц, то есть C4.
    figure: { template: waveforms, shapes: [sine, sine], periods: [3, 6], labels: [261 Гц, 523 Гц], caption: "Октава вверх: на том же отрезке времени вдвое больше периодов." }
    simpler: Представь маятник. Один размах туда и обратно — период. Сколько раз он качнулся за секунду — частота. Чаще качается — выше звук.
    faq:
      - q: Как посчитать периоды на экране Scope?
        a: Выбери точку, где волна пересекает нуль снизу вверх, и считай такие пересечения от левого края до правого. Если картинка бежит, включи Trigger.
      - q: Почему умножаем именно на 40?
        a: При 25 мс на экран за секунду набирается 40 экранов, ведь 1000 мс делим на 25. Поэтому периоды на экране умножаются на 40.
      - q: Если поставить Time на 10 мс, формула та же?
        a: "Нет, множитель другой: 1000 делим на Time. Для 10 мс это 100. Поэтому в уроке везде стоит 25 мс, а число 40 запомнить проще."

  - id: b4
    type: story
    preset: story
    title: Формы волны и гармоники
    page: |
      # Формы волны и гармоники
      Форма одного периода определяет [[тембр]]. Любую форму можно сложить из синусов, кратных основной частоте. Это [[гармоники]].
      - **Синус** — только основной тон.
      - **Треугольник** — нечётные гармоники, быстро слабеющие.
      - **Пила** — все гармоники, каждая слабее предыдущей.
      - **Прямоугольник** — нечётные гармоники, слабеющие медленно.
      Для вычитающего синтеза берут волну с богатым спектром, а лишнее убирают фильтром. Гордон Рид описывает это так: "you attenuate or remove harmonics from harmonically rich waveforms".
      Фильтры начнутся в части 3.
    figure: { template: harmonics, shape: triangle, count: 8, caption: "Треугольник: только нечётные гармоники, каждая заметно слабее прошлой." }
    simpler: Нота на гитаре и на флейте одной высоты звучит по-разному. Это тембр. Гармоники похожи на приправы, основа одна, а вкус разный.
    faq:
      - q: Какая форма самая яркая?
        a: "Обычно пила: в ней все гармоники. Сравни на слух и на Scope. Прямоугольник тоже яркий, но в нём только нечётные гармоники."
      - q: Почему синус звучит тише остальных, если размах тот же?
        a: В нём нет гармоник, и звук мягче. Размах у всех выходов около ±5 В, но слух воспринимает богатый спектр как более яркий звук.
      - q: Меняет ли форма волны ноту?
        a: Нет. Все четыре выхода звучат на одной высоте, если Frequency не трогать. Форма меняет только окраску звука.

  - id: b5
    type: live
    preset: live
    title: Выходы VCO
    page: |
      # Выходы VCO
      **VCO** играет 440 Гц. Синус идёт в **Ch 1** у Scope и в Audio, пила — в **Ch 2**.
      На экране ровно 11 периодов за 25 мс. Проверь формулу: 11 × 40 = 440.
      Переложи звуковой кабель на `Triangle`, `Sawtooth`, `Square`. Число периодов не меняется, меняется форма и окраска.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "440" } } }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "25" }, Trigger: Enabled, Gain 1: { display: "10" }, Gain 2: { display: "10" } }
    cables:
      - { from: [vco, Sine], to: [scope, Ch 1] }
      - { from: [vco, Sawtooth], to: [scope, Ch 2] }
      - { from: [vco, Sine], to: [audio, "To \"device output 1\""] }
    notes:
      - after: vco
        text: "Четыре выхода — четыре формы. Звук идёт из `Sine`."
        targets: [{ module: vco, output: Sine }, { module: vco, output: Triangle }, { module: vco, output: Sawtooth }, { module: vco, output: Square }]
      - after: vco
        text: "**Frequency** сейчас 440 Гц — нота A4."
        targets: [{ module: vco, param: Frequency }]
      - after: scope
        text: "**Time** 25 мс: на экране 11 периодов."
        targets: [{ module: scope, param: Time }]
    figure: { template: waveforms, shapes: [sine, saw], periods: 2, caption: "Синус и пила на одной частоте: период тот же, форма разная." }
    faq:
      - q: Я насчитал 10 или 12 периодов. Это ошибка?
        a: Скорее всего, ты сбился на краю экрана. Считай пересечения нуля снизу вверх. Если картинка плывёт, включи Trigger.
      - q: Переложил кабель на Square — стало резче. Почему?
        a: В прямоугольнике много нечётных гармоник, и звук яркий. Размах такой же, как у синуса, но на слух он кажется громче.
      - q: Откуда на экране две линии?
        a: У Scope два канала. Ch 1 показывает синус, Ch 2 — пилу. Так видно, что период у них один и тот же.

  - id: b6
    type: anatomy
    preset: anatomy
    title: Панель VCO
    page: |
      # Панель VCO
      У **VCO** много ручек и входов. Сегодня нужны выходы и высота, остальное разберём в уроке 2.2.
    module: { ref: vco, plugin: Fundamental, slug: VCO }
    notes:
      - { text: "Выходы **Sine** и **Triangle**: синус без гармоник и мягкий треугольник.", targets: [{ module: vco, output: Sine }, { module: vco, output: Triangle }] }
      - { text: "Выходы **Sawtooth** и **Square**: пила с полным набором гармоник и яркий прямоугольник.", targets: [{ module: vco, output: Sawtooth }, { module: vco, output: Square }] }
      - { text: "**Frequency** — от 11,562 до 5919,9 Гц. Середина — 261,63 Гц, шаг ручки — полутон.", targets: [{ module: vco, param: Frequency }] }
      - { text: "Вход `1V/octave pitch`: напряжение прибавляется к ручке. Без кабеля работает только Frequency.", targets: [{ module: vco, input: 1V/octave pitch }] }
      - { text: "**Pulse width** меняет ширину прямоугольника на выходе Square. Подробнее в уроке 2.2.", targets: [{ module: vco, param: Pulse width }] }
    later:
      - { what: "Вход Sync и переключатель Sync mode", lesson: "2.2" }
      - { what: "Вход, ручка и переключатель Frequency modulation (FM mode)", lesson: "2.2" }
      - { what: "Вход и ручка Pulse width modulation", lesson: "2.2" }
    faq:
      - q: Что за две ручки без подписи?
        a: Это служебные параметры модуля. Для курса они не нужны, их можно не трогать.
      - q: Почему шаг ручки Frequency — полутон?
        a: В Rack ручка Frequency двигается ступенями по полутонам, чтобы ноты попадали на строй. Двенадцать ступеней — октава. Точное число вводится через правый щелчок.
      - q: Что будет, если подать кабель на `1V/octave pitch`?
        a: Напряжение сложится с положением ручки. Например, ручка на C4 и 1 В на входе дают C5. Подробнее об этом был урок 1.3.

  - id: b7
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Поверни **Frequency** от минимума до максимума."
        see: На низких значениях виден один медленный период, на высоких периоды сливаются в частокол. На слух — гул, нота, потом писк.
      - do: Поставь **Frequency** на 261,63, потом на 523,25 Гц.
        see: Вдвое больше периодов на экране, нота на октаву выше.
      - do: Переложи звуковой кабель на `Triangle`, `Sawtooth`, `Square`, `Sine`.
        see: Число периодов то же, форма разная. Самая яркая окраска у пилы.
      - do: Поверни **Time** у Scope на 5, потом на 100.
        see: Меньше число — один период шире. Звук не меняется.
      - do: Поверни **Gain 1** у Scope.
        see: Форма не меняется, масштаб по вертикали меняется.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "25" }, Trigger: Enabled, Gain 1: { display: "10" }, Gain 2: { display: "10" } }
    cables:
      - { from: [vco, Sine], to: [scope, Ch 1] }
      - { from: [vco, Sine], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: vco, text: Шаги 1–3 — ручка Frequency и выходы., targets: [{ module: vco, param: Frequency }] }
      - { after: scope, text: Шаги 4 и 5 — Time и Gain 1., targets: [{ module: scope, param: Time }, { module: scope, param: Gain 1 }] }
    faq:
      - q: Как поставить ровно 523,25 Гц?
        a: Наведи курсор на ручку, и Rack покажет значение. Двойной щелчок сбрасывает ручку на 261,63 Гц, правый щелчок открывает поле для точного числа.
      - q: На низких частотах не видно периодов. Что делать?
        a: Увеличь Time у Scope, например до 500 мс. Медленная волна успеет уместиться на экране.
      - q: На высоких частотах звук пищит. Это поломка?
        a: Нет, это ноты очень высоких октав. Верни Frequency к середине. На слух они мало пригодятся, зато их удобно показывать на Scope.

  - id: b8
    type: practice
    preset: practice
    title: Практика — настрой A4
    task: |
      Настрой VCO ровно на 440 Гц по экрану.
      1. Поставь на верстак **VCO** и **Scope**.
      2. `Sine` → `Ch 1` у Scope и ещё `Sine` → `To "device output 1"` у Audio.
      3. **Time** у Scope — 25 мс, **Trigger** — Enabled.
      4. Крути **Frequency**, пока на экране не уложатся ровно 11 периодов.
      Для точного числа щёлкни по ручке правой кнопкой. Потом нажми «Проверить».
    given: [audio]
    check: p2-01-vco
    hints:
      "cable:1":
        - На Scope пусто. Что должно прийти в канал?
        - Какой выход VCO даёт синус, и какой вход Scope первый?
        - "Кабель из `Sine` у VCO во вход `Ch 1` у Scope."
      "cable:2":
        - Картинка есть, а звука нет.
        - Нужна связь от VCO к Audio. Один выход может питать два кабеля.
        - "Второй кабель из `Sine` во вход `To \"device output 1\"` у Audio."
      "param:1":
        - Сколько периодов сейчас на экране при Time 25 мс?
        - Нужно ровно 11 периодов, а на ручке Frequency значение около 440.
        - "Подстрой Frequency до значения между 437 и 443 Гц: правый щелчок по ручке открывает поле для числа."
      "probe:1":
        - Движется ли линия на экране?
        - Проверь, что в выход Sine воткнут кабель и модуль включён.
        - Подключи `Sine` к Scope и нажми «Проверить» ещё раз.
    faq:
      - q: Как попасть ровно в 440?
        a: Щёлкни по ручке правой кнопкой и введи 440. Допуск проверки — от 437 до 443 Гц, то есть около 12 центов.
      - q: Ничего не слышу, хотя кабель есть.
        a: Проверь Level у Audio и громкость в системе. Звучит только активный ряд, и кабель должен идти в вход To "device output 1".
      - q: Можно взять другой выход вместо Sine?
        a: Для проверки нужен Sine. Остальные формы будут звучать так же по высоте, но потом сравнивать с эталоном на Scope сложнее.

  - id: b9
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Нота должна быть A4, но на экране вместо ровных 11 периодов их больше, а картинка плывёт. Звучит чуть выше эталона.
      Найди одну настройку и верни ровно 440 Гц.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "440" } } }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "25" }, Trigger: Enabled, Gain 1: { display: "10" }, Gain 2: { display: "10" } }
    cables:
      - { from: [vco, Sine], to: [scope, Ch 1] }
      - { from: [vco, Sine], to: [audio, "To \"device output 1\""] }
    break: { set_param: { module: vco, name: Frequency, value: { display: "466.16" } } }
    check: { kind: fixed, expect_param: { module: vco, name: Frequency, display_min: 437, display_max: 443 } }
    hints:
      fixed:
        - Сосчитай периоды на экране. Их ровно 11?
        - Кабели на месте. Смотри на ручку Frequency у VCO.
        - Верни Frequency на 440 Гц.
    faq:
      - q: Как понять, что нота завышена, если кабели на месте?
        a: Сосчитай периоды при Time 25 мс. Больше 11 — частота выше 440 Гц. На слух нота чуть выше эталона.

  - id: b10
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - **Частота** задаёт ноту, **форма волны** — тембр, а размах остаётся около ±5 В.
      - Четыре выхода VCO отдают четыре формы на одной частоте.
      - Частоту читают по Scope: при Time 25 мс периоды на экране умножь на 40.
      - Ручка Frequency и вход `1V/octave pitch` складываются.
      Сохрани патч: Ctrl+S сохраняет твою копию урока.
      **Источники:** Gordon Reid, «Synth Secrets», ч. 1 (Sound On Sound); обзор осцилляторов из серии «Learning Synthesis» (Perfect Circuit); руководство VCV Free.
    questions:
      - q: На экране при Time 25 мс уместилось 22 периода. Какая это примерно частота?
        options:
          - { text: 880 Гц, correct: true, why: "22 периода умножаем на 40 и получаем 880 Гц, то есть A5, октаву выше A4." }
          - { text: 440 Гц, why: "440 Гц дают 11 периодов. Здесь периодов вдвое больше, значит и частота вдвое выше." }
          - { text: 22 Гц, why: "Это число периодов на экране, а не частота. Чтобы получить герцы, умножь его на 40." }
    next: |
      # Дальше: 2.2
      **PWM, синхронизация, FM.** Ты оживишь прямоугольник и заставишь один VCO рвать цикл другого.
    faq:
      - q: Нужно ли помнить число 40?
        a: "Нет. Запомни идею: чем больше периодов на экране, тем выше частота. Число 40 верно только для Time 25 мс."
      - q: Что повторить, если Scope не получается читать?
        a: Вернись к ряду «Выходы VCO» и сосчитай периоды при Frequency 440 Гц и при 523,25 Гц. Второе число должно получиться больше.
