id: p0-02-interface
num: "0.2"
part: 0
title: "Интерфейс Rack"
goal: "Свободно ходить по Rack: ставить модули, тянуть и вынимать кабели, отменять ошибки, сохранять патч, оставлять заметку в Notes."
builds: "Основу организации патчей. Подписанные ряды и свободные места между инструментами понадобятся в части 8."
minutes: 25
requires: [p0-01-install]
glossary: [шкаф, HP, браузер модулей, кабель, автосохранение, пресет, плагин]
sources: [vcv-manual-menu-bar, vcv-manual-keys, omri-first-minutes, doepfer-a100]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: "Интерфейс Rack"
    page: |
      # 0.2 Интерфейс Rack
      **Ты научишься:** ставить модули из [[браузер модулей|браузера модулей]], тянуть [[кабель|кабели]], отменять действия и сохранять патч.
      **Ты соберёшь:** два **VCO** с кабелем между ними, **Notes** с подписью и **Blank** как разделитель.
      **Понадобится:** 25 минут. Звука в уроке нет.
      Урок идёт рядами: один ряд — одна мысль. Кнопка «Дальше →» в Навигаторе или в панели справа переводит к следующему ряду.
    figure: { template: flow, nodes: [{ id: a, label: VCO A, kind: audio }, { id: b, label: VCO B, kind: audio }], edges: [{ from: a, to: b, kind: cv }], layout: row, caption: "Кабель идёт от выхода одного модуля ко входу другого." }
    faq:
      - q: "Почему в уроке нет звука?"
        a: "Сегодня мы учимся двигать модули и кабели, а не слушать. Звук появится в уроке 0.3, когда подключим Audio."
      - q: "Где кнопка «Дальше»?"
        a: "В Навигаторе, первом модуле этого ряда, и в панели справа. Там же список всех рядов урока."
      - q: "Нужно ли учить все пункты меню?"
        a: "Нет. Сегодня нужны Edit, File и Library, остальное узнаешь по ходу курса."

  - id: b2
    type: quiz
    preset: quiz
    title: "Что ты уже знаешь"
    lead: |
      # Сначала угадай
      Три вопроса до объяснений. Ошибаться можно: ответы покажут, о чём урок.
    questions:
      - q: "Что такое HP в описании ширины модуля?"
        free: true
        options:
          - { text: "Единица ширины панели, пришедшая из Eurorack", correct: true, why: "Модуль в 10 HP вдвое уже модуля в 20 HP. К электрике это не относится." }
          - { text: "Мощность модуля", why: "HP — размер, а не электрическая мощность." }
          - { text: "Число ручек на панели", why: "Ширина не равна числу органов управления: у узкого модуля бывает много ручек." }
      - q: "Ты случайно удалил модуль. Что делать?"
        options:
          - { text: "Edit → Undo: вернётся и модуль, и его настройки", correct: true, why: "Отмена работает и на удаление модуля, и на кабель, и на ручку." }
          - { text: "Добавить модуль заново и выставить всё по памяти", why: "Это лишняя работа: Undo возвращает модуль вместе с положениями ручек." }
          - { text: "Закрыть Rack без сохранения", why: "Автосохранение могло уже записать удаление. Отмена проще и надёжнее." }
      - q: "Куда идёт сигнал по кабелю?"
        options:
          - { text: "От выхода к входу", correct: true, why: "У разъёмов есть направление. Кабель соединяет выход одного модуля со входом другого." }
          - { text: "В любую сторону, кабель двусторонний", why: "Входы и выходы разные, и подписаны на панели. Сигнал идёт только от выхода." }
          - { text: "В один выход можно воткнуть только один кабель", why: "Из одного выхода можно вести несколько кабелей. Это называется раздачей сигнала." }

  - id: b3
    type: story
    preset: story
    title: "Шкаф, ряды и HP"
    page: |
      # Шкаф, ряды и HP
      Перед тобой [[шкаф]]: ряды, в которые ставятся модули. Между модулями тянутся кабели.
      Ширина модуля измеряется в [[HP]]. В Eurorack 1 HP равен 5,08 мм, в Rack пропорции те же. Таблица рядом показывает, сколько места занимают модули этого урока.
      Идея пришла из железных систем. Doepfer называет модульный синтезатор открытой системой, где возможно почти всё.
      **Патч** — это модули, их места, положения ручек и кабели. Настройки звукового устройства в патч не входят: они сидят в самом модуле Audio.
    figure: { template: table, rows: [[Модуль, Ширина HP], [Audio 2, "5"], [VCO, "9"], [Blank, "10"], [Notes, "16"]], caption: "Ширина модулей урока. Чем больше HP, тем шире панель." }
    simpler: "Шкаф — как книжная полка с рядами. Модули — книги разной толщины, HP — толщина корешка. Кабели — ленточки, которыми ты связываешь нужные книги между собой."
    faq:
      - q: "Зачем знать HP, если всё ставится мышью?"
        a: "Ширина решает, сколько модулей влезет в ряд. На слух HP не влияет, но пригодится, когда будешь планировать ряды инструментов."
      - q: "Модули можно ставить на любой ряд?"
        a: "Да. Перетащи модуль за панель на свободное место. Модули в ряду не пересекаются и встают вплотную."
      - q: "Что хранится в файле патча?"
        a: "Список модулей, их места, положения ручек, кабели и текст в Notes. Выбор звукового устройства сюда не входит."

  - id: b4
    type: story
    preset: story
    title: "Меню и браузер модулей"
    page: |
      # Меню и браузер модулей
      Сверху идёт строка меню. **File** — новый патч, открыть, сохранить. **Edit** — отмена и повтор. **Library** — вход и обновление [[плагин|плагинов]]. **View** — масштаб и вид кабелей. **Engine** — частота дискретизации. **Help** — справка и папка пользователя.
      Добавить модуль можно через [[браузер модулей]]. Наведи курсор на пустое место шкафа и нажми Enter.
      В окне есть поиск по названию, теги и фильтр по [[плагин|плагинам]]. Выбери модуль, и он встанет в ряд под курсором.
    page2: |
      # Масштаб и сохранение
      Масштаб шкафа меняется колёсиком мыши с зажатой клавишей. Так удобно подойти к ручке или отъехать и увидеть весь ряд.
      Сохраняй патч командой **File** → «Save as». Rack ещё периодически записывает [[автосохранение|автосохранение]] текущего патча в папку пользователя. Оно не заменяет файл под своим именем.
      Правый щелчок по модулю открывает его меню. Там есть пункты **Preset**, **Duplicate** и **Delete**. [[Пресет]] хранит положения ручек одного модуля.
    simpler: "Меню Rack похоже на меню любой программы: файл, правка, справка. Браузер модулей — как каталог в магазине. Ищешь по названию, нажимаешь, и товар оказывается у тебя на полке."
    faq:
      - q: "Нажимаю Enter, а браузер не открывается."
        a: "Курсор должен стоять над пустым местом шкафа, а не над модулем. Если не помогает, щёлкни правой кнопкой по пустому месту."
      - q: "Что такое пресет модуля?"
        a: "Сохранённые положения ручек одного модуля. Правый щелчок по модулю, пункт Preset. Пригодится в части 8, когда будешь хранить любимые настройки."
      - q: "Автосохранение заменяет обычное?"
        a: "Нет. Оно страхует от вылета, но имени у него нет. Каждый урок сохраняй под своим именем через File."

  - id: b5
    type: live
    preset: live
    title: "Кабель от выхода ко входу"
    page: |
      # Кабель от выхода ко входу
      Перед тобой два **VCO**, **Notes** и **Blank**. Кабель идёт из выхода `Sine` первого VCO во вход `Frequency modulation` второго.
      Звука нет: ни один модуль не подключён к Audio. Первый VCO стоит на 110 Гц.
      **Blank** — пустая панель. Она нужна как разделитель между инструментами.
    modules:
      - { ref: blank, plugin: Core, slug: Blank }
      - { ref: notes, plugin: Core, slug: Notes }
      - { ref: vco_a, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "110" } } }
      - { ref: vco_b, plugin: Fundamental, slug: VCO }
    cables:
      - { from: [vco_a, Sine], to: [vco_b, Frequency modulation] }
    notes:
      - after: notes
        text: "**Notes** хранит текст вместе с патчем. Напиши туда название урока."
      - after: vco_a
        text: "Выход `Sine` справа внизу: отсюда кабель уходит ко второму VCO."
        targets: [{ module: vco_a, output: Sine }]
      - after: vco_b
        text: "Вход `Frequency modulation`: кабель приходит сюда. Ручка рядом стоит на 0, поэтому на звук он не влияет."
        targets: [{ module: vco_b, input: Frequency modulation }]
    faq:
      - q: "Зачем кабель, если звука нет?"
        a: "Это учебный кабель. Он нужен, чтобы потренироваться тянуть и вынимать соединения. Разберём его смысл в уроке 2.2."
      - q: "Что делает модуль Blank?"
        a: "Ничего со звуком. У него нет ни ручек, ни входов, ни выходов. Его можно растянуть за боковой край и поставить как разделитель или подложку для подписи."
      - q: "Можно ли вести два кабеля из одного выхода?"
        a: "Да. Выход можно раздать на несколько входов. Обратное не работает: в один вход идёт один кабель."

  - id: b6
    type: try
    preset: try
    title: "Покрути сам"
    steps:
      - do: "Нажми Enter над пустым местом шкафа и набери в поиске VCO."
        see: "В списке есть Fundamental VCO. Выбери его, и он встанет в ряд."
      - do: "Перетащи модуль за панель на свободное место соседнего ряда."
        see: "Модуль встаёт в ряд и ложится на сетку."
      - do: "Протяни кабель из `Sine` одного VCO во вход `Frequency modulation` другого."
        see: "Кабель повисает дугой. Звука нет, и так и должно быть."
      - do: "Вытащи кабель за конец из входа, затем нажми ⌘Z."
        see: "Кабель вернулся на то же место. Undo работает и на кабели."
      - do: "Сохрани патч командой File → Save as и открой его снова."
        see: "Всё на месте: модули, кабель и подпись в Notes."
    modules:
      - { ref: notes, plugin: Core, slug: Notes }
      - { ref: vco_a, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "110" } } }
      - { ref: vco_b, plugin: Fundamental, slug: VCO }
    cables:
      - { from: [vco_a, Sine], to: [vco_b, Frequency modulation] }
    notes:
      - after: vco_a
        text: "Потяни кабель отсюда: он берёт начало в выходе."
        targets: [{ module: vco_a, output: Sine }]
    faq:
      - q: "Как вытащить кабель?"
        a: "Потяни его за конец и отпусти в пустом месте шкафа. Кабель исчезнет. Вернуть его можно отменой."
      - q: "Кабель не втыкается во вход."
        a: "Проверь, что тянешь от выхода ко входу. Два входа или два выхода между собой не соединяются."
      - q: "Как отменить и повторить действие?"
        a: "Меню Edit, пункты Undo и Redo. На macOS это ⌘Z и ⇧⌘Z. Работает на модули, кабели и ручки."

  - id: b7
    type: practice
    preset: practice
    title: "Практика — два VCO и заметка"
    task: |
      Собери патч сам, между маркерами «Верстак».
      1. Поставь **Notes**, **Blank** и два **VCO**.
      2. Протяни кабель из `Sine` первого VCO во вход `Frequency modulation` второго.
      3. В Notes напиши одну строку: название урока и дату.
      4. Нажми «Проверить». Сохранение и текст заметки проверка не видит.
    check: p0-02-interface
    hints:
      "module:notes":
        - Чего-то не хватает среди служебных модулей.
        - В браузере модулей посмотри плагин Core.
        - Найди Notes среди модулей Core и поставь на верстак.
      "module:blank":
        - Нужна пустая панель.
        - Она тоже в плагине Core, у неё нет ни ручек, ни разъёмов.
        - Найди Blank в браузере модулей и поставь на верстак.
      "module:vco_a":
        - Нужно два генератора.
        - Модуль VCO живёт в плагине Fundamental.
        - Поставь на верстак два VCO из Fundamental.
      "module:vco_b":
        - Второго генератора пока нет.
        - Сколько VCO должно быть на верстаке?
        - Добавь второй VCO из Fundamental.
      "cable:1":
        - Два VCO есть, но они не связаны.
        - Откуда идёт кабель и куда он приходит?
        - "Кабель из `Sine` первого VCO во вход `Frequency modulation` второго."
    faq:
      - q: "Можно взять другой выход вместо Sine?"
        a: "Проверка ждёт именно Sine. Остальные выходы VCO мы разберём в уроке 1.1."
      - q: "Проверка не видит заметку в Notes. Это нормально?"
        a: "Да. Текст и файл патча проверка не читает. Проверь их сам: подпись должна быть видна, а файл открываться."
      - q: "Где мои модули, если верстак пуст?"
        a: "Правый щелчок по пустому месту между маркерами «Верстак» открывает браузер модулей. Там найди Notes, Blank и VCO."

  - id: b8
    type: debug
    preset: debug
    title: "Найди поломку"
    task: |
      Раньше два VCO были связаны, а теперь нет.
      Найди, чего не хватает, и верни одним действием.
    modules:
      - { ref: vco_a, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "110" } } }
      - { ref: vco_b, plugin: Fundamental, slug: VCO }
    cables:
      - { from: [vco_a, Sine], to: [vco_b, Frequency modulation] }
    break: { remove_cable: [vco_a, Sine, vco_b, Frequency modulation] }
    check: { kind: fixed, expect_cable: [vco_a, Sine, vco_b, Frequency modulation] }
    hints:
      fixed:
        - "Посмотри на модули: чего не хватает между ними?"
        - Выход без кабеля ничего никому не отдаёт.
        - "Протяни кабель из `Sine` первого VCO во вход `Frequency modulation` второго."
    faq:
      - q: "Почему тут нет звука, хотя что-то сломано?"
        a: "Звука в этом уроке нет по замыслу. Ты ищешь поломку глазами: на экране нет кабеля между модулями."
      - q: "Куда протянуть кабель?"
        a: "От выхода первого VCO ко входу второго. Выход называется Sine, вход — Frequency modulation."

  - id: b9
    type: recap
    preset: recap
    title: "Итог"
    page: |
      # Итог
      - Ширина модуля измеряется в **HP**, ряды шкафа заполняются слева направо.
      - Браузер модулей открывается клавишей Enter над пустым местом шкафа.
      - Кабель идёт от выхода ко входу. Из одного выхода можно вести несколько кабелей.
      - Edit → Undo возвращает удалённое. Патч сохраняется командой File → Save as.
      Сохрани патч как `vcv-0.2.vcv`.
      **Источники:** справка VCV Rack, разделы «Menu Bar» и «Key Commands». Omri Cohen, «Your first minutes in VCV 2». Doepfer, описание системы A-100.
    questions:
      - q: "Что сделает отмена, если вынуть кабель из входа?"
        free: true
        options:
          - { text: "Вернёт кабель на то же место", correct: true, why: "Undo работает на кабели так же, как на модули и ручки." }
          - { text: "Удалит оба VCO", why: "Отмена возвращает последнее действие, а не стирает модули." }
          - { text: "Ничего: кабели не отменяются", why: "Отменяются и кабели, и модули, и движения ручек." }
    next: |
      # Дальше: 0.3
      Пора услышать первый звук. Подключим Audio, выберем устройство и разберём безопасную громкость.
    faq:
      - q: "Что повторить, если запутался?"
        a: "Вернись к ряду «Кабель от выхода ко входу» и проделай шаги из «Покрути сам» ещё раз."
      - q: "Нужно ли помнить все пункты меню?"
        a: "Нет. Запомни Enter для браузера модулей, Undo для отмены и Save as для сохранения."
