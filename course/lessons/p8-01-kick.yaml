id: p8-01-kick
num: "8.1"
part: 8
title: Бочка
goal: Собрать бочку из синуса и одной огибающей, которая управляет и громкостью, и высотой, и подобрать её под свой трек.
builds: Первый ударный инструмент трека. В уроке 9.2 бочка встанет в ритм-секцию рядом с малым барабаном и хэтами.
minutes: 35
requires: [p3-04-adsr, p3-02-vcf-cv]
glossary: [питч-огибающая, щелчок атаки, сброс фазы осциллятора, огибающая, аттенюатор]
sources: [sos-33, sos-34, ne-kick]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: Бочка
    page: |
      # 8.1 Бочка
      **Ты научишься:** собирать бочку из синуса и одной [[огибающая|огибающей]], а потом подбирать глубину, длину и щелчок.
      **Ты соберёшь:** VCO → VCA с огибающей на громкости и на высоте через **8vert**.
      **Понадобится:** 35 минут, уроки про ADSR и управление фильтром от CV.
      Этот инструмент пойдёт в часть 9. Сохрани патч в конце урока.
    figure: { template: adsr, a: 0.002, d: 0.3, s: 0, r: 0.3, gate: 0.25, markers: true, caption: Огибающая бочки — резкий старт и спад без выдержки. }
    faq:
      - q: Бочка — это ведь просто низкий звук. Зачем огибающая?
        a: "Одним низким тоном ты получишь гудение. Удар даёт огибающая: громкость быстро падает, а высота в первые миллисекунды съезжает вниз. Без этого нет «бух»."
      - q: Нужны ли мне колонки с басом?
        a: Нет. В наушниках глубина слышна лучше, а на маленьком динамике ты услышишь в основном щелчок и верхушку тона. Для проверки полезно послушать оба варианта.
      - q: Звук будет громким?
        a: Убавь громкость в системе перед первым ударом. Демо звучит только в активном ряду, а ручку Level у Audio можно держать низко.

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса до объяснений. Ошибаться можно: ответы покажут, о чём будет урок.
    questions:
      - q: Что даёт бочке «нырок», то есть ощущение удара?
        free: true
        options:
          - { text: "Высота звука быстро падает от высокой к низкой", correct: true, why: "Это и есть нырок: в первые доли секунды тон съезжает вниз. Из-за этого бочка «бухает»." }
          - { text: "Звук просто быстро затихает", why: "Спад громкости нужен, но сам по себе он даёт короткий гул, а не удар." }
          - { text: "Шум в начале звука", why: "Короткий щелчок в начале — отдельная деталь. Нырок — это движение высоты тона." }
      - q: "Чем управляет вторая цепочка: ADSR → 8vert → VCO?"
        options:
          - { text: "Высотой VCO — ослабленная огибающая сдвигает тон вниз", correct: true, why: "Огибающая даёт до 10 В. 8vert оставляет пару вольт, и тон съезжает на пару октав." }
          - { text: "Громкостью, как и первая цепочка", why: "Громкостью занят кабель в CV у VCA. Эта цепочка идёт во вход высоты." }
          - { text: "Тембром через фильтр", why: "Вход 1V/octave pitch у VCO отвечает за высоту, а не за фильтр." }
      - q: "Бочка гудит: после удара тон держится, пока идёт гейт. Что поправить?"
        options:
          - { text: "Поставить Sustain у ADSR в ноль", correct: true, why: "Sustain — уровень, на котором нота держится при высоком гейте. В нуле огибающая падает до тишины сама." }
          - { text: "Поставить Attack на максимум", why: "Attack делает старт мягче, но выдержку не убирает." }
          - { text: "Опустить Level у VCA-1 в ноль", why: "Level задаёт общую громкость. Выдержку он не меняет, он просто заглушит всё." }

  - id: b3
    type: story
    preset: story
    title: Три особенности удара
    page: |
      # Три особенности удара
      Бочка — одиночный низкий удар. На слух в нём три вещи.
      Первая: **тон падает**. В момент удара высота настоящей бочки смещается на пару полутонов. У электронной бочки сдвиг больше, поэтому она «бухает».
      Вторая: **громкость быстро спадает**. Выдержки нет.
      Третья: в самом начале есть короткий [[щелчок атаки|щелчок]] от колотушки.
    figure:
      template: table
      rows:
        - [Особенность, Что слышно, Чем делается]
        - [Нырок высоты, Бочка «бухает», "8vert → высота VCO"]
        - [Спад громкости, Нет выдержки, "ADSR → CV у VCA-1"]
        - [Щелчок, Удар в начале, Attack около 2 мс]
      caption: Три особенности бочки и ручки, которые за них отвечают.
    simpler: Представь мячик, брошенный в пол. В момент удара он звонкий и высокий, потом звук падает и глохнет. Бочка делает то же самое с тоном и громкостью.
    faq:
      - q: Нырок и щелчок — это одно и то же?
        a: Нет. Нырок — движение высоты тона за десятки миллисекунд, он даёт «бух». Щелчок — очень короткий резкий звук в самый момент начала. Их часто путают, потому что оба случаются вначале.
      - q: Почему у электронной бочки сдвиг больше, чем у настоящей?
        a: Так устроены классические драм-машины вроде 808 и 909. Они делают сдвиг преувеличенным, и бочка звучит глубже и плотнее, чем у живого барабана.
      - q: Откуда эта схема?
        a: Схему с синусом, падающей высотой и короткой огибающей описывают статьи Sound On Sound и блог производителя модулей. Конкретная сборка на одной огибающей — подгонка курса под модули Rack.

  - id: b4
    type: story
    preset: story
    title: Одна огибающая на два входа
    page: |
      # Одна огибающая на два входа
      Громкость и высоту бочки ведёт одна и та же [[огибающая]]. Один её кабель идёт в **CV** у VCA, второй — во вход высоты VCO.
      Прямо подать огибающую в высоту нельзя. Она доходит до 10 В, то есть до десяти октав.
      Нужна пара октав, поэтому между ними стоит [[аттенюатор]] **8vert**. При 25 % он оставляет 2,5 В — около двух с половиной октав.
      Такая [[питч-огибающая]] даёт нырок, а [[сброс фазы осциллятора|сброс фазы]] на входе **Sync** сделал бы все удары одинаковыми. В этом патче Sync не подключён.
    page2: |
      Пока огибающая вверху, VCO звучит высоко. Когда огибающая падает, тон съезжает к основной частоте.
      Равные **Decay** и **Release** дают один и тот же хвост при коротком и при длинном гейте.
      Ритм в демо задаёт LFO: его выход Square даёт гейт два раза в секунду.
    figure:
      template: flow
      layout: two-rows
      nodes:
        - { id: lfo, label: LFO, kind: gate }
        - { id: env, label: ADSR, kind: cv }
        - { id: att, label: 8vert, kind: cv }
        - { id: vco, label: VCO, kind: audio }
        - { id: vca, label: VCA-1, kind: audio }
        - { id: out, label: Audio, kind: audio }
      edges:
        - { from: lfo, to: env, kind: gate }
        - { from: env, to: att, kind: cv }
        - { from: att, to: vco, kind: cv }
        - { from: env, to: vca, kind: cv }
        - { from: vco, to: vca, kind: audio }
        - { from: vca, to: out, kind: audio }
      caption: Огибающая расходится на два пути. Верхний ведёт громкость, нижний через 8vert ведёт высоту.
    simpler: Рука бьёт в барабан и одновременно крутит ручку высоты вниз. Рука — одна огибающая, а ручек две.
    faq:
      - q: Почему нельзя подать огибающую в высоту напрямую?
        a: Огибающая доходит до 10 В, а один вольт на входе 1V/octave — это октава. Нырок вышел бы на десять октав и превратился в писк. 8vert оставляет только пару вольт.
      - q: Что такое сброс фазы и зачем он нужен?
        a: Это запуск волны с одного и того же места при каждом ударе. Тогда все удары похожи друг на друга. В Rack фазу сбрасывает вход Sync у VCO.
      - q: Можно ли вести высоту отдельной огибающей?
        a: "Можно, и в сложных патчах так делают. Здесь одна огибающая проще: нырок и спад громкости сами совпадают по времени."

  - id: b5
    type: live
    preset: live
    title: Бочка целиком
    page: |
      # Бочка целиком
      Перед тобой собранная бочка. Метроном **LFO** даёт гейт два раза в секунду, ADSR превращает его в удар.
      Поверни **Row 1 gain** у 8vert от 0 к 40 %. Нырок усиливается, удар становится резче.
      Потом поверни **Decay** от 150 до 600 мс. Бочка из сухой становится гудящей.
    modules:
      - { ref: lfo, plugin: Fundamental, slug: LFO, params: { Frequency: { display: "2" } } }
      - { ref: env, plugin: Fundamental, slug: ADSR, params: { Attack: { display: "2" }, Decay: { display: "300" }, Sustain: { display: "0" }, Release: { display: "300" } } }
      - { ref: att, plugin: Fundamental, slug: 8vert, params: { Row 1 gain: { raw: 0.25 } } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "55" } } }
      - { ref: vca, plugin: Fundamental, slug: VCA-1, params: { Level: { display: "100" }, Response mode: { display: "Exponential" } } }
    cables:
      - { from: [lfo, Square], to: [env, Gate] }
      - { from: [env, Envelope], to: [vca, CV] }
      - { from: [env, Envelope], to: [att, Row 1] }
      - { from: [att, Row 1], to: [vco, 1V/octave pitch] }
      - { from: [vco, Sine], to: [vca, Channel] }
      - { from: [vca, Channel], to: [audio, "To \"device output 1\""] }
      - { from: [vca, Channel], to: [audio, "To \"device output 2\""] }
    notes:
      - { after: att, text: "**Row 1 gain** — глубина нырка. 25 % — это 2,5 В на входе высоты.", targets: [{ module: att, param: Row 1 gain }] }
      - { after: vco, text: "**Frequency** — основной тон бочки, 55 Гц. Низкий звук, который ты чувствуешь больше, чем слышишь.", targets: [{ module: vco, param: Frequency }] }
      - { after: vca, text: "**Response mode** в Exponential: спад громкости выходит естественнее.", targets: [{ module: vca, param: Response mode }] }
    faq:
      - q: Я почти ничего не слышу на 55 Гц. Это ошибка?
        a: Нет. На 55 Гц тон очень низкий, и маленькие динамики его почти не воспроизводят. Подними Frequency до 80 Гц или послушай в наушниках, нырок и щелчок слышны и там.
      - q: Что делает метроном LFO?
        a: LFO даёт гейт с выхода Square два раза в секунду, вместо тебя нажимая на кнопку. Позже тут появится секвенсор из части 5.
      - q: Почему Row 1 gain показывает вольты, а не проценты?
        a: Пока в Row 1 нет кабеля, ручка показывает вольты. Как только подключён кабель, Rack переходит на проценты. 25 % и 2,5 В — одно и то же положение.

  - id: b6
    type: anatomy
    preset: anatomy
    title: 8vert как ослабитель
    page: |
      # 8vert как ослабитель
      Тебе нужна только первая строка. Остальные строки в этом уроке не трогай.
      Огибающая заходит во вход **Row 1**, а ослабленная копия выходит из гнезда **Row 1** рядом.
    module: { ref: att, plugin: Fundamental, slug: 8vert }
    notes:
      - { text: "**Row 1 gain** — коэффициент. Вправо от нуля сигнал ослабляется, влево переворачивается.", targets: [{ module: att, param: Row 1 gain }] }
      - { text: "Вход **Row 1** принимает огибающую от ADSR.", targets: [{ module: att, input: Row 1 }] }
      - { text: "Выход **Row 1** идёт во вход **1V/octave pitch** у VCO.", targets: [{ module: att, output: Row 1 }] }
    later:
      - { what: "Остальные строки как константы напряжения", lesson: "1.4" }
    faq:
      - q: Почему ручка показывает то вольты, то проценты?
        a: Пока в Row 1 нет кабеля, ручка работает как источник константы и показывает вольты от −10 до 10. С кабелем она становится ослабителем и показывает проценты. В уроке говорим процентами.
      - q: Что будет, если повернуть Row 1 gain влево от нуля?
        a: Огибающая перевернётся, и тон вместо нырка вниз начнёт подскакивать вверх. Для бочки это не нужно, но слышно хорошо.
      - q: Можно ли заменить 8vert другим ослабителем?
        a: Можно любым, который умеет уменьшать сигнал до пары вольт. Для курса выбран 8vert, потому что ты его уже видел в уроках 1.4 и 3.2.

  - id: b7
    type: anatomy
    preset: anatomy
    title: ADSR бочки
    page: |
      # ADSR бочки
      Здесь та же огибающая, что в уроке про ADSR. Меняется только настройка.
      Нужен быстрый подъём, спад и ноль выдержки.
    module: { ref: env, plugin: Fundamental, slug: ADSR }
    notes:
      - { text: "**Attack** — самое короткое значение. Чем короче, тем резче щелчок.", targets: [{ module: env, param: Attack }] }
      - { text: "**Decay** и **Release** держи равными. Тогда хвост не зависит от длины гейта.", targets: [{ module: env, param: Decay }, { module: env, param: Release }] }
      - { text: "**Sustain** в ноль: после удара звук не держится.", targets: [{ module: env, param: Sustain }] }
      - { text: "На вход **Gate** приходит ритм: у нас это LFO Square.", targets: [{ module: env, input: Gate }] }
    faq:
      - q: Почему Decay и Release должны быть равны?
        a: Если гейт короткий, хвост ведёт Release. Если длинный, хвост ведёт Decay. Равные значения дают один и тот же звук в обоих случаях, и бочка не меняется, когда меняется длина гейта.
      - q: Что значит «щелчок атаки»?
        a: Это короткий резкий звук в самом начале, когда огибающая поднимается почти мгновенно. При Attack 1–2 мс он слышен, при 20–30 мс удар становится мягче.
      - q: Что будет, если Sustain не в ноле?
        a: Огибающая после спада остановится на этом уровне и будет держаться, пока гейт высокий. Бочка зазвучит как гул, пока длится гейт.

  - id: b8
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Поверни **Frequency** у VCO от 30 до 90 Гц."
        see: Бочка то глубже, то выше и «коробочнее».
      - do: "Подними **Row 1 gain** от 0 до 50 %."
        see: Нырок усиливается, удар становится резче.
      - do: "Двигай **Decay** и **Release** вместе от 100 до 800 мс."
        see: Хвост короче или длиннее.
      - do: "Переставь **Attack** от 1 до 30 мс."
        see: От острого щелчка к мягкому удару.
      - do: "Переключи **Response mode** у VCA-1 между Linear и Exponential."
        see: В Exponential спад сжимается к началу, хвост тише.
    modules:
      - { ref: lfo, plugin: Fundamental, slug: LFO, params: { Frequency: { display: "2" } } }
      - { ref: env, plugin: Fundamental, slug: ADSR, params: { Attack: { display: "2" }, Decay: { display: "300" }, Sustain: { display: "0" }, Release: { display: "300" } } }
      - { ref: att, plugin: Fundamental, slug: 8vert, params: { Row 1 gain: { raw: 0.25 } } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "55" } } }
      - { ref: vca, plugin: Fundamental, slug: VCA-1, params: { Level: { display: "100" }, Response mode: { display: "Exponential" } } }
    cables:
      - { from: [lfo, Square], to: [env, Gate] }
      - { from: [env, Envelope], to: [vca, CV] }
      - { from: [env, Envelope], to: [att, Row 1] }
      - { from: [att, Row 1], to: [vco, 1V/octave pitch] }
      - { from: [vco, Sine], to: [vca, Channel] }
      - { from: [vca, Channel], to: [audio, "To \"device output 1\""] }
      - { from: [vca, Channel], to: [audio, "To \"device output 2\""] }
    notes:
      - { after: env, text: "Шаги 3 и 4 — ручки этого ADSR.", targets: [{ module: env, param: Decay }, { module: env, param: Release }, { module: env, param: Attack }] }
    faq:
      - q: Я поставил Row 1 gain на 50 %, и бочка стала писклявой. Нормально?
        a: Да. Сдвиг 5 В — это пять октав вверх от основного тона, нырок слишком глубокий. Верни 20–35 %, и бочка снова станет плотной.
      - q: Звук хрипит и трещит. Что делать?
        a: Скорее всего, бочка слишком громкая. Опусти Level у VCA-1 или у Audio. Громкая низкая бочка быстро перегружает выход.
      - q: Можно ли взять Triangle вместо Sine?
        a: "Можно: появятся гармоники, звук станет грубее и лучше слышен в маленьких динамиках. Перенеси кабель с Sine на Triangle у VCO и сравни."

  - id: b9
    type: practice
    preset: practice
    title: Практика — своя бочка
    task: |
      Собери бочку сам, между маркерами «Верстак».
      1. **VCO**, **ADSR**, **VCA-1**, **8vert**. Для ритма поставь **LFO** и подай его `Square` в `Gate` у ADSR.
      2. Звук: `Sine` → `Channel` у VCA-1, `Channel` → вход 1 у Audio.
      3. Огибающая: `Envelope` → `CV` у VCA-1 и `Envelope` → `Row 1` у 8vert, потом `Row 1` → `1V/octave pitch` у VCO.
      4. **Frequency** 30–90 Гц, **Row 1 gain** 10–50 %, **Decay** 100–800 мс, **Sustain** не выше 10 %.
    given: [audio]
    check: p8-01-kick
    hints:
      "cable:1":
        - Какую форму волны ты хочешь для бочки?
        - Смотри на верхние выходы VCO.
        - "`Sine` у VCO → вход `Channel` у VCA-1."
      "cable:2":
        - Громкость не спадает после удара. Что закрывает VCA-1?
        - Посмотри на ADSR и на вход управления у VCA-1.
        - "`Envelope` у ADSR → `CV` у VCA-1."
      "cable:3":
        - Откуда взять нырок высоты?
        - Та же огибающая, но через ослабитель.
        - "`Envelope` у ADSR → `Row 1` (вход) у 8vert."
      "cable:4":
        - Куда идёт ослабленная огибающая?
        - Нужен вход высоты у VCO.
        - "Выход `Row 1` у 8vert → `1V/octave pitch` у VCO."
      "cable:5":
        - Бочка собрана, а тишина.
        - Откуда звук выходит из VCA-1 и куда должен прийти?
        - "`Channel` у VCA-1 → `To \"device output 1\"` у Audio."
      "param:1":
        - Основной тон бочки лежит слишком высоко или низко.
        - Ручка Frequency у VCO.
        - Поставь Frequency между 30 и 90 Гц.
      "param:2":
        - Нырок слишком мал или слишком глубок.
        - Ручка Row 1 gain у 8vert.
        - Поставь Row 1 gain между 10 и 50 %.
      "param:3":
        - Хвост слишком короткий или слишком длинный.
        - Ручка Decay у ADSR.
        - Поставь Decay между 100 и 800 мс.
      "param:4":
        - Бочка гудит, пока идёт гейт. Что держит тон?
        - Ручка Sustain у ADSR.
        - Поставь Sustain не выше 10 %, лучше в ноль.
      "probe:1":
        - Огибающая не поднялась.
        - Идёт ли ритм и доходит ли он до Gate у ADSR?
        - "Подай `Square` у LFO в `Gate` у ADSR и нажми «Проверить» ещё раз."
      "probe:2":
        - На выходе 8vert тишина.
        - Идёт ли огибающая в 8vert и поднят ли Row 1 gain выше нуля?
        - "`Envelope` → `Row 1` у 8vert и подними Row 1 gain."
    faq:
      - q: Какой источник ритма взять?
        a: "Любой, который даёт гейт или триггер: LFO Square, SEQ 3, Clocked или Push с включённым Hold. Проверка смотрит на огибающую, а не на источник."
      - q: Проверка говорит, что огибающая не поднялась, а я слышу звук.
        a: Скорее всего, кабель Envelope не дошёл до Gate, или Push не удерживается. Подай ритм на Gate у ADSR и нажми «Проверить» ещё раз.
      - q: Можно ли взять другой ослабитель вместо 8vert?
        a: "Для проверки нужен именно 8vert: она читает его выход Row 1. Другие ослабители нужны позже."

  - id: b10
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Эта бочка бьёт, но гудит ровным тоном, без нырка.
      Найди одну ошибку и исправь её одним кабелем.
    modules:
      - { ref: lfo, plugin: Fundamental, slug: LFO, params: { Frequency: { display: "2" } } }
      - { ref: env, plugin: Fundamental, slug: ADSR, params: { Attack: { display: "2" }, Decay: { display: "300" }, Sustain: { display: "0" }, Release: { display: "300" } } }
      - { ref: att, plugin: Fundamental, slug: 8vert, params: { Row 1 gain: { raw: 0.25 } } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "55" } } }
      - { ref: vca, plugin: Fundamental, slug: VCA-1, params: { Level: { display: "100" }, Response mode: { display: "Exponential" } } }
    cables:
      - { from: [lfo, Square], to: [env, Gate] }
      - { from: [env, Envelope], to: [vca, CV] }
      - { from: [env, Envelope], to: [att, Row 1] }
      - { from: [att, Row 1], to: [vco, 1V/octave pitch] }
      - { from: [vco, Sine], to: [vca, Channel] }
      - { from: [vca, Channel], to: [audio, "To \"device output 1\""] }
      - { from: [vca, Channel], to: [audio, "To \"device output 2\""] }
    break: { remove_cable: [att, Row 1, vco, 1V/octave pitch] }
    check: { kind: fixed, expect_cable: [att, Row 1, vco, 1V/octave pitch] }
    hints:
      fixed:
        - Громкость спадает, а высота остаётся ровной. Куда должна идти ослабленная огибающая?
        - Проследи выход Row 1 у 8vert.
        - Соедини `Row 1` (выход) у 8vert с `1V/octave pitch` у VCO.
    faq:
      - q: Почему без этого кабеля нет нырка?
        a: "Вход высоты у VCO не получает огибающую. Остаётся только спад громкости: звук затихает, но тон не съезжает вниз."
      - q: Как отличить этот сбой на слух?
        a: Сравни начало удара до и после кабеля. С кабелем в первые 100 мс тон падает, без него — остаётся ровным гулом.

  - id: b11
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - Бочка — низкий синус с тремя особенностями: нырок высоты, быстрый спад громкости, короткий щелчок.
      - Одна огибающая ведёт громкость напрямую, а высоту — через 8vert.
      - Row 1 gain задаёт глубину нырка, Decay и Release — длину хвоста, Sustain остаётся в нуле.
      - Frequency у VCO — глубина бочки, Attack — острота щелчка.
      Сохрани патч (⌘S): твоя копия урока 8.1 понадобится в части 9.
      **Источники:** Sound On Sound, «Synthesizing Drums: The Bass Drum» и «Practical Bass Drum Synthesis»; блог Noise Engineering, «Kick Out the Jams».
    questions:
      - q: Что изменится в звуке, если поднять Row 1 gain с 10 до 40 %?
        options:
          - { text: "Нырок станет глубже, удар резче", correct: true, why: "Больше вольт на входе высоты — тон стартует выше и дольше съезжает вниз. Удар слышен ярче." }
          - { text: "Бочка станет громче", why: "Громкостью управляет другой кабель, в CV у VCA-1. Row 1 gain меняет только высоту." }
          - { text: "Хвост станет длиннее", why: "Длину хвоста задают Decay и Release. Row 1 gain на них не влияет." }
    next: |
      # Дальше: 8.2
      **Малый барабан и клэп.** Шум и короткие огибающие дают другой удар — резкий и «шипящий».
    faq:
      - q: Что повторить, если бочка не бухает?
        a: Проверь кабель от 8vert к 1V/octave pitch и значение Row 1 gain. Если нырок есть, но слабый, подними gain до 30–40 %.
      - q: Зачем сохранять патч?
        a: В части 9 бочка станет частью ритм-секции. Твоя копия урока 8.1 понадобится там как готовый инструмент.
