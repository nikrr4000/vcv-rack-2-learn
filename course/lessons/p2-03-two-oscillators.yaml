id: p2-03-two-oscillators
num: "2.3"
part: 2
title: Два генератора
goal: Сложить два VCO в один звук, сдвинуть второй на точный интервал и сделать густой юнисон из двух слегка расстроенных пил.
builds: Основа баса и струнных пэдов. Один VCO звучит тонко, два расстроенных звучат объёмно.
minutes: 35
requires: [p2-01-vco, p1-03-volt-per-octave]
glossary: [интервал, полутон как 1/12 В, цент, расстройка и биения, юнисон]
sources: [sos-strings, kane-musichackspace]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: Два генератора
    page: |
      # 2.3 Два генератора
      **Ты научишься:** складывать два **VCO** микшером **Mix**, сдвигать второй на октаву и квинту и расстраивать его на доли полутона.
      **Ты соберёшь:** [[юнисон]] из двух пил, который «дышит».
      **Понадобится:** 35 минут, наушники или колонки на тихой громкости.
      Это основа баса и струнных пэдов из части 8.
    figure: { template: waveforms, shapes: [saw, saw], periods: [4, 4], labels: [VCO 1, VCO 2], caption: Две пилы одной высоты. Сложим их и расстроим одну. }
    faq:
      - q: Зачем два VCO, если можно один?
        a: Два чуть разных генератора дают густой звук, а один звучит тонко. Это самый дешёвый способ сделать звук объёмным, без эффектов и фильтров.
      - q: Звук будет громким?
        a: Две пилы в сумме громче одной. Поэтому в уроке у Mix стоит Level 50 %. Начни с тихой громкости в системе и подними её сам.
      - q: Что такое Mix и чем он отличается от Audio?
        a: Mix складывает до шести сигналов в один. Audio выводит этот один сигнал в колонки. Сначала сумма, потом выход.

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса до объяснений. Ошибаться можно, ответы подскажут, что повторить.
    questions:
      - q: Два VCO играют почти одну ноту, второй выше на 3 Гц. Что слышно?
        free: true
        options:
          - { text: Громкость пульсирует три раза в секунду, correct: true, why: "Волны то усиливают, то гасят друг друга. Частота пульсаций равна разнице частот: 3 Гц дают три пульсации." }
          - { text: Звук просто стал громче, why: "Две волны не складываются в простое удвоение. Из-за разницы фаз громкость то растёт, то падает." }
          - { text: Две отдельные ноты, why: "Разница в 3 Гц слишком мала, ухо слышит одну ноту с пульсацией. Две ноты слышны при разнице в полутон." }
      - q: На сколько вольт сдвигает выход Octave при Shift = 1?
        options:
          - { text: На 1 В, correct: true, why: "Один вольт на октаву: Shift = 1 прибавляет к высоте ровно 1 В." }
          - { text: На 12 В, why: "12 — число полутонов в октаве. В вольтах октава это 1 В." }
          - { text: "На 0,5 В", why: "Октава не половина вольта: это вольт, по стандарту 1 В на октаву." }
      - q: Второй VCO выше ровно на полутон. Почему это не расстройка?
        options:
          - { text: "Расстройка это доли полутона, а полутон уже другая нота", correct: true, why: "Расстройка меряется центами, сотыми долями полутона. Целый полутон слышен как отдельная нота и диссонирует." }
          - { text: Это и есть расстройка, why: "Расстройка слишком мала, чтобы стать другой нотой. Полутон — интервал." }
          - { text: Полутон на слух не различим, why: "Слух различает его уверенно. Даже доли полутона дают заметные биения." }

  - id: b3
    type: story
    preset: story
    title: Интервалы
    page: |
      # Интервалы
      [[интервал|Интервал]] — отношение высот двух нот. Октава — частота вдвое больше, в вольтах +1 В.
      [[полутон как 1/12 В|Полутон]] — двенадцатая часть октавы, около 0,083 В. Квинта — семь полутонов. Частота при этом растёт примерно в 1,5 раза.
      Нота с одинаковой высотой звучит «в унисон». Когда второй VCO чуть-чуть мимо, возникает [[расстройка и биения|расстройка]]. Её меряют в [[цент|центах]]: цент — сотая доля полутона.
    figure: { template: keyboard, from: C4, to: C5, marks: [{ note: C4, volts: 0 }, { note: G4, volts: 0.58 }, { note: C5, volts: 1 }], caption: "От C4 до C5 один вольт. Квинта G4 посередине, около 0,58 В." }
    simpler: Представь лестницу из двенадцати ступенек до следующего этажа. Этаж — октава, ступенька — полутон, квинта — седьмая ступенька. Цент — тонкий шажок внутри ступеньки.
    faq:
      - q: Почему квинта — это 7 полутонов, а не 5?
        a: Квинта — пятая нота мажорной гаммы, но от первой до пятой по ступеням нужно пройти семь полутонов. Поэтому в вольтах она 7/12 В.
      - q: Сколько центов в октаве?
        a: "1200: двенадцать полутонов по сто центов. Расстройка в 10–20 центов еле заметна как отдельная нота, но слышна как пульсации."
      - q: Чем интервал отличается от расстройки?
        a: "Интервал — осмысленное расстояние между нотами: полутон, квинта, октава. Расстройка — крошечная разница, при которой нота остаётся той же, только «дышит»."

  - id: b4
    type: story
    preset: story
    title: Биения и юнисон
    page: |
      # Биения и юнисон
      Если два генератора звучат почти в унисон, их волны то усиливают, то гасят друг друга. Получаются **биения** — пульсация громкости.
      Скорость пульсации равна разнице частот. Разница 3 Гц — три пульсации в секунду.
      Юнисон — несколько голосов на одной ноте с лёгкой расстройкой. Гордон Рид описывает струнные синтезаторы так: "Every note you hear is simply four detuned and modulated oscillators".
      Мы пока обойдёмся двумя.
    figure: { template: waveforms, shapes: [sine, sine], periods: [8, 9], labels: [260 Гц, 263 Гц], caption: "Две синусоиды чуть разной частоты то совпадают, то расходятся." }
    simpler: Двое идут рядом, шаг почти в шаг. Иногда шаги совпадают, и стук слышен громче. Иногда расходятся, и стук гаснет. Так и волны двух VCO.
    faq:
      - q: Зачем расстраивать, если можно играть точно в унисон?
        a: В точном унисоне две волны совпадают, и звук просто громче. Небольшая расстройка заставляет их расходиться, поэтому звук густеет и «дышит».
      - q: Слишком большая расстройка тоже плоха?
        a: Да. При разнице в десятки герц пульсации сливаются в гудение, а потом слышны две отдельные ноты. Для юнисона берут от 5 до 20 центов.
      - q: Какая расстройка нужна для медленного дыхания?
        a: Раз в секунду — разница 1 Гц, три раза в секунду — 3 Гц. Двигай Frequency второго VCO и слушай, как меняется скорость пульсаций.

  - id: b5
    type: live
    preset: live
    title: Две пилы
    page: |
      # Две пилы
      Две **пилы** идут в микшер **Mix**, сумма — в **Scope** и в Audio. Второй VCO на 3 Гц выше первого.
      На экране громкость «горбится» около трёх раз в секунду. Это биения.
      Поверни **Shift** у Octave на 1. Второй VCO уходит на октаву вверх, пульсаций нет: это интервал, а не расстройка.
    modules:
      - { ref: vco1, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: octave, plugin: Fundamental, slug: Octave, params: { Shift: { display: "0" } } }
      - { ref: vco2, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "264.7" } } }
      - { ref: mix, plugin: Fundamental, slug: Mixer, params: { Level: { display: "50" } } }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "1000" }, Gain 1: { display: "10" } }
    cables:
      - { from: [vco1, Sawtooth], to: [mix, Channel 1] }
      - { from: [vco2, Sawtooth], to: [mix, Channel 2] }
      - { from: [octave, Pitch], to: [vco2, 1V/octave pitch] }
      - { from: [mix, Mix], to: [scope, Ch 1] }
      - { from: [mix, Mix], to: [audio, "To \"device output 1\""] }
    notes:
      - after: vco2
        text: "Второй VCO на 264,7 Гц: примерно 20 центов выше первого."
        targets: [{ module: vco2, param: Frequency }]
      - after: vco2
        text: "**Shift** сдвигает высоту второго на целые октавы."
        targets: [{ module: octave, param: Shift }, { module: vco2, input: 1V/octave pitch }]
      - after: mix
        text: "**Level** 50 % не даёт сумме двух пил перегрузить выход."
        targets: [{ module: mix, param: Level }]
    faq:
      - q: Пульсаций не слышу. Что не так?
        a: Проверь, что оба кабеля Sawtooth идут в Mix, а Shift у Octave стоит на 0. Разница частот должна быть небольшой, около 3 Гц.
      - q: Почему на экране картинка меняется медленно?
        a: Time стоит на 1000 мс на экран, и видна огибающая суммы, а не отдельные периоды. Горбы огибающей и есть биения.
      - q: Звук с Octave Shift = 1 стал тоньше. Почему?
        a: Второй VCO ушёл на октаву вверх и перестал пульсировать вместе с первым. Звук стал двойным по высоте, но не густым.

  - id: b6
    type: anatomy
    preset: anatomy
    title: Панель Mix
    page: |
      # Панель Mix
      **Mix** складывает до шести сигналов в один. Раздельных ручек громкости нет: на панели один общий **Level**.
    module: { ref: mix, plugin: Fundamental, slug: Mixer }
    notes:
      - { text: "Шесть входов **Channel 1 … Channel 6**. Каждый принимает свой сигнал.", targets: [{ module: mix, input: Channel 1 }, { module: mix, input: Channel 2 }, { module: mix, input: Channel 3 }, { module: mix, input: Channel 4 }, { module: mix, input: Channel 5 }, { module: mix, input: Channel 6 }] }
      - { text: "**Level** — общая громкость суммы: от 0 до 100 %. Раздельной регулировки нет.", targets: [{ module: mix, param: Level }] }
      - { text: "Выход **Mix** — сумма всех подключённых входов, умноженная на Level.", targets: [{ module: mix, output: Mix }] }
    faq:
      - q: Два громких сигнала дают искажения. Что делать?
        a: Убавь Level. Два сигнала по ±5 В в сумме дают размах до ±10 В, и Audio может перегрузиться. Level 50 % возвращает размах к ±5 В.
      - q: Можно ли в Mix сложить не только звук?
        a: Можно. Mix складывает любые напряжения, в том числе CV. Для раздельной громкости нужен другой микшер, он будет в уроке 3.3.
      - q: Что будет с пустым входом Channel?
        a: Ничего. Вход без кабеля даёт ноль и в сумму не вносит ничего.

  - id: b7
    type: anatomy
    preset: anatomy
    title: Панель Octave
    page: |
      # Панель Octave
      **Octave** прибавляет к высоте целое число вольт, то есть сдвигает ноту на целые октавы. Ставится между источником нот и VCO.
    module: { ref: octave, plugin: Fundamental, slug: Octave }
    notes:
      - { text: "**Shift** — целые октавы от −4 до +4. Вправо выше, влево ниже.", targets: [{ module: octave, param: Shift }] }
      - { text: "Вход `1V/octave pitch` принимает высоту. Без кабеля Pitch равен просто сдвигу в вольтах.", targets: [{ module: octave, input: 1V/octave pitch }] }
      - { text: "Вход **Octave shift CV** сдвигает октаву напряжением. В уроке не нужен.", targets: [{ module: octave, input: Octave shift CV }] }
      - { text: "Выход **Pitch** — высота плюс сдвиг. Его кабель идёт во вход высоты VCO.", targets: [{ module: octave, output: Pitch }] }
    faq:
      - q: Почему Shift сдвигает только на октавы, а не на полутоны?
        a: Модуль прибавляет целые вольты. Полутон — это 1/12 В, его ручкой Shift не задать. Для полутонов крути Frequency у VCO.
      - q: Подключил Octave, а высота VCO не поменялась.
        a: Проверь, что кабель идёт из Pitch во вход `1V/octave pitch` у VCO. Ручка Shift должна быть не на нуле.
      - q: Octave складывается с ручкой Frequency?
        a: Да. Rack суммирует положение ручки и входное напряжение. Сдвиг идёт поверх ручки.

  - id: b8
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: Двигай **Frequency** второго VCO от 261,63 до 270 Гц понемногу.
        see: Пульсации сначала редкие, потом чаще, потом переходят в гудение.
      - do: Поверни **Level** у Mix с 100 до 50 %.
        see: Размах на Scope вдвое меньше. Звук тише, форма та же.
      - do: Поставь **Shift** у Octave на −1, на 0 и на 1.
        see: Высота второго меняется ровно на октаву. При целом сдвиге пульсаций нет.
      - do: Поставь **Frequency** второго на 392 Гц, потом на 329,63 Гц.
        see: 392 Гц — квинта, 329,63 Гц — большая терция. Это интервалы, а не расстройка.
      - do: Верни **Frequency** второго на 264 Гц.
        see: Расстройка около 15 центов. Это самая густая зона для юнисона.
    modules:
      - { ref: vco1, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: octave, plugin: Fundamental, slug: Octave, params: { Shift: { display: "0" } } }
      - { ref: vco2, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: mix, plugin: Fundamental, slug: Mixer, params: { Level: { display: "100" } } }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "1000" }, Gain 1: { display: "10" } }
    cables:
      - { from: [vco1, Sawtooth], to: [mix, Channel 1] }
      - { from: [vco2, Sawtooth], to: [mix, Channel 2] }
      - { from: [octave, Pitch], to: [vco2, 1V/octave pitch] }
      - { from: [mix, Mix], to: [scope, Ch 1] }
      - { from: [mix, Mix], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: vco2, text: "Шаги 1, 4 и 5 — ручка Frequency второго VCO. Шаг 3 — Shift.", targets: [{ module: vco2, param: Frequency }, { module: octave, param: Shift }] }
      - { after: mix, text: Шаг 2 — Level., targets: [{ module: mix, param: Level }] }
    faq:
      - q: В начале я не слышу биений. Это ошибка?
        a: Нет, обе пилы стоят на 261,63 Гц и совпадают. Подвинь Frequency второго VCO, и появятся пульсации.
      - q: Как поставить ровно 392 Гц?
        a: Наведи курсор на ручку, и Rack покажет значение. Правый щелчок открывает поле для точного числа.
      - q: Звук громкий, когда Level на 100 %. Это нормально?
        a: Да. Две пилы в сумме громче одной, и Level 100 % не ослабляет сумму. Убавь Level до 50 %.

  - id: b9
    type: practice
    preset: practice
    title: Практика — юнисон
    task: |
      Собери юнисон из двух пил между маркерами «Верстак».
      1. Поставь два **VCO** и **Mix**.
      2. `Sawtooth` первого → `Channel 1`, `Sawtooth` второго → `Channel 2` у Mix.
      3. `Mix` → `To "device output 1"` у Audio. Убавь **Level** у Mix.
      4. Первый VCO оставь на 261,63 Гц. Второй подними чуть выше: от 262,8 до 272 Гц.
      Потом нажми «Проверить» и послушай «дыхание».
    given: [audio]
    check: p2-03-two-oscillators
    hints:
      "cable:1":
        - Первый голос не попал в сумму.
        - Куда должна идти пила первого VCO? Нужен вход микшера.
        - "`Sawtooth` первого VCO → вход `Channel 1` у Mix."
      "cable:2":
        - Второго голоса в сумме нет.
        - Пила второго VCO должна попасть в другой вход микшера.
        - "`Sawtooth` второго VCO → вход `Channel 2` у Mix."
      "cable:3":
        - Сумма не доходит до колонок.
        - Какой выход Mix ведёт к Audio?
        - "Выход `Mix` → `To \"device output 1\"` у Audio."
      "param:1":
        - Первый VCO должен быть опорным.
        - Ручка Frequency первого VCO.
        - Верни Frequency первого на 261,63 Гц, значение по умолчанию.
      "param:2":
        - Что слышно, если второй ровно на той же высоте? А если выше на полтона?
        - Ручка Frequency второго VCO.
        - Поставь Frequency второго между 262,8 и 272 Гц, например 265.
      "probe:1":
        - На выходе Mix нет движения сигнала.
        - Идут ли оба кабеля в Mix и не в нуле ли Level?
        - Проверь кабели в Channel 1 и Channel 2 и подними Level у Mix выше нуля.
    faq:
      - q: Проверка не принимает частоту второго VCO.
        a: Нужна расстройка от 8 до 70 центов, то есть Frequency между 262,8 и 272 Гц. Слишком близко к 261,63 Гц биений нет, слишком далеко звучат две ноты.
      - q: Нужен ли Scope?
        a: Нет, но полезен. Подключи Mix к Scope, поставь Time на 1000 мс и смотри на огибающую пульсаций.
      - q: Можно взять Square вместо Sawtooth?
        a: Для проверки нужна пила. Square тоже даст биения, попробуй после проверки и сравни окраску.

  - id: b10
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Вместо мягкого «дыхания» слышны две ноты вплотную, и это режет слух. Пульсаций нет.
      Найди одну настройку и исправь её.
    modules:
      - { ref: vco1, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: vco2, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "264.7" } } }
      - { ref: mix, plugin: Fundamental, slug: Mixer, params: { Level: { display: "50" } } }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "1000" }, Gain 1: { display: "10" } }
    cables:
      - { from: [vco1, Sawtooth], to: [mix, Channel 1] }
      - { from: [vco2, Sawtooth], to: [mix, Channel 2] }
      - { from: [mix, Mix], to: [scope, Ch 1] }
      - { from: [mix, Mix], to: [audio, "To \"device output 1\""] }
    break: { set_param: { module: vco2, name: Frequency, value: { display: "277.18" } } }
    check: { kind: fixed, expect_param: { module: vco2, name: Frequency, display_min: 262.8, display_max: 272 } }
    hints:
      fixed:
        - Кабели на месте. Насколько второй VCO выше первого?
        - "Ручка Frequency у второго VCO: сейчас разница целый полутон."
        - Верни Frequency второго между 262,8 и 272 Гц, например 264,7.
    faq:
      - q: Почему полутон звучит плохо, а 20 центов нет?
        a: Целый полутон слышен как отдельная нота рядом, она диссонирует с первой. При 20 центах нота одна, а звук пульсирует.

  - id: b11
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - Интервал — расстояние между нотами. Октава это +1 В, полутон это 1/12 В.
      - Расстройка — доли полутона, её меряют в центах. Из-за неё возникают биения.
      - Частота биений равна разнице частот двух VCO.
      - Mix складывает сигналы, Level убавляет сумму.
      Сохрани патч: ⌘S сохраняет твою копию урока.
      **Источники:** Gordon Reid, «Synthesizing Strings: PWM & String Sounds» (Sound On Sound); курс Phelan Kane «Getting Started with VCV Rack 2» (Music Hackspace).
    questions:
      - q: Один VCO на 261,63 Гц, второй на 264,63 Гц. Сколько пульсаций в секунду?
        options:
          - { text: Три, correct: true, why: "Частота биений равна разнице частот: 264,63 минус 261,63 дают 3 Гц, то есть три пульсации." }
          - { text: Одна, why: "Одна пульсация в секунду была бы при разнице 1 Гц. Здесь разница три герца." }
          - { text: Пульсаций нет, why: "Они есть всегда, когда частоты почти совпадают. Нет их только при точном совпадении или при сдвиге на целую октаву." }
    next: |
      # Дальше: 2.4
      **Wavetable VCO.** Тембр сможет двигаться сам, без фильтра и без второго генератора.
    faq:
      - q: Обязательно ли расстраивать именно пилы?
        a: Нет, подойдёт любая форма. Пилы дают самый густой результат, потому что в них больше всего гармоник.
      - q: Что повторить, если биения не слышны?
        a: Ряд «Две пилы». Проверь, что второй VCO чуть выше первого и Shift у Octave стоит на нуле.
