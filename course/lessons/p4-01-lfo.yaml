id: p4-01-lfo
num: "4.1"
part: 4
title: LFO
goal: Понять, чем скорость модуляции отличается от глубины, различать формы LFO на Scope и собрать вибрато.
builds: Базовый приём оживления звука. Он открывает часть 4 и нужен в каждом инструменте дальше.
minutes: 30
requires: [p1-04-knob-cv]
glossary: [модуляция, модулятор и цель, LFO, скорость и глубина модуляции, вибрато, тремоло, свип фильтра, Offset]
sources: [vcv-free-manual, sos-10, pc-learning-synthesis]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: LFO
    page: |
      # 4.1 LFO
      **Ты научишься:** отличать скорость [[модуляция|модуляции]] от глубины и читать формы **LFO** на **Scope**.
      **Ты соберёшь:** [[вибрато]] — медленный LFO качает высоту VCO.
      **Понадобится:** 30 минут и урок 1.4 про ручки и CV.
      Начинается часть 4. Здесь сигналы будут двигать ручки за тебя.
    figure:
      template: flow
      layout: row
      nodes:
        - { id: lfo, label: LFO, kind: cv }
        - { id: vco, label: VCO, kind: audio }
        - { id: out, label: Audio, kind: audio }
      edges:
        - { from: lfo, to: vco, kind: cv }
        - { from: vco, to: out, kind: audio }
      caption: LFO не звучит сам. Он двигает ручку другого модуля.
    faq:
      - q: Зачем нужен LFO, если я могу крутить ручку сам?
        a: Руки заняты, а звук должен меняться постоянно и ровно. LFO качает параметр без тебя, с точной скоростью. Так звук перестаёт быть застывшим.
      - q: Чем LFO отличается от VCO?
        a: Устройство то же, но частота от долей герца до десятков герц. Такой сигнал не слышен как тон. Его используют как управляющий.
      - q: Что значит «оживить звук»?
        a: "Дать параметру медленно двигаться: высоте, громкости, яркости. Слух ловит движение и перестаёт воспринимать звук как ровный гул."

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса до объяснений. Ошибаться можно: ответы покажут, о чём урок.
    questions:
      - q: Что слышно, если выход LFO на 2 Гц подать в Audio?
        free: true
        options:
          - { text: "Почти ничего: щелчки или тишина", correct: true, why: "LFO делает медленное напряжение для управления. Для уха он слишком медленный, тона не получится." }
          - { text: "Медленная нота", why: "Тон слышен от десятков герц. На 2 Гц ухо различает отдельные щелчки, а не ноту." }
          - { text: "Серия гейтов", why: "Гейты делает другой тип модулей. LFO выдаёт плавные волны, хотя у Square два уровня." }
      - q: Какую ручку крутить, чтобы вибрато стало быстрее, но не глубже?
        options:
          - { text: "Frequency у LFO", correct: true, why: "Frequency задаёт, сколько циклов в секунду делает LFO. Это и есть скорость качания." }
          - { text: "Frequency modulation у VCO", why: "Эта ручка задаёт, насколько сильно LFO двигает высоту. Она меняет глубину, а не скорость." }
          - { text: "Pulse width", why: "Ширина импульса относится к форме Square. К скорости вибрато она отношения не имеет." }
      - q: Offset у LFO стоит на Unipolar. Какой размах у Sine?
        options:
          - { text: "От 0 до 10 В", correct: true, why: "В Unipolar сигнал целиком выше нуля. Полный размах всегда 10 В." }
          - { text: "От −5 до +5 В", why: "Так выглядит Bipolar. В Unipolar вся волна поднята выше нуля." }
          - { text: "От 0 до 5 В", why: "Размах 10 В, а не 5. Половина размаха — это отклонение от середины." }

  - id: b3
    type: story
    preset: story
    title: Модулятор и цель
    page: |
      # Модулятор и цель
      Модуляция — это когда один сигнал двигает параметр другого модуля.
      Сигнал, который двигает, называют [[модулятор и цель|модулятором]]. Параметр, который движется, — целью.
      [[LFO]] — низкочастотный генератор, самый простой модулятор. Это генератор вроде VCO, но медленный: от долей герца до десятков герц.
      Цель определяет эффект. LFO на высоте VCO даёт [[вибрато]]. На громкости — [[тремоло]]. На частоте среза фильтра — [[свип фильтра|свип]].
      Сам LFO ничего не звучит. Его выход надо подать на вход управления.
    figure: { template: flow, layout: row, nodes: [{ id: lfo, label: LFO, kind: cv }, { id: vco, label: VCO pitch, kind: audio }, { id: vca, label: VCA, kind: audio }, { id: vcf, label: VCF cutoff, kind: audio }], edges: [{ from: lfo, to: vco, kind: cv }, { from: lfo, to: vca, kind: cv }, { from: lfo, to: vcf, kind: cv }], caption: "Один модулятор, три цели: высота, громкость, яркость." }
    simpler: Представь, что ты плавно крутишь ручку громкости туда-обратно, всегда в одном темпе. LFO делает это сам. Куда подключить его — на ручку высоты, громкости или яркости — решаешь ты.
    faq:
      - q: Любой сигнал может быть модулятором?
        a: Да. Огибающая, случайное напряжение, другой LFO — всё, что меняет напряжение. LFO удобен тем, что повторяется ровно и без участия рук.
      - q: Что происходит с цели, когда LFO подключён?
        a: Её значение складывается с положением ручки. Ручка задаёт центр, LFO качает вокруг него. Глубину качания регулирует ручка CV у цели.
      - q: Почему LFO сам ничего не слышно?
        a: Он слишком медленный для слуха. Он меняет напряжение, а звучит то, чем он управляет, — например, высота VCO.

  - id: b4
    type: story
    preset: story
    title: Скорость и глубина
    page: |
      # Скорость и глубина
      У модуляции два независимых параметра.
      [[скорость и глубина модуляции|Скорость]] — сколько раз в секунду повторяется цикл. Её задаёт **Frequency** у LFO.
      Глубина — насколько сильно сигнал двигает цель. Её задаёт ручка CV на цели, например **Frequency modulation** у VCO.
      Скорость меняет, как часто движется параметр. Глубина меняет, как далеко.
      На Scope скорость — число циклов на экране. Глубина — размах кривой.
    figure: { template: waveforms, shapes: [sine, sine], periods: [2, 4], labels: [скорость x1, скорость x2], caption: "Та же форма, вдвое быстрее: на экране вдвое больше циклов." }
    simpler: Вспомни маятник. Как часто он качается — скорость. Как далеко отходит от середины — глубина. Это две разные вещи, и менять их можно по отдельности.
    faq:
      - q: Я поставил скорость побольше, а вибрато не стало сильнее. Почему?
        a: Скорость и глубина независимы. Быстрее — значит чаще, но не дальше. За глубину отвечает Frequency modulation у VCO.
      - q: Какая скорость нужна для вибрато?
        a: Для вибрато хватает нескольких герц, в этом уроке работаешь в диапазоне 3–8 Гц. Совсем медленный LFO качает высоту плавно, как волна. Быстрый добавляет дрожь.
      - q: Что будет на 400 Гц?
        a: LFO станет звуковым. На такой частоте он уже тон, а не медленный модулятор. Граница плавная, но по сути LFO — источник управления.

  - id: b5
    type: story
    preset: story
    title: Униполярный и биполярный
    page: |
      # Униполярный и биполярный
      Переключатель **Offset** выбирает, где LFO качается по вертикали.
      **Bipolar** — от −5 до +5 В, вокруг нуля. **Unipolar** — от 0 до 10 В, целиком выше нуля.
      Размах в обоих режимах 10 В. Меняется только положение: среднее значение.
      Для вибрато нужен Bipolar: высота качается вокруг ноты. В Unipolar она уходит только вверх.
      Для яркости фильтра подходит Unipolar: от закрытого к открытому.
    figure: { template: voltages, ranges: [{ label: Unipolar, min: 0, max: 10 }, { label: Bipolar, min: -5, max: 5 }], caption: "Один размах 10 В, два положения относительно нуля." }
    simpler: Представь линейку на столе. Bipolar — ты держишь её за середину, она качается в обе стороны. Unipolar — один край прижат к столу, она поднимается только вверх.
    faq:
      - q: Какой режим стоит по умолчанию?
        a: Unipolar, от 0 до 10 В. Для вибрато его надо переключить в Bipolar, иначе нота будет только подниматься вверх.
      - q: Что делает кнопка Invert?
        a: "Переворачивает форму вверх ногами: направление движения меняется на обратное. У вибрато разницу почти не слышно, у свипа фильтра слышно."
      - q: Размах 10 В — это много для высоты?
        a: Много, но глубину ты ограничиваешь ручкой Frequency modulation у VCO. На 1 % LFO двигает высоту совсем немного.

  - id: b6
    type: live
    preset: live
    title: Вибрато
    page: |
      # Вибрато
      Здесь собрано вибрато. **Sine** у LFO идёт в **Frequency modulation** у VCO и в канал 1 у Scope. **Triangle** идёт в канал 2.
      Слушай, как высота покачивается. На Scope две кривые одной частоты: плавная синусная и угловатая треугольная.
      Скорость задаёт LFO, глубину — ручка Frequency modulation у VCO.
    modules:
      - { ref: lfo, plugin: Fundamental, slug: LFO, params: { Frequency: { display: "5.5" }, Offset: Bipolar } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" }, Frequency modulation: { display: "3" } } }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "1000" }, Gain 1: { display: "10" }, Gain 2: { display: "10" } } }
    cables:
      - { from: [lfo, Sine], to: [vco, Frequency modulation] }
      - { from: [vco, Sine], to: [audio, "To \"device output 1\""] }
      - { from: [lfo, Sine], to: [scope, Ch 1] }
      - { from: [lfo, Triangle], to: [scope, Ch 2] }
    notes:
      - { after: lfo, text: "**Frequency** — скорость. Здесь 5,5 Гц: около пяти покачиваний в секунду.", targets: [{ module: lfo, param: Frequency }] }
      - { after: lfo, text: "**Offset** стоит в Bipolar: качание идёт вокруг ноты.", targets: [{ module: lfo, param: Offset }] }
      - { after: vco, text: "**Frequency modulation** — глубина. Здесь 3 %: покачивание заметно, но нота остаётся нотой.", targets: [{ module: vco, param: Frequency modulation }] }
    faq:
      - q: Я не слышу вибрато. Что проверить?
        a: Посмотри на ручку Frequency modulation у VCO. На 0 % LFO не двигает высоту. Подними её до 3 %.
      - q: Почему на Scope две кривые разной формы?
        a: "Это два выхода одного LFO: Sine и Triangle. Частота одна, форма разная. Сравни, как гладко они поднимаются и опускаются."
      - q: Зачем Time 1000 мс на Scope?
        a: Сигнал медленный. При Time 1000 на экран помещается около пяти циклов, и форму можно разглядеть. При 10 мс экран показал бы лишь кусок одной волны.

  - id: b7
    type: anatomy
    preset: anatomy
    title: Панель LFO
    page: |
      # Панель LFO
      **LFO** встречался в уроках про PWM и таблицы волн. Теперь разберём панель целиком.
      Подписи справа показывают главные органы.
    module: { ref: lfo, plugin: Fundamental, slug: LFO }
    notes:
      - { text: "Четыре выхода: **Sine**, **Triangle**, **Sawtooth**, **Square**. Частота одна, форма разная.", targets: [{ module: lfo, output: Sine }, { module: lfo, output: Triangle }, { module: lfo, output: Sawtooth }, { module: lfo, output: Square }] }
      - { text: "**Frequency** — скорость, от 0,0039 до 1024 Гц, по умолчанию 2 Гц. На высоких значениях LFO уже звучит.", targets: [{ module: lfo, param: Frequency }] }
      - { text: "**Offset**: Bipolar — ±5 В, Unipolar — 0…10 В. Размах всегда 10 В.", targets: [{ module: lfo, param: Offset }] }
      - { text: "**Invert** переворачивает форму вверх ногами.", targets: [{ module: lfo, param: Invert }] }
      - { text: "**Pulse width** меняет ширину импульса, но только у выхода **Square**.", targets: [{ module: lfo, param: Pulse width }] }
      - { text: "Вход **Reset** сбрасывает цикл. Так LFO стартует вместе с нотой.", targets: [{ module: lfo, input: Reset }] }
    later:
      - { what: Вход Clock — подгонка LFO под такт, lesson: "5.1" }
      - { what: Вход Frequency modulation у LFO — один LFO меняет скорость другого, lesson: "4.2" }
    faq:
      - q: Pulse width крутится, а ничего не меняется.
        a: Ручка действует только на выход Square. У синуса, треугольника и пилы ширины импульса нет.
      - q: Какую форму брать для вибрато?
        a: "Sine — самая плавная. Треугольник тоже подходит. Пила и прямоугольник дают рывки: пила — подъём и резкий сброс, прямоугольник — два уровня по очереди."
      - q: Чем Frequency у LFO отличается от Frequency у VCO?
        a: У VCO это высота звука, у LFO — скорость повторения цикла. LFO не передаёт ноту, он только качает.

  - id: b8
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Поставь **Frequency** у LFO на 0,1 Гц, потом на 2, 8 и 30."
        see: Покачивание ускоряется. На 30 Гц оно превращается в быструю дрожь, на Scope цикл спрессован.
      - do: "Поставь **Frequency modulation** у VCO на 0, потом на 3 и 10 %."
        see: Вибрато появляется и углубляется. Скорость остаётся прежней, меняется только размах высоты.
      - do: "Переключи **Offset** у LFO в Unipolar и обратно в Bipolar."
        see: В Unipolar высота уходит только вверх от ноты, в Bipolar качается вокруг неё. На Scope кривая лежит над нулём или вокруг него.
      - do: "Нажми **Invert** у LFO."
        see: Форма перевёрнута. На слух у вибрато разница почти не заметна.
      - do: "Поставь **Pulse width** у LFO на 10 %, потом на 50 %."
        see: Импульс на Scope становится уже и обратно. Это видно только на выходе Square.
    modules:
      - { ref: lfo, plugin: Fundamental, slug: LFO, params: { Frequency: { display: "5.5" }, Offset: Bipolar } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" }, Frequency modulation: { display: "3" } } }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "1000" }, Gain 1: { display: "10" }, Gain 2: { display: "10" } } }
    cables:
      - { from: [lfo, Sine], to: [vco, Frequency modulation] }
      - { from: [vco, Sine], to: [audio, "To \"device output 1\""] }
      - { from: [lfo, Sine], to: [scope, Ch 1] }
      - { from: [lfo, Square], to: [scope, Ch 2] }
    notes:
      - { after: lfo, text: "Шаги 1, 3, 4 и 5 — ручки LFO.", targets: [{ module: lfo, param: Frequency }, { module: lfo, param: Offset }, { module: lfo, param: Invert }, { module: lfo, param: Pulse width }] }
      - { after: vco, text: "Шаг 2 — глубина вибрато.", targets: [{ module: vco, param: Frequency modulation }] }
    faq:
      - q: На 30 Гц вибрато пропало. Что случилось?
        a: Покачивание стало слишком быстрым, чтобы слышать его как движение. Оно слилось в шероховатость тона. Вернись к скорости 3–8 Гц.
      - q: На 10 % высота уплывает слишком далеко. Это нормально?
        a: Да. 10 % — большая глубина, высота плывёт на несколько полутонов. Для вибрато обычно хватает пары процентов.
      - q: Ничего не меняется, когда кручу Pulse width.
        a: Ширина импульса действует только на Square. В этом патче Square идёт в канал 2 Scope, смотри на него.

  - id: b9
    type: practice
    preset: practice
    title: Практика — своё вибрато
    task: |
      Собери вибрато сам, между маркерами «Верстак».
      1. **LFO**, **VCO** и **Scope**.
      2. `Sine` у LFO → `Frequency modulation` у VCO. `Sine` у VCO → `To "device output 1"` у Audio.
      3. `Sine` у LFO ещё и в `Ch 1` у Scope.
      4. **Frequency** у LFO — от 3 до 8 Гц, **Offset** — Bipolar.
      5. **Frequency modulation** у VCO — от 0,5 до 10 %. Нажми «Проверить».
    given: [audio]
    check: p4-01-lfo
    hints:
      "cable:1":
        - Вибрато не получится. Что должно качать высоту?
        - Какой вход у VCO принимает управление высотой?
        - "`Sine` у LFO → вход `Frequency modulation` у VCO."
      "cable:2":
        - Звука в колонках не будет. Куда идёт звук?
        - Звуковой выход VCO должен прийти в Audio.
        - "`Sine` у VCO → вход `To \"device output 1\"` у Audio этого ряда."
      "cable:3":
        - На Scope нечего смотреть.
        - Что Scope должен показывать в канале 1?
        - "`Sine` у LFO → вход `Ch 1` у Scope."
      "param:1":
        - Вибрато звучит в узком диапазоне скоростей. Что слышно на 0,2 Гц или 30 Гц?
        - Посмотри на Frequency у LFO.
        - Поставь Frequency у LFO между 3 и 8 Гц.
      "param:2":
        - Вибрато должно качать вокруг ноты, а не только вверх.
        - Посмотри на переключатель Offset у LFO.
        - Выбери Bipolar.
      "param:3":
        - LFO подключён, но глубина слишком мала или слишком велика.
        - Посмотри на ручку Frequency modulation у VCO.
        - Поставь её от 0,5 до 10 %.
      "probe:1":
        - LFO не движется.
        - Подключён ли Sine к VCO и Scope, не стоит ли Frequency на минимуме?
        - Проверь кабели с `Sine` у LFO, подними Frequency и нажми «Проверить» ещё раз.
      "probe:2":
        - На выходе VCO нет сигнала.
        - Идёт ли кабель из Sine у VCO в Audio?
        - Соедини `Sine` у VCO с `To \"device output 1\"` у Audio и проверь ещё раз.
    faq:
      - q: Можно взять другую форму LFO?
        a: "Для проверки нужен Sine: проверка смотрит именно на этот выход. Потом пробуй Triangle и другие формы сам."
      - q: Проверка говорит, что LFO не движется, а я вижу кривую на Scope.
        a: Скорее всего, Frequency стоит на самом минимуме или кабель идёт не из Sine. Подними Frequency до 3–8 Гц и проверь снова.
      - q: Зачем Scope, если вибрато и так слышно?
        a: Scope показывает скорость и размах глазами. Так ты проверяешь, что LFO действительно качается и с какой скоростью.

  - id: b10
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Нота не качается вокруг высоты, а подпрыгивает вверх и возвращается. Средняя высота стала выше.
      Найди одну неверную настройку и исправь её. Кабели трогать не нужно.
    modules:
      - { ref: lfo, plugin: Fundamental, slug: LFO, params: { Frequency: { display: "5.5" }, Offset: Bipolar } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" }, Frequency modulation: { display: "10" } } }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "1000" }, Gain 1: { display: "10" } } }
    cables:
      - { from: [lfo, Sine], to: [vco, Frequency modulation] }
      - { from: [vco, Sine], to: [audio, "To \"device output 1\""] }
      - { from: [lfo, Sine], to: [scope, Ch 1] }
    break: { set_param: { module: lfo, name: Offset, value: Unipolar } }
    check: { kind: fixed, expect_param: { module: lfo, name: Offset, display_in: [Bipolar] } }
    hints:
      fixed:
        - Слушай среднюю высоту. Вокруг какого уровня качается LFO на Scope?
        - Посмотри на переключатель Offset у LFO.
        - Верни Offset в Bipolar.
    faq:
      - q: Почему в Unipolar нота уходит вверх?
        a: В Unipolar LFO даёт 0…10 В, то есть всегда плюс. При глубине 10 % это до 1 В — до октавы вверх от исходной ноты.
      - q: Достаточно ли вернуть Bipolar?
        a: Для этого задания да. Если вибрато всё равно слишком сильное, потом уменьши Frequency modulation у VCO.

  - id: b11
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - Модуляция — один сигнал двигает параметр другого модуля. LFO — медленный модулятор.
      - Скорость — Frequency у LFO. Глубина — ручка CV на цели.
      - Offset: Bipolar качает вокруг нуля, Unipolar — выше нуля. Размах 10 В.
      - Для вибрато нужны Sine, 3–8 Гц, Bipolar и малая глубина.
      Сохрани патч: LFO понадобится в каждом уроке части 4.
      **Источники:** руководство VCV Rack Free (раздел LFO); Sound On Sound, «Synth Secrets», статья про модуляцию; Perfect Circuit, «Learning Synthesis: LFOs».
    questions:
      - q: Почему LFO на 400 Гц уже не модулятор, а звук?
        options:
          - { text: "На такой частоте ухо слышит его как тон", correct: true, why: "От десятков герц повторение сливается в высоту. LFO становится обычным генератором." }
          - { text: "Он меняет форму на синус", why: "Форма не зависит от частоты. Меняется только то, как её воспринимает слух." }
          - { text: "LFO не умеет работать выше 100 Гц", why: "Умеет: Frequency доходит до 1024 Гц. Просто такой сигнал звучит как тон." }
    next: |
      # Дальше: 4.2
      **Wavetable LFO.** Форма волны LFO станет подвижной: её положение в таблице тоже можно качать.
    faq:
      - q: Вибрато звучит неестественно. Что подкрутить?
        a: Уменьши глубину — Frequency modulation у VCO. Потом подбери скорость между 4 и 7 Гц. Слишком глубокое и слишком быстрое вибрато звучит механически.
      - q: Что повторить, если запутался в Offset?
        a: Вернись к блоку про униполярный и биполярный сигнал и к уроку 1.4 про смещение. Помогает посмотреть на Scope оба режима подряд.
