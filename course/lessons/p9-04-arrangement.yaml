id: p9-04-arrangement
num: "9.4"
part: 9
title: Аранжировка
goal: Построить в патче план из четырёх секций, по которому слои входят и выходят сами.
builds: Трек со структурой на две с небольшим минуты. В уроке 9.5 его останется свести и записать одним проходом.
minutes: 50
requires: [p9-02-rhythm-section, p9-03-bass-harmony, p5-05-sequential-switches, p5-06-live-control]
glossary: [аранжировка, секция, слой, мьют, последовательный переключатель, логика гейтов, деление такта, гейт]
sources: [vcv-forum-song, ne-mutes, ne-seq-switches, omri-generative, sos-gigging]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: Аранжировка
    page: |
      # 9.4 Аранжировка
      **Ты научишься:** строить [[аранжировка|аранжировку]], то есть превращать повторяющиеся партии в трек со структурой: интро, грув, брейк, финал.
      **Ты соберёшь:** переключатель [[секция|секций]], логику слоёв и [[мьют|мьюты]]. Они управляют мастер-микшером.
      **Понадобится:** 50 минут и каркас из уроков 9.1–9.3.
      Готового рецепта аранжировки в VCV нет. Схема урока — метод курса.
    figure: { template: table, rows: [[Секция, Ударные, Бас, Пэд], [1 интро, "—", "—", да], [2 грув, да, да, да], [3 брейк, "—", да, да], [4 финал, да, да, да]], caption: "План трека. Каждая секция — 16 баров." }
    faq:
      - q: Почему нет готового модуля для аранжировки?
        a: В Rack есть сторонние модули для этого, но курс обходится Fundamental. Схема из переключателя, логики и мьютов собирается из того, что ты уже знаешь.
      - q: Сколько секций нужно в треке?
        a: Для ознакомительного трека хватает четырёх. Больше трёх-четырёх секций без новых идей слушателю не нужно.
      - q: Можно ли играть живьём поверх плана?
        a: Да. Мьюты оставляют за тобой право вмешаться кнопкой. План идёт сам, а ты отключаешь слой вручную.

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса про мьюты, секвенсоры и переключатель. Ответы подскажут, что повторить.
    questions:
      - q: Ты заглушил гейт бочки мьютом до огибающей. Что с последним ударом?
        free: true
        options:
          - { text: "Огибающая договаривает текущий удар, новых не будет", correct: true, why: "Гейт пропал, огибающая уходит в Release. Хвост затухает сам, новые удары не приходят." }
          - { text: "Звук обрывается мгновенно", why: "Мьют стоит на гейте, а не на звуке. Огибающая сама доводит звук до конца." }
          - { text: "Огибающая зависает на 10 В", why: "Без гейта огибающая падает, а не залипает." }
      - q: Зачем секвенсоры идут дальше, пока партия заглушена в брейке?
        options:
          - { text: "Фаза не теряется, партия входит с положенного по времени шага", correct: true, why: "Секвенсор тактируется всегда, а заглушается только выход. Поэтому все партии остаются вместе." }
          - { text: "Rack не умеет приостанавливать секвенсор", why: "Умеет. Просто так партии потеряли бы друг друга по времени." }
          - { text: "Чтобы звук нарастал плавно", why: "Фаза и громкость — разные вещи." }
      - q: Sequential Switch 1 to 4 стоит на Steps = 4. Что делает пятый такт на входе Clock?
        options:
          - { text: "Переключатель возвращается на Channel 1: цикл идёт по кругу", correct: true, why: "После последнего канала счёт начинается заново. Reset нужен только для ручного возврата." }
          - { text: "Остаётся на Channel 4", why: "Цикл не заканчивается на последнем канале." }
          - { text: "Ничего не делает, нужен Reset", why: "Reset нужен не для каждого круга. Круг замыкается сам." }

  - id: b3
    type: story
    preset: story
    title: План трека
    page: |
      # План трека
      [[аранжировка|Аранжировка]] — план того, что играет и когда. [[секция|Секция]] — часть трека с постоянным набором партий.
      [[слой|Слой]] — одна партия: ударные, бас или пэд. В секции слой звучит или молчит.
      Длина секции обычно степень двойки: 8, 16 или 32 бара.
      Партии работают всегда, а заглушаются только на выходе. Так фаза не теряется.
    figure: { template: table, rows: [[Слой, Когда звучит, Почему], [ударные, "грув и финал", "нет интро и брейка"], [бас, "все, кроме интро", "NOT от секции 1"], [пэд, всегда, "без управления"]], caption: "Правила слоёв. Три способа держать партию в плане." }
    simpler: Оркестр на репетиции. Все музыканты сидят на местах и считают такты. Дирижёр поднимает руку тем, кому пора играть.
    faq:
      - q: Почему не остановить секвенсор в брейке?
        a: Остановленный секвенсор потеряет место. Когда он вернётся, его ритм сдвинется относительно остальных. Заглушённый выход сохраняет фазу.
      - q: Что такое «слой» и чем он отличается от инструмента?
        a: "Слой — роль в треке: ударные, бас, пэд. Один слой может состоять из нескольких инструментов. В плане мы переключаем именно слои."
      - q: Нужно ли делать секции одинаковой длины?
        a: "Нет. Но одинаковая длина проще: один делитель на весь трек. Меняй только состав слоёв."

  - id: b4
    type: story
    preset: story
    title: Откуда берутся гейты секций
    page: |
      # Откуда берутся гейты секций
      **Sequential Switch 1 to 4** ([[последовательный переключатель]]) получает на **Clock** редкий такт, по одному на секцию. На вход **Main** идёт [[гейт]] 10 В от Push.
      Пока выбран канал, 10 В приходят на соответствующий **Channel N**. Остальные молчат.
      Так получаются четыре гейта секций. Потом [[логика гейтов|логика]] собирает из них гейты слоёв.
    figure:
      template: flow
      layout: two-rows
      nodes:
        - { id: clk, label: "Clock 3", kind: gate }
        - { id: sw, label: Switch, kind: gate }
        - { id: logic, label: Logic, kind: gate }
        - { id: mutes, label: Mutes, kind: gate }
        - { id: mix, label: VCA Mix, kind: cv }
      edges:
        - { from: clk, to: sw, kind: gate }
        - { from: sw, to: logic, kind: gate }
        - { from: logic, to: mutes, kind: gate }
        - { from: mutes, to: mix, kind: cv }
      caption: Такт секций идёт на переключатель, гейты через логику и мьюты на CV мастера.
    simpler: Светофор на четыре лампы. Каждый такт зажигается следующая, а после четвёртой снова первая.
    faq:
      - q: Откуда берутся постоянные 10 В на Main?
        a: Push с включённым Hold держит на выходе Gate постоянные 10 В. Это источник для всей схемы секций.
      - q: Что такое NOR и NOT A?
        a: NOR даёт 10 В, когда оба входа низкие. NOT A даёт 10 В, когда вход A низкий. Из каналов 1 и 3 получаются слои.
      - q: Как гейт управляет громкостью слоя?
        a: Он идёт в вход Channel N CV мастера, и VCA Mix умножает канал на это напряжение. Нет гейта — слой тихий.

  - id: b5
    type: story
    preset: story
    title: Сколько длится трек
    page: |
      # Сколько длится трек
      Длина секции в секундах: бары × 4 доли × 60 ÷ BPM.
      При 120 BPM шестнадцать баров — 32 с. Четыре секции — 2 мин 8 с.
      Чем длиннее секция, тем реже **Clock 3**: это [[деление такта]]. Шестнадцать баров — это шестьдесят четыре доли, значит, деление на 64.
    figure: { template: table, rows: [[BPM, "16 баров", "4 секции"], [110, "35 с", "2:20"], [120, "32 с", "2:08"], [130, "30 с", "1:58"]], caption: "Длина секции и трека. Значения округлены." }
    simpler: Если в каждом баре четыре шага, а секция — шестнадцать баров, то она длится шестьдесят четыре шага. Темп решает, как быстро ты их делаешь.
    faq:
      - q: Что, если в Clk 3 ratio нет деления на 64?
        a: Возьми ближайшее. Деление на 48 даёт секцию в 12 баров, трек получится короче. Посмотри на дисплее Clocked, какие значения есть у ручки.
      - q: Как поменять длину трека, не трогая секции?
        a: Измени Master clock. Структура останется, а все секции вырастут или сократятся пропорционально.
      - q: Почему длина трека зависит от BPM?
        a: BPM — число долей в минуту. Больше долей в минуту — быстрее проходит каждая секция. Поэтому те же 64 доли длятся меньше времени.

  - id: b6
    type: live
    preset: live
    title: Секции по кругу
    page: |
      # Секции по кругу
      Для демо темп поднят до 300 BPM, секции меняются каждые 0,2 с. Scope показывает два гейта.
      **Channel 2** и **Channel 4** по очереди поднимаются до 10 В. Это секции 2 и 4.
      Нажми **Reset** у Clocked: переключатель вернётся на секцию 1.
    modules:
      - ref: clk
        plugin: ImpromptuModular
        slug: Clocked
        params: { Master clock: { display: "300" } }
      - { ref: sw, plugin: Fundamental, slug: SequentialSwitch1, params: { Steps: { display: "4" } } }
      - { ref: push, plugin: Fundamental, slug: Push, params: { Hold: { raw: 1 } } }
      - { ref: scope, plugin: Fundamental, slug: Scope }
    cables:
      - { from: [clk, Clock 3], to: [sw, Clock] }
      - { from: [clk, Reset], to: [sw, Reset] }
      - { from: [push, Gate], to: [sw, Main] }
      - { from: [sw, Channel 2], to: [scope, Ch 1] }
      - { from: [sw, Channel 4], to: [scope, Ch 2] }
    notes:
      - { after: sw, text: "**Channel N** — гейт секции N.", targets: [{ module: sw, output: Channel 2 }, { module: sw, output: Channel 4 }] }
      - { after: push, text: "**Hold** держит 10 В без нажатия.", targets: [{ module: push, param: Hold }] }
    faq:
      - q: Почему на Scope нет картинки?
        a: Проверь, что Push стоит с включённым Hold и что Clocked идёт. Без 10 В на Main переключателю нечего раздавать.
      - q: Почему секции меняются так быстро?
        a: Для демо темп 300 BPM и Clock 3 в такт мастера. В треке ты замедлишь Clock 3 в шестьдесят четыре раза, и секция займёт шестнадцать баров.
      - q: Что делает Reset?
        a: Возвращает переключатель на Channel 1. Так можно начать трек с интро в любой момент.

  - id: b7
    type: live
    preset: live
    title: От секции к слою
    page: |
      # От секции к слою
      **Logic** собирает слои. **NOR** от секций 1 и 3 — ударные: они молчат в интро и брейке. **NOT A** от секции 1 — бас.
      Мьют стоит после логики. Включённая кнопка заглушает слой независимо от секции.
      Гейты слоёв идут дальше в **Channel CV** мастера.
    modules:
      - ref: clk
        plugin: ImpromptuModular
        slug: Clocked
        params: { Master clock: { display: "300" } }
      - { ref: sw, plugin: Fundamental, slug: SequentialSwitch1, params: { Steps: { display: "4" } } }
      - { ref: push, plugin: Fundamental, slug: Push, params: { Hold: { raw: 1 } } }
      - { ref: logic, plugin: Fundamental, slug: Logic }
      - { ref: mutes, plugin: Fundamental, slug: Mutes }
    cables:
      - { from: [clk, Clock 3], to: [sw, Clock] }
      - { from: [clk, Reset], to: [sw, Reset] }
      - { from: [push, Gate], to: [sw, Main] }
      - { from: [sw, Channel 1], to: [logic, A] }
      - { from: [sw, Channel 3], to: [logic, B] }
      - { from: [logic, NOR], to: [mutes, Row 1] }
      - { from: [logic, NOT A], to: [mutes, Row 2] }
    notes:
      - { after: logic, text: "**NOR** — ударные, **NOT A** — бас.", targets: [{ module: logic, output: NOR }, { module: logic, output: NOT A }] }
      - { after: mutes, text: "**Row 1 mute** глушит ударные.", targets: [{ module: mutes, param: Row 1 mute }] }
    faq:
      - q: Как Logic понимает, какая сейчас секция?
        a: Он смотрит на два входа. A — гейт секции 1, B — гейт секции 3. Остальное определяют выходы NOR и NOT A.
      - q: Почему ударные звучат в финале, а не только в груве?
        a: Финал — секция 4, обе секции 1 и 3 в это время низкие, и NOR высокий. Поэтому ударные играют в 2 и 4.
      - q: Можно ли собрать план без Logic?
        a: Можно, но для каждого слоя нужен отдельный выход переключателя. Logic объединяет секции и уменьшает число кабелей.

  - id: b8
    type: anatomy
    preset: anatomy
    title: Панель Sequential Switch
    page: |
      # Панель Sequential Switch
      Один вход, четыре выхода и счётчик.
    module: { ref: sw, plugin: Fundamental, slug: SequentialSwitch1 }
    notes:
      - { text: "**Clock**: каждый фронт переключает на следующий канал.", targets: [{ module: sw, input: Clock }] }
      - { text: "**Reset** возвращает на первый канал.", targets: [{ module: sw, input: Reset }] }
      - { text: "**Main** — сигнал, который раздаёт переключатель.", targets: [{ module: sw, input: Main }] }
      - { text: "**Steps**: 2, 3 или 4. Для трека — 4.", targets: [{ module: sw, param: Steps }] }
      - { text: "**Channel 1** … **Channel 4** — гейты секций.", targets: [{ module: sw, output: Channel 1 }, { module: sw, output: Channel 4 }] }
    faq:
      - q: Что делает Steps?
        a: "Он задаёт число каналов в цикле. При 3 цикл короче: после третьего канала снова первый. Для четырёх секций нужен Steps равный 4."
      - q: Что будет, если на Main нет сигнала?
        a: Все выходы молчат. Переключатель переключается, но раздавать ему нечего.
      - q: Нужно ли подавать Run?
        a: Нет. У этого переключателя нет входа Run, он идёт по тактам на Clock.

  - id: b9
    type: anatomy
    preset: anatomy
    title: Панель Mutes
    page: |
      # Панель Mutes
      Десять строк. Каждая строка — вход, выход и кнопка.
    module: { ref: mutes, plugin: Fundamental, slug: Mutes }
    notes:
      - { text: "Вход **Row 1** принимает сигнал строки.", targets: [{ module: mutes, input: Row 1 }] }
      - { text: "Выход **Row 1** отдаёт сигнал, если строка не заглушена.", targets: [{ module: mutes, output: Row 1 }] }
      - { text: "**Row 1 mute** включена — строка молчит. Для ударных.", targets: [{ module: mutes, param: Row 1 mute }] }
      - { text: "**Row 2 mute** для баса.", targets: [{ module: mutes, param: Row 2 mute }] }
    faq:
      - q: Зачем мьют, если слои уже управляются секциями?
        a: План идёт сам, а мьют даёт тебе ручное вмешательство. Включил кнопку, и слой молчит в любой секции.
      - q: Что происходит с последним звуком при мьюте?
        a: Мьют стоит на гейте, поэтому огибающая договаривает текущую ноту. Новых нот не будет.
      - q: Есть ли у Mutes плавность включения?
        a: Проверь на слух и по Scope. Если слышен щелчок, поставь между логикой и мастером модуль Process со Slew (урок 4.5).

  - id: b10
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Поставь **Steps** у переключателя на 3."
        see: Секций три, цикл короче. Верни 4.
      - do: "Нажми **Reset** у Clocked."
        see: Переключатель возвращается к секции 1. Так можно стартовать с начала.
      - do: "Включи **Row 1 mute**."
        see: Ударные молчат в любой секции. Выключи — они вернутся.
      - do: "Поверни **Clk 3 ratio** от центра, пока секции не пойдут реже."
        see: Секции удлиняются. Если они ускорились, поверни ручку в другую сторону.
    modules:
      - ref: clk
        plugin: ImpromptuModular
        slug: Clocked
        params: { Master clock: { display: "300" } }
      - { ref: sw, plugin: Fundamental, slug: SequentialSwitch1, params: { Steps: { display: "4" } } }
      - { ref: push, plugin: Fundamental, slug: Push, params: { Hold: { raw: 1 } } }
      - { ref: logic, plugin: Fundamental, slug: Logic }
      - { ref: mutes, plugin: Fundamental, slug: Mutes }
    cables:
      - { from: [clk, Clock 3], to: [sw, Clock] }
      - { from: [clk, Reset], to: [sw, Reset] }
      - { from: [push, Gate], to: [sw, Main] }
      - { from: [sw, Channel 1], to: [logic, A] }
      - { from: [sw, Channel 3], to: [logic, B] }
      - { from: [logic, NOR], to: [mutes, Row 1] }
      - { from: [logic, NOT A], to: [mutes, Row 2] }
    notes:
      - { after: sw, text: "Шаг 1: **Steps**.", targets: [{ module: sw, param: Steps }] }
      - { after: mutes, text: "Шаг 3: кнопка **Row 1 mute**.", targets: [{ module: mutes, param: Row 1 mute }] }
    faq:
      - q: После Steps = 3 четвёртая секция пропала. Это ошибка?
        a: Нет. Переключатель теперь идёт по трём каналам. Верни Steps = 4, чтобы вернуть финал.
      - q: Что если Clk 3 ratio не замедляет секции?
        a: Поверни ручку в другую сторону от центра. Одна сторона делит такт, другая умножает.
      - q: Как понять, что мьют работает?
        a: Выход Row 1 у Mutes становится низким независимо от того, что пришло на вход.

  - id: b11
    type: practice
    preset: practice
    title: Практика — трек на четыре секции
    task: |
      Собери схему секций в каркасе из 9.3.
      1. `Clock 3` → `Clock` у Sequential Switch (Steps 4), `Reset` → `Reset`. Подбери **Clk 3 ratio**: секция 16 баров, темп 110–130 BPM.
      2. `Gate` у Push (Hold) → `Main`.
      3. `Channel 1` → `A`, `Channel 3` → `B` у Logic.
      4. `NOR` → строка 1 у Mutes → `Channel 1 CV`. `NOT A` → строка 2 → `Channel 2 CV`.
      5. Пэд без CV играет всегда. В Notes запиши план и длину трека.
    given: [audio]
    check: p9-04-arrangement
    hints:
      "cable:1":
        - Секции не будут сменяться.
        - Какой выход Clocked даёт редкий такт для секций?
        - "`Clock 3` у Clocked → вход `Clock` у Sequential Switch."
      "cable:2":
        - После остановки секции не вернутся к первой.
        - Куда подать Reset?
        - "`Reset` у Clocked → вход `Reset` у Sequential Switch."
      "cable:3":
        - Переключателю нечего раздавать.
        - Откуда взять постоянные 10 В?
        - "`Gate` у Push с включённым Hold → вход `Main`."
      "cable:4":
        - Logic не знает, идёт ли интро.
        - Какой канал переключателя отвечает за интро?
        - "`Channel 1` у Sequential Switch → вход `A` у Logic."
      "cable:5":
        - Logic не знает, идёт ли брейк.
        - Какой канал отвечает за брейк?
        - "`Channel 3` у Sequential Switch → вход `B` у Logic."
      "cable:6":
        - Ударные не получают гейт секций.
        - Какой выход Logic высок, когда нет ни интро, ни брейка?
        - "`NOR` у Logic → вход `Row 1` у Mutes."
      "cable:7":
        - Гейт ударных не дошёл до мастера.
        - Куда идёт выход строки 1 у Mutes?
        - "`Row 1` (выход) у Mutes → `Channel 1 CV` у VCA Mix."
      "cable:8":
        - Бас не получает гейт секций.
        - Какой выход Logic высок во всех секциях, кроме интро?
        - "`NOT A` у Logic → вход `Row 2` у Mutes."
      "cable:9":
        - Гейт баса не дошёл до мастера.
        - Куда идёт выход строки 2?
        - "`Row 2` (выход) у Mutes → `Channel 2 CV` у VCA Mix."
      "cable:10":
        - Мастер ничего не отдаёт в Audio.
        - Какой выход мастера несёт сумму?
        - "`Mix` у VCA Mix → `To \"device output 1\"` у Audio."
      "param:1":
        - Секций должно быть четыре.
        - Что стоит на Steps?
        - Поставь **Steps** у переключателя на 4.
      "param:2":
        - У трека нет запаса.
        - Что на Mix level?
        - Поставь **Mix level** мастера не выше 0 dB.
      "probe:1":
        - Гейт ударных не меняется.
        - Идёт ли такт, приходит ли Clock 3 и включён ли Hold?
        - Нажми **Reset** у Clocked, включи Hold у Push и дождись смены секции.
      "probe:2":
        - Гейт баса не меняется.
        - Приходит ли Channel 1 на вход A?
        - Проверь кабель `Channel 1` → `A` у Logic и Hold у Push.
      "probe:3":
        - Слои молчат.
        - Не включены ли кнопки мьютов, дошли ли гейты до Channel CV?
        - Выключи **Row 1 mute** и **Row 2 mute** и проверь кабели в `Channel CV` мастера.
    faq:
      - q: Проверка не видит Clk 3 ratio. Как убедиться, что секция идёт 16 баров?
        a: "Посчитай по формуле: бары × 4 × 60 ÷ BPM. При 120 BPM и 16 барах получится 32 с. Засеки время между сменой секций."
      - q: Секция меняется слишком быстро.
        a: Clk 3 ratio ещё не поставлен на деление. Поверни ручку в сторону, где такт редеет, и найди значение около 64.
      - q: Нужны ли настоящие инструменты в треке?
        a: Да. Бочка, бас и пэд из 9.2 и 9.3 идут в мастер. Гейты секций открывают их через Channel CV.

  - id: b12
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Ударные играют и в брейке, хотя брейк должен быть без них.
      Найди одну ошибку и исправь её одним кабелем.
    modules:
      - ref: clk
        plugin: ImpromptuModular
        slug: Clocked
        params: { Master clock: { display: "300" } }
      - { ref: sw, plugin: Fundamental, slug: SequentialSwitch1, params: { Steps: { display: "4" } } }
      - { ref: push, plugin: Fundamental, slug: Push, params: { Hold: { raw: 1 } } }
      - { ref: logic, plugin: Fundamental, slug: Logic }
      - { ref: mutes, plugin: Fundamental, slug: Mutes }
    cables:
      - { from: [clk, Clock 3], to: [sw, Clock] }
      - { from: [clk, Reset], to: [sw, Reset] }
      - { from: [push, Gate], to: [sw, Main] }
      - { from: [sw, Channel 1], to: [logic, A] }
      - { from: [sw, Channel 3], to: [logic, B] }
      - { from: [logic, NOR], to: [mutes, Row 1] }
      - { from: [logic, NOT A], to: [mutes, Row 2] }
    break: { remove_cable: [sw, Channel 3, logic, B] }
    check: { kind: fixed, expect_cable: [sw, Channel 3, logic, B] }
    hints:
      fixed:
        - Logic считает только по тем каналам, которые к нему подключены.
        - Какой канал отвечает за брейк, и куда он должен идти?
        - Соедини `Channel 3` у Sequential Switch с `B` у Logic.
    faq:
      - q: Почему без Channel 3 ударные играют в брейке?
        a: NOR высок, когда оба входа низкие. Без B вход остаётся низким всегда, поэтому в брейке NOR тоже высокий.
      - q: Как проверить карту секций?
        a: Выпиши, какие каналы подключены, и для каждой секции посчитай NOR и NOT A. Ударные должны молчать в секциях 1 и 3.

  - id: b13
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - Аранжировка — план секций. Слои заглушаются на выходе, секвенсоры идут всегда.
      - Гейты секций раздаёт Sequential Switch от редкого Clock 3.
      - Ударные = NOR от секций 1 и 3. Бас = NOT A от секции 1. Пэд всегда.
      - Длина секции: бары × 4 × 60 ÷ BPM. При 120 BPM и 16 барах — 32 с.
      **Источники:** обсуждение «Creating song with multiple sequencers» (VCV Community). Noise Engineering, «Getting Started: Mutes» и «Sequential Switches». Omri Cohen, «Self-playing generative ambient patch». Sound On Sound, «SOS Guide To Gigging With Modular Synths».
    questions:
      - q: Как посчитать длину трека в секундах?
        options:
          - { text: "Бары × 4 × 60 ÷ BPM, умножить на число секций", correct: true, why: "Бар — четыре доли, доля — 60 ÷ BPM секунд. Секция умножается на число секций." }
          - { text: "Бары × BPM ÷ 60", why: "Так считают число доль в минуту, а не длительность." }
          - { text: "Число секций × BPM", why: "Длина секции зависит от баров. Число секций само по себе длину не задаёт." }
    next: |
      # Дальше: 9.5
      **Сведение, запись, разбор.** Уровни, реверберация и запись всего трека одним проходом в файл.
    faq:
      - q: Сохранить ли патч?
        a: Да. Сохрани его под номером 9.4. Он нужен для записи в 9.5.
      - q: Что повторить, если секции не меняются?
        a: Уроки 5.5 про Sequential Switch и 5.6 про мьюты. Чаще всего забывают Hold у Push или не подают Clock 3.
