  - id: b12
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - Малый барабан — тон (корпус) плюс шум (струны) с двумя короткими ADSR и **Sustain** в нуле.
      - Шум идёт через фильтр верхних частот: остаётся хруст без гула.
      - Баланс тона и шума задают ручки Level у двух VCA-1, а не Mixer.
      - Клэп — шум, огибающая которого перезапускается через **Retrigger**, пока гейт ещё высок.
      Сохрани патч (⌘S): твоя копия урока 8.2 понадобится в части 9.
      **Источники:** Sound On Sound, «Synthesizing Drums: The Snare Drum» и «Practical Snare Drum Synthesis». Блог Noise Engineering, «The Sound of One Synth Clapping».
    questions:
      - q: "Чем регулируется баланс тона и шума, если у Mixer одна общая Level?"
        options:
          - { text: "Ручками Level у двух VCA-1", correct: true, why: "Каждая ветка заканчивается своим VCA-1, его Level задаёт долю этой ветки в миксе." }
          - { text: "Ручкой Level у Mixer", why: "Она одна на весь микс: меняет общую громкость, а не баланс." }
          - { text: "Cutoff frequency у VCF", why: "Это граница фильтра, то есть яркость шума, а не его громкость." }
    next: |
      # Дальше: 8.3
      **Хэты.** Тот же шум, другой цвет и очень короткая огибающая. Открытый и закрытый хэт делят одну огибающую.
    faq:
      - q: "Что повторить, если барабан не хрустит?"
        a: "Проверь Highpass filter у VCF и Level у VCA-1 шума. Если шум тихий, подними Level у VCA-1 шума и Cutoff frequency."
      - q: "Зачем сохранять патч?"
        a: "В части 9 барабан и клэп попадут в ритм-секцию. Твоя копия урока 8.2 понадобится там как готовый инструмент."
