      **Огибающая ADSR.** Напряжение на CV начнёт меняться само: нота получит атаку и затухание.
    faq:
      - q: Что повторить, если VCA не слушается?
        a: Урок 1.2 про напряжение. Чаще всего путают CV и Channel или забывают, что без кабеля в CV усилитель открыт.
      - q: Что такое кроссфейд?
        a: Это плавный переход от одного звука к другому. Пока первый затихает, второй нарастает. VCA на это способен. Подробно в уроке 4.6.
