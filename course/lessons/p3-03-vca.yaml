id: p3-03-vca
num: "3.3"
part: 3
title: VCA
goal: Управлять громкостью напряжением, так чтобы звук был слышен только пока усилитель открыт.
builds: Второй кирпич голоса. К нему в уроке 3.4 присоединится огибающая, и звук получит форму во времени.
minutes: 30
requires: [p1-02-voltage]
glossary: [VCA, усиление, линейная и экспоненциальная характеристика, CV, амплитуда]
sources: [vcv-free-manual, sos-09, pc-learning-synthesis]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: VCA
    page: |
      # 3.3 VCA
      **Ты научишься:** управлять громкостью напряжением и отличать вход звука **Channel** от входа управления **CV**.
      **Ты соберёшь:** VCO → [[VCA|VCA]] → Audio. Ручка 8vert открывает и закрывает усилитель.
      **Понадобится:** 30 минут и тихая громкость.
      Без VCA любая нота звучит бесконечно. Огибающая в уроке 3.4 нужна именно ему.
    figure: { template: flow, layout: two-rows, nodes: [{ id: vco, label: VCO, kind: audio }, { id: vca, label: VCA, kind: audio }, { id: out, label: Audio, kind: audio }, { id: cv, label: 8vert, kind: cv }], edges: [{ from: vco, to: vca, kind: audio }, { from: vca, to: out, kind: audio }, { from: cv, to: vca, kind: cv }], caption: Звук идёт сверху. Управление снизу решает, сколько звука дойдёт до выхода. }
    faq:
      - q: Чем VCA отличается от регулятора Level на Audio?
        a: "Level на Audio — ручка, которую крутишь ты. VCA слушается кабеля: напряжение с другого модуля меняет громкость само. Поэтому к нему подключают огибающую и LFO."
      - q: Почему у VCA два входа с одинаковыми гнёздами?
        a: "Один принимает звук, другой управление. Различай по подписи: **Channel** — звук, **CV** — управление. Если перепутать, звук пропадёт или останется постоянным."
      - q: Звук будет громким?
        a: Начни с тихой громкости. Row 1 gain у 8vert открывает усилитель. Поднимай эту ручку и громкость понемногу.

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса до объяснений. Ответы подскажут, что в уроке главное.
    questions:
      - q: На входе CV у VCA нет кабеля, Level стоит на 100 %. Что со звуком на входе Channel?
        free: true
        options:
          - { text: "Проходит без изменений, VCA открыт", correct: true, why: "Без кабеля в CV усиление задаёт только Level. На 100 % звук идёт как есть." }
          - { text: "Звука нет, пока не подашь CV", why: "VCA не закрыт по умолчанию. Без кабеля в CV вход считается полностью открытым." }
          - { text: "Звук станет вдвое тише", why: "Модули в цепочке ничего не отнимают сами. Громкость меняет Level и напряжение на CV." }
      - q: Что такое «усиление» у VCA?
        options:
          - { text: "Число, на которое умножается сигнал", correct: true, why: "Ноль даёт тишину, единица пропускает без изменения. VCA умножает, а не складывает." }
          - { text: "Напряжение, которое прибавляется к сигналу", why: "Прибавление — это смещение. VCA меняет размах, а не сдвигает волну вверх." }
          - { text: "Изменение частоты сигнала", why: "Частоту задаёт VCO. VCA меняет размах волны, а высота остаётся той же." }
      - q: Чем Exponential отличается от Linear при одном и том же CV?
        options:
          - { text: "В нижней части хода громкость почти не растёт, подъём ближе к верху", correct: true, why: "Linear растёт ровно по напряжению. Exponential внизу пологий, поэтому звучит естественнее." }
          - { text: "Exponential всегда громче", why: "Слово «экспоненциальный» не значит «сильнее». При тех же настройках он обычно тише." }
          - { text: "Linear работает с огибающими, Exponential только с LFO", why: "Режим не привязан к источнику CV. Оба режима принимают любое управляющее напряжение." }

  - id: b3
    type: story
    preset: story
    title: Усилитель-умножитель
    page: |
      # Усилитель-умножитель
      Громкость сигнала — его размах, [[амплитуда]]. VCA умножает сигнал на число от 0 до 1.
      Умножил на 0 — тишина. На 1 — исходный звук. На 0,5 — размах вдвое меньше.
      Множитель приходит как напряжение на входе **CV**. Чем оно больше, тем шире открыт усилитель.
      Ручка **Level** тоже участвует: итоговое [[усиление]] — это Level и CV, перемноженные друг на друга.
    figure: { template: waveforms, shapes: [saw, saw, saw], periods: 2, labels: [умножили на 1, умножили на 0.5, умножили на 0], caption: Одна пила и три множителя. Форма та же, размах разный. }
    simpler: Представь кран и воду. Вода — это звук из VCO. Кран — VCA. Напряжение на CV — рука, которая поворачивает кран. Рука на нуле — вода закрыта, повернул до конца — течёт вся.
    faq:
      - q: Что значит «умножить» сигнал?
        a: Каждое значение волны в каждый момент времени умножается на множитель. Если множитель 0,5, все пики становятся вдвое ниже, а форма и высота остаются теми же.
      - q: Почему на CV нужны вольты, а не проценты?
        a: CV — это напряжение. Источник вроде 8vert отдаёт вольты, а VCA превращает их в множитель. Десять вольт открывают усилитель полностью.
      - q: Так VCA тоже работает как тремоло?
        a: Да. Если на CV подать медленный LFO, громкость начнёт колебаться. Это тремоло. Об этом будет часть 4.

  - id: b4
    type: story
    preset: story
    title: Линейно или экспоненциально
    page: |
      # Линейно или экспоненциально
      Переключатель **Response mode** выбирает, как напряжение на CV превращается в усиление.
      В режиме **Linear** усиление растёт ровно вместе с напряжением.
      В режиме **Exponential** нижняя половина хода почти не добавляет громкости, а основной подъём приходит ближе к верху. Это [[линейная и экспоненциальная характеристика|разница характеристик]].
    page2: |
      Слух воспринимает громкость не по прямой: внизу хода он замечает малые сдвиги сильнее, чем наверху. Поэтому экспоненциальный режим для громкости часто звучит естественнее.
      Это ориентир, а не закон. Сравни режимы на слух при одном и том же CV: Exponential обычно тише.
    figure: { template: table, rows: [[Режим, "Низ хода CV", "Верх хода CV"], [Linear, "растёт ровно", "полная громкость"], [Exponential, "почти не растёт", "быстрый подъём"]], caption: Ориентир для сравнения на слух. Точные числа не нужны. }
    faq:
      - q: Какой режим выбрать для огибающей громкости?
        a: "Чаще Exponential: затухание звучит плавнее. Linear удобен там, где нужна ровная зависимость — например, для точной подстройки уровня или CV, который двигает другой параметр."
      - q: Почему в Exponential звук тише при том же CV?
        a: Кривая внизу пологая. Пока напряжение невысокое, усиление остаётся маленьким. Дойди до 10 В — и оба режима дадут полную громкость.
      - q: Режим меняет высоту ноты?
        a: Нет. Он меняет только то, как громкость идёт за CV. Форма волны и частота остаются прежними.

  - id: b5
    type: live
    preset: live
    title: Открой усилитель
    page: |
      # Открой усилитель
      VCO идёт в **Channel** у VCA. На **CV** приходит напряжение от 8vert.
      Подними **Row 1 gain**: сначала 0 — тишина, потом 2, 5, 10 В. Громкость растёт.
      На Scope размах пилы растёт вместе с напряжением.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: cv, plugin: Fundamental, slug: 8vert, params: { Row 1 gain: { display: "5" } } }
      - { ref: vca, plugin: Fundamental, slug: VCA-1, params: { Level: { display: "100" } } }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "5" } } }
    cables:
      - { from: [vco, Sawtooth], to: [vca, Channel] }
      - { from: [cv, Row 1], to: [vca, CV] }
      - { from: [vca, Channel], to: [scope, Ch 1] }
      - { from: [vca, Channel], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: cv, text: "**Row 1 gain** — вольты на CV. Сейчас 5 В: усилитель приоткрыт.", targets: [{ module: cv, param: Row 1 gain }] }
      - { after: vca, text: "Вход **CV** — управление, вход **Channel** — звук.", targets: [{ module: vca, input: CV }, { module: vca, input: Channel }] }
      - { after: scope, text: "Размах пилы показывает, сколько звука прошло.", targets: [{ module: scope, param: Time }] }
    faq:
      - q: Row 1 gain на 0, а звук есть. Почему?
        a: Скорее всего, кабель из 8vert не дошёл до CV или идёт в Channel. Без кабеля в CV усилитель открыт. Проверь, что выход Row 1 идёт именно в CV.
      - q: Чем Row 1 gain 10 В отличается от Level 100 %?
        a: Это две разные ручки. Row 1 gain даёт напряжение управления, Level — собственное усиление VCA. Итог — их произведение. Оба на максимуме дают полную громкость.
      - q: Почему громкость растёт не по прямой?
        a: "Слух не линеен: вдвое больший размах звучит лишь немного громче. Поэтому разница внизу хода слышна лучше, чем наверху."

  - id: b6
    type: anatomy
    preset: anatomy
    title: Панель VCA
    page: |
      # Панель VCA
      Модуль маленький, но входы здесь путают чаще всего.
    module: { ref: vca, plugin: Fundamental, slug: VCA-1 }
    notes:
      - { text: "Вход **Channel** — звук, который нужно приглушить.", targets: [{ module: vca, input: Channel }] }
      - { text: "Вход **CV** — управление. 10 В открывают усилитель полностью.", targets: [{ module: vca, input: CV }] }
      - { text: "Выход **Channel** — звук после усилителя.", targets: [{ module: vca, output: Channel }] }
      - { text: "**Level** — собственное усиление от 0 до 100 %. Умножается на CV.", targets: [{ module: vca, param: Level }] }
      - { text: "**Response mode** — характеристика: Linear или Exponential.", targets: [{ module: vca, param: Response mode }] }
    faq:
      - q: Вход Channel и выход Channel — это одно и то же гнездо?
        a: Нет. Вход принимает звук, выход отдаёт его после усилителя. Названия одинаковые, но гнёзда разные.
      - q: Что будет, если звук подать в CV?
        a: "Звук станет управлением: громкость начнёт дёргаться со скоростью волны. Получится грубая амплитудная модуляция. Для обычной задачи это лишнее."
      - q: Нужна ли ручка Level, если есть CV?
        a: Level задаёт потолок громкости. Это полезно, когда нужно ограничить максимум одной ручкой, не меняя источник CV.

  - id: b7
    type: anatomy
    preset: anatomy
    title: VCA Mix
    page: |
      # VCA Mix
      Четыре VCA в одном модуле, а выходы сведены в один. Пригодится в части 7.
    module: { ref: mix, plugin: Fundamental, slug: VCMixer }
    notes:
      - { text: "**Channel 1** … **Channel 4** — четыре входа звука.", targets: [{ module: mix, input: Channel 1 }, { module: mix, input: Channel 2 }] }
      - { text: "**Channel 1 CV** — вход управления для первого канала. Он необязателен.", targets: [{ module: mix, input: Channel 1 CV }] }
      - { text: "**Channel 1 level** — уровень канала в децибелах. 0 дБ — без изменений.", targets: [{ module: mix, param: Channel 1 level }] }
      - { text: "**Mix level** и вход **Mix CV** управляют общей громкостью.", targets: [{ module: mix, param: Mix level }, { module: mix, input: Mix CV }] }
      - { text: "Выход **Mix** — сумма каналов. Выходы **Channel 1** … **Channel 4** отдают каждый канал отдельно.", targets: [{ module: mix, output: Mix }, { module: mix, output: Channel 1 }] }
    later:
      - { what: "Постановка уровней", lesson: "7.1" }
    faq:
      - q: Что значит −6 дБ?
        a: Это размах вдвое меньше. 0 дБ — без изменений, минус бесконечность — тишина. Децибелы ближе к слуху, чем проценты.
      - q: Зачем CV на каждом канале?
        a: Можно открывать и закрывать каналы по отдельности. Например, подать огибающую на один канал и LFO на другой.
      - q: Чем VCA Mix отличается от простого VCA?
        a: В VCA Mix четыре канала и общий уровень. Он и усиливает, и складывает сигналы. В VCA один канал и одно управление.

  - id: b8
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Уменьши **Level** у VCA от 100 % вниз."
        see: "Звук тише. На Scope размах пропорционален Level."
      - do: "Поставь **Response mode** в Exponential и подними **Row 1 gain** от 0 до 10 В."
        see: "Малые значения почти не слышны. Громкость растёт ближе к верху."
      - do: "Верни **Response mode** в Linear и повтори подъём."
        see: "Громкость растёт ровнее. Размах пилы на Scope растёт линейно."
      - do: "Отключи кабель от входа **CV** у VCA."
        see: "Звук появляется на полную: без кабеля усилитель открыт."
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: cv, plugin: Fundamental, slug: 8vert, params: { Row 1 gain: { display: "5" } } }
      - { ref: vca, plugin: Fundamental, slug: VCA-1, params: { Level: { display: "100" } } }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "5" } } }
    cables:
      - { from: [vco, Sawtooth], to: [vca, Channel] }
      - { from: [cv, Row 1], to: [vca, CV] }
      - { from: [vca, Channel], to: [scope, Ch 1] }
      - { from: [vca, Channel], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: vca, text: "Шаги 1–3 — ручки этого VCA.", targets: [{ module: vca, param: Level }, { module: vca, param: Response mode }] }
    faq:
      - q: В режиме Exponential звук пропал при 2 В. Это ошибка?
        a: Нет. Внизу хода кривая пологая, и усиление остаётся очень маленьким. Подними Row 1 gain выше 5 В, и звук вернётся.
      - q: Что произойдёт, если перенести кабель с CV на Channel?
        a: 8vert отдаёт постоянное напряжение, а не волну, и на слух его не слышно. VCA усилит то, что ему дали, но звука от этого не появится.

  - id: b9
    type: practice
    preset: practice
    title: Практика — открывающийся звук
    task: |
      Собери усилитель сам, между маркерами «Верстак».
      1. **VCO**, **8vert** и **VCA**.
      2. Пила в усилитель: `Sawtooth` → `Channel` у VCA.
      3. Управление: выход `Row 1` у 8vert → вход `CV` у VCA.
      4. Выход `Channel` у VCA → вход 1 у Audio.
      5. **Row 1 gain** — не меньше 3 В. При 0 должна быть тишина. Нажми «Проверить».
    given: [audio]
    check: p3-03-vca
    hints:
      "cable:1":
        - VCA нечего усиливать.
        - Какой выход VCO идёт во вход Channel?
        - "`Sawtooth` у VCO → вход `Channel` у VCA."
      "cable:2":
        - Звук слышен всегда? Что управляет усилением?
        - Какой вход VCA отвечает за управление, а не за звук?
        - "Выход `Row 1` у 8vert → вход `CV` у VCA."
      "cable:3":
        - VCA собран, а звука на выходе нет.
        - Откуда звук выходит из VCA?
        - "Выход `Channel` у VCA → `To \"device output 1\"` у Audio этого ряда."
      "param:1":
        - Сколько вольт сейчас идёт на CV?
        - Смотри на число под ручкой Row 1 gain.
        - Поставь **Row 1 gain** от 3 до 10 В.
      "probe:1":
        - Выход VCA почти не двигается.
        - Звучит ли VCO, и приходит ли на CV положительное напряжение?
        - Подними **Row 1 gain** и нажми «Проверить» ещё раз.
    faq:
      - q: Можно взять VCA Mix вместо VCA?
        a: "Для этой проверки нужен модуль VCA. В VCA Mix другие названия входов."
      - q: Звук есть при 0, хотя должна быть тишина. Почему?
        a: Скорее всего, 8vert не подключён к CV или подключён к Channel. Без кабеля в CV усилитель открыт, и звук идёт целиком.
      - q: Проверка не проходит, а звук слышен. Что смотреть?
        a: Проверь, что Row 1 gain не меньше 3 В и что кабель с 8vert идёт в CV, а не в Channel.

  - id: b10
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Row 1 gain поднят, усилитель открыт, а звука нет.
      Найди одну ошибку и исправь её одним кабелем.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: cv, plugin: Fundamental, slug: 8vert, params: { Row 1 gain: { display: "5" } } }
      - { ref: vca, plugin: Fundamental, slug: VCA-1, params: { Level: { display: "100" } } }
    cables:
      - { from: [vco, Sawtooth], to: [vca, Channel] }
      - { from: [cv, Row 1], to: [vca, CV] }
      - { from: [vca, Channel], to: [audio, "To \"device output 1\""] }
    break: { remove_cable: [vco, Sawtooth, vca, Channel] }
    check: { kind: fixed, expect_cable: [vco, Sawtooth, vca, Channel] }
    hints:
      fixed:
        - Усилитель открыт, а усиливать нечего. Какой вход принимает звук?
        - Посмотри на вход Channel у VCA. Что в него идёт?
        - Соедини `Sawtooth` у VCO со входом `Channel` у VCA.
    faq:
      - q: Как отличить «усилитель закрыт» от «звука нет на входе»?
        a: Подними Row 1 gain и убери кабель с CV. Если звук всё равно не появился, проблема на входе Channel. Если появился, дело было в управлении.
      - q: Что покажет Scope на выходе VCA?
        a: Если звука на входе нет, там ровная линия, как бы широко ни был открыт VCA. Если звук есть, но усилитель закрыт, линия тоже ровная.

  - id: b11
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - VCA умножает звук на число от 0 до 1. Число приходит напряжением на входе **CV**.
      - Без кабеля в CV усилитель открыт. Громкость тогда задаёт только **Level**.
      - **Response mode** выбирает кривую: Linear растёт ровно, Exponential внизу пологая.
      - VCA Mix — четыре VCA с общим выходом, уровни в децибелах.
      Сохрани патч: ⌘S сохраняет твою копию урока.
      **Источники:** руководство VCV Free (Fundamental), разделы VCA и VCA Mix; Gordon Reid, «Synth Secrets», ч. 9 (Sound On Sound); Perfect Circuit, «Learning Synthesis».
    questions:
      - q: Что случится со звуком, если у VCA нет кабеля на CV?
        options:
          - { text: "Звук пройдёт: усилитель открыт, громкость задаёт Level", correct: true, why: "Пустой CV считается полностью открытым. Громкость определяет только ручка Level." }
          - { text: "Звук пропадёт", why: "Это было бы так, если бы по умолчанию VCA был закрыт. В Rack он открыт." }
      - q: Когда экспоненциальная характеристика удобнее линейной?
        options:
          - { text: "Для громкости: слух не линеен, и пологий низ звучит естественнее", correct: true, why: "Слух сильнее замечает сдвиги внизу хода, чем наверху, поэтому кривая с пологим низом лучше подходит громкости." }
          - { text: "Всегда, когда нужен громкий звук", why: "Режим не делает звук громче. Он меняет форму кривой между CV и усилением." }
