id: p5-03-quantizer
num: "5.3"
part: 5
title: Квантование и минимум теории
goal: Превратить случайное плавное напряжение в ноты выбранной шкалы, чтобы мелодия не фальшивила.
builds: Основа генеративных линий и аккордов в частях 8–9. Любая мелодия сначала попадает в тональность, потом уже получается красивой.
minutes: 35
requires: [p1-03-volt-per-octave, p4-04-randomness]
glossary: [квантизатор, шкала, корневая нота, полутон как 1/12 В, случайное напряжение]
sources: [vcv-free-manual, ne-quantizers, sos-16, mi-marbles]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: Квантование и минимум теории
    page: |
      # 5.3 Квантование и минимум теории
      **Ты научишься:** округлять напряжение до нот [[шкала|шкалы]] и различать мажор и минор по полутонам.
      **Ты соберёшь:** Random → Quantizer → Octave → VCO. Случайные значения превратятся в мелодию без фальши.
      **Понадобится:** 35 минут, уроки про вольт на октаву (1.3) и случайность (4.4). Начни с тихой громкости.
      Любую мелодию нужно сначала поместить в тональность. [[Квантизатор]] делает это сам.
    figure: { template: keyboard, from: C4, to: C5, marks: [{ note: C4, volts: 0 }, { note: C5, volts: 1 }], caption: "Квантизатор оставляет напряжению только значения на клавишах выбранной шкалы." }
    faq:
      - q: Зачем округлять ноты?
        a: Случайное напряжение попадает между клавишами, и мелодия звучит «плывущей». Квантизатор подтягивает каждое значение к ближайшей ноте шкалы, поэтому мелодия звучит строго.
      - q: Нужно ли знать теорию музыки?
        a: Немного. Достаточно понять, что в октаве двенадцать полутонов, а шкала — это отбор из них. Всё нужное разберём в уроке.
      - q: Что значит «минимум теории»?
        a: "Только то, что даёт слышимый результат: полутон, шкала, корень, мажор и минор. Остальное подождёт до частей 8–9."

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса про напряжение и ноты. Ошибаться можно: ответы покажут, что разобрать.
    questions:
      - q: Какое напряжение в стандарте «вольт на октаву» соответствует одному полутону?
        free: true
        options:
          - { text: "1/12 В, около 0,083 В", correct: true, why: "Октава — 1 В, в ней 12 полутонов. Один полутон — двенадцатая часть вольта." }
          - { text: "Целый вольт", why: "Вольт — это октава, а не полутон." }
          - { text: "1/1200 В", why: "Так выглядит цент — сотая доля полутона. До полутона здесь ещё сто шагов." }
      - q: На вход квантизатора пришло значение между двумя разрешёнными нотами. Что на выходе?
        options:
          - { text: "Ближайшая разрешённая нота шкалы", correct: true, why: "Квантизатор округляет значение к ближайшему разрешённому уровню." }
          - { text: "То же значение без изменений", why: "Если бы квантизатор ничего не менял, он был бы просто кабелем." }
          - { text: "Ноль вольт", why: "Неподходящая нота не пропадает. Её подтягивают к соседней разрешённой." }
      - q: Как устроена мажорная шкала в полутонах от корня?
        options:
          - { text: "2–2–1–2–2–2–1", correct: true, why: "От C получается C D E F G A B — это белые клавиши." }
          - { text: "2–1–2–2–1–2–2", why: "Это натуральный минор. Расстояния те же, но порядок другой." }
          - { text: "Все двенадцать подряд", why: "Двенадцать подряд — хроматика, в ней нет отбора. Шкала выбирает из них часть." }

  - id: b3
    type: story
    preset: story
    title: От вольт к нотам
    page: |
      # От вольт к нотам
      В стандарте «вольт на октаву» высота — это напряжение. 0 В — нота C4, 1 В — C5.
      Один [[полутон как 1/12 В|полутон]] — 1/12 В.
      В октаве двенадцать нот. Между ними нет ничего: если подать 0,04 В, получится нота «между» C и C#, и слух сочтёт её неточной.
      Плавное напряжение, например от [[случайное напряжение|случайного источника]], почти всегда попадает в такие щели.
      [[Квантизатор]] округляет его до ближайшей разрешённой ноты.
    figure: { template: keyboard, from: C3, to: C5, marks: [{ note: C3, volts: -1 }, { note: C4, volts: 0 }, { note: C5, volts: 1 }], caption: "Каждая клавиша — своё напряжение. Квантизатор приводит вход к ближайшей разрешённой клавише." }
    simpler: Представь лестницу. Обычное напряжение — пандус, на нём можно стоять где угодно. Квантизатор превращает его в ступеньки. Встать можно только на ступеньку, и ты всегда стоишь на нужной ноте.
    faq:
      - q: Почему между нотами 0,04 В звучит «неточно»?
        a: Слух привык к двенадцати нотам строя. Полутон — 1/12 В, около 0,083 В. Значение 0,04 В лежит посередине между двумя нотами, и слух не находит в нём ноты.
      - q: Квантизатор меняет громкость или тембр?
        a: Нет. Он работает только с напряжением высоты. Звук с ним не связан, пока ты не подашь это напряжение в VCO.
      - q: Что будет, если подать на квантизатор уже ровную ноту?
        a: Она пройдёт без изменений, если разрешена шкалой. Если не разрешена, её подтянут к ближайшей разрешённой.

  - id: b4
    type: story
    preset: story
    title: Шкала и корень
    page: |
      # Шкала и корень
      [[Шкала]] — набор разрешённых нот в октаве. Её задают расстояния между нотами в полутонах от [[корневая нота|корня]].
      Мажор: 2–2–1–2–2–2–1. От C это белые клавиши, C D E F G A B.
      Натуральный минор: 2–1–2–2–1–2–2. От C это C D D# F G G# A#. Окраска мрачнее.
      Пентатоника — пять нот без полутоновых ступеней. В ней трудно взять неудачную ноту.
    figure: { template: table, rows: [["Шкала", "Полутоны", "Ноты от C"], ["Мажор", "2–2–1–2–2–2–1", "C D E F G A B"], ["Натур. минор", "2–1–2–2–1–2–2", "C D D# F G G# A#"], ["Мажор. пентатоника", "2–2–3–2–3", "C D E G A"]], caption: "Три шкалы, которые пригодятся в курсе." }
    simpler: Шкала — это набор клавиш, на которых тебе разрешено играть. Выбрал белые клавиши, и любая мелодия остаётся в ладу. Корень — клавиша, с которой начинаешь отсчёт.
    faq:
      - q: Чем мажор отличается от минора на слух?
        a: "Положением полутоновых ступеней. Третья ступень минора ниже на полутон, поэтому окраска мрачнее. Сравни на слух сам: включи сначала белые клавиши, потом шкалу от C с D# вместо E."
      - q: Что значит «корень»?
        a: Нота, с которой начинается шкала и к которой тянется мелодия. В C-мажоре корень — C. Шкалу можно сдвинуть, и корень сместится вместе с ней.
      - q: Зачем пентатоника?
        a: В ней нет соседних нот через полутон. Что бы ни выпало случайно, звучит ровно. Для первых генеративных мелодий это самая надёжная шкала.

  - id: b5
    type: live
    preset: live
    title: Случайность в строю
    page: |
      # Случайность в строю
      Случайный источник **Random** выдаёт ступеньки напряжения, **Quantizer** подтягивает их к нотам, **Octave** сдвигает всё на октаву.
      Включи белые клавиши на панели Quantizer: это C-мажор. Сравни на **Scope** два сигнала.
      Верхняя линия — случайные значения до квантизатора. Нижняя — после.
    modules:
      - { ref: rnd, plugin: Fundamental, slug: Random, params: { Internal trigger rate: { display: "2" }, Random spread: { display: "50" } } }
      - { ref: q, plugin: Fundamental, slug: Quantizer, params: { Pre-offset: { display: "0" } } }
      - { ref: oct, plugin: Fundamental, slug: Octave, params: { Shift: { display: "-1" } } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "500" } } }
    cables:
      - { from: [rnd, Stepped], to: [q, 1V/octave pitch] }
      - { from: [q, Pitch], to: [oct, 1V/octave pitch] }
      - { from: [oct, Pitch], to: [vco, 1V/octave pitch] }
      - { from: [vco, Triangle], to: [audio, "To \"device output 1\""] }
      - { from: [rnd, Stepped], to: [scope, Ch 1] }
      - { from: [q, Pitch], to: [scope, Ch 2] }
    notes:
      - { after: rnd, text: "**Stepped** держит случайное значение до следующего импульса. **Internal trigger rate** задаёт, как часто оно меняется.", targets: [{ module: rnd, output: Stepped }, { module: rnd, param: Internal trigger rate }] }
      - { after: q, text: "Нижний кабель Scope берёт **Pitch** после квантизатора: ступеньки лежат на сетке из нот.", targets: [{ module: q, output: Pitch }] }
      - { after: oct, text: "**Shift** −1 опускает мелодию на октаву, то есть вычитает 1 В.", targets: [{ module: oct, param: Shift }] }
    faq:
      - q: Звук не меняется, хотя Scope рисует ступеньки.
        a: "Проверь кабель от Octave к VCO и выход Triangle к Audio. Если они на месте, подожди: Random меняет значение с частотой 2 Гц, то есть два раза в секунду."
      - q: Какие клавиши включать на Quantizer?
        a: "Для C-мажора включи белые: C, D, E, F, G, A, B. Остальные выключи. Клавиши не ручки, их состояние видно по подсветке, а не по числу."
      - q: Почему Pre-offset стоит в нуле?
        a: Pre-offset сдвигает вход до округления. На нуле шкала применяется к значениям как есть. Подвинешь ручку, и тот же случайный источник сыграет другие ноты шкалы.

  - id: b6
    type: anatomy
    preset: anatomy
    title: Панель Quantizer
    page: |
      # Панель Quantizer
      У **Quantizer** один вход, один выход, ряд клавиш и одна ручка.
    module: { ref: q, plugin: Fundamental, slug: Quantizer }
    notes:
      - { text: "Вход высоты принимает любое напряжение, обычно плавное или случайное.", targets: [{ module: q, input: 1V/octave pitch }] }
      - { text: "Выход **Pitch** отдаёт то же напряжение, но только на разрешённых нотах.", targets: [{ module: q, output: Pitch }] }
      - { text: "Двенадцать клавиш на панели включают и исключают ноты. Белые клавиши C D E F G A B — это C-мажор." }
      - { text: "**Pre-offset** — сдвиг входа до округления, от −12 до 12 полутонов. Подвинь, чтобы мелодия попала на другие ноты шкалы.", targets: [{ module: q, param: Pre-offset }] }
    later:
      - { what: "Тональность для всех партий трека", lesson: "9.3" }
    faq:
      - q: Клавиши Quantizer не крутятся, как ручки. Это нормально?
        a: "Да. Это кнопки-переключатели: нажатая клавиша включает ноту, отжатая выключает. Состояние видно по подсветке. Курс читает их с панели, а не из параметров."
      - q: Что будет, если выключить все клавиши?
        a: Квантизатору не из чего выбирать, и он перестаёт давать ноты. Оставь хотя бы одну клавишу включённой.
      - q: Как сменить тональность?
        a: Сдвинь набор клавиш. Белые клавиши — C-мажор, сдвинутые на два полутона дают D-мажор с двумя диезами. Pre-offset тональность не меняет, он двигает вход до округления.

  - id: b7
    type: anatomy
    preset: anatomy
    title: Панель Octave
    page: |
      # Панель Octave
      **Octave** сдвигает высоту на целое число октав. Нотам он строй не ломает.
    module: { ref: oct, plugin: Fundamental, slug: Octave }
    notes:
      - { text: "Вход высоты принимает напряжение, выход **Pitch** отдаёт его со сдвигом.", targets: [{ module: oct, input: 1V/octave pitch }, { module: oct, output: Pitch }] }
      - { text: "**Shift** — сдвиг от −4 до 4 октав, целыми числами. Каждая октава — 1 В.", targets: [{ module: oct, param: Shift }] }
      - { text: "Вход **Octave shift CV** сдвигает мелодию напряжением, например от секвенсора.", targets: [{ module: oct, input: Octave shift CV }] }
    faq:
      - q: Почему Octave ставят после Quantizer?
        a: Сдвиг на целое число вольт не выводит ноту из строя, поэтому после квантизатора сетка остаётся целой. Порядок «источник, квантизатор, октава, VCO» проще читать.
      - q: Чем Octave отличается от ручки Frequency у VCO?
        a: Frequency плавно двигает всю высоту. Octave прибавляет ровно целые вольты, поэтому тональность не уезжает.

  - id: b8
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Поставь **Internal trigger rate** у Random на 0,5 Гц, потом на 4 Гц."
        see: "Ноты меняются чаще, на Scope ступеньки идут гуще."
      - do: "Оставь на панели Quantizer только клавиши C, E и G."
        see: "Мелодия состоит из трёх нот, на нижней линии Scope три уровня."
      - do: "Поверни **Pre-offset** у Quantizer от 0 до 5."
        see: "Тот же случайный источник играет другие ноты шкалы."
      - do: "Поменяй **Shift** у Octave с −2 на 2."
        see: "Вся мелодия сдвигается ровно на октаву, ступеньки на Scope смещаются на 1 В."
      - do: "Вытащи кабель Quantizer → Octave и подай Stepped прямо в Octave."
        see: "Ноты уплывают с сетки: слышна фальшь, а уровни на Scope произвольные."
    modules:
      - { ref: rnd, plugin: Fundamental, slug: Random, params: { Internal trigger rate: { display: "2" }, Random spread: { display: "50" } } }
      - { ref: q, plugin: Fundamental, slug: Quantizer, params: { Pre-offset: { display: "0" } } }
      - { ref: oct, plugin: Fundamental, slug: Octave, params: { Shift: { display: "-1" } } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "500" } } }
    cables:
      - { from: [rnd, Stepped], to: [q, 1V/octave pitch] }
      - { from: [q, Pitch], to: [oct, 1V/octave pitch] }
      - { from: [oct, Pitch], to: [vco, 1V/octave pitch] }
      - { from: [vco, Triangle], to: [audio, "To \"device output 1\""] }
      - { from: [rnd, Stepped], to: [scope, Ch 1] }
      - { from: [q, Pitch], to: [scope, Ch 2] }
    notes:
      - { after: q, text: "Шаги 2 и 3 — клавиши и ручка Quantizer.", targets: [{ module: q, param: Pre-offset }] }
    faq:
      - q: Я оставил C, E и G, а звучат другие ноты.
        a: Возможно, ты слышишь после сдвига Octave. Ноты те же, но октавой выше или ниже. Проверь Shift, на 0 октава исходная.
      - q: Когда подал Stepped прямо в Octave, ничего не сломалось?
        a: Не сломалось. Просто пропал квантизатор, и мелодия идёт без сетки. Так удобнее всего услышать, что именно он делает.
      - q: Pre-offset на 5 дал почти те же ноты. Почему?
        a: Сдвиг на 5 полутонов переносит выборку, а шкала остаётся той же. Часть значений просто падает на соседние клавиши, поэтому разница слышна не сразу.

  - id: b9
    type: practice
    preset: practice
    title: Практика — мелодия в тональности
    task: |
      Собери мелодию в тональности сам, между маркерами «Верстак».
      1. **Random**, **Quantizer**, **Octave**, **VCO**. Internal trigger rate — не ниже 1 Гц.
      2. Высота: `Stepped` → `1V/octave pitch` у Quantizer, `Pitch` → `1V/octave pitch` у Octave, `Pitch` → `1V/octave pitch` у VCO.
      3. Звук: `Triangle` у VCO → вход 1 у Audio.
      4. На панели Quantizer оставь только белые клавиши (C-мажор).
      5. Нажми «Проверить».
    given: [audio]
    check: p5-03-quantizer
    hints:
      "module:rnd":
        - Нужен источник случайных значений.
        - Случайный генератор из набора Fundamental.
        - "Поставь на верстак **Random**."
      "module:q":
        - Нужен квантизатор.
        - Он округляет высоту до нот шкалы, набор Fundamental.
        - "Поставь на верстак **Quantizer**."
      "module:oct":
        - Нужен сдвиг по октавам.
        - Модуль называется как единица, на которую он сдвигает.
        - "Поставь на верстак **Octave**."
      "module:vco":
        - Нужен источник звука.
        - Осциллятор из набора Fundamental.
        - "Поставь на верстак **VCO**."
      "module:out":
        - Нужен выход звука.
        - Модуль Audio уже стоит в ряду.
        - "Не убирай Audio из ряда и подключай кабель к его первому входу."
      "cable:1":
        - Случайные значения не идут в квантизатор.
        - Какой выход Random даёт ступеньки?
        - "`Stepped` у Random → `1V/octave pitch` у Quantizer."
      "cable:2":
        - Квантизатор не связан с Octave.
        - Какой выход Quantizer даёт ноты шкалы?
        - "`Pitch` у Quantizer → `1V/octave pitch` у Octave."
      "cable:3":
        - Октавный сдвиг не доходит до VCO.
        - Куда подаётся высота у VCO?
        - "`Pitch` у Octave → `1V/octave pitch` у VCO."
      "cable:4":
        - Тишина.
        - Какой выход VCO идёт на звук?
        - "`Triangle` у VCO → `To \"device output 1\"` у Audio этого ряда."
      "param:1":
        - Ноты меняются слишком редко.
        - Посмотри на ручку Internal trigger rate у Random.
        - Подними Internal trigger rate хотя бы до 1 Гц.
      "probe:1":
        - Высота не меняется.
        - Идут ли ступеньки с Random и не стоит ли Internal trigger rate на минимуме?
        - Подними Internal trigger rate до 1–2 Гц и проверь, что кабель Stepped идёт в Quantizer.
    faq:
      - q: Как понять, что шкала выбрана правильно?
        a: "Послушай несколько нот подряд. В C-мажоре среди них не бывает «чёрных» нот: звучит ровно, без резких диссонансов. Выключи лишние клавиши и убедись, что горят только белые."
      - q: Проверка проходит, а мелодия фальшивит.
        a: "Проверка не видит клавиши Quantizer. Проверь панель сам: должны гореть только C, D, E, F, G, A, B."
      - q: Нужен ли кабель Random к Scope?
        a: Нет, только если хочешь смотреть на сигнал. Для проверки он не нужен.

  - id: b10
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Мелодия застыла на одной ноте: Random меняет значения, а высота не двигается.
      Найди одну ошибку и исправь её одним кабелем.
    modules:
      - { ref: rnd, plugin: Fundamental, slug: Random, params: { Internal trigger rate: { display: "2" }, Random spread: { display: "50" } } }
      - { ref: q, plugin: Fundamental, slug: Quantizer, params: { Pre-offset: { display: "0" } } }
      - { ref: oct, plugin: Fundamental, slug: Octave, params: { Shift: { display: "-1" } } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
    cables:
      - { from: [rnd, Stepped], to: [q, 1V/octave pitch] }
      - { from: [q, Pitch], to: [oct, 1V/octave pitch] }
      - { from: [oct, Pitch], to: [vco, 1V/octave pitch] }
      - { from: [vco, Triangle], to: [audio, "To \"device output 1\""] }
    break: { remove_cable: [q, Pitch, oct, 1V/octave pitch] }
    check: { kind: fixed, expect_cable: [q, Pitch, oct, 1V/octave pitch] }
    hints:
      fixed:
        - Высота не двигается. Дойдёт ли случайное значение до VCO?
        - Посмотри на вход высоты у Octave. Что должно приходить на него от квантизатора?
        - "Соедини `Pitch` у Quantizer с `1V/octave pitch` у Octave."
    faq:
      - q: Почему высота застыла, хотя Random работает?
        a: Без кабеля вход высоты у Octave получает 0 В, и VCO играет одну ноту. Случайные значения доходят только до квантизатора, дальше цепь разорвана.
      - q: А если подать Stepped прямо в Octave?
        a: Мелодия вернётся, но ноты не будут подтянуты к сетке, и звучать она станет неточно. Правильный путь — через Quantizer.

  - id: b11
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - [[Квантизатор]] округляет напряжение высоты до ближайшей разрешённой ноты.
      - Полутон — 1/12 В, октава — 1 В.
      - [[Шкала]] — отбор нот. Мажор: 2–2–1–2–2–2–1, натуральный минор: 2–1–2–2–1–2–2.
      - Octave ставят после Quantizer: целый вольт не выводит ноту из строя.
      Сохрани патч: он пригодится для генеративных линий в части 9.
      **Источники:** руководство VCV Free (Quantizer); Noise Engineering, «Getting Started: Quantizers»; Sound On Sound, «Synth Secrets»; руководство Marbles (Mutable Instruments).
    questions:
      - q: Что делает квантизатор с напряжением между двумя нотами?
        options:
          - { text: "Подтягивает его к ближайшей разрешённой ноте", correct: true, why: "Он округляет значение до уровня, которым шкала разрешает играть." }
          - { text: "Пропускает без изменений", why: "Тогда он бы ничем не помогал. Его задача — убрать неточные значения." }
          - { text: "Обнуляет значение", why: "Тишина и нулевая нота — разные вещи. Квантизатор выбирает ближайшую ноту, а не обнуляет." }
      - q: Зачем Octave ставят после Quantizer?
        options:
          - { text: "Целый вольт не сдвигает ноты с сетки", correct: true, why: "Октава — ровно 1 В, и значения после сдвига остаются в строю." }
          - { text: "Иначе звук станет громче", why: "Октава меняет высоту, а не громкость." }
          - { text: "Так требует VCO", why: "VCO принимает высоту откуда угодно. Порядок нужен, чтобы шкала применялась к исходным значениям." }
