    faq:
      - q: Какую шкалу выбрать для первой мелодии?
        a: "Мажорную пентатонику: в ней нет нот через полутон, и случайные значения звучат ровно. Потом переходи на мажор и минор."
      - q: Что повторить, если мелодия фальшивит?
        a: Проверь, что Stepped идёт в Quantizer, а не мимо него, и что на панели включены нужные клавиши. Затем вернись к уроку 1.3.
