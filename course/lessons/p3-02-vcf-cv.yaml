id: p3-02-vcf-cv
num: "3.2"
part: 3
title: VCF под управлением
goal: Двигать частоту среза напряжением, привязать тембр к высоте ноты и заставить фильтр звучать самому.
builds: «Вау»-свипы и фильтр-кик из урока 8.1. Те же приёмы работают в басе и в лиде.
minutes: 30
requires: [p3-01-vcf, p1-04-knob-cv]
glossary: [модуляция среза, отслеживание клавиш, самогенерация фильтра, резонанс, частота среза, 1V/oct, LFO, CV]
sources: [sos-06, sos-34, vcv-free-manual]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: Фильтр под управлением
    page: |
      # 3.2 VCF под управлением
      **Ты научишься:** двигать [[частота среза|частоту среза]] напряжением, связывать яркость с высотой ноты и слышать, как фильтр поёт сам.
      **Ты соберёшь:** [[LFO]] → 8vert → VCF — «сирену», где фильтр звучит без входного сигнала.
      **Понадобится:** 30 минут, тихая громкость: самогенерация бывает резкой.
      Ручка среза — тоже «ручка на проводе». Её можно крутить кабелем.
    figure: { template: flow, layout: row, nodes: [{ id: lfo, label: LFO, kind: cv }, { id: cv, label: 8vert, kind: cv }, { id: vcf, label: VCF, kind: audio }, { id: out, label: Audio, kind: audio }], edges: [{ from: lfo, to: cv, kind: cv }, { from: cv, to: vcf, kind: cv }, { from: vcf, to: out, kind: audio }], caption: Управление идёт пунктиром и попадает на вход Frequency у VCF. }
    faq:
      - q: Зачем двигать срез, если можно покрутить ручку?
        a: Рука одна, а нот много. Кабель двигает срез сам, в такт и плавно. Так появляются «вау»-свипы, и на этом строится бас из части 8.
      - q: Что такое самогенерация и почему она не ломает фильтр?
        a: При высоком резонансе фильтр начинает звучать сам, как генератор синуса. Он не ломается. Это нормальный режим, им пользуются для кика и необычных звуков.
      - q: Звук будет громким?
        a: Самогенерация может быть резкой. Начни с тихой громкости и подними её, когда услышишь тон. Демо звучит только в активном ряду.

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса до объяснений. Ответы покажут, на что смотреть в уроке.
    questions:
      - q: На вход Frequency у VCF идёт кабель от LFO, но срез не качается. Что проверить первым?
        free: true
        options:
          - { text: "Ручку Cutoff frequency CV", correct: true, why: "При нуле на этой ручке вход Frequency не действует. Сила воздействия задаётся ею." }
          - { text: "Громкость на Audio", why: "Громкость и качание среза — разные вещи. Нет качания — значит, до среза не доходит управление." }
          - { text: "Выход LFO: нужен Square", why: "Подойдёт любая форма. Если срез стоит на месте, дело в количестве, а не в форме сигнала." }
      - q: Нота выросла на две октавы, а фильтр остался на месте. Что с тембром?
        options:
          - { text: "Звук потемнеет относительно ноты", correct: true, why: "Гармоники ушли вверх, а срез остался внизу. Ярких призвуков стало меньше." }
          - { text: "Ничего, тембр зависит только от среза", why: "Тембр зависит и от того, где лежат гармоники. Они двигаются вместе с нотой, срез нет." }
          - { text: "Звук станет громче", why: "Срез управляет яркостью, а не громкостью. Громкость решает VCA." }
      - q: На вход Audio у VCF нет кабеля, а Resonance почти на максимуме. Что возможно?
        options:
          - { text: "Фильтр звучит сам", correct: true, why: "Это самогенерация. Тон задаёт частота среза." }
          - { text: "Тишина: фильтр без входа молчит всегда", why: "Обычно так, но при высоком резонансе фильтр сам превращается в генератор синуса." }
          - { text: "Слышен шум", why: "Шум придёт из другого модуля. Самогенерация — это чистый синус, а не шипение." }

  - id: b3
    type: story
    preset: story
    title: Срез на проводе
    page: |
      # Срез на проводе
      Ты уже управлял высотой VCO напряжением: плюс 1 В — нота на октаву выше. С частотой среза работает то же правило.
      Вход **Frequency** у VCF принимает управление. Плюс 1 В поднимает срез на октаву, если ручка **Cutoff frequency CV** стоит на 100 %.
      Эта ручка — «громкость» для кабеля. На 0 кабель не слышен, на 100 % слышен полностью, ниже нуля — переворачивает.
      Это [[модуляция среза]]. Источником может быть [[LFO]], огибающая или ручка.
    figure: { template: filter, type: lp, cutoff: 1500, resonance: 0.3, caption: Срез ездит вправо и влево. Яркость звука ходит за ним. }
    simpler: Представь регулятор громкости на гитарной педали и ногу, которая его качает. Нога — это LFO, регулятор — срез. Ручка CV решает, насколько сильно нога давит на педаль.
    faq:
      - q: Почему «ручка CV» нужна, если кабель уже подключён?
        a: Кабель только приносит напряжение. Ручка Cutoff frequency CV решает, сколько из него дойдёт до среза. Пока она на нуле, срез стоит на месте.
      - q: Что значит CV 100 % для 1 В?
        a: Один вольт на входе Frequency сдвигает срез ровно на октаву. На 50 % сдвиг вдвое меньше — полоктавы. Отрицательные значения сдвигают в другую сторону.
      - q: LFO качает срез. А звук не пропадает?
        a: Пропасть может, если срез уходит ниже ноты. Подними базовый Cutoff frequency или уменьши CV. Тогда фильтр качается над нотой, а не под ней.

  - id: b4
    type: story
    preset: story
    title: Тембр за нотой и фильтр-синус
    page: |
      # Тембр за нотой
      Подними ноту на две октавы, и гармоники уйдут вверх. Срез остался: звук потемнел.
      Решение — [[отслеживание клавиш]]. Тот же CV, что двигает VCO по [[1V/oct]], подаёшь и на **Frequency**. Срез растёт вместе с нотой, яркость остаётся прежней.
      CV на ручке ставь около 100 %.
    page2: |
      # Фильтр-синус
      Подними **Resonance** почти до максимума и отключи вход **Audio**. Фильтр запоёт сам: это [[самогенерация фильтра]].
      Тон — частота среза. Меняй её ручкой или напряжением на **Frequency**.
      Короткая огибающая, которая «пинает» такой фильтр, даёт основу для кика. Подробнее — в части 8.
    figure: { template: filter, type: lp, cutoff: 600, resonance: 0.95, caption: Резонанс почти на максимуме. Пик превращается в самостоятельный тон. }
    simpler: Самогенерация похожа на бокал, у которого ты ведёшь пальцем по краю. Бокал не получает звука, но звучит сам. Фильтр тоже звенит на своей частоте, если разогнать резонанс.
    faq:
      - q: Как понять, что отслеживание клавиш работает?
        a: Подними ноту на пару октав. Если яркость примерно та же, срез идёт за нотой. Если звук глохнет, кабель с высотой до Frequency не дошёл или CV на нуле.
      - q: Фильтр не звучит без входа. Что подкрутить?
        a: Подними Resonance ближе к максимуму. Если тишина осталась, подай на вход Audio короткий звук на секунду — он «разбудит» фильтр. Потом кабель можно убрать.
      - q: Самогенерация опасна для динамиков?
        a: Тон ровный и громкий, поэтому начинай тихо. Уровень задаёт Level у Audio. Если слух устал, убавь Resonance.

  - id: b5
    type: live
    preset: live
    title: Вау-эффект
    page: |
      # Вау-эффект
      LFO качает срез у VCF. Пила идёт через фильтр, на Scope виден размах.
      Подними **Cutoff frequency CV** от 0 к 60 %. Качание сильнее, звук «дышит».
      Потом поверни **Frequency** у LFO: от медленного к быстрому.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "130.81" } } }
      - { ref: lfo, plugin: Fundamental, slug: LFO, params: { Frequency: { display: "2" } } }
      - { ref: vcf, plugin: Fundamental, slug: VCF, params: { Cutoff frequency: { display: "500" }, Resonance: { display: "30" }, Cutoff frequency CV: { display: "30" } } }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "500" } } }
    cables:
      - { from: [vco, Sawtooth], to: [vcf, Audio] }
      - { from: [lfo, Sine], to: [vcf, Frequency] }
      - { from: [vcf, Lowpass filter], to: [scope, Ch 1] }
      - { from: [vcf, Lowpass filter], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: lfo, text: "**Frequency** — как быстро качается срез. Сейчас 2 Гц.", targets: [{ module: lfo, param: Frequency }] }
      - { after: vcf, text: "**Cutoff frequency CV** — сила кабеля. Подними от 0.", targets: [{ module: vcf, param: Cutoff frequency CV }, { module: vcf, input: Frequency }] }
    faq:
      - q: Я подвинул Cutoff frequency CV, а качания не слышно. Почему?
        a: Скорее всего, база среза слишком высокая или низкая. Поставь Cutoff frequency около 500 Гц, и качание станет заметным. Проверь также, что кабель LFO идёт именно во Frequency.
      - q: Быстрый LFO превращает «вау» в «жужжание». Это нормально?
        a: Да. Выше десятка герц модуляция сама становится слышимой и меняет тембр, а не двигает его. Верни LFO к 1–5 Гц, чтобы услышать свип.
      - q: Почему на Scope картина меняется?
        a: Амплитуда пилы за фильтром зависит от среза. Когда срез выше, проходит больше гармоник, и размах растёт. Когда ниже, остаётся основной тон.

  - id: b6
    type: live
    preset: live
    title: Фильтр звучит сам
    page: |
      # Фильтр звучит сам
      На вход **Audio** ничего не приходит, а **Resonance** почти на максимуме. Фильтр звучит как синус.
      Меняй **Row 1 gain** у 8vert от 0 до 2 В. Каждый вольт — октава вверх по тону.
      Если тишина, подними **Resonance** чуть выше.
    modules:
      - { ref: cv, plugin: Fundamental, slug: 8vert, params: { Row 1 gain: { display: "0" } } }
      - { ref: vcf, plugin: Fundamental, slug: VCF, params: { Cutoff frequency: { display: "261.63" }, Resonance: { display: "95" }, Cutoff frequency CV: { display: "100" } } }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "5" } } }
    cables:
      - { from: [cv, Row 1], to: [vcf, Frequency] }
      - { from: [vcf, Lowpass filter], to: [scope, Ch 1] }
      - { from: [vcf, Lowpass filter], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: cv, text: "**Row 1 gain** без кабеля на входе — это вольты. 1 В — октава.", targets: [{ module: cv, param: Row 1 gain }] }
      - { after: vcf, text: "**Resonance** почти на максимуме. **Audio** свободен.", targets: [{ module: vcf, param: Resonance }, { module: vcf, input: Audio }] }
    figure: { template: filter, type: lp, cutoff: 261, resonance: 0.95, caption: Пик в 261,63 Гц звучит сам. 1 В на Frequency сдвигает его на октаву. }
    faq:
      - q: Почему нет звука, хотя Resonance 95 %?
        a: Фильтр иногда стартует не сразу. Подними Resonance до 100 % или на секунду подай на Audio любой звук от VCO. После этого он держится сам.
      - q: Это настоящий синус?
        a: Почти. На Scope виден ровный синус. Он звучит чище, чем синус у VCO, потому что у фильтра нет гармоник совсем.
      - q: Как играть мелодию таким фильтром?
        a: Подавай на Frequency 1V/oct от клавиатуры или секвенсора. Срез повторит ноту, как VCO. Так делают тоны для кика и басовых нот.

  - id: b7
    type: anatomy
    preset: anatomy
    title: VCF — входы управления
    page: |
      # VCF — входы управления
      Знакомая панель, но теперь про вход Frequency и ручки CV.
    module: { ref: vcf, plugin: Fundamental, slug: VCF }
    notes:
      - { text: "Вход **Frequency** принимает управление срезом. Работает по 1V/oct.", targets: [{ module: vcf, input: Frequency }] }
      - { text: "**Cutoff frequency CV** — ослабитель и инвертор для Frequency: от −100 до +100 %.", targets: [{ module: vcf, param: Cutoff frequency CV }] }
      - { text: "**Cutoff frequency** — база среза. Управление добавляется к ней.", targets: [{ module: vcf, param: Cutoff frequency }] }
      - { text: "**Resonance** у максимума без сигнала на **Audio** запускает самогенерацию.", targets: [{ module: vcf, param: Resonance }, { module: vcf, input: Audio }] }
      - { text: "Входы **Resonance** и **Drive** работают так же, у каждого своя ручка CV.", targets: [{ module: vcf, input: Resonance }, { module: vcf, input: Drive }, { module: vcf, param: Resonance CV }, { module: vcf, param: Drive CV }] }
    later:
      - { what: "Огибающая на срез", lesson: "3.4" }
      - { what: "Свипы LFO", lesson: "4.1" }
    faq:
      - q: Вход Resonance и ручка Resonance — одно и то же?
        a: Нет. Ручка задаёт значение. Вход принимает напряжение, и ручка Resonance CV решает, сколько из него использовать. Названия совпадают, смысл разный.
      - q: Зачем минус у Cutoff frequency CV?
        a: Минус переворачивает управление. Когда напряжение растёт, срез идёт вниз. Так делают «закрывающийся» свип.
      - q: Что будет, если подать звук, а не CV, на Frequency?
        a: Срез начнёт дёргаться со скоростью звука и добавит новые гармоники. Для начала подавай медленное CV от LFO или 8vert.

  - id: b8
    type: anatomy
    preset: anatomy
    title: 8vert — источник напряжения
    page: |
      # 8vert — источник напряжения
      Ты уже знаешь 8vert по уроку 1.4. Здесь он даёт фильтру точное число вольт.
    module: { ref: cv, plugin: Fundamental, slug: 8vert }
    notes:
      - { text: "Вход **Row 1** принимает сигнал, выход **Row 1** отдаёт его дальше.", targets: [{ module: cv, input: Row 1 }, { module: cv, output: Row 1 }] }
      - { text: "**Row 1 gain** без кабеля на входе — постоянное напряжение. Ручка показывает вольты.", targets: [{ module: cv, param: Row 1 gain }] }
      - { text: "С кабелем на входе ручка ослабляет сигнал и показывает проценты.", targets: [{ module: cv, param: Row 1 gain }] }
      - { text: "Ряды 2–8 работают так же. Один выход — один кабель или несколько.", targets: [{ module: cv, output: Row 2 }] }
    faq:
      - q: Почему у ручки то вольты, то проценты?
        a: Без входа Row 1 — это источник, ручка задаёт напряжение. С кабелем на входе Row 1 — ослабитель, ручка задаёт долю сигнала. Единицы меняются сами.
      - q: Сколько градусов поворота — это 1 В?
        a: Шкала на ручке идёт от −10 до +10 В. Читай число под ручкой, а не угол. Пользуйся стрелками или вводом числа.
      - q: Можно ли вывести один Row на два кабеля?
        a: Можно. Один выход идёт сразу на VCO и на VCF. Так делают отслеживание клавиш.

  - id: b9
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Поверни **Frequency** у LFO от медленной к быстрой при **Cutoff frequency CV** 50 %."
        see: "Качание превращается в дрожь, потом в жужжание."
      - do: "Поставь **Cutoff frequency CV** на −50 %."
        see: "Направление качания переворачивается. На Scope размах меняется в противофазе."
      - do: "Подними **Resonance** до 80 % при медленном LFO."
        see: "Пик [[резонанс|резонанса]] ходит за срезом. На высоких значениях слышен свист."
      - do: "Подними **Resonance** до 90 % и отключи кабель от входа **Audio** у VCF."
        see: "Звук остаётся: фильтр звучит сам. Ручка **Cutoff frequency** двигает его высоту."
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "130.81" } } }
      - { ref: lfo, plugin: Fundamental, slug: LFO, params: { Frequency: { display: "2" } } }
      - { ref: vcf, plugin: Fundamental, slug: VCF, params: { Cutoff frequency: { display: "500" }, Resonance: { display: "30" }, Cutoff frequency CV: { display: "50" } } }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "500" } } }
    cables:
      - { from: [vco, Sawtooth], to: [vcf, Audio] }
      - { from: [lfo, Sine], to: [vcf, Frequency] }
      - { from: [vcf, Lowpass filter], to: [scope, Ch 1] }
      - { from: [vcf, Lowpass filter], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: vcf, text: "Шаги 2–4 — ручки и вход этого VCF.", targets: [{ module: vcf, param: Cutoff frequency CV }, { module: vcf, param: Resonance }] }
    faq:
      - q: После шага 3 слышен свист. Это нормально?
        a: Да. При Resonance около 100 % фильтр звучит сам поверх пилы. Опусти Resonance до 70 %, если свист мешает слушать качание.
      - q: На шаге 4 звук не остаётся после отключения Audio. Почему?
        a: Резонанс ещё недостаточно высокий. Подними Resonance до 95–100 %. Если тихо, на секунду верни кабель на Audio и снова убери.

  - id: b10
    type: practice
    preset: practice
    title: Практика — сирена
    task: |
      Собери «сирену» сам, между маркерами «Верстак».
      1. **LFO**, **8vert** и **VCF**.
      2. `Triangle` у LFO → вход `Row 1` у 8vert, выход `Row 1` → вход `Frequency` у VCF.
      3. Выход `Lowpass filter` → вход 1 у Audio. Вход `Audio` у VCF оставь свободным.
      4. **Resonance** — не меньше 80 %, **Cutoff frequency CV** — не меньше 80 %.
      5. **Row 1 gain** — от 10 до 40 %: при LFO на входе ручка показывает проценты.
      Нажми «Проверить».
    given: [audio]
    check: p3-02-vcf-cv
    hints:
      "cable:1":
        - Откуда берётся качание?
        - Какой выход LFO даёт плавный треугольник и куда его подать?
        - "`Triangle` у LFO → вход `Row 1` у 8vert."
      "cable:2":
        - Управление не доходит до фильтра.
        - Какой вход VCF отвечает за частоту среза?
        - "Выход `Row 1` у 8vert → вход `Frequency` у VCF."
      "cable:3":
        - Фильтр поёт, но слушать нечем.
        - Из какого выхода VCF звук идёт к Audio?
        - "`Lowpass filter` у VCF → `To \"device output 1\"` у Audio этого ряда."
      "param:1":
        - Почему не слышно свиста?
        - Сколько процентов у Resonance сейчас?
        - Поставь **Resonance** не меньше 80 %.
      "param:2":
        - Что делает ручка Cutoff frequency CV?
        - Сколько процентов на ней сейчас?
        - Поставь **Cutoff frequency CV** не меньше 80 %.
      "param:3":
        - На сколько октав качает фильтр?
        - Сколько процентов под ручкой Row 1 gain, пока на входе LFO?
        - "Поставь **Row 1 gain** от 10 до 40 %: треугольник 0…10 В даст качание на 1–4 октавы."
      "probe:1":
        - Напряжение на выходе 8vert не качается.
        - Идёт ли кабель от LFO в 8vert, и не стоит ли Row 1 gain на нуле?
        - "Проверь кабель `Triangle` → `Row 1` и подними **Row 1 gain** до 10 % и выше."
      "probe:2":
        - Фильтр молчит.
        - Поднял ли ты Resonance почти до максимума, и не на нуле ли CV?
        - Подними Resonance, а при тишине на секунду подай на `Audio` у VCF пилу или шум от VCO.
    faq:
      - q: Row 1 gain показывает проценты, а не вольты. Это ошибка?
        a: Нет. С кабелем на входе Row 1 ручка ослабляет сигнал и считает в процентах. Без кабеля она показывала бы вольты.
      - q: Фильтр не поёт, хотя Resonance 90 %. Что делать?
        a: Подними Resonance ближе к 100 %. Если тихо, на секунду подай на Audio любую пилу, затем убери кабель. Проверка не требует кабеля на Audio.
      - q: Нужно ли подключать Scope?
        a: Не нужно, но полезно. Подключи выход Lowpass filter к Scope и смотри синус, который качается по высоте.

  - id: b11
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Этот патч должен качать фильтр, но звук стоит на месте.
      Найди одну ошибку и исправь её одним кабелем.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "130.81" } } }
      - { ref: lfo, plugin: Fundamental, slug: LFO, params: { Frequency: { display: "2" } } }
      - { ref: cv, plugin: Fundamental, slug: 8vert, params: { Row 1 gain: { raw: 0.3 } } }
      - { ref: vcf, plugin: Fundamental, slug: VCF, params: { Cutoff frequency: { display: "500" }, Resonance: { display: "30" }, Cutoff frequency CV: { display: "60" } } }
    cables:
      - { from: [vco, Sawtooth], to: [vcf, Audio] }
      - { from: [lfo, Triangle], to: [cv, Row 1] }
      - { from: [cv, Row 1], to: [vcf, Frequency] }
      - { from: [vcf, Lowpass filter], to: [audio, "To \"device output 1\""] }
    break: { remove_cable: [cv, Row 1, vcf, Frequency] }
    check: { kind: fixed, expect_cable: [cv, Row 1, vcf, Frequency] }
    hints:
      fixed:
        - LFO качает, а фильтр не реагирует. Что стоит между ними?
        - Проследи выход Row 1 у 8vert. Куда он идёт?
        - Соедини выход `Row 1` у 8vert со входом `Frequency` у VCF.
    faq:
      - q: Почему тут важны оба кабеля, LFO и Row 1?
        a: Первый кабель несёт качание в 8vert, второй приносит его на срез. Если оборван любой, фильтр стоит на месте.
      - q: Как понять, что управление не доходит?
        a: Подними Cutoff frequency CV и послушай. Если звук неподвижен, входу Frequency нечего принимать. Проследи кабель от выхода источника до входа.

  - id: b12
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - Срез двигается напряжением через вход **Frequency**. 1 В — октава при CV 100 %.
      - **Cutoff frequency CV** — «громкость» кабеля. Минус переворачивает управление.
      - Если подать на Frequency высоту ноты, яркость идёт за нотой.
      - Почти максимум резонанса без входа на Audio — фильтр звучит как синус.
      Сохрани патч как `vcv-3.2.vcv`.
      **Источники:** Gordon Reid, «Synth Secrets», ч. 6 и ч. 34 (Sound On Sound); руководство VCV Free (Fundamental), раздел VCF.
    questions:
      - q: Как сделать, чтобы яркость сохранялась на любых нотах?
        options:
          - { text: "Подать высоту ноты и на Frequency у VCF", correct: true, why: "Срез растёт вместе с нотой, и набор гармоник остаётся тем же." }
          - { text: "Поднять Resonance", why: "Резонанс добавляет пик возле среза. На зависимость яркости от ноты он не влияет." }
      - q: Что нужно для самогенерации?
        options:
          - { text: "Resonance почти на максимуме и свободный вход Audio", correct: true, why: "Без входного сигнала и при высоком резонансе фильтр сам превращается в генератор синуса." }
          - { text: "Cutoff frequency на минимуме", why: "На минимуме тон будет очень низкий и тихий. Самогенерации нужен резонанс." }
    next: |
      # Дальше: 3.3
      **VCA.** Громкость тоже управляется напряжением. Звук появится только когда усилитель открыт.
    faq:
      - q: Что повторить, если фильтр не качается?
        a: Урок 1.4 про ручки и CV. Чаще всего ручка Cutoff frequency CV стоит на нуле, и кабель не слышен.
      - q: Что дальше делать с самогенерирующим фильтром?
        a: В уроке 8.1 ты соберёшь из него кик. Короткая огибающая «пнёт» срез, и тон упадёт вниз, как у барабана.
