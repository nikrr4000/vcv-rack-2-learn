  - id: b12
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - Стерео — два канала. Разные сигналы слева и справа дают положение.
      - **Fade** разводит две партии: Crossfade слева — на своих местах, посередине — в обоих поровну.
      - **Mid/Side** делит звук на центр и бок. Ширина — усиление бока, в нуле остаётся моно.
      - Расширять можно только то, что различается слева и справа. Сначала разведи, потом расширяй.
      Сохрани патч как `vcv-7.4.vcv`.
      **Источники:** руководство VCV Free (Fundamental), раздел Mid/Side. Noise Engineering, «Getting Started: Mixers». Omri Cohen, курс «VCAs in the Modular Environment with VCV Rack 2».
    questions:
      - q: Почему Decoder width не расширит моно-сигнал?
        options:
          - { text: "В моно нет различия каналов, бок пуст", correct: true, why: "Ширина усиливает бок. Если левый и правый равны, бока нет, и усиливать нечего." }
          - { text: "Decoder width действует только на низкие частоты", why: "Ширина не зависит от частоты. Она усиливает разность каналов." }
          - { text: "Нужно сначала включить реверберацию", why: "Реверберация не нужна. Достаточно развести партии." }
    next: |
      # Дальше: 7.5
      **Запись в файл.** Ты запишешь свой патч в WAV и проверишь, что уровень не перегружен.
    faq:
      - q: Что повторить, если картинка не расширяется?
        a: Проверь, что партии разные и разведены Fade. На одинаковых каналах Mid/Side ничего не изменит. Потом посмотри на Decoder width.
      - q: Какой материал по теме использовать дальше?
        a: Руководство VCV Free описывает Fade и Mid/Side. Остальное в курсе собрано из общих идей про панораму и микшер.
