      - { from: [fade, Ch 1], to: [ms, Encoder left] }
      - { from: [fade, Ch 2], to: [ms, Encoder right] }
      - { from: [ms, Decoder left], to: [audio, "To \"device output 1\""] }
      - { from: [ms, Decoder right], to: [audio, "To \"device output 2\""] }
