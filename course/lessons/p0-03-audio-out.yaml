id: p0-03-audio-out
num: "0.3"
part: 0
title: "Звук наружу"
goal: "Услышать первый звук из VCO через Audio 2, выбрать драйвер, устройство, частоту дискретизации и размер блока, включить звук безопасно."
builds: "Выход любого инструмента курса. Каждый голос потом приходит именно в Audio."
minutes: 25
requires: [p0-02-interface]
glossary: [аудиоинтерфейс, частота дискретизации, размер блока, безопасная громкость, кабель]
sources: [vcv-manual-getting-started, vcv-manual-core, koma-beginner]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: "Звук наружу"
    page: |
      # 0.3 Звук наружу
      **Ты научишься:** выбирать звуковое устройство в [[аудиоинтерфейс|аудиоинтерфейсе]] **Audio 2**, включать звук безопасно и понимать, что делают [[частота дискретизации]] и [[размер блока]].
      **Ты соберёшь:** VCO → Audio 2 с двумя [[кабель|кабелями]], чтобы тон звучал в обоих ушах.
      **Понадобится:** 25 минут, наушники или колонки. Сначала убавь громкость системы.
    figure: { template: flow, nodes: [{ id: vco, label: VCO, kind: audio }, { id: out, label: Audio 2, kind: audio }], edges: [{ from: vco, to: out, kind: audio }], layout: row, caption: "Первый звук курса: один VCO и выход на устройство." }
    faq:
      - q: "Звук будет громким?"
        a: "Нет, если начать с тихого. Убавь громкость системы, оставь ручку Level на 0 дБ и поднимай медленно. Демо в уроке звучит только в активном ряду."
      - q: "Нужны ли для курса наушники?"
        a: "Подойдут и наушники, и колонки. В наушниках слышнее разница между левым и правым ухом. Надевай их, только когда убедился, что звук тихий."
      - q: "Что делать, если звука нет совсем?"
        a: "Проверь по порядку: выбрано ли устройство в меню Audio, не выключена ли системная громкость и стоит ли Level выше минимума."

  - id: b2
    type: quiz
    preset: quiz
    title: "Что ты уже знаешь"
    lead: |
      # Сначала угадай
      Три вопроса до объяснений. Ошибаться можно: ответы покажут, о чём урок.
    questions:
      - q: "Что делает модуль Audio в патче?"
        free: true
        options:
          - { text: "Связывает сигналы Rack со звуковым устройством компьютера", correct: true, why: "Его входы уходят на колонки или наушники, а выходы приносят звук с входа устройства." }
          - { text: "Генерирует звук", why: "Audio сам звука не создаёт. Он выводит то, что ему подали по кабелю." }
          - { text: "Записывает звук в файл", why: "Запись делает другой модуль, VCV Recorder. Мы дойдём до него в уроке 7.5." }
      - q: "Звук потрескивает и щёлкает в простом патче. Что поменять первым?"
        options:
          - { text: "Увеличить размер блока в меню Audio", correct: true, why: "Больший блок даёт драйверу больше запаса, и он реже остаётся без данных." }
          - { text: "Уменьшить размер блока, чтобы было быстрее", why: "Малый блок даёт меньшую задержку, но ломается быстрее." }
          - { text: "Поднять Level, чтобы заглушить щелчки", why: "Громкость не лечит нехватку данных. Щелчки станут только громче." }
      - q: "Какую громкость выставить перед первым звуком?"
        options:
          - { text: "Системную вниз, Level около 0 дБ, потом поднимать медленно", correct: true, why: "Каждое звено цепочки может усилить звук, поэтому начинать нужно с тихого." }
          - { text: "Выкрутить на максимум, чтобы точно услышать", why: "Синус на полной громкости в наушниках неприятен и опасен для слуха." }
          - { text: "Level на максимум безопасен: там всего 12 дБ", why: "12 дБ — это громче примерно в четыре раза, чем 0 дБ." }

  - id: b3
    type: story
    preset: story
    title: "Числа и колонки"
    page: |
      # Числа и колонки
      Внутри Rack звук — это числа, а колонкам нужно колебание воздуха. Между ними стоит звуковая карта.
      [[Частота дискретизации]] — сколько раз в секунду Rack считает значение сигнала. Привычные значения: 44100 и 48000 Гц.
      Чем выше частота, тем больше нагрузка на процессор. В справке сказано так: "Engine CPU usage is almost exactly proportional to its sample rate."
      [[Размер блока]] — сколько отсчётов Rack отдаёт карте за один раз. Блок больше — надёжнее, но задержка длиннее. Блок меньше — отклик быстрее, но щелчков больше.
    figure: { template: table, rows: [[Блок, "Задержка при 48 кГц"], ["256", "5,3 мс"], ["512", "10,7 мс"], ["1024", "21,3 мс"]], caption: "Задержка блока равна размеру блока, делённому на частоту дискретизации." }
    simpler: "Представь конвейер с коробками. Частота дискретизации — сколько деталей кладут в секунду. Размер блока — сколько деталей в одной коробке. Большие коробки возят реже и надёжнее, но ты ждёшь первую дольше."
    faq:
      - q: "Какую частоту дискретизации выбрать?"
        a: "Для курса подойдут 44100 или 48000 Гц. Выбери ту, что стоит в системе по умолчанию. Тон от этого не меняется, VCO считает частоту в герцах."
      - q: "Зачем знать про задержку?"
        a: "Она не слышна, пока ты слушаешь готовый патч. Её почувствуешь, когда подключишь клавиши в части 6: нажал, а звук приходит позже."
      - q: "Какой размер блока поставить?"
        a: "Начни с 512 или 1024. Если звук чистый и тебе нужен быстрый отклик, пробуй уменьшать. Появились щелчки — верни побольше."

  - id: b4
    type: story
    preset: story
    title: "Безопасная громкость"
    page: |
      # Безопасная громкость
      Громкость проходит три звена: ручка **Level** в Audio, системный регулятор и усилитель колонок или наушников. Ошибка в любом звене бьёт по ушам.
      [[Безопасная громкость|Безопасный порядок]] включения такой:
      1. Опусти системную громкость.
      2. Поставь **Level** на Audio около 0 дБ.
      3. Сними наушники до первого пробного звука.
      4. Включи звук и поднимай громкость медленно.
      Надевай наушники, когда убедился, что звук тихий.
    simpler: "Включать звук — как садиться в ванну. Сначала проверяешь воду рукой и только потом ложишься. С громкостью то же: сначала тихо, потом погромче."
    faq:
      - q: "Почему нельзя сразу поставить погромче?"
        a: "Синус на полной громкости в наушниках неприятен и вреден для слуха. Rack сам не ограничивает уровень, поэтому за громкостью следишь ты."
      - q: "Что значит 0 дБ на ручке Level?"
        a: "Сигнал выходит без усиления и без ослабления. Это середина хода ручки. Слева звука нет, справа около +12 дБ, это примерно вчетверо громче."
      - q: "Системная громкость и Level — это одно и то же?"
        a: "Нет. Level стоит внутри Rack, системная громкость — в компьютере. Итоговый звук зависит от обоих, поэтому убавляй оба."

  - id: b5
    type: live
    preset: live
    title: "Первый тон"
    page: |
      # Первый тон
      Перед тобой **VCO**, подключённый к **Audio 2** двумя кабелями. Выход `Sine` идёт в оба входа.
      Звучит синус на 220 Гц. Убедись, что системная громкость тихая, и слушай ровный тон.
      Сравни два уха: в обоих должен звучать один и тот же тон.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "220" } } }
    cables:
      - { from: [vco, Sine], to: [audio, "To \"device output 1\""] }
      - { from: [vco, Sine], to: [audio, "To \"device output 2\""] }
    notes:
      - after: vco
        text: "Выход `Sine` даёт синусоиду. От него идут оба кабеля."
        targets: [{ module: vco, output: Sine }]
      - after: vco
        text: "**Frequency** — высота тона. Сейчас 220 Гц."
        targets: [{ module: vco, param: Frequency }]
      - after: vco
        text: "Два кабеля идут в два входа Audio: левый и правый каналы."
        targets: [{ module: audio, input: "To \"device output 1\"" }, { module: audio, input: "To \"device output 2\"" }]
    faq:
      - q: "Слышу тон только в одном ухе."
        a: "Проверь, что оба кабеля воткнуты: из Sine в первый вход и из Sine во второй вход Audio. Каждый канал берёт свой кабель."
      - q: "Тон слишком тихий или слишком громкий."
        a: "Меняй системную громкость, а ручку Level держи около 0 дБ. Поднимай медленно."
      - q: "Почему из одного выхода идут два кабеля?"
        a: "Так звук попадает в оба канала. Один выход можно раздать на несколько входов."

  - id: b6
    type: anatomy
    preset: anatomy
    title: "Панель Audio 2"
    page: |
      # Панель Audio 2
      В Core три модуля Audio: Audio 2, Audio 8 и Audio 16. Для курса нужен **Audio 2**: один регулятор и два канала.
      Щёлкни по дисплею с названием устройства. Откроется меню: **Driver**, **Device**, **Sample rate** и **Block size**.
    module: { ref: aud, plugin: Core, slug: AudioInterface2 }
    notes:
      - { text: "**Level** — громкость в децибелах. Слева звука нет, середина 0 дБ, справа около +12 дБ.", targets: [{ module: aud, param: Level }] }
      - { text: "Первый вход: левый канал.", targets: [{ module: aud, input: "To \"device output 1\"" }] }
      - { text: "Второй вход: правый канал.", targets: [{ module: aud, input: "To \"device output 2\"" }] }
      - { text: "Выход первого входа звуковой карты: микрофон или линейный вход.", targets: [{ module: aud, output: "From \"device input 1\"" }] }
    later:
      - { what: "Audio 8 и Audio 16: восемь и шестнадцать каналов", lesson: "7.3" }
      - { what: "Постановка уровней", lesson: "7.3" }
    faq:
      - q: "Чем Audio 2 отличается от Audio 8?"
        a: "Числом каналов. Audio 8 и Audio 16 нужны, когда у звуковой карты много выходов. Для курса хватает двух, мы остаёмся на Audio 2."
      - q: "Что такое выходы From device input?"
        a: "Это звук, который приходит на вход звуковой карты: с микрофона или линейного входа. В курсе они нам не нужны."
      - q: "Куда нажать, чтобы выбрать устройство?"
        a: "На дисплей с названием устройства вверху модуля. Откроется меню с драйвером, устройством, частотой и блоком."

  - id: b7
    type: try
    preset: try
    title: "Покрути сам"
    steps:
      - do: "Сдвинь **Frequency** у VCO вправо, потом влево."
        see: "Вправо тон выше, влево ниже. У самого левого края слышен рокот или щелчки."
      - do: "Двигай **Level** у Audio небольшими шагами вправо и верни на 0 дБ."
        see: "Звук громче. Выше 0 дБ без нужды не уходи."
      - do: "В меню Audio увеличь **Block size** с 256 до 1024."
        see: "Тон тот же. Задержка проявится, когда появятся клавиши."
      - do: "Смени **Sample rate** на другое значение из списка."
        see: "Высота тона не меняется: VCO считает частоту в герцах."
      - do: "Вытащи один из двух кабелей из Audio."
        see: "Тон остался только в одном ухе. Верни кабель на место."
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "220" } } }
    cables:
      - { from: [vco, Sine], to: [audio, "To \"device output 1\""] }
      - { from: [vco, Sine], to: [audio, "To \"device output 2\""] }
    notes:
      - after: vco
        text: "Крути эту ручку в первом шаге."
        targets: [{ module: vco, param: Frequency }]
    faq:
      - q: "После смены частоты дискретизации пропал звук."
        a: "Rack перезапустил устройство. Подожди секунду. Если звука нет, выбери устройство в меню Audio заново."
      - q: "Меню Audio не открывается."
        a: "Щёлкни по дисплею с названием устройства вверху модуля Audio, а не по ручке Level."
      - q: "Как точно поставить 0 дБ?"
        a: "Дважды щёлкни по ручке Level, и она встанет в значение по умолчанию. Это 0 дБ."

  - id: b8
    type: practice
    preset: practice
    title: "Практика — звук в оба уха"
    task: |
      Собери на верстаке патч, где тон звучит в обоих ушах.
      1. Поставь между маркерами **VCO**.
      2. `Sine` → `To "device output 1"` у Audio этого ряда.
      3. `Sine` ещё раз → `To "device output 2"`.
      4. **Frequency** держи в пределах 80–1000 Гц, **Level** не выше 0 дБ.
      Звук включай тихо. Потом нажми «Проверить».
    given: [audio]
    check: p0-03-audio-out
    hints:
      "module:vco":
        - Чего не хватает в источнике звука?
        - Генератор живёт в плагине Fundamental.
        - Поставь на верстак VCO из Fundamental.
      "module:out":
        - Не найден выход на устройство.
        - Модуль Audio 2 уже дан в этом ряду. Возможно, ты его убрал.
        - Верни Audio 2 из плагина Core.
      "cable:1":
        - Звук не доходит до левого канала.
        - Какой выход VCO даёт синусоиду?
        - "Кабель из `Sine` у VCO в `To \"device output 1\"` у Audio."
      "cable:2":
        - Звук идёт только в одно ухо.
        - У Audio два входа, и каждому нужен свой кабель.
        - "Второй кабель из `Sine` в `To \"device output 2\"` у Audio."
      "param:1":
        - Тон слишком низкий или слишком высокий.
        - Посмотри на ручку Frequency у VCO.
        - Верни Frequency в диапазон 80–1000 Гц, по умолчанию 261,63 Гц.
      "param:2":
        - Громкость вне нормы.
        - Посмотри на ручку Level у Audio.
        - Поставь Level в диапазон от -40 до 0 дБ. Двойной щелчок вернёт 0 дБ.
      "probe:1":
        - Сигнал на выходе почти не меняется.
        - Кабель воткнут в Sine, а не в другой выход?
        - Проверь кабель из `Sine` и верни Frequency не в крайнее левое положение.
    faq:
      - q: "Можно взять выход Sawtooth вместо Sine?"
        a: "Для этой проверки нужен именно Sine. Остальные выходы VCO мы разберём в уроке 1.1."
      - q: "Всё подключено, а звука нет."
        a: "Это настройка, а не ошибка патча. Проверь выбранное устройство в меню Audio, потом системную громкость, потом размер блока."
      - q: "Где брать VCO?"
        a: "Правый щелчок по пустому месту между маркерами «Верстак» открывает браузер модулей. Найди там VCO из Fundamental."

  - id: b9
    type: debug
    preset: debug
    title: "Найди поломку"
    task: |
      Тон слышен только в одном ухе.
      Найди, чего не хватает, и исправь одним кабелем.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "220" } } }
      - { ref: audio, plugin: Core, slug: AudioInterface2 }
    cables:
      - { from: [vco, Sine], to: [audio, "To \"device output 1\""] }
      - { from: [vco, Sine], to: [audio, "To \"device output 2\""] }
    break: { remove_cable: [vco, Sine, audio, "To \"device output 2\""] }
    check: { kind: fixed, expect_cable: [vco, Sine, audio, "To \"device output 2\""] }
    hints:
      fixed:
        - Сколько кабелей идёт в Audio?
        - "У Audio два входа: один для левого уха, другой для правого."
        - "Кабель из `Sine` у VCO в `To \"device output 2\"` у Audio."
    faq:
      - q: "Почему звук ушёл в одно ухо?"
        a: "Стерео — это два канала, и каждому нужен свой кабель. Без второго кабеля правый канал молчит."
      - q: "Какой вход подключать?"
        a: "Второй вход Audio, подписанный device output 2. Первый уже занят."

  - id: b10
    type: recap
    preset: recap
    title: "Итог"
    page: |
      # Итог
      - Audio связывает Rack со звуковым устройством. Устройство выбирается в меню на дисплее модуля.
      - Больше размер блока — надёжнее и дольше задержка. Задержка равна блоку, делённому на частоту.
      - Включай звук безопасно: системная громкость вниз, Level около 0 дБ, наушники сняты.
      - Для двух ушей нужны два кабеля.
      Сохрани патч как `vcv-0.3.vcv`.
      **Источники:** справка VCV Rack, разделы «Getting Started», «Core» и «Menu Bar». Видеоурок koma2000, «VCV Rack Beginner Tutorial».
    questions:
      - q: "Блок 512 при 48000 Гц. Какая задержка блока?"
        free: true
        options:
          - { text: "Около 10,7 мс", correct: true, why: "Задержка равна размеру блока, делённому на частоту: 512 / 48000 ≈ 0,0107 с." }
          - { text: "Около 5,3 мс", why: "Это блок 256. Блок 512 вдвое больше, и задержка вдвое длиннее." }
          - { text: "Около 21 мс", why: "Столько даёт блок 1024. У блока 512 задержка вдвое короче." }
    next: |
      # Дальше: 0.4
      Звук есть. Теперь подключим репетитора: узнаем, как он читает патч через MCP Server и чего не делает.
    faq:
      - q: "Нужно ли запоминать формулу задержки?"
        a: "Нет. Запомни идею: блок больше — задержка длиннее. Числа можно посчитать на калькуляторе."
      - q: "Что повторить перед следующим уроком?"
        a: "Безопасный порядок включения и два кабеля для двух ушей. С ними ты соберёшь патч в уроке 0.4."
