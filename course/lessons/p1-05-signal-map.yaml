id: p1-05-signal-map
num: "1.5"
part: 1
title: Карта сигнала
goal: "Читать и описывать любой патч как карту: откуда выходит сигнал, какого он типа и куда идёт; размножать сигнал через Mult и записывать карту в Notes."
builds: "Главный инструмент отладки курса. «Пропал звук» превращается в «где оборвалась ветка карты», а карту можно показать агенту."
minutes: 30
requires: [p1-04-knob-cv]
glossary: [путь звука, путь управления, мульт, задержка в один сэмпл]
sources: [lm-first-voice, aikin-how-to-rack, vcv-voltage-standards, samesound-first-patch]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: Карта сигнала
    page: |
      # 1.5 Карта сигнала
      **Ты научишься:** читать патч как карту, размножать сигнал через **Mult** и записывать карту в **Notes**.
      **Ты соберёшь:** VCO с покачиванием от LFO, где пила идёт и в Audio, и в Scope.
      **Понадобится:** 30 минут. Звук тихий, пила из VCO.
    figure: { template: flow, nodes: [{ id: lfo, label: LFO, kind: cv }, { id: vco, label: VCO, kind: audio }, { id: mult, label: Mult, kind: audio }, { id: out, label: Audio, kind: audio }, { id: scope, label: Scope, kind: audio }], edges: [{ from: lfo, to: vco, kind: cv }, { from: vco, to: mult, kind: audio }, { from: mult, to: out, kind: audio }, { from: mult, to: scope, kind: audio }], layout: two-rows, caption: "Карта патча урока: звук — толстые линии, CV — тонкая." }
    faq:
      - q: Зачем записывать патч словами, если он виден на экране?
        a: Запись заставляет проверить каждый кабель и пригодится в отладке. По строке «откуда → куда» ты быстро найдёшь, где оборвался сигнал.
      - q: Звук будет громким?
        a: Нет, если начать с тихой громкости. Демо звучит только в активном ряду, а уровень задаёт ручка Level у Audio.
      - q: Что такое Notes?
        a: Модуль с текстовым полем. Он хранит заметки внутри патча и не влияет на сигналы. Мы будем писать в нём карту.

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса про кабели и пути сигнала. Ответы подскажут, о чём урок.
    questions:
      - q: Сколько кабелей можно подключить к одному входу?
        free: true
        options:
          - { text: "Один", correct: true, why: "Вход принимает один кабель. Из выхода же можно вести сколько угодно кабелей." }
          - { text: "Сколько угодно, сигналы сложатся", why: "Сложение не происходит само. Чтобы сложить два сигнала, нужен микшер или CV Mix." }
          - { text: "Два, левый и правый", why: "Левый и правый каналы — это два разных входа у Audio, а не два кабеля в один вход." }
      - q: Что значит «задержка в один сэмпл на кабель»?
        options:
          - { text: "Сигнал доходит с запозданием в одну выборку", correct: true, why: "Это доли миллисекунды, на слух незаметно. Но на каждый кабель в цепочке приходится по одной выборке." }
          - { text: "Каждый кабель добавляет заметное эхо", why: "Задержка слишком мала, чтобы быть эхом. Она около 21 мкс при 48 кГц." }
          - { text: "Так ведут себя только очень длинные кабели", why: "Длина кабеля на экране ни при чём. Задержка одинакова для любого кабеля." }
      - q: Что из этого относится к пути управления, а не к пути звука?
        options:
          - { text: "LFO, который качает частоту VCO", correct: true, why: "Этот кабель меняет параметр, а сам звуком не идёт. Значит, это путь управления." }
          - { text: "Кабель из VCO в Audio", why: "Это сам звук на пути к колонкам. Он на пути звука." }
          - { text: "Кабель из VCO в Scope", why: "Scope только смотрит на звук. Кабель к нему — ответвление пути звука." }

  - id: b3
    type: story
    preset: story
    title: Два пути
    page: |
      # Два пути
      В любом патче два слоя. [[путь звука|Путь звука]] — цепочка, по которой идёт сам звук: источник, обработка, выход Audio.
      [[путь управления|Путь управления]] — все кабели, которые меняют параметры этой цепочки: CV, гейты, триггеры.
      На схемах звук рисуют слева направо. Управление подходит сбоку и двигает то, что стоит на пути звука.
      Когда пропал звук, ищи обрыв на пути звука. Когда звук есть, но стоит на месте, ищи на пути управления.
    figure: { template: flow, nodes: [{ id: vco, label: VCO, kind: audio }, { id: vcf, label: VCF, kind: audio }, { id: vca, label: VCA, kind: audio }, { id: out, label: Audio, kind: audio }, { id: lfo, label: LFO, kind: cv }], edges: [{ from: vco, to: vcf, kind: audio }, { from: vcf, to: vca, kind: audio }, { from: vca, to: out, kind: audio }, { from: lfo, to: vcf, kind: cv }], layout: row, caption: "Пример: толстая линия — путь звука, тонкая — путь управления." }
    simpler: Река и ручьи. Река несёт воду к морю — это путь звука. Ручьи вливаются сбоку и меняют, как течёт река, — это путь управления.
    faq:
      - q: Где граница между звуком и управлением?
        a: По роли сигнала, а не по виду. Кабель, идущий в Audio, — звук. Кабель, который меняет параметр, — управление, даже если он быстрый.
      - q: Scope — это звук или управление?
        a: Ни то ни другое. Scope только смотрит на сигнал. Кабель к нему — ответвление пути, и на звук он не влияет.
      - q: Может ли один кабель быть и звуком, и управлением?
        a: Да. Выход VCO можно подать и в Audio, и на вход модуляции другого модуля. Роль определяет то, куда пришёл кабель.

  - id: b4
    type: story
    preset: story
    title: Карта — патч словами
    page: |
      # Карта — патч словами
      Карта записывает патч текстом: откуда выходит сигнал, какого он типа и куда приходит. Одна строка — один кабель.
      Строка выглядит так: `VCO Sawtooth` → `Mult Mult`, звук ±5 В.
      Хорошая карта читается без экрана. По ней другой человек или агент увидит те же кабели, что и ты.
      Дальше по курсу карта — главный инструмент отладки. Пропал звук — значит, какая-то строка не сходится с патчем.
    figure: { template: table, rows: [[Откуда, Тип, Куда], [VCO Sawtooth, звук, Mult Mult], [Mult Mult 1, звук, Audio], [LFO Sine, CV, VCO Freq. mod.]], caption: "Три строки карты: выход, тип сигнала, вход." }
    simpler: Карта метро. Ты не видишь тоннелей, но по линиям и станциям найдёшь маршрут. Карта патча делает то же для кабелей.
    faq:
      - q: Как на карте отличить звук от CV?
        a: По роли. Если кабель идёт к Audio или несёт быструю волну ±5 В, это звук. Если двигает параметр, это CV, гейт или триггер.
      - q: Как записать, если из одного выхода идут два кабеля?
        a: Две строки с одним началом. Одна строка описывает один кабель, поэтому «Mult 1 → Audio» и «Mult 2 → Scope» — отдельные строки.
      - q: Нужно ли писать полные названия портов?
        a: Лучше да, как они подписаны на панели. Тогда строку можно проверить по патчу буква в букву.

  - id: b5
    type: story
    preset: story
    title: Мульт и задержка
    page: |
      # Мульт
      Вход принимает один кабель, а из выхода можно вести несколько. Так в уроке 1.1 пила шла и в Scope, и в Audio.
      Когда копий много, помогает [[мульт]]. **Mult** копирует вход на восемь выходов. Ты ведёшь один кабель, а от Mult веером расходятся выходы.
      Номер выхода не важен: все восемь несут одну и ту же копию.
    page2: |
      # Задержка в один сэмпл
      Каждый кабель в Rack передаёт сигнал с [[задержка в один сэмпл|задержкой в один сэмпл]]. При 48 кГц это около 21 мкс, на слух незаметно.
      Цепочка кабелей копит несколько сэмплов. Сигнал через Mult отстаёт от прямого на один: это два кабеля вместо одного.
      Увидеть сэмпл на Scope нельзя. Он понадобится в уроке 5.1, когда клок и нота пойдут разными путями.
    simpler: Раздвижной удлинитель с розетками. Один шнур в стену, а от него несколько розеток. Каждая даёт то же напряжение. Mult делает то же с сигналом.
    faq:
      - q: Зачем Mult, если можно вести несколько кабелей из одного выхода?
        a: Для порядка. Если копий много, один Mult с подписанными выходами читается проще, чем пучок кабелей из одного гнезда.
      - q: Можно ли подать два кабеля в один вход?
        a: Нет. К входу идёт один кабель. Чтобы сложить два сигнала, поставь их на вход микшера или CV Mix.
      - q: Слышна ли задержка в один сэмпл?
        a: Нет. Это доли миллисекунды. Она важна только тогда, когда два сигнала идут разными путями и должны прийти одновременно.

  - id: b6
    type: live
    preset: live
    title: Карта в действии
    page: |
      # Карта в действии
      Перед тобой **LFO**, **VCO**, **Mult** и **Scope**. Прочти патч как карту.
      Путь звука: `VCO Sawtooth` → `Mult` → `Mult 1` в Audio и `Mult 2` в Scope.
      Путь управления: `LFO Sine`, CV 0…10 В, 2 Гц → `Frequency modulation` у VCO на 10 %.
      Высота покачивается, а волна на Scope то сжимается, то растягивается.
    modules:
      - { ref: lfo, plugin: Fundamental, slug: LFO, params: { Frequency: { display: "2" }, Offset: Unipolar } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" }, Frequency modulation: { display: "10" } } }
      - { ref: mult, plugin: Fundamental, slug: Mult }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "500" }, Trigger: Disabled, Gain 1: { display: "10" } }
    cables:
      - { from: [lfo, Sine], to: [vco, Frequency modulation] }
      - { from: [vco, Sawtooth], to: [mult, Mult] }
      - { from: [mult, Mult 1], to: [audio, "To \"device output 1\""] }
      - { from: [mult, Mult 2], to: [scope, Ch 1] }
    notes:
      - { after: lfo, text: "Путь управления: медленное CV 0…10 В.", targets: [{ module: lfo, output: Sine }] }
      - { after: vco, text: "**Frequency modulation** — глубина покачивания. Сейчас 10 %.", targets: [{ module: vco, param: Frequency modulation }] }
      - { after: mult, text: "Один вход, восемь копий. `Mult 1` идёт в Audio, `Mult 2` в Scope.", targets: [{ module: mult, output: Mult 1 }, { module: mult, output: Mult 2 }] }
      - { after: scope, text: "Волна то сжимается, то растягивается вслед за LFO.", targets: [{ module: scope, input: Ch 1 }] }
    faq:
      - q: Где на экране стрелки карты?
        a: Их нет. Карту ты составляешь сам в Notes по кабелям на панели. Каждая строка описывает один кабель.
      - q: Звук пилы идёт через Mult. Он стал другим?
        a: Нет. Mult копирует вход без изменений, добавляя задержку в один сэмпл, которую не слышно.
      - q: Что такое Frequency modulation у VCO?
        a: Вход и ручка, через которые сигнал качает частоту. Ручка задаёт глубину в процентах. Подробнее это будет в уроке 2.2.

  - id: b7
    type: anatomy
    preset: anatomy
    title: Панель Mult
    page: |
      # Панель Mult
      Mult — самый простой модуль: один вход, восемь выходов, ручек нет.
    module: { ref: mult, plugin: Fundamental, slug: Mult }
    notes:
      - { text: "Вход **Mult** принимает исходный сигнал.", targets: [{ module: mult, input: Mult }] }
      - { text: "Выходы **Mult 1** … **Mult 8** несут восемь одинаковых копий.", targets: [{ module: mult, output: Mult 1 }, { module: mult, output: Mult 8 }] }
      - { text: "Копируется любое напряжение: звук, CV, гейт, триггер.", targets: [{ module: mult, input: Mult }] }
    later:
      - { what: "Многоканальные кабели", lesson: "6.4" }
    faq:
      - q: Mult усиливает сигнал?
        a: Нет. Каждая копия равна входу по напряжению. Уровень не растёт и не падает.
      - q: Есть ли разница, в какой выход Mult втыкать кабель?
        a: Нет. Все восемь выходов одинаковы, номер нужен только для твоего порядка.

  - id: b8
    type: anatomy
    preset: anatomy
    title: Модуль Notes
    page: |
      # Модуль Notes
      Notes — поле для текста. Здесь будет жить карта твоего патча.
    module: { ref: notes, plugin: Core, slug: Notes }
    notes:
      - { text: "Щёлкни по полю и печатай. Текст хранится в файле патча." }
      - { text: "Входов и выходов нет: на сигналы модуль не влияет." }
      - { text: "Формат: одна строка — один кабель, с типом сигнала." }
    faq:
      - q: Сохраняется ли текст вместе с патчем?
        a: Да. Notes хранит текст внутри патча, и он вернётся при следующем открытии. Сохраняй патч по Ctrl+S.
      - q: Можно ли писать по-русски?
        a: "Попробуй. Если буквы не отображаются, записывай порты латиницей, как на панели, а тип сигнала коротко: звук, CV."

  - id: b9
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Поверни **Frequency modulation** у VCO от 0 до 10 и до 30."
        see: Покачивание высоты растёт. На Scope волна сильнее сжимается и растягивается.
      - do: "Поверни **Frequency** у LFO с 2 до 8, потом вниз."
        see: Покачивание быстрее, потом медленнее.
      - do: "Вытащи кабель из `Mult 1`."
        see: Звук пропал, а Scope продолжает рисовать. Оборвалась ветка к Audio.
      - do: "Воткни тот же кабель в `Mult 3`."
        see: Звук вернулся. Номер выхода у Mult не важен.
      - do: "Добавь кабель из `Mult 4` в `Ch 2` у Scope."
        see: "Две одинаковые линии: одна волна, два пути."
    modules:
      - { ref: lfo, plugin: Fundamental, slug: LFO, params: { Frequency: { display: "2" }, Offset: Unipolar } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" }, Frequency modulation: { display: "10" } } }
      - { ref: mult, plugin: Fundamental, slug: Mult }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "500" }, Trigger: Disabled, Gain 1: { display: "10" }, Gain 2: { display: "10" } }
    cables:
      - { from: [lfo, Sine], to: [vco, Frequency modulation] }
      - { from: [vco, Sawtooth], to: [mult, Mult] }
      - { from: [mult, Mult 1], to: [audio, "To \"device output 1\""] }
      - { from: [mult, Mult 2], to: [scope, Ch 1] }
    notes:
      - { after: vco, text: "Шаг 1 — здесь.", targets: [{ module: vco, param: Frequency modulation }] }
      - { after: lfo, text: "Шаг 2 — здесь.", targets: [{ module: lfo, param: Frequency }] }
    faq:
      - q: Я вытащил кабель, а звук остался.
        a: Скорее всего, ты вытащил кабель из другого выхода. Звук идёт из Mult 1 в Audio. Если кабель из Mult 2, пропадёт только картинка на Scope.
      - q: Как вытащить кабель?
        a: Потяни за конец у входа. Если нужно переткнуть, сразу воткни его в другой выход Mult.

  - id: b10
    type: practice
    preset: practice
    title: Практика — карта в Notes
    task: |
      Собери патч из урока и запиши его карту.
      1. Поставь между маркерами **VCO**, **LFO**, **Mult**, **Scope** и **Notes**.
      2. `Sine` у LFO → `Frequency modulation` у VCO. Ручка **Frequency modulation** — около 10.
      3. `Sawtooth` у VCO → `Mult` у Mult. `Mult 1` → Audio этого ряда. `Mult 2` → `Ch 1` у Scope.
      4. В **Notes** впиши карту: каждый кабель отдельной строкой, с типом сигнала.
      Потом нажми «Проверить» и пришли текст из Notes в чат.
    given: [audio]
    check: p1-05-signal-map
    hints:
      "module:notes":
        - Где записана карта патча?
        - Нужен модуль Notes из браузера модулей.
        - Добавь Notes между маркерами и впиши карту по строке на кабель.
      "cable:1":
        - Что качает высоту VCO?
        - Выход LFO идёт во вход модуляции частоты у VCO.
        - "Кабель из `Sine` у LFO во вход `Frequency modulation` у VCO."
      "cable:2":
        - Куда идёт пила?
        - Выход Sawtooth у VCO идёт на вход Mult.
        - "Кабель из `Sawtooth` у VCO во вход `Mult` у Mult."
      "cable:3":
        - Слышно ли звук?
        - Один из выходов Mult должен идти в Audio.
        - "Кабель из `Mult 1` во вход `To \"device output 1\"` у Audio."
      "cable:4":
        - Видна ли волна на Scope?
        - Другой выход Mult идёт в первый вход Scope.
        - "Кабель из `Mult 2` во вход `Ch 1` у Scope."
      "param:1":
        - Насколько сильно качать высоту?
        - Ручка Frequency modulation у VCO, значение небольшое.
        - Поставь Frequency modulation около 10.
      "probe:1":
        - Двигается ли сигнал LFO?
        - Проверь ручку Frequency у LFO и кабель из Sine.
        - Верни Frequency у LFO на 2 и проверь кабель.
      "probe:2":
        - Доходит ли пила до Mult 1?
        - Проверь кабель из Sawtooth в Mult.
        - Подключи Sawtooth у VCO к входу Mult и нажми «Проверить» ещё раз.
    faq:
      - q: Проверка видит, что я написал в Notes?
        a: Нет, текст модуля из патча не читается. Проверка смотрит на кабели и ручки. Карту ты присылаешь в чат, и её сверяют с патчем.
      - q: Что писать в карте для кабеля LFO?
        a: "Выход, тип и вход: `LFO Sine` → `VCO Frequency modulation`, CV 0…10 В. По такой строке патч восстанавливается без экрана."

  - id: b11
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Звук играет, а Scope пустой: линии нет.
      Найди обрыв на ветке к Scope и почини его. Ручки трогать не нужно.
    modules:
      - { ref: lfo, plugin: Fundamental, slug: LFO, params: { Frequency: { display: "2" }, Offset: Unipolar } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" }, Frequency modulation: { display: "10" } } }
      - { ref: mult, plugin: Fundamental, slug: Mult }
      - ref: scope
        plugin: Fundamental
        slug: Scope
        params: { Time: { display: "500" }, Trigger: Disabled, Gain 1: { display: "10" } }
    cables:
      - { from: [lfo, Sine], to: [vco, Frequency modulation] }
      - { from: [vco, Sawtooth], to: [mult, Mult] }
      - { from: [mult, Mult 1], to: [audio, "To \"device output 1\""] }
      - { from: [mult, Mult 2], to: [scope, Ch 1] }
    break: { remove_cable: [mult, Mult 2, scope, Ch 1] }
    check: { kind: fixed, expect_cable: [mult, Mult 2, scope, Ch 1] }
    hints:
      fixed:
        - Звук есть, значит Mult получает пилу. Что должно рисовать картинку?
        - Какая строка карты ведёт в Scope?
        - Соедини выход Mult 2 с входом Ch 1 у Scope.
    faq:
      - q: Как понять, какая строка карты оборвалась?
        a: Пройди карту сверху вниз и сверь с кабелями. Строка «Mult 2 → Scope Ch 1» есть в карте, но на панели такого кабеля нет.
      - q: Подойдёт ли другой выход Mult?
        a: По картинке да, любой свободный. Но проверка ищет именно Mult 2, потому что так записана карта.

  - id: b12
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - **Путь звука** ведёт к Audio, **путь управления** двигает его параметры.
      - Карта — патч словами: одна строка — один кабель, с типом сигнала.
      - **Mult** копирует вход на восемь выходов. К входу идёт один кабель, из выхода — сколько угодно.
      - Каждый кабель добавляет **задержку в один сэмпл**, это около 21 мкс при 48 кГц.
      Сохрани патч: Ctrl+S сохраняет твою копию урока.
      **Источники:** Learning Modular, «Patching a typical subtractive synthesis voice». Jim Aikin, «How to Rack». Документация VCV Rack, «Voltage Standards». Кирилл Колотвин, SAMESOUND, «Введение в модульные синтезаторы».
    questions:
      - q: Чем путь звука отличается от пути управления?
        options:
          - { text: "Звук идёт к Audio, управление меняет параметры по пути", correct: true, why: "Роль определяет путь. Кабель в Audio — звук, кабель к параметру — управление." }
          - { text: "Звук всегда быстрый, а управление всегда медленное", why: "Скорость не критерий. Быстрый сигнал тоже может управлять, как в частотной модуляции." }
      - q: Что такое задержка в один сэмпл и слышна ли она?
        options:
          - { text: "Запаздывание на выборку на каждом кабеле, не слышна", correct: true, why: "При 48 кГц это около 21 мкс. На слух не заметна, но складывается по цепочке." }
          - { text: "Слышимое эхо, которое добавляет каждый кабель", why: "Это слишком мало для эха. Эхо делает модуль Delay, а не кабель." }
