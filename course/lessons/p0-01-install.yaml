id: p0-01-install
num: "0.1"
part: 0
title: "Установка Rack 2 и библиотека плагинов"
goal: "Поставить VCV Rack 2 Free, войти в учётную запись VCV и получить из Library плагины, которые понадобятся в курсе."
builds: "Среду для всего курса. Без нужных плагинов части 5, 7, 8 и 9 не соберутся."
minutes: 20
glossary: [плагин, VCV Library, учётная запись VCV, браузер модулей, MCP-сервер, шкаф]
sources: [vcv-manual-installing, vcv-forum-getting-started, omri-first-minutes, shatnyy-lesson1]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: "Установка Rack 2"
    page: |
      # 0.1 Установка Rack 2 и библиотека плагинов
      **Ты научишься:** подписываться на [[плагин|плагины]] в [[VCV Library]] и получать их в Rack.
      **Ты получишь:** Rack 2 Free с плагинами для всего курса и записью в файл.
      **Понадобится:** 20 минут, интернет и почта для регистрации на vcvrack.com.
      Если Rack уже стоит и ты видишь этот урок внутри него, пройди только проверку плагинов в блоке «Три действия».
    figure: { template: flow, nodes: [{ id: lib, label: Library, kind: cv }, { id: acc, label: Аккаунт, kind: cv }, { id: rack, label: Rack, kind: audio }], edges: [{ from: lib, to: acc, kind: cv }, { from: acc, to: rack, kind: cv }], layout: row, caption: "Подписка оформляется на сайте, установка идёт в Rack." }
    faq:
      - q: "Нужно ли платить за Rack?"
        a: "Нет. Курс идёт на бесплатной версии Rack 2 Free. Нужные плагины тоже бесплатные. Платная версия Rack Pro отдельная, в курсе она не используется."
      - q: "Какую версию Rack ставить?"
        a: "Rack 2 Free для своей системы. Курс написан под macOS на процессоре Apple и версию 2.6. Берёшь сборку с официального сайта vcvrack.com."
      - q: "Пароль от аккаунта нужно кому-то давать?"
        a: "Нет. Регистрацию и вход ты делаешь сам, на сайте и в окне Rack. Репетитор курса пароль не вводит и не просит."

  - id: b2
    type: quiz
    preset: quiz
    title: "Что ты уже знаешь"
    lead: |
      # Сначала угадай
      Три вопроса до объяснений. Ошибаться можно: ответы покажут, о чём урок.
    questions:
      - q: "Откуда в Rack берутся модули, которых нет в комплекте?"
        free: true
        options:
          - { text: "Из VCV Library: подписка на сайте, потом обновление в Rack", correct: true, why: "Плагины подписываются под аккаунтом на сайте, а Rack скачивает их командой обновления." }
          - { text: "Rack сам скачивает их, когда я ищу модуль в браузере модулей", why: "Поиск показывает только то, что уже установлено. Сам по себе он ничего не скачивает." }
          - { text: "Каждый плагин покупают и ставят отдельным установщиком", why: "Нужные курсу плагины бесплатны и ставятся одним действием «Update all»." }
      - q: "Зачем учётная запись VCV, если Rack Free бесплатный?"
        options:
          - { text: "Чтобы подписываться на плагины и получать их в Rack", correct: true, why: "Подписки привязаны к аккаунту. Rack при входе знает, что скачать." }
          - { text: "Чтобы разблокировать полную версию Rack", why: "Pro — отдельный продукт. Аккаунт его не открывает." }
          - { text: "Чтобы хранить патчи в облаке VCV", why: "Патчи лежат у тебя на диске, там, куда ты их сохранил." }
      - q: "Ты подписался на плагин на сайте. Что сделать в Rack, чтобы модули появились?"
        options:
          - { text: "В меню Library нажать «Update all» и перезапустить Rack", correct: true, why: "Rack читает плагины при запуске, поэтому без перезапуска новых модулей не будет." }
          - { text: "Ничего, модули появятся сразу", why: "Пока Rack не перезапущен, он не видит новые плагины." }
          - { text: "Переустановить Rack", why: "Плагины живут отдельно от программы. Переустановка не нужна." }

  - id: b3
    type: story
    preset: story
    title: "Плагины и Library"
    page: |
      # Плагины и Library
      Чистый Rack — пустой [[шкаф|шкаф]] и несколько служебных модулей. Остальное приходит в [[плагин|плагинах]]: пакет модулей одного автора.
      Часть плагинов вшита в Rack: **Fundamental** и **Core**. Остальные лежат в [[VCV Library]], каталоге на vcvrack.com.
      Библиотека привязана к [[учётная запись VCV|учётной записи]]. Ты нажимаешь «Add» на странице плагина, это подписка. Установка идёт в Rack.
      В справке Rack сказано так: "Plugins are typically installed via the VCV Library."
    figure: { template: flow, nodes: [{ id: site, label: "Library: Add", kind: cv }, { id: upd, label: "Update all", kind: cv }, { id: rst, label: Перезапуск, kind: audio }], edges: [{ from: site, to: upd, kind: cv }, { from: upd, to: rst, kind: cv }], layout: row, caption: "Подписка на сайте, затем Update all в Rack и перезапуск." }
    simpler: "Библиотека — как приложение-магазин. Подписка на сайте — это «добавить в мои покупки». Update all — «скачать всё купленное на телефон». Пока не перезапустишь Rack, он их не заметит."
    faq:
      - q: "Чем подписка отличается от установки?"
        a: "Подписка — запись в твоём аккаунте на сайте. Установка — скачивание плагина в папку Rack. Нажать «Add» мало: плагин появится только после «Update all» и перезапуска."
      - q: "Что значит кнопка «Included» у Fundamental?"
        a: "Плагин уже входит в Rack Free. Подписываться на него не нужно, он есть сразу."
      - q: "Можно поставить плагин без интернета?"
        a: "Можно скопировать папку плагина в папку пользователя Rack. Для курса проще дождаться сети и поставить из Library."

  - id: b4
    type: story
    preset: story
    title: "Что подписать"
    page: |
      # Какие плагины нужны
      Подпишись на пять плагинов. Шестой, Fundamental, уже в комплекте.
      - **Neural Harmonics** — модуль **MCP Server**, [[MCP-сервер|сервер]] для чтения патча (урок 0.4).
      - **Impromptu Modular** — **Clocked**, тактовый генератор (части 5 и 9).
      - **Valley** — **Plateau**, реверберация (части 7, 8, 9).
      - **Audible Instruments** — **Clouds**, гранулярный процессор (часть 8).
      - **VCV Recorder** — запись в файл (урок 7.5).
      У Recorder в Library кнопка «Add», а не «Included». Он бесплатный, но с Rack Free не поставляется.
    figure: { template: table, rows: [[Плагин, Модуль, Часть], [Neural Harmonics, MCP Server, "0"], [Impromptu Modular, Clocked, "5, 9"], [Valley, Plateau, "7-9"], [Audible Instruments, Clouds, "8"]], caption: "Четыре плагина и их главные модули. Пятый, VCV Recorder, нужен в уроке 7.5." }
    faq:
      - q: "Зачем столько плагинов в начале?"
        a: "Чтобы не возвращаться к установке посреди курса. Каждый плагин нужен в своей части. Подпишись на все сразу, это занимает несколько минут."
      - q: "Не нашёл VCV Recorder среди «Included». Это ошибка?"
        a: "Нет. Recorder бесплатный, но подписку нужно оформить кнопкой «Add». После этого снова «Update all» и перезапуск Rack."

  - id: b5
    type: story
    preset: story
    title: "Порядок установки"
    page: |
      # Шесть шагов
      1. На vcvrack.com скачай Rack 2 Free для своей системы и поставь его. macOS может спросить подтверждение для программы из интернета. Решаешь ты.
      2. Запусти Rack. Он откроет стартовый патч. Что в нём лежит, неважно.
      3. Зарегистрируйся на сайте. Пароль вводишь сам.
      4. В Rack открой меню **Library** и войди в аккаунт.
      5. На library.vcvrack.com нажми «Add» у пяти плагинов.
      6. В Rack: **Library** → «Update all». Дождись загрузки и перезапусти Rack.
    simpler: "Это как настроить новый телефон. Сначала создаёшь аккаунт, потом входишь, потом отмечаешь нужные приложения и ждёшь, пока они скачаются."
    faq:
      - q: "Rack не пускает в аккаунт. Что делать?"
        a: "Проверь вход на сайте vcvrack.com теми же данными. Если там всё работает, войди в Rack ещё раз через меню Library."
      - q: "В каком порядке всё делать?"
        a: "Сначала аккаунт, потом подписки на сайте, потом «Update all» в Rack и перезапуск. Если нажать «Update all» до подписок, нового не появится."
      - q: "Где лежат плагины на диске?"
        a: "В папке пользователя Rack. Открыть её можно через меню Help. Копаться там не нужно."

  - id: b6
    type: try
    preset: try
    title: "Три действия"
    steps:
      - do: "Открой меню **Help** и найди пункт, который открывает папку пользователя."
        see: "Откроется папка Rack с подпапкой plugins."
      - do: "Открой меню **Library**."
        see: "Виден твой логин. Если ты не вошёл, будет пункт входа."
      - do: "Нажми Enter над пустым местом шкафа и набери в поиске MCP."
        see: "В [[браузер модулей|браузере модулей]] находится модуль MCP Server. Если нет, вернись к подписке и Update all."
    modules: []
    faq:
      - q: "В поиске по MCP ничего нет."
        a: "Проверь подписку на Neural Harmonics в аккаунте на сайте, нажми «Update all» и перезапусти Rack. Rack читает плагины только при запуске."
      - q: "Не получается открыть браузер модулей."
        a: "Наведи курсор на пустое место шкафа, не на модуль, и нажми Enter. Подойдёт и правый щелчок по пустому месту."
      - q: "Как понять, что все пять плагинов встали?"
        a: "Найди в браузере по одному модулю: MCP Server, Clocked, Plateau, Clouds и Recorder. Все пять нашлись, значит всё в порядке."

  - id: b7
    type: recap
    preset: recap
    title: "Итог"
    page: |
      # Итог
      - Модули приходят плагинами. Часть вшита в Rack, остальное берётся из **VCV Library**.
      - Подписка оформляется на сайте, установка — в Rack: Library → Update all и перезапуск.
      - Нужны пять плагинов: Neural Harmonics, Impromptu Modular, Valley, Audible Instruments и VCV Recorder.
      Патча в этом уроке нет, сохранять нечего.
      **Источники:** справка VCV Rack, раздел «Installing & Running». Форумная вики «Getting started with VCV Rack». Omri Cohen, «Your first minutes in VCV 2». Тим Шатный, «VCV Rack — урок 1».
    questions:
      - q: "Ты подписался на Valley на сайте, но не перезапустил Rack. Что в браузере модулей?"
        free: true
        options:
          - { text: "Plateau там нет", correct: true, why: "Rack загружает плагины при запуске. Пока он не перезапущен, новый плагин не виден." }
          - { text: "Plateau есть, потому что подписка уже оформлена", why: "Подписка — запись на сайте. В программе она появляется после Update all и перезапуска." }
          - { text: "Plateau есть, но выключен", why: "Модули не бывают установлены и выключены. Нет плагина — нет модуля." }
    next: |
      # Дальше: 0.2
      Rack установлен. Разберём интерфейс: шкаф, браузер модулей, кабели и сохранение патча.
    faq:
      - q: "Что повторить, если что-то не встало?"
        a: "Пройди три действия ещё раз. Чаще всего не хватает «Update all» или перезапуска Rack."
      - q: "Где посмотреть первые минуты в Rack на видео?"
        a: "У Omri Cohen есть ролик «Your first minutes in VCV 2», а на русском первый урок у Тима Шатного. Смотреть их для курса не обязательно."
