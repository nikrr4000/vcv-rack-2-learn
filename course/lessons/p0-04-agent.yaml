id: p0-04-agent
num: "0.4"
part: 0
title: "Подключаем репетитора"
goal: "Понять, как репетитор в Rack читает патч через MCP Server, чего он не делает и что работает без Atlas."
builds: "Канал, по которому репетитор видит твой патч. Дальше он смотрит, что ты собрал, но ничего не меняет сам."
minutes: 20
requires: [p0-03-audio-out]
glossary: [MCP-сервер, порт, кабель]
sources: [nh-readme, vcv-manual-getting-started]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: "Подключаем репетитора"
    page: |
      # 0.4 Подключаем репетитора
      **Ты научишься:** понимать, как репетитор читает твой патч, и пользоваться его быстрыми действиями.
      **Ты соберёшь:** патч из урока 0.3 (VCO → Audio 2) и попросишь репетитора пересказать его.
      **Понадобится:** 20 минут. Для живых ответов нужен запущенный Atlas, приложение курса на твоём компьютере. Без него урок тоже проходится.
      Репетитор живёт в панели справа от шкафа. Он только читает патч и ничего в нём не меняет.
    figure: { template: flow, nodes: [{ id: rack, label: Rack, kind: audio }, { id: mcp, label: MCP Server, kind: cv }, { id: tutor, label: Репетитор, kind: cv }], edges: [{ from: rack, to: mcp, kind: cv }, { from: mcp, to: tutor, kind: cv }], layout: row, caption: "Сведения идут к репетитору. Обратно в патч он ничего не пишет." }
    faq:
      - q: "Репетитор будет что-то делать в моём патче?"
        a: "Нет. Он читает модули, кабели и положения ручек, а собирает и меняет патч только твоя рука. Демо в уроках собраны заранее."
      - q: "Нужен ли интернет?"
        a: "Для ответов репетитора нужен запущенный Atlas, а он вызывает модель. Текст урока, быстрые ответы, квизы и проверки работают и без него."
      - q: "Что такое Atlas?"
        a: "Приложение курса на твоём компьютере. Оно держит репетитора и общается с Rack через MCP Server."

  - id: b2
    type: quiz
    preset: quiz
    title: "Что ты уже знаешь"
    lead: |
      # Сначала угадай
      Три вопроса до объяснений. Ошибаться можно: ответы покажут, о чём урок.
    questions:
      - q: "Что такое MCP Server в Rack?"
        free: true
        options:
          - { text: "Модуль, который открывает на твоём компьютере локальный сервер для чтения патча", correct: true, why: "Через него приложение-помощник видит модули, кабели и ручки." }
          - { text: "Звуковой модуль, который играет сам", why: "У него нет звуковых выходов, только служебный выход Server heartbeat." }
          - { text: "Онлайн-сервис, куда уходит копия патча", why: "Сервер слушает только адрес 127.0.0.1, то есть твой компьютер." }
      - q: "Что репетитор может сделать с твоим патчем?"
        options:
          - { text: "Только прочитать: модули, кабели, значения ручек", correct: true, why: "Инструментов для записи у репетитора нет. Он ничего не добавляет, не двигает и не удаляет." }
          - { text: "Собрать демо в своём ряду", why: "Демо в уроках собраны заранее. Репетитор не строит и не убирает ничего в патче." }
          - { text: "Повернуть ручку, если попросишь", why: "Менять параметры он не может. Ручку поворачиваешь ты." }
      - q: "Atlas не запущен. Что продолжает работать?"
        options:
          - { text: "Текст урока, быстрые ответы, квизы и проверки", correct: true, why: "Всё это записано в самом уроке и не зависит от Atlas." }
          - { text: "Ничего: без Atlas урок закрыт", why: "Урок хранится в Rack. Закрывается только свободный диалог с репетитором." }
          - { text: "Только свободные вопросы репетитору", why: "Как раз они требуют Atlas. Без него репетитор недоступен." }

  - id: b3
    type: story
    preset: story
    title: "Как репетитор видит патч"
    page: |
      # Как репетитор видит патч
      Репетитор и Rack — две разные программы. Им нужен общий язык: протокол MCP, набор именованных операций вроде «покажи модули».
      Модуль **MCP Server** — сторона Rack. Он поднимает на твоём компьютере маленький [[MCP-сервер|сервер]] и отвечает на запросы.
      Адрес сервера — `127.0.0.1`, [[порт]] 2600. Это локальный адрес: наружу из компьютера он не выходит.
      Репетитор читает: список модулей, [[кабель|кабели]], значения ручек и напряжение на подключённых выходах. Сам модуль умеет и менять патч, но репетитору эти операции закрыты.
    figure: { template: table, rows: [[Читает, Не делает], [Модули, Не добавляет], [Кабели, Не тянет], [Ручки, Не крутит], [Напряжение, Не сохраняет патч]], caption: "Репетитор смотрит на патч, но не трогает его." }
    simpler: "Репетитор — как тренер у окна, который смотрит, как ты играешь. Он видит, какие инструменты и провода у тебя на столе, и подсказывает. Но руками ничего не двигает."
    faq:
      - q: "Куда идёт информация о моём патче?"
        a: "Сервер слушает только адрес 127.0.0.1, то есть твой компьютер. Atlas читает патч локально и передаёт репетитору то, что нужно для ответа."
      - q: "Видит ли репетитор мой звук?"
        a: "Звук он не слышит. Ему доступны числа: модули, кабели, ручки и напряжение. О том, что ты слышишь, он спрашивает тебя."
      - q: "Почему порт 2600?"
        a: "Это порт по умолчанию у модуля MCP Server. Atlas ждёт патч именно там. Если порт занят, число можно изменить, и Atlas нужно сообщить об этом."

  - id: b4
    type: story
    preset: story
    title: "Быстрые ответы и действия"
    page: |
      # Быстрые ответы и действия
      Под репетитором стоят **чипы** — готовые вопросы к текущему ряду. Нажми чип, и ответ появится сразу с пометкой «из урока». Модель при этом не вызывается.
      Ниже четыре быстрых действия: «Объясни проще», «Пример», «Подсказка», «Проверь мой патч». Последнее читает патч и называет, что работает и что поправить.
    page2: |
      # Без Atlas
      Если Atlas не запущен, свободный вопрос получит ответ «Репетитор недоступен: Atlas не запущен».
      Чипы с ответами из урока, текст рядов, квизы и проверки работают как обычно.
      Запусти Atlas и повтори вопрос, когда понадобится живой ответ.
    simpler: "Чипы — как таблички «Частые вопросы» в магазине. Ответ уже написан, ждать не нужно. Живой продавец вызывается кнопкой, но он может быть на перерыве. Тогда читай таблички."
    faq:
      - q: "Чем чип отличается от вопроса в поле?"
        a: "Чип показывает готовый ответ мгновенно и с пометкой «из урока». Вопрос из поля уходит репетитору через Atlas и приходит чуть позже."
      - q: "Что делает «Проверь мой патч»?"
        a: "Репетитор читает твой патч и называет, что в нём работает и какую одну вещь поправить. Сам он ничего не исправляет."
      - q: "Что делать, если репетитор недоступен?"
        a: "Нажимай чипы и читай текст ряда. Для живых ответов запусти Atlas и повтори вопрос."

  - id: b5
    type: story
    preset: story
    title: "Панель MCP Server"
    page: |
      # Панель MCP Server
      Модуль уже стоит в начале ряда 1 этого патча. Второй MCP Server на том же порту конфликтует с первым, поэтому свой не ставь.
      На панели три вещи.
      **HTTP Port** — номер порта от 2000 до 9999. Atlas ждёт 2600.
      **Enable HTTP Server** — включает сервер. Пока он выключен, порт никто не слушает и репетитор не читает патч.
      **Server heartbeat** — служебный выход «пульс сервера». Это не звук, к Audio его не подключают.
    faq:
      - q: "Нужно ли подключать Server heartbeat к Audio?"
        a: "Нет. Это служебный выход, он не несёт звук. Оставь его без кабеля."
      - q: "Что будет, если выключить Enable HTTP Server?"
        a: "Сервер перестанет слушать порт, и репетитор не сможет читать патч из Rack. Текст урока и проверки продолжат работать. Включи переключатель обратно."
      - q: "Порт занят другой программой. Что делать?"
        a: "Поменяй число в HTTP Port на другое и сообщи об этом Atlas в настройках. Курс по умолчанию ждёт 2600."

  - id: b6
    type: try
    preset: try
    title: "Покрути сам"
    steps:
      - do: "Нажми любой чип под репетитором."
        see: "Ответ появляется сразу, с пометкой «из урока»."
      - do: "Нажми «Проверь мой патч»."
        see: "Если Atlas запущен, репетитор называет модули, кабели и частоту VCO. Если нет, видишь «Репетитор недоступен: Atlas не запущен»."
      - do: "Сдвинь **Frequency** у VCO и снова нажми «Проверь мой патч»."
        see: "Новая частота названа в ответе. Репетитор читает то, что стоит на ручке сейчас."
      - do: "Нажми «Объясни проще» на любом ряду с текстом."
        see: "Ответ либо готовый из урока, либо живой, если Atlas запущен."
      - do: "Открой правым щелчком меню любого модуля и сразу спроси репетитора."
        see: "Ответ может задержаться или не прийти. Закрой меню и повтори, это не поломка."
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "220" } } }
    cables:
      - { from: [vco, Sine], to: [audio, "To \"device output 1\""] }
      - { from: [vco, Sine], to: [audio, "To \"device output 2\""] }
    notes:
      - after: vco
        text: "Двигай эту ручку в третьем шаге."
        targets: [{ module: vco, param: Frequency }]
    faq:
      - q: "Репетитор отвечает, что патч прочитать нельзя."
        a: "Проверь переключатель Enable HTTP Server на MCP Server и порт 2600. Закрой открытые меню в Rack и повтори вопрос."
      - q: "Запрос не проходит, пока открыто меню. Это поломка?"
        a: "Нет. Rack отвечает на запросы в потоке интерфейса, а открытое меню его занимает. Закрой меню, и запрос пройдёт."
      - q: "Звука нет, хотя всё подключено."
        a: "Это настройка Audio, а не репетитора. Проверь выбранное устройство в меню Audio и системную громкость, как в уроке 0.3."

  - id: b7
    type: practice
    preset: practice
    title: "Практика — патч для репетитора"
    task: |
      Собери патч из урока 0.3 на верстаке.
      1. Поставь между маркерами **VCO**.
      2. `Sine` → `To "device output 1"` и `To "device output 2"` у Audio этого ряда.
      3. **Frequency** держи в пределах 80–1000 Гц, **Level** не выше 0 дБ.
      4. Нажми «Проверить». Потом нажми «Проверь мой патч» у репетитора.
    given: [audio]
    check: p0-04-agent
    hints:
      "module:vco":
        - Источника звука пока нет.
        - Генератор живёт в плагине Fundamental.
        - Поставь на верстак VCO из Fundamental.
      "module:out":
        - Не найден выход на устройство.
        - Модуль Audio 2 уже дан в этом ряду. Возможно, ты его убрал.
        - Верни Audio 2 из плагина Core.
      "cable:1":
        - Звук не доходит до левого канала.
        - Какой выход VCO даёт синусоиду?
        - "Кабель из `Sine` у VCO в `To \"device output 1\"` у Audio."
      "cable:2":
        - Звук идёт только в одно ухо.
        - У Audio два входа, и каждому нужен свой кабель.
        - "Второй кабель из `Sine` в `To \"device output 2\"` у Audio."
      "param:1":
        - Тон вне удобного диапазона.
        - Посмотри на ручку Frequency у VCO.
        - Верни Frequency в диапазон 80–1000 Гц, по умолчанию 261,63 Гц.
      "param:2":
        - Громкость вне нормы.
        - Посмотри на ручку Level у Audio.
        - Поставь Level в диапазон от -40 до 0 дБ. Двойной щелчок вернёт 0 дБ.
      "probe:1":
        - Сигнал на выходе почти не меняется.
        - Кабель воткнут в Sine, а не в другой выход?
        - Проверь кабель из `Sine` и верни Frequency не в крайнее левое положение.
    faq:
      - q: "Репетитор пересказал патч не так, как я его вижу."
        a: "Он читает то, что сейчас в Rack. Закрой открытые меню, подожди секунду и нажми «Проверь мой патч» ещё раз."
      - q: "Проверка идёт без репетитора?"
        a: "Да. Проверка работает внутри Rack и не зависит от Atlas. Репетитор нужен только для разбора словами."
      - q: "Репетитор может поправить патч за меня?"
        a: "Нет. Он назовёт, что работает и что поправить, а кабель или ручку ты исправишь сам."

  - id: b8
    type: debug
    preset: debug
    title: "Найди поломку"
    task: |
      Тон слышен только в одном ухе.
      Нажми «Проверь мой патч» (если Atlas запущен) или найди причину сам и верни одним кабелем.
    modules:
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "220" } } }
      - { ref: audio, plugin: Core, slug: AudioInterface2 }
    cables:
      - { from: [vco, Sine], to: [audio, "To \"device output 1\""] }
      - { from: [vco, Sine], to: [audio, "To \"device output 2\""] }
    break: { remove_cable: [vco, Sine, audio, "To \"device output 1\""] }
    check: { kind: fixed, expect_cable: [vco, Sine, audio, "To \"device output 1\""] }
    hints:
      fixed:
        - Сколько кабелей идёт в Audio?
        - "У Audio два входа: один для левого уха, другой для правого. Какой пуст?"
        - "Кабель из `Sine` у VCO в `To \"device output 1\"` у Audio."
    faq:
      - q: "Репетитор назвал причину, но не исправил её. Почему?"
        a: "У него нет инструментов записи. Он читает патч и подсказывает, а кабель возвращаешь ты."
      - q: "Откуда репетитор знает про кабели?"
        a: "Он читает список кабелей из Rack через MCP Server. Поэтому видит, что до первого входа Audio кабеля нет."

  - id: b9
    type: recap
    preset: recap
    title: "Итог"
    page: |
      # Итог
      - **MCP Server** открывает локальный сервер на `127.0.0.1`, порт 2600. Через него репетитор читает патч.
      - Репетитор только читает. Он не добавляет модули, не тянет кабели и не крутит ручки.
      - Чипы дают готовые ответы «из урока» мгновенно. Быстрые действия: «Объясни проще», «Пример», «Подсказка», «Проверь мой патч».
      - Без Atlas репетитор недоступен, а текст, чипы, квизы и проверки работают.
      Сохрани патч: ⌘S сохраняет твою копию урока.
      **Источники:** описание плагина Neural Harmonics (MCP Server) на GitHub. Справка VCV Rack, раздел «Getting Started».
    questions:
      - q: "Что нужно, чтобы репетитор прочитал твой патч?"
        free: true
        options:
          - { text: "Включённый Enable HTTP Server и порт 2600", correct: true, why: "Пока сервер выключен, порт никто не слушает. Atlas ждёт патч на порту 2600." }
          - { text: "Подключённый к Audio выход Server heartbeat", why: "Heartbeat — служебный выход. К Audio его не подключают." }
          - { text: "Открытое меню модуля", why: "Открытое меню как раз задерживает запросы. Закрой его." }
    next: |
      # Дальше: 1.1
      Среда готова. Начнём с самого звука: четыре формы волны, частота, амплитуда и Scope.
    faq:
      - q: "Нужно ли держать Atlas запущенным всегда?"
        a: "Нет. Он нужен для живых ответов репетитора. Урок, чипы, квизы и проверки работают без него."
      - q: "Что повторить перед частью 1?"
        a: "Безопасный порядок включения звука из урока 0.3 и два кабеля для двух ушей. С ними ты соберёшь «глаз» курса в уроке 1.1."
