id: p5-02-seq3
num: "5.2"
part: 5
title: Секвенсор SEQ 3
goal: Сыграть мелодию из восьми шагов самим секвенсором, задав высоту ручками, а ритм — кнопками.
builds: Основа лид-линии и баса в частях 8–9. Другая мелодия — это то же самое, только другое положение восьми ручек.
minutes: 40
requires: [p5-01-clock-tempo, p3-05-first-voice]
glossary: [секвенсор, шаг, ряд триггеров, пауза, полутон как 1/12 В]
sources: [vcv-free-manual, leonov-seq3, samesound-first-patch]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: Секвенсор SEQ 3
    page: |
      # 5.2 Секвенсор SEQ 3
      **Ты научишься:** задавать мелодию восемью ручками и ритм восемью кнопками **SEQ 3**.
      **Ты соберёшь:** голос из урока 3.5, но высоту ему даёт [[секвенсор]], а не твоя рука.
      **Понадобится:** 40 минут, уроки 3.5 и 5.1. Звук будет, начни с тихой громкости.
      Секвенсор играет за тебя. Ты один раз расставляешь ноты, а дальше он ходит по ним по кругу.
    figure: { template: steps, values: [0, 2, 4, 7, 4, 2, 0, 7], gates: [1, 1, 1, 0, 1, 1, 1, 0], caption: "Восемь шагов: высота каждого шага и места, где нота звучит." }
    faq:
      - q: Секвенсор сам сочиняет мелодию?
        a: Нет. Он только хранит то, что ты поставил, и проигрывает по кругу. Ноты задают ручки, ритм задают кнопки, а скорость берётся из такта.
      - q: Почему SEQ 3, а не что-то посложнее?
        a: "У него всё на виду: восемь шагов, три ряда ручек и ряд кнопок. На нём понятно, как работает любой секвенсор. Позже ты встретишь более хитрые."
      - q: Будет ли громко?
        a: Нет, если начать с тихой громкости. Убавь звук в системе, потом поднимай Level у модуля Audio.

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса про секвенсор. Ошибаться можно: ответы покажут, что разобрать.
    questions:
      - q: Что отдаёт выход CV 1 на третьем шаге?
        free: true
        options:
          - { text: "Напряжение ручки CV 1 step 3, и держит его до следующего шага", correct: true, why: "Каждый шаг хранит своё напряжение. Выход держит его всё время, пока шаг активен." }
          - { text: "Короткий импульс «сейчас»", why: "Импульс даёт выход Trigger. CV 1 выдаёт ровное напряжение, а не событие." }
          - { text: "Сумму трёх рядов CV", why: "У каждого ряда свой выход: CV 1, CV 2 и CV 3. Они не складываются." }
      - q: Как сделать паузу на четвёртом шаге?
        options:
          - { text: "Выключить кнопку Step 4 trigger", correct: true, why: "Без триггера огибающая не запустится, и звука на шаге нет. Напряжение CV при этом остаётся." }
          - { text: "Поставить CV 1 step 4 в ноль", why: "Ноль вольт — это нота C4, а не тишина. Высота есть, пока шаг играет." }
          - { text: "Уменьшить Steps до 3", why: "Так цикл станет короче, а пауза в середине не появится." }
      - q: Сколько вольт соответствует одному полутону в стандарте «вольт на октаву»?
        options:
          - { text: "1/12 В, около 0,083 В", correct: true, why: "В октаве 12 полутонов, а октава — это 1 В. Значит, полутон — двенадцатая часть вольта." }
          - { text: "1 В", why: "Целый вольт — это октава, а не полутон." }
          - { text: "0,1 В", why: "Круглое число удобно, но не точно. Строй требует именно 1/12 В." }

  - id: b3
    type: story
    preset: story
    title: Таблица с указателем
    page: |
      # Таблица с указателем
      [[Секвенсор]] — таблица значений и указатель, который идёт по ней. Каждый импульс такта переводит указатель на строку ниже.
      Таблица замкнута в кольцо: после последней строки идёт первая.
      У **SEQ 3** строк восемь. Это [[шаг|шаги]]. В каждом шаге три напряжения и одна кнопка «звучать или нет».
    figure: { template: steps, values: [0, 2, 4, 7, 4, 2, 0, 7], gates: [1, 1, 1, 0, 1, 1, 1, 0], caption: "Указатель идёт слева направо и после восьмого шага возвращается к первому." }
    simpler: Представь ряд из восьми ступенек и мячик, который перепрыгивает на следующую при каждом тике. На каждой ступеньке написана нота. Дойдя до конца, мячик возвращается к первой.
    faq:
      - q: Кто двигает указатель?
        a: Тактовые импульсы. У SEQ 3 есть свой внутренний такт с ручкой Tempo. Если вставить кабель в вход Clock, указатель пойдёт от внешнего такта, например от Clocked.
      - q: Что будет после восьмого шага?
        a: "Указатель вернётся на первый. Цикл можно сократить ручкой Steps: например, на четырёх шагах он замкнётся после четвёртого."
      - q: Три напряжения на шаге — зачем?
        a: "Первое обычно задаёт высоту, второе и третье — любые другие параметры, например яркость фильтра. Каждое имеет свой выход: CV 1, CV 2 и CV 3."

  - id: b4
    type: story
    preset: story
    title: Мелодия и ритм
    page: |
      # Мелодия и ритм
      Высота идёт по выходу **CV 1**. Ручка шага хранит напряжение, а в стандарте «вольт на октаву» вольты — это ноты.
      Один [[полутон как 1/12 В|полутон]] — 1/12 В, около 0,083 В. Октава — ровно 1 В.
      Ритм идёт по выходу **Trigger**. Кнопка включена — на шаге есть импульс, и огибающая запускается. Выключена — это [[пауза]].
      Ряд кнопок — это [[ряд триггеров]]. Высота и ритм независимы: можно менять одно, не трогая другое.
    figure: { template: keyboard, from: C4, to: C5, marks: [{ note: C4, volts: 0 }, { note: C5, volts: 1 }], caption: "От C4 до C5 ровно 1 В: двенадцать полутонов по 1/12 В." }
    simpler: Высота — это что играть, ритм — когда играть. Ручки пишут ноты на нотном стане, кнопки решают, какие из нот прозвучат, а какие будут паузой.
    faq:
      - q: Чем пауза отличается от ноты с нулём вольт?
        a: "Ноль вольт — это нота C4, она звучит. Пауза — шаг с выключенным триггером: огибающая не запускается, и звука нет, хотя напряжение CV на шаге остаётся."
      - q: Как поставить ровно нужную ноту ручкой?
        a: На слух или по подписи, пока без точности. Ручка плавная, и попасть в 1/12 В вручную трудно. Поэтому в уроке 5.3 мы подключим квантизатор, который округлит ноты до строя.
      - q: Почему триггер, а не гейт?
        a: Огибающей достаточно короткого импульса, чтобы стартовать. Длину ноты тогда задают Decay и Release у ADSR, а не кнопка.

  - id: b5
    type: live
    preset: live
    title: Голос с секвенсором
    page: |
      # Голос с секвенсором
      Перед тобой голос из урока 3.5, но вместо Push работает **SEQ 3**. Мелодия идёт по кругу из восьми шагов.
      Выход **CV 1** задаёт высоту, выход **Trigger** запускает огибающую.
      На шагах 4 и 8 нота не звучит. Послушай, где в цикле паузы.
    modules:
      - { ref: seq, plugin: Fundamental, slug: SEQ3, params: { Tempo: { display: "120" }, Steps: { display: "8" }, CV 1 step 1: { raw: 0 }, CV 1 step 2: { raw: 0.1667 }, CV 1 step 3: { raw: 0.3333 }, CV 1 step 4: { raw: 0.5833 }, CV 1 step 5: { raw: 0.3333 }, CV 1 step 6: { raw: 0.1667 }, CV 1 step 7: { raw: 0 }, CV 1 step 8: { raw: 0.5833 }, Step 1 trigger: { raw: 1 }, Step 2 trigger: { raw: 1 }, Step 3 trigger: { raw: 1 }, Step 4 trigger: { raw: 0 }, Step 5 trigger: { raw: 1 }, Step 6 trigger: { raw: 1 }, Step 7 trigger: { raw: 1 }, Step 8 trigger: { raw: 0 } } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "130.81" } } }
      - { ref: vcf, plugin: Fundamental, slug: VCF, params: { Cutoff frequency: { display: "800" }, Resonance: { display: "30" } } }
      - { ref: vca, plugin: Fundamental, slug: VCA-1, params: { Level: { display: "100" } } }
      - { ref: env, plugin: Fundamental, slug: ADSR, params: { Attack: { display: "5" }, Decay: { display: "300" }, Sustain: { display: "40" }, Release: { display: "400" } } }
    cables:
      - { from: [seq, CV 1], to: [vco, 1V/octave pitch] }
      - { from: [seq, Trigger], to: [env, Gate] }
      - { from: [vco, Sawtooth], to: [vcf, Audio] }
      - { from: [vcf, Lowpass filter], to: [vca, Channel] }
      - { from: [env, Envelope], to: [vca, CV] }
      - { from: [vca, Channel], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: seq, text: "**CV 1** — высота, **Trigger** — ритм. Два выхода, два дела.", targets: [{ module: seq, output: CV 1 }, { module: seq, output: Trigger }] }
      - { after: seq, text: "**Tempo** — скорость, пока в Clock нет кабеля.", targets: [{ module: seq, param: Tempo }] }
    faq:
      - q: Мелодия не играет. Что проверить?
        a: Возможно, секвенсор остановлен. Новый SEQ 3 уже идёт, а кнопка Run на идущем останавливает. Нажми Run один раз и послушай ещё раз.
      - q: Почему мелодия звучит ступеньками?
        a: Каждая ручка CV 1 стоит на своём напряжении. На шагах 1 и 7 ручки равны, поэтому ноты там одинаковые.
      - q: Где в мелодии паузы?
        a: На шагах 4 и 8, их кнопки Step 4 trigger и Step 8 trigger выключены. Высота у этих шагов задана, но огибающая молчит.

  - id: b6
    type: anatomy
    preset: anatomy
    title: SEQ 3 — такт и шаги
    page: |
      # SEQ 3 — такт и шаги
      Верхняя часть панели отвечает за ход секвенсора. Ряды ручек разберём в следующем блоке.
    module: { ref: seq, plugin: Fundamental, slug: SEQ3 }
    notes:
      - { text: "**Tempo** — скорость внутреннего такта в BPM. Работает, пока в **Clock** нет кабеля.", targets: [{ module: seq, param: Tempo }, { module: seq, input: Clock }] }
      - { text: "**Run** — запуск и остановка. Новый SEQ 3 уже идёт, нажатие на идущем останавливает.", targets: [{ module: seq, param: Run }, { module: seq, input: Run }] }
      - { text: "**Reset** — следующий шаг станет первым. Тот же сигнал принимает вход **Reset**.", targets: [{ module: seq, param: Reset }, { module: seq, input: Reset }] }
      - { text: "Кнопка **Clock** делает один шаг вручную. Удобно, чтобы услышать шаги по одному.", targets: [{ module: seq, param: Clock }] }
      - { text: "**Steps** — сколько шагов в цикле, от 1 до 8. Вход **Steps** меняет это напряжением.", targets: [{ module: seq, param: Steps }, { module: seq, input: Steps }] }
      - { text: "**Tempo CV** и **Steps CV** — глубина влияния входов Tempo и Steps, в процентах.", targets: [{ module: seq, param: Tempo CV }, { module: seq, param: Steps CV }] }
    later:
      - { what: "Выходы Steps, Clock, Run, Reset — для цепочки секвенсоров", lesson: "9.2" }
    faq:
      - q: Чем кнопка Clock отличается от входа Clock?
        a: Кнопка делает один шаг вручную. Вход принимает такт кабелем, и тогда внутренний Tempo перестаёт работать. Оба двигают указатель на следующий шаг.
      - q: Что произойдёт, если Steps поставить на 1?
        a: Секвенсор будет играть один шаг по кругу. Нота повторяется на каждом импульсе такта. Это быстрый способ послушать один шаг отдельно.
      - q: Кабель в Clock есть, а ручка Tempo не работает. Баг?
        a: Нет. Пока в Clock подключён кабель, секвенсор слушается внешнего такта. Вытащи кабель, и Tempo снова заработает.

  - id: b7
    type: anatomy
    preset: anatomy
    title: SEQ 3 — ряды и выходы
    page: |
      # SEQ 3 — ряды и выходы
      Три ряда ручек, ряд кнопок и выходы справа. Всё, что нужно для мелодии, лежит здесь.
    module: { ref: seq, plugin: Fundamental, slug: SEQ3 }
    notes:
      - { text: "**CV 1 step 1** … **step 8** — напряжение каждого шага, от −10 до 10 В. Это высота: полутон — 1/12 В.", targets: [{ module: seq, param: CV 1 step 1 }, { module: seq, param: CV 1 step 8 }] }
      - { text: "Выход **CV 1** выдаёт напряжение текущего шага. Он идёт во вход высоты у VCO.", targets: [{ module: seq, output: CV 1 }] }
      - { text: "Ряды **CV 2** и **CV 3** устроены так же и дают ещё два напряжения на каждом шаге.", targets: [{ module: seq, param: CV 2 step 1 }, { module: seq, output: CV 2 }, { module: seq, output: CV 3 }] }
      - { text: "**Step 1 trigger** … **Step 8 trigger** — кнопки ритма. Включённый шаг запускает ноту, выключенный молчит.", targets: [{ module: seq, param: Step 1 trigger }, { module: seq, param: Step 8 trigger }] }
      - { text: "Выход **Trigger** выдаёт импульс на включённых шагах. Он идёт в **Gate** у ADSR.", targets: [{ module: seq, output: Trigger }] }
      - { text: "Выходы **Step 1** … **Step 8** держат 10 В, пока играет свой шаг. Пригодятся для событий на отдельных шагах.", targets: [{ module: seq, output: Step 1 }, { module: seq, output: Step 8 }] }
    later:
      - { what: "Выходы Step N для событий на отдельных шагах", lesson: "5.5" }
    faq:
      - q: Какие значения ставить на ручках CV 1?
        a: Для мелодии ставь небольшие значения, до 1–2 В. Каждые 0,0833 В — полутон, 1 В — октава. Большие напряжения уводят ноту за слышимый диапазон.
      - q: Нужно ли настраивать CV 2 и CV 3?
        a: Нет, пока они не подключены. Позже ты подашь CV 2 на фильтр, и цвет звука станет меняться от шага к шагу.
      - q: Чем выход Trigger отличается от Step 1?
        a: Trigger даёт короткий импульс на включённых шагах. Step 1 держит 10 В всё время, пока играет первый шаг, независимо от кнопки.

  - id: b8
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Поверни **CV 1 step 3** вверх и вниз."
        see: "Меняется высота только третьей ноты. На Scope третья ступенька идёт выше или ниже."
      - do: "Включи и выключи **Step 4 trigger**."
        see: "Ритм меняется: четвёртая нота появляется и пропадает. Высота остальных нот не меняется."
      - do: "Уменьши **Steps** с 8 до 4."
        see: "Мелодия короче: после четвёртой ноты цикл начинается заново. На Scope четыре ступеньки."
      - do: "Измени **Tempo** от 60 до 240 BPM."
        see: "Мелодия быстрее, высота нот та же."
    modules:
      - { ref: seq, plugin: Fundamental, slug: SEQ3, params: { Tempo: { display: "120" }, Steps: { display: "8" }, CV 1 step 1: { raw: 0 }, CV 1 step 2: { raw: 0.1667 }, CV 1 step 3: { raw: 0.3333 }, CV 1 step 4: { raw: 0.5833 }, CV 1 step 5: { raw: 0.3333 }, CV 1 step 6: { raw: 0.1667 }, CV 1 step 7: { raw: 0 }, CV 1 step 8: { raw: 0.5833 }, Step 1 trigger: { raw: 1 }, Step 2 trigger: { raw: 1 }, Step 3 trigger: { raw: 1 }, Step 4 trigger: { raw: 0 }, Step 5 trigger: { raw: 1 }, Step 6 trigger: { raw: 1 }, Step 7 trigger: { raw: 1 }, Step 8 trigger: { raw: 0 } } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "130.81" } } }
      - { ref: vcf, plugin: Fundamental, slug: VCF, params: { Cutoff frequency: { display: "800" }, Resonance: { display: "30" } } }
      - { ref: vca, plugin: Fundamental, slug: VCA-1, params: { Level: { display: "100" } } }
      - { ref: env, plugin: Fundamental, slug: ADSR, params: { Attack: { display: "5" }, Decay: { display: "300" }, Sustain: { display: "40" }, Release: { display: "400" } } }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "500" } } }
    cables:
      - { from: [seq, CV 1], to: [vco, 1V/octave pitch] }
      - { from: [seq, Trigger], to: [env, Gate] }
      - { from: [vco, Sawtooth], to: [vcf, Audio] }
      - { from: [vcf, Lowpass filter], to: [vca, Channel] }
      - { from: [env, Envelope], to: [vca, CV] }
      - { from: [vca, Channel], to: [audio, "To \"device output 1\""] }
      - { from: [seq, CV 1], to: [scope, Ch 1] }
    notes:
      - { after: seq, text: "Шаги 1–4 — ручки и кнопки этого секвенсора.", targets: [{ module: seq, param: CV 1 step 3 }, { module: seq, param: Step 4 trigger }, { module: seq, param: Steps }, { module: seq, param: Tempo }] }
    faq:
      - q: Покрутил CV 1 step 3, а мелодия не изменилась.
        a: Возможно, Steps стоит на 2 или меньше, и указатель до третьего шага не доходит. Подними Steps до 8 и послушай ещё раз.
      - q: Включил Step 4 trigger, но пауза осталась.
        a: Проверь, что кнопка горит. Если Steps меньше 4, четвёртый шаг не играет вообще. Подними Steps и включи кнопку.
      - q: Если поднять Tempo до 960, что будет?
        a: Мелодия станет очень быстрой и сольётся в жужжание. Огибающая не успеет закончиться. Вернись к 120–240 BPM, там шаги ещё слышны отдельно.

  - id: b9
    type: practice
    preset: practice
    title: Практика — своя мелодия
    task: |
      Собери голос с секвенсором сам, между маркерами «Верстак».
      1. **SEQ 3**, **VCO**, **VCF**, **VCA**, **ADSR**. Tempo — не ниже 100 BPM.
      2. Мелодия и ритм: `CV 1` → `1V/octave pitch` у VCO, `Trigger` → `Gate` у ADSR.
      3. Звук: `Sawtooth` → `Audio` у VCF, `Lowpass filter` → `Channel` у VCA, `Envelope` → `CV` у VCA, выход `Channel` → вход 1 у Audio.
      4. Поставь на ручках CV 1 разные значения и оставь хотя бы одну паузу.
      5. Убедись, что секвенсор идёт, и нажми «Проверить».
    given: [audio]
    check: p5-02-seq3
    hints:
      "module:seq":
        - Нужен источник мелодии.
        - Это секвенсор из набора Fundamental.
        - "Поставь на верстак **SEQ 3**."
      "module:vco":
        - Нужен источник звука.
        - Осциллятор из набора Fundamental.
        - "Поставь на верстак **VCO**."
      "module:vcf":
        - Нужен фильтр для тембра.
        - Фильтр из набора Fundamental.
        - "Поставь на верстак **VCF**."
      "module:vca":
        - Нужен усилитель, который решает, когда звучать.
        - Усилитель из набора Fundamental, в браузере он называется VCA.
        - "Поставь на верстак **VCA**."
      "module:env":
        - Нужна огибающая для громкости.
        - Огибающая из набора Fundamental.
        - "Поставь на верстак **ADSR**."
      "module:out":
        - Нужен выход звука.
        - Модуль Audio уже стоит в ряду и входит в проверку.
        - Не убирай Audio из ряда, подключай кабель к его первому входу.
      "cable:1":
        - Мелодия не доходит до высоты.
        - Какой выход SEQ 3 даёт напряжение первого ряда и какой вход у VCO принимает высоту?
        - "`CV 1` у SEQ 3 → `1V/octave pitch` у VCO."
      "cable:2":
        - Огибающая не знает, когда начинать.
        - Какой выход SEQ 3 отдаёт импульсы по шагам?
        - "`Trigger` у SEQ 3 → `Gate` у ADSR."
      "cable:3":
        - Пила есть, но фильтр её не слышит.
        - Какой выход VCO даёт пилу?
        - "`Sawtooth` у VCO → `Audio` у VCF."
      "cable:4":
        - До усилителя звук не доходит.
        - Какой выход VCF ведёт к входу Channel у VCA?
        - "`Lowpass filter` у VCF → `Channel` у VCA."
      "cable:5":
        - Шаги не открывают звук.
        - Что должно управлять VCA через вход CV?
        - "`Envelope` у ADSR → `CV` у VCA."
      "cable:6":
        - Голос собран, а тишина.
        - Откуда звук выходит из VCA и куда он должен прийти?
        - "`Channel` у VCA → `To \"device output 1\"` у Audio этого ряда."
      "param:1":
        - Темп слишком медленный.
        - Посмотри на ручку Tempo у SEQ 3. Проверка не успеет увидеть шаги.
        - Подними Tempo хотя бы до 100 BPM.
      "probe:1":
        - Высота не меняется.
        - Идёт ли секвенсор и стоят ли ручки CV 1 step на разных значениях?
        - "Выставь разные значения у CV 1 step 1…8. Если шаги не идут, нажми Run один раз: на идущем он останавливает."
      "probe:2":
        - Огибающая не поднимается.
        - Горят ли кнопки в ряду триггеров и идёт ли секвенсор?
        - "Включи несколько кнопок Step N trigger и проверь, что SEQ 3 идёт."
    faq:
      - q: Проверка ругается на CV 1, а ручки я покрутил.
        a: Возможно, секвенсор остановлен, и шаги стоят. Новый SEQ 3 уже идёт, а Run на идущем останавливает. Нажми Run один раз и проверь ещё раз.
      - q: Нужно ли подключать Trigger именно к Gate?
        a: Да. В Gate у ADSR огибающая получает команду «начать». Через другие входы она не запустится так, как нужно.
      - q: Можно ли взять другой выход VCO вместо Sawtooth?
        a: Проверка ждёт Sawtooth, как в уроке 3.5. Пила богата гармониками, поэтому фильтр с ней заметнее.

  - id: b10
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Мелодия играет, но цикл кончается слишком рано: слышно только часть нот.
      Найди одну ошибку и исправь её.
    modules:
      - { ref: seq, plugin: Fundamental, slug: SEQ3, params: { Tempo: { display: "120" }, Steps: { display: "8" }, CV 1 step 1: { raw: 0 }, CV 1 step 2: { raw: 0.1667 }, CV 1 step 3: { raw: 0.3333 }, CV 1 step 4: { raw: 0.5833 }, CV 1 step 5: { raw: 0.3333 }, CV 1 step 6: { raw: 0.1667 }, CV 1 step 7: { raw: 0 }, CV 1 step 8: { raw: 0.5833 }, Step 1 trigger: { raw: 1 }, Step 2 trigger: { raw: 1 }, Step 3 trigger: { raw: 1 }, Step 4 trigger: { raw: 1 }, Step 5 trigger: { raw: 1 }, Step 6 trigger: { raw: 1 }, Step 7 trigger: { raw: 1 }, Step 8 trigger: { raw: 1 } } }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "130.81" } } }
      - { ref: vcf, plugin: Fundamental, slug: VCF, params: { Cutoff frequency: { display: "800" }, Resonance: { display: "30" } } }
      - { ref: vca, plugin: Fundamental, slug: VCA-1, params: { Level: { display: "100" } } }
      - { ref: env, plugin: Fundamental, slug: ADSR, params: { Attack: { display: "5" }, Decay: { display: "300" }, Sustain: { display: "40" }, Release: { display: "400" } } }
    cables:
      - { from: [seq, CV 1], to: [vco, 1V/octave pitch] }
      - { from: [seq, Trigger], to: [env, Gate] }
      - { from: [vco, Sawtooth], to: [vcf, Audio] }
      - { from: [vcf, Lowpass filter], to: [vca, Channel] }
      - { from: [env, Envelope], to: [vca, CV] }
      - { from: [vca, Channel], to: [audio, "To \"device output 1\""] }
    break: { set_param: { module: seq, name: Steps, value: { display: "5" } } }
    check: { kind: fixed, expect_param: { module: seq, name: Steps, display_in: ["8"] } }
    hints:
      fixed:
        - Мелодия обрывается и начинается сначала раньше времени. Что решает длину цикла?
        - Посмотри на ручку Steps у SEQ 3.
        - Верни ручку Steps на 8.
    faq:
      - q: Почему мелодия не доигрывает цикл?
        a: Steps ограничивает длину цикла. Когда он стоит на 5, указатель после пятого шага прыгает обратно на первый, а шаги 6–8 просто не играют.
      - q: Как это услышать, не глядя на ручку?
        a: "Сосчитай ноты до повтора. Если их пять, а не восемь, цикл укорочен. Тот же эффект виден на Scope: ступенек пять, а не восемь."

  - id: b11
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - [[Секвенсор]] — таблица шагов и указатель. Такт двигает указатель по кругу.
      - Ручки CV 1 задают высоту: полутон — 1/12 В, октава — 1 В.
      - Кнопки триггеров задают ритм. Выключенная кнопка — [[пауза]], а не нота с нулём вольт.
      - Ручка Steps решает, сколько шагов в цикле.
      Сохрани патч: этот голос с секвенсором ты не раз перепишешь под бас и лид.
      **Источники:** руководство VCV Free (SEQ 3); А. Леонов, «Updated SEQ 3 and QUANTIZER patch»; К. Колотвин (samesound).
    questions:
      - q: Какой выход SEQ 3 отвечает за высоту, а какой за ритм?
        options:
          - { text: "CV 1 за высоту, Trigger за ритм", correct: true, why: "CV 1 держит напряжение шага, а Trigger выдаёт импульс на включённых шагах." }
          - { text: "Trigger за высоту, CV 1 за ритм", why: "Наоборот: высота — это напряжение, а ритм — импульсы. Они идут по разным выходам." }
          - { text: "Оба выхода дают высоту", why: "Только CV 1 управляет высотой. Trigger — это команда «играй сейчас»." }
      - q: Что делает ручка Steps?
        options:
          - { text: "Задаёт длину цикла от 1 до 8 шагов", correct: true, why: "После последнего активного шага указатель возвращается на первый." }
          - { text: "Задаёт число повторов мелодии", why: "Цикл повторяется без конца. Steps меняет его длину, а не число повторов." }
          - { text: "Задаёт скорость секвенсора", why: "Скорость задаёт Tempo или внешний такт. Steps её не касается." }
    next: |
      # Дальше: 5.3
      **Квантизатор.** Случайные и неточные ноты станут нотами выбранной шкалы, и мелодия перестанет фальшивить.
    faq:
      - q: Можно ли хранить две разные мелодии в одном SEQ 3?
        a: "В одном цикле — одну. Но у тебя есть три ряда CV: второй ряд может задавать, например, яркость фильтра, и мелодия оживёт без нового секвенсора."
      - q: Что повторить, если голос не звучит?
        a: Урок 3.5 про путь звука и урок 5.1 про такт. Чаще всего забывают кабель Envelope в CV или останавливают секвенсор кнопкой Run.
