      **Полифония.** Один набор модулей сыграет аккорд из нескольких нот сразу.
    faq:
      - q: Чем MIDI to Gate отличается от MIDI to CV по задаче?
        a: MIDI to CV даёт высоту и гейт одной ноты для мелодии. MIDI to Gate даёт отдельный гейт на каждую ноту диапазона, для ударных.
      - q: Что повторить, если пэд не запускает звук?
        a: Урок 3.4 про ADSR и урок 6.1 про выбор устройства и канала на MIDI-модуле. Чаще всего дело в канале или начальной ноте.
