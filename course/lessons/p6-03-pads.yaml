id: p6-03-pads
num: "6.3"
part: 6
title: Пэды как триггеры
goal: "Запускать огибающие пэдами MiniLab mkII: понять, что пэд — это нота, а MIDI to Gate превращает её в гейт."
builds: Руками играемые ударные для части 8. Здесь одна огибающая и один пэд, потом их станет восемь.
minutes: 30
requires: [p6-01-midi-cv, p3-04-adsr]
glossary: [пэд, нота как гейт, гейт, триггер, MIDI-канал, ретриггер]
sources: [vcv-manual-core, vcv-voltage-standards]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: Пэды как триггеры
    page: |
      # 6.3 Пэды как триггеры
      **Ты научишься:** запускать огибающие [[пэд|пэдом]] и отличать ударный голос от клавиатурного.
      **Ты соберёшь:** короткий ударный звук: **MIDI to Gate** → ADSR → VCA.
      **Понадобится:** 30 минут, MiniLab mkII и тихая громкость.
      Пэдов под рукой нет? Собери патч и пройди проверку: она читает только кабели и ручки.
    figure:
      template: flow
      layout: two-rows
      nodes:
        - { id: pad, label: Пэд, kind: gate }
        - { id: mg, label: MIDI to Gate, kind: gate }
        - { id: env, label: ADSR, kind: cv }
        - { id: vco, label: VCO, kind: audio }
        - { id: vca, label: VCA, kind: audio }
        - { id: out, label: Audio, kind: audio }
      edges:
        - { from: pad, to: mg, kind: gate }
        - { from: mg, to: env, kind: gate }
        - { from: env, to: vca, kind: cv }
        - { from: vco, to: vca, kind: audio }
        - { from: vca, to: out, kind: audio }
      caption: Пэд запускает огибающую, огибающая открывает VCA, а VCO даёт звук.
    faq:
      - q: Чем это отличается от голоса с клавиатуры?
        a: У ударного звука нет мелодии, и высота ему не нужна. Пэд сообщает лишь «ударили сейчас». Поэтому берём не MIDI to CV, а MIDI to Gate с гейтом на каждую ноту.
      - q: Что, если пэдов нет?
        a: "Собери патч и пройди проверку: она не получает MIDI. Услышать удар без пэда нельзя, поэтому вернись к нему, когда подключишь контроллер."
      - q: Сколько пэдов у MiniLab mkII?
        a: Восемь. Их хватает на выходы Gate 1 … Gate 8 модуля MIDI to Gate. Остальные выходы остаются свободными.

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса до объяснений. Ответы подскажут, что повторить.
    questions:
      - q: Что приходит на выход Gate 1, когда нажат первый пэд?
        free: true
        options:
          - { text: "10 В, пока пэд нажат, и 0 В после", correct: true, why: "Это гейт: он держится, пока палец на пэде, и падает при отпускании." }
          - { text: "Импульс 1 мс", why: "Короткий импульс — это триггер. Гейт у пэда держится всё время нажатия." }
          - { text: "Напряжение высоты по 1V/oct", why: "Высоту пэд не несёт. Для него важно только, нажат он или нет." }
      - q: Звук от пэда тянется, пока палец на пэде. Почему?
        options:
          - { text: "Гейт держится, пока пэд нажат, а Sustain у ADSR выше нуля", correct: true, why: "Пока гейт высокий, огибающая стоит на уровне Sustain и не падает до нуля." }
          - { text: "Слишком большой Decay", why: "Decay влияет на спад до Sustain, а не на то, сколько держится гейт." }
          - { text: "Пэд залип", why: "Так бывает редко. Сначала проверь Sustain." }
      - q: Пэды нажимаются, MIDI to Gate подключён, но ни один Gate не зажигается. Что проверить?
        options:
          - { text: "MIDI-канал и диапазон нот модуля", correct: true, why: "Пэды могут идти на другом канале, чем клавиши, и на ноты вне 16 нот модуля." }
          - { text: "Release у ADSR", why: "Release влияет на хвост звука. До прихода гейта он не относится." }
          - { text: "Sawtooth у VCO", why: "Форма волны не влияет на то, придёт ли гейт." }

  - id: b3
    type: story
    preset: story
    title: Пэд — это нота
    page: |
      # Пэд — это нота
      У ударного инструмента нет мелодии. Пэд сообщает: «ударили сейчас», и всё.
      Для MIDI пэд — обычная нота: нажали и отпустили. Поэтому каждой ноте диапазона достаётся свой выход с [[гейт|гейтом]]. Это [[нота как гейт]].
      Пэд запускает огибающую, а высоту тона задаёт ручка VCO.
    page2: |
      Правило для гейта простое. В Rack активный гейт даёт 10 В.
      MIDI to Gate выдаёт 10 В, пока пэд нажат, и 0 В, пока отпущен. Это не [[триггер]]: триггер короткий, а гейт держится.
    simpler: Пэд как звонок у двери. Нажал — звонок звенит, отпустил — стихает. Каждый пэд соответствует своему звонку, а какую мелодию он играет, решаешь потом.
    faq:
      - q: Почему у MIDI to Gate нет высоты?
        a: Модуль выдаёт гейт, а не высоту. Ударные звуки одной высоты не требуют. Если нужна нота с высотой, бери MIDI to CV из урока 6.1.
      - q: Чем гейт отличается от триггера?
        a: Гейт держится, пока пэд нажат. Триггер — короткий импульс около 1 мс. Для ударного звука с Sustain 0 разницы почти нет, а для долгого звука она большая.
      - q: Нота и пэд — одно и то же для Rack?
        a: Да. MIDI не различает их, это одни и те же сообщения. Различие только в том, как ты их используешь.

  - id: b4
    type: story
    preset: story
    title: Ударная огибающая
    page: |
      # Ударная огибающая
      Удар — это мгновенный подъём и быстрый спад. Для этого ставят **Attack** около 1 мс, **Decay** в сотни миллисекунд и **Sustain** на 0.
      При Sustain 0 длина гейта почти не важна. Нажал пэд коротко или долго — звук получится одинаковым.
      Если поднять Sustain, огибающая будет стоять наверху, пока пэд нажат. Получится не удар, а органная нота.
      Вход **Retrigger** у ADSR ждёт короткие импульсы — это [[ретриггер]]. Гейт с пэда подавай в **Gate**.
    figure: { template: adsr, a: 0.01, d: 0.2, s: 0, r: 0.1, gate: 0.6, markers: true, caption: "Ударная огибающая: быстрый подъём, спад до нуля, Sustain 0." }
    simpler: Мячик, брошенный об пол. Подпрыгнул мгновенно и сразу падает. Sustain 100 % был бы мячиком, который завис в воздухе, пока ты держишь руку.
    faq:
      - q: Почему Sustain 0, а не 10 или 20?
        a: При Sustain 0 огибающая после Decay падает до нуля, и звук затихает даже с нажатым пэдом. Это ударный характер. Значения до 10 % тоже допустимы.
      - q: Что делает Release в ударе?
        a: Доводит звук до тишины после отпускания пэда. Короткий Release оставляет «сухой» удар, длинный — тянет хвост.
      - q: Что будет, если подать гейт в Retrigger вместо Gate?
        a: Огибающая поднимется на мгновение, и получится щелчок. Retrigger принимает короткие импульсы, а не гейт. Подавай гейт в Gate.

  - id: b5
    type: live
    preset: live
    title: Ударный голос
    page: |
      # Ударный голос
      VCO даёт пилу низкого тона, ADSR открывает VCA на мгновение. Всё это запускает первый пэд.
      Выбери на **MIDI to Gate** [[драйвер и устройство MIDI|драйвер и устройство]], потом [[MIDI-канал|канал]] пэдов. Ударь по первому пэду.
      Ударь по второму пэду: **Gate 1** не зажжётся, зажжётся другой гейт.
      Пэдов нет? Звука не будет, но кабели и ручки те же, что в практике.
    modules:
      - { ref: trig, plugin: Core, slug: MIDITriggerToCVInterface }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "130.81" } } }
      - { ref: env, plugin: Fundamental, slug: ADSR, params: { Attack: { display: "1" }, Decay: { display: "200" }, Sustain: { display: "0" }, Release: { display: "100" } } }
      - { ref: vca, plugin: Fundamental, slug: VCA-1, params: { Level: { display: "100" } } }
    cables:
      - { from: [trig, Gate 1], to: [env, Gate] }
      - { from: [vco, Sawtooth], to: [vca, Channel] }
      - { from: [env, Envelope], to: [vca, CV] }
      - { from: [vca, Channel], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: trig, text: "**Gate 1** — первый пэд. Пока он нажат, на выходе 10 В.", targets: [{ module: trig, output: Gate 1 }] }
      - { after: env, text: "**Sustain** на 0: звук затихает сам, даже если пэд зажат.", targets: [{ module: env, param: Sustain }, { module: env, input: Gate }] }
    faq:
      - q: Ударил по пэду, а звука нет. Что смотреть?
        a: "Меню MIDI to Gate: драйвер, устройство, канал. Пэды часто идут не на тот канал, что клавиши. Выбери «Все каналы» или канал пэдов. Потом проверь начальную ноту диапазона."
      - q: Второй пэд не играет этот звук. Почему?
        a: Gate 2 не подключён к ADSR. Здесь кабель идёт только от Gate 1. Чтобы второй пэд тоже играл, подай Gate 2 в тот же Gate у ADSR.
      - q: Почему тон такой низкий?
        a: Frequency у VCO стоит на 130,81 Гц. Для ударной «бочки» или «тома» это подходит. Покрути ручку и найди свой тон.

  - id: b6
    type: anatomy
    preset: anatomy
    title: Панель MIDI to Gate
    page: |
      # Панель MIDI to Gate
      Ручек у модуля нет. Настройки лежат в меню, а на каждый пэд приходится свой выход.
    module: { ref: trig, plugin: Core, slug: MIDITriggerToCVInterface }
    notes:
      - { text: "**Верх панели** — драйвер, устройство и канал. Пэды MiniLab часто идут на другой канал, чем клавиши: выбери «Все каналы» или канал пэдов." }
      - { text: "**Gate 1 … Gate 8** — по одному выходу на ноту. Gate 1 соответствует нижней ноте диапазона. Выходы дальше, до Gate 16, остаются свободными.", targets: [{ module: trig, output: Gate 1 }, { module: trig, output: Gate 8 }] }
      - { text: "**Начальная нота диапазона** — в контекстном меню. Gate 1 должен совпасть с первым пэдом, иначе ни один гейт не зажжётся." }
      - { text: "**Режим velocity** — в контекстном меню: вместо 10 В выдаёт напряжение по силе удара." }
      - { text: "**Куда подавать Gate:** в вход **Gate** у ADSR, не в **Retrigger**. Retrigger для коротких импульсов." }
    later:
      - { what: "Режим velocity и динамика ударных", lesson: "8.6" }
    faq:
      - q: Почему пэд нажат, а ни один Gate не зажигается?
        a: Либо канал не тот, либо ноты пэдов вне диапазона из 16 нот модуля. Проверь канал и сдвинь начальную ноту. Номера нот пэдов зависят от пресета контроллера.
      - q: "Нужны ли два модуля: для клавиш и для пэдов?"
        a: Если клавиши и пэды на разных каналах, да. MIDI to CV для клавиш и MIDI to Gate для пэдов. Можно и общий канал, но это настройка контроллера.
      - q: Чем Gate 5 отличается от Gate 1?
        a: Только нотой, на которую реагирует. Каждый выход — свой гейт для своей ноты диапазона.

  - id: b7
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Ударь по пэду коротко, потом долго."
        see: При Sustain 0 звук одинаково короткий. На Scope быстрый всплеск и спад.
      - do: "Подними **Decay** от 50 до 800 мс."
        see: Хлопок становится длиннее, спад на Scope медленнее.
      - do: "Подними **Attack** от 1 до 100 мс."
        see: Щелчок превращается в мягкий вход, ударный характер пропадает.
      - do: "Подними **Sustain** от 0 до 100 %."
        see: Пока пэд нажат, звук держится на уровне Sustain и спадает только после отпускания.
      - do: "Верни **Sustain** на 0 и подай **Gate 2** в тот же **Gate** у ADSR."
        see: Второй пэд тоже играет этот звук. Одна огибающая обслуживает два пэда.
    modules:
      - { ref: trig, plugin: Core, slug: MIDITriggerToCVInterface }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "130.81" } } }
      - { ref: env, plugin: Fundamental, slug: ADSR, params: { Attack: { display: "1" }, Decay: { display: "200" }, Sustain: { display: "0" }, Release: { display: "100" } } }
      - { ref: vca, plugin: Fundamental, slug: VCA-1, params: { Level: { display: "100" } } }
      - { ref: scope, plugin: Fundamental, slug: Scope, params: { Time: { display: "5" } } }
    cables:
      - { from: [trig, Gate 1], to: [env, Gate] }
      - { from: [vco, Sawtooth], to: [vca, Channel] }
      - { from: [env, Envelope], to: [vca, CV] }
      - { from: [vca, Channel], to: [audio, "To \"device output 1\""] }
      - { from: [vca, Channel], to: [scope, Ch 1] }
    notes:
      - { after: env, text: "Шаги 2–4 — ручки этого ADSR.", targets: [{ module: env, param: Decay }, { module: env, param: Attack }, { module: env, param: Sustain }] }
    faq:
      - q: Нет пэдов. Что из шагов можно сделать?
        a: Ручки крутить можно, но без нажатия звука нет. Услышать результат получится, когда подключишь контроллер.
      - q: Поднял Sustain, и звук не затихает. Это поломка?
        a: Нет. Пока пэд нажат, гейт высокий, и огибающая держится на уровне Sustain. Отпустишь пэд — звук затихнет за Release.
      - q: Второй пэд молчит после шага 5. Почему?
        a: Проверь, что кабель идёт от Gate 2 в Gate, а не в Retrigger. И что начальная нота диапазона совпадает с твоим пэдом.

  - id: b8
    type: practice
    preset: practice
    title: Практика — ударный голос на пэде
    task: |
      Собери ударный голос сам, между маркерами «Верстак».
      1. **MIDI to Gate**, **VCO**, **ADSR** и **VCA**.
      2. Пэд запускает огибающую: `Gate 1` → `Gate` у ADSR.
      3. Путь звука: `Sawtooth` → `Channel` у VCA, `Envelope` → `CV` у VCA, выход `Channel` → вход 1 у Audio.
      4. **Sustain** не выше 10 %. Выбери устройство и канал пэдов на MIDI to Gate и нажми «Проверить».
    given: [audio]
    check: p6-03-pads
    hints:
      "cable:1":
        - Пэд не запускает огибающую.
        - Какой выход MIDI to Gate соответствует первому пэду?
        - "`Gate 1` у MIDI to Gate → вход `Gate` у ADSR."
      "cable:2":
        - Источник звука не дошёл до усилителя.
        - Какой выход VCO даёт пилу и какой вход у VCA принимает звук?
        - "`Sawtooth` у VCO → вход `Channel` у VCA."
      "cable:3":
        - Звук есть всегда или не откликается на пэд.
        - Что управляет громкостью VCA?
        - "`Envelope` у ADSR → вход `CV` у VCA."
      "cable:4":
        - Всё собрано, а тишина.
        - Откуда звук выходит из VCA и куда должен прийти?
        - "Выход `Channel` у VCA → `To \"device output 1\"` у Audio этого ряда."
      "param:1":
        - Звук тянется, пока пэд нажат.
        - Что делает Sustain, пока гейт высокий?
        - Убавь Sustain у ADSR до 10 % или ниже.
      "module:trig":
        - Модуля MIDI to Gate нет в патче.
        - Какой модуль превращает ноты в гейты по одному на ноту? Он в плагине Core.
        - Добавь MIDI to Gate и выбери на панели драйвер, устройство и канал пэдов.
    faq:
      - q: Все кабели на месте, а пэд молчит. Почему?
        a: Проверка не видит меню модуля. Выбери драйвер, устройство и канал пэдов. Если ни один Gate не зажигается при ударе, вопрос в канале или начальной ноте.
      - q: Звук тянется после пэда, но Sustain уже 10 %. Достаточно?
        a: Проверка пропускает до 10 %. Но для чисто ударного звука надёжнее 0. Тогда звук затихает сам, даже если пэд зажат.
      - q: Можно ли взять кнопку Push вместо MIDI to Gate?
        a: "Для этой проверки нужен именно MIDI to Gate: урок про пэды. Push остаётся для первых уроков."

  - id: b9
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Пэд нажимается, но вместо короткого удара звучит протяжная нота: она держится, пока палец на пэде.
      Найди одну ошибку и исправь её одной ручкой.
    modules:
      - { ref: trig, plugin: Core, slug: MIDITriggerToCVInterface }
      - { ref: vco, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "130.81" } } }
      - { ref: env, plugin: Fundamental, slug: ADSR, params: { Attack: { display: "1" }, Decay: { display: "200" }, Sustain: { display: "0" }, Release: { display: "100" } } }
      - { ref: vca, plugin: Fundamental, slug: VCA-1, params: { Level: { display: "100" } } }
    cables:
      - { from: [trig, Gate 1], to: [env, Gate] }
      - { from: [vco, Sawtooth], to: [vca, Channel] }
      - { from: [env, Envelope], to: [vca, CV] }
      - { from: [vca, Channel], to: [audio, "To \"device output 1\""] }
    break: { set_param: { module: env, name: Sustain, display: "100" } }
    check: { kind: fixed, expect_param: { module: env, name: Sustain, display_max: 10 } }
    hints:
      fixed:
        - Гейт держится, пока пэд нажат. Какая ручка ADSR решает, где огибающая стоит в это время?
        - Посмотри на Sustain у ADSR.
        - Убавь Sustain до 10 % или ниже.
    faq:
      - q: Почему из-за Sustain удар превратился в органную ноту?
        a: Пока гейт высокий, огибающая стоит на уровне Sustain. При 100 % это максимум, поэтому звук держится на полной громкости, пока пэд нажат.
      - q: Как это видно на Scope?
        a: Размах волны держится на одном уровне, а не падает. При Sustain 0 размах быстро уходит в ноль.

  - id: b10
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - Для MIDI пэд — обычная нота. MIDI to Gate даёт каждой ноте диапазона свой гейт-выход.
      - Гейт держится 10 В, пока пэд нажат. Это не триггер.
      - Ударная огибающая: Attack около 1 мс, Decay в сотни миллисекунд, Sustain 0.
      - Драйвер, устройство, канал и начальную ноту выбирают на модуле.
      Сохрани патч: он пригодится в части 8.
      **Источники:** Core Modules и Voltage Standards, руководство VCV Rack.
    questions:
      - q: Чем гейт с пэда отличается от триггера и почему при Sustain 0 это не мешает?
        options:
