id: p9-03-bass-harmony
num: "9.3"
part: 9
title: Бас и гармония
goal: Заставить бас и пэд играть в одной тональности через два квантизатора с одинаковой шкалой.
builds: Мелодическая половина трека. В уроке 9.4 бас и пэд сложатся в секции.
minutes: 50
requires: [p9-01-track-architecture, p8-04-bass, p8-06-pad]
glossary: [тональность, шкала, аккорд, ход аккордов, квантизатор, корневая нота, полутон как 1/12 В, шаг]
sources: [omri-techno, ne-quantizers, vcv-voltage-standards]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: Бас и гармония
    page: |
      # 9.3 Бас и гармония
      **Ты научишься:** держать бас и [[аккорд|аккорды]] в одной [[тональность|тональности]] и проверять её по напряжению.
      **Ты соберёшь:** бас по восьмым и пэд, который меняет аккорд раз в бар. Оба идут через [[квантизатор|квантизаторы]].
      **Понадобится:** 50 минут, каркас из 9.2, бас из 8.4 и пэд из 8.6.
      Это мелодическая половина трека. Она ответит на вопрос, почему всё звучит вместе.
    figure: { template: keyboard, from: C4, to: C5, marks: [{ note: C4, volts: 0 }, { note: A4, volts: 0.75 }, { note: C5, volts: 1 }], caption: "Нота — это напряжение. C4 — 0 В, A4 — 0,75 В, C5 — 1 В." }
    faq:
      - q: Почему тональность проверяют по напряжению, а не на слух?
        a: "Слух может подвести: фальшь слышна, а причину нет. Напряжение показывает точно, какая нота идёт. По числам ты сразу видишь, что нота не из шкалы."
      - q: Нужно ли знать нотную грамоту?
        a: Нет. Хватает названий нот и правила 1/12 В на полутон. Остальное квантизатор делает сам.
      - q: Что, если мой бас из 8.4 уже в другой тональности?
        a: "Переведи его в A-минор: пропусти через Quantizer с клавишами A B C D E F G. Партии, которые идут через общую шкалу, не могут разойтись."

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса про квантизатор и вольты. Ответы подскажут, что повторить.
    questions:
      - q: У Quantizer включены клавиши A B C D E F G. На вход пришла нота C♯. Что на выходе Pitch?
        free: true
        options:
          - { text: "Ближайшая нота шкалы, C или D", correct: true, why: "Квантизатор округляет любое напряжение до ближайшей разрешённой ноты. На выходе только ноты шкалы." }
          - { text: "C♯, потому что напряжение так задано", why: "Квантизатор не пропускает сигнал как есть. Он подтягивает его к шкале." }
          - { text: "0 В, потому что ноты нет в шкале", why: "Недопустимая нота не гасится. Она заменяется ближайшей разрешённой." }
      - q: Бас и аккорды стоят на квантизаторах с разной шкалой. Что произойдёт?
        options:
          - { text: "Иногда они возьмут ноты, которых нет у партнёра, и будет слышна фальшь", correct: true, why: "Каждый квантизатор знает только свою шкалу. Если шкалы разные, ноты расходятся." }
          - { text: "Ничего, квантизаторы синхронизируются сами", why: "Модули в Rack друг о друге не знают. Шкала у каждого своя." }
          - { text: "Собьётся темп", why: "Высота и темп — разные вещи. Темп задаёт Clocked." }
      - q: На сколько вольт по стандарту 1V/oct отличаются соседние полутоны?
        options:
          - { text: "На 1/12 В, около 0,083 В", correct: true, why: "Октава — 1 В. В октаве 12 полутонов, значит один полутон — 1/12 В." }
          - { text: "На 1 В", why: "1 В — это целая октава, а не один полутон." }
          - { text: "На 0,1 В", why: "Это округление. Точное значение 1/12 В, то есть 0,0833 В." }

  - id: b3
    type: story
    preset: story
    title: Нота — это вольты
    page: |
      # Нота — это вольты
      [[тональность|Тональность]] — набор разрешённых нот и нота, от которой идёт отсчёт ([[корневая нота]]).
      В Rack ноту несёт напряжение по стандарту [[1V/oct]]. 0 В — это C, 1 В — следующее C октавой выше.
      Один [[полутон как 1/12 В|полутон]] — 1/12 В. Значит, A стоит на 0,75 В, G на 0,5833 В, F на 0,4167 В.
    figure: { template: keyboard, from: C4, to: C5, marks: [{ note: C4, volts: 0 }, { note: F4, volts: 0.4167 }, { note: G4, volts: 0.5833 }, { note: A4, volts: 0.75 }], caption: "Белые клавиши с напряжением: C 0 В, F 0,4167 В, G 0,5833 В, A 0,75 В." }
    simpler: Представь лестницу. Одна ступенька — полутон, двенадцать ступенек — октава. Напряжение показывает, на какой ступеньке ты стоишь.
    faq:
      - q: Почему C это 0 В, а не A?
        a: "Так принято в 1V/oct: 0 В это C4. Ноль нужен как точка отсчёта, а C — первая нота нотной октавы. От неё и считают."
      - q: Как посчитать напряжение любой ноты?
        a: Посчитай полутоны от C и раздели на 12. Для A это 9 полутонов, 9/12 = 0,75 В. Для G это 7 полутонов, 7/12 = 0,5833 В.
      - q: Минор от A — это только белые клавиши?
        a: "Да. A-минор: A B C D E F G. Чёрных клавиш в нём нет, поэтому его удобно показывать на панели Quantizer."

  - id: b4
    type: story
    preset: story
    title: Квантизатор и шкала
    page: |
      # Квантизатор и шкала
      [[квантизатор|Квантизатор]] округляет любое напряжение до ближайшей ноты [[шкала|шкалы]]. Шкалу ты выбираешь клавишами на панели.
      Правило курса: все партии с высотой идут через квантизаторы с одной шкалой. Тогда их ноты не расходятся.
      Агент не видит клавиши шкалы: это не параметры. Поэтому проверяй числа: все ноты на выходе должны принадлежать A-минору.
    figure: { template: table, rows: [[Нота, Полутонов от C, Напряжение], [A, 9, "0,75 В"], [B, 11, "0,9167 В"], [C, 0, "0 В"], [D, 2, "0,1667 В"]], caption: "Часть нот A-минора с напряжением. Остальные: E 4, F 5, G 7." }
    simpler: Квантизатор — как расчёска. Шкала задаёт зубцы. Любая нота падает в ближайший зубец, а не между ними.
    faq:
      - q: Почему нужен именно квантизатор на каждую партию?
        a: Бас и аккорд берут высоту из разных секвенсоров. Квантизатор каждого подтягивает ноты к шкале. Если шкала одна, всё складывается в тональность.
      - q: Как проверить шкалу, если клавиш не видно в данных?
        a: Читай напряжение на выходе Pitch. Умножь вольты на 12, округли и возьми остаток от деления на 12 — это номер полутона. Для A-минора допустимы 9, 11, 0, 2, 4, 5, 7.
      - q: Что, если включить все двенадцать клавиш?
        a: Квантизатор пропускает любую ноту, тональность пропадает. Верни A-минор.

  - id: b5
    type: story
    preset: story
    title: Аккорд и ход аккордов
    page: |
      # Аккорд и ход аккордов
      [[аккорд|Аккорд]] — несколько нот вместе. [[ход аккордов|Ход аккордов]] — их последовательность по барам.
      Для A-минора возьмём A, F, C, G: по аккорду на бар, четыре бара по кругу.
      Бас играет корни и свой ритм. Пэд держит аккорд сверху: корень, квинта (+7 полутонов), октава (+12).
    figure: { template: table, rows: [[Голос, Сдвиг, Напряжение], [корень, 0, "0 В"], [квинта, "+7 полутонов", "+0,5833 В"], [октава, "+12 полутонов", "+1 В"]], caption: "Три голоса пэда. Сдвиги постоянные, от корня." }
    simpler: Колокол. Одна нота звучит, а к ней добавляются ещё две. Сдвиг всегда один и тот же, как у аккордеона.
    faq:
      - q: Почему только корень, квинта и октава?
        a: "Постоянные сдвиги не следуют шкале. Терцию так не получить на всех ступенях: на одной она малая, на другой большая. Корень, квинта и октава звучат нейтрально, лад задаёт бас."
      - q: Можно ли сделать настоящий аккорд с терцией?
        a: Можно, если поставить второй Quantizer с Pre-offset +3 или +4 перед голосом. Это тонкий приём с неоднозначным округлением, поэтому мы его пропускаем.
      - q: Откуда аккордовый секвенсор знает, когда менять аккорд?
        a: Его тактирует выход Step 1 басового SEQ 3. Фронт Step 1 приходит один раз за цикл баса, то есть раз в бар.

  - id: b6
    type: live
    preset: live
    title: Бас через квантизатор
    page: |
      # Бас через квантизатор
      SEQ 3 выдаёт напряжения, Quantizer подтягивает их к шкале, Octave опускает на две октавы.
      Клавиши шкалы на панели Quantizer поставь сам: A B C D E F G.
      Звук идёт сразу: огибающей нет, меняется только высота.
    modules:
      - ref: clk
        plugin: ImpromptuModular
        slug: Clocked
        params: { Master clock: { display: "120" } }
      - ref: seq
        plugin: Fundamental
        slug: SEQ3
        params:
          Steps: { display: "8" }
          CV 1 step 1: { display: "0" }
          CV 1 step 2: { display: "0.1667" }
          CV 1 step 3: { display: "0.3333" }
          CV 1 step 4: { display: "0.1667" }
          CV 1 step 5: { display: "0" }
          CV 1 step 6: { display: "0.5833" }
          CV 1 step 7: { display: "0.4167" }
          CV 1 step 8: { display: "0.0833" }
      - { ref: q, plugin: Fundamental, slug: Quantizer }
      - { ref: oct, plugin: Fundamental, slug: Octave, params: { Shift: { display: "-2" } } }
      - { ref: vco, plugin: Fundamental, slug: VCO }
    cables:
      - { from: [clk, Clock 1], to: [seq, Clock] }
      - { from: [clk, Reset], to: [seq, Reset] }
      - { from: [seq, CV 1], to: [q, 1V/octave pitch] }
      - { from: [q, Pitch], to: [oct, 1V/octave pitch] }
      - { from: [oct, Pitch], to: [vco, 1V/octave pitch] }
      - { from: [vco, Sawtooth], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: q, text: "**Pitch** — только ноты шкалы.", targets: [{ module: q, output: Pitch }] }
      - { after: oct, text: "**Shift** −2: на две октавы ниже.", targets: [{ module: oct, param: Shift }] }
    faq:
      - q: Звук не меняется. Что проверить?
        a: Посмотри, идёт ли Clocked и приходят ли напряжения на шаги CV 1. Потом проверь кабель от Quantizer к Octave и от Octave к VCO.
      - q: Почему бас тише или звучит как гул?
        a: Shift стоит на −2, VCO играет в низкой области. Это для баса нормально. Если звук слишком низкий, поставь Shift на −1.
      - q: Нужно ли ставить клавиши шкалы вручную?
        a: Да. Агент и снимок клавиш не видят. Нажми A, B, C, D, E, F и G на панели Quantizer.

  - id: b7
    type: live
    preset: live
    title: Аккорд из двух голосов
    page: |
      # Аккорд из двух голосов
      Аккордовый SEQ 3 выдаёт корни: A, F, C, G. Quantizer ведёт оба голоса пэда.
      Второй VCO стоит на 392 Гц — квинта над первым. Постоянный интервал остаётся при любом корне.
      В демо корень меняется каждую долю, чтобы ты быстрее слышал ход.
    modules:
      - ref: clk
        plugin: ImpromptuModular
        slug: Clocked
        params: { Master clock: { display: "120" } }
      - ref: seq
        plugin: Fundamental
        slug: SEQ3
        params:
          Steps: { raw: 4 }
          CV 1 step 1: { display: "0.75" }
          CV 1 step 2: { display: "0.4167" }
          CV 1 step 3: { display: "0" }
          CV 1 step 4: { display: "0.5833" }
      - { ref: q, plugin: Fundamental, slug: Quantizer }
      - { ref: va, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: vb, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "392" } } }
    cables:
      - { from: [clk, Clock 1], to: [seq, Clock] }
      - { from: [clk, Reset], to: [seq, Reset] }
      - { from: [seq, CV 1], to: [q, 1V/octave pitch] }
      - { from: [q, Pitch], to: [va, 1V/octave pitch] }
      - { from: [q, Pitch], to: [vb, 1V/octave pitch] }
      - { from: [va, Sawtooth], to: [audio, "To \"device output 1\""] }
      - { from: [vb, Sawtooth], to: [audio, "To \"device output 2\""] }
    notes:
      - { after: q, text: "Один **Pitch** на два голоса.", targets: [{ module: q, output: Pitch }] }
    faq:
      - q: Почему второй VCO на 392 Гц?
        a: "261,63 Гц это C4. Квинта над C — G4, то есть 392 Гц. Сдвиг от первого голоса постоянный: 7 полутонов, множитель 2 в степени 7/12."
      - q: Звучит неточно, голоса «плывут». Это нормально?
        a: Нет. Оба VCO должны получать один и тот же Pitch. Проверь, что кабели идут в 1V/octave pitch обоих VCO.
      - q: Почему голоса идут в разные стороны Audio?
        a: "Один голос слева, другой справа: так проще услышать их отдельно. В треке оба пойдут через VCA в мастер."

  - id: b8
    type: anatomy
    preset: anatomy
    title: Панель Quantizer
    page: |
      # Панель Quantizer
      Двенадцать клавиш выбирают шкалу. Это не параметры, поэтому ставишь их сам.
    module: { ref: q, plugin: Fundamental, slug: Quantizer }
    notes:
      - { text: "Вход **1V/octave pitch** принимает любое напряжение.", targets: [{ module: q, input: 1V/octave pitch }] }
      - { text: "Выход **Pitch** — ближайшая нота шкалы.", targets: [{ module: q, output: Pitch }] }
      - { text: "**Pre-offset** сдвигает вход на −12…+12 полутонов до округления.", targets: [{ module: q, param: Pre-offset }] }
    faq:
      - q: Что на панели значат двенадцать клавиш?
        a: Каждая клавиша — нота октавы. Горит — нота разрешена, не горит — запрещена. Для A-минора горят A B C D E F G.
      - q: Pre-offset сдвигает ноты в шкале или вне?
        a: Он сдвигает вход до округления. Результат всё равно попадает в шкалу, поэтому весь бас смещается на тон, но остаётся внутри шкалы.
      - q: Квантизатор меняет темп?
        a: Нет. Он меняет только высоту. Темп задаёт Clocked.

  - id: b9
    type: anatomy
    preset: anatomy
    title: Панель Octave
    page: |
      # Панель Octave
      Один модуль сдвигает высоту на целые октавы.
    module: { ref: oct, plugin: Fundamental, slug: Octave }
    notes:
      - { text: "Вход **1V/octave pitch** принимает высоту.", targets: [{ module: oct, input: 1V/octave pitch }] }
      - { text: "**Shift** — число октав, от −4 до 4. Бас держи не выше −1.", targets: [{ module: oct, param: Shift }] }
      - { text: "**Octave shift CV** меняет Shift напряжением.", targets: [{ module: oct, input: Octave shift CV }] }
      - { text: "Выход **Pitch** идёт на VCO баса.", targets: [{ module: oct, output: Pitch }] }
    faq:
      - q: Зачем бас на октаву ниже аккорда?
        a: Если бас и аккорд лежат в одной области, они мешают друг другу. Октавы разделяют их по высоте, и каждая партия звучит отчётливо.
      - q: Что будет, если Shift поднять до 0?
        a: Бас сравняется по высоте с аккордом и начнёт его заглушать. Верни Shift не выше −1.
      - q: Нужен ли Octave, если есть Frequency у VCO?
        a: Frequency двигает всё VCO вручную. Octave делает то же напряжением и сохраняет настройку в патче.

  - id: b10
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Выключи клавишу C на Quantizer и сыграй басовый ход."
        see: "[[шаг|Шаги]], которые попадали на C, уходят на соседнюю ноту шкалы. Включи клавишу обратно."
      - do: "Включи все двенадцать клавиш."
        see: "Квантизатор пропускает любую ноту, тональность исчезает. Верни A-минор."
      - do: "Поставь **Pre-offset** на +2."
        see: "Весь бас смещается на тон, но остаётся внутри шкалы."
      - do: "Поверни **Shift** у Octave от −2 к −1 и к 0."
        see: "Бас поднимается на октаву за шаг. Верни не выше −1."
    modules:
      - ref: clk
        plugin: ImpromptuModular
        slug: Clocked
        params: { Master clock: { display: "120" } }
      - ref: seq
        plugin: Fundamental
        slug: SEQ3
        params:
          Steps: { display: "8" }
          CV 1 step 1: { display: "0" }
          CV 1 step 2: { display: "0.1667" }
          CV 1 step 3: { display: "0.3333" }
          CV 1 step 4: { display: "0.1667" }
          CV 1 step 5: { display: "0" }
          CV 1 step 6: { display: "0.5833" }
          CV 1 step 7: { display: "0.4167" }
          CV 1 step 8: { display: "0.0833" }
      - { ref: q, plugin: Fundamental, slug: Quantizer }
      - { ref: oct, plugin: Fundamental, slug: Octave, params: { Shift: { display: "-2" } } }
      - { ref: vco, plugin: Fundamental, slug: VCO }
    cables:
      - { from: [clk, Clock 1], to: [seq, Clock] }
      - { from: [clk, Reset], to: [seq, Reset] }
      - { from: [seq, CV 1], to: [q, 1V/octave pitch] }
      - { from: [q, Pitch], to: [oct, 1V/octave pitch] }
      - { from: [oct, Pitch], to: [vco, 1V/octave pitch] }
      - { from: [vco, Sawtooth], to: [audio, "To \"device output 1\""] }
    notes:
      - { after: q, text: "Клавиши и **Pre-offset**: шаги 1–3.", targets: [{ module: q, param: Pre-offset }] }
      - { after: oct, text: "Шаг 4: **Shift**.", targets: [{ module: oct, param: Shift }] }
    faq:
      - q: Выключил клавишу, а звук не изменился.
        a: Возможно, ни один шаг не попадал на эту ноту. Выбери клавишу, на которую приходится басовый ход, или послушай несколько циклов.
      - q: После Pre-offset нота стала странной.
        a: Pre-offset сдвигает вход до округления, поэтому нота всё равно остаётся в шкале. Если звук «не тот», сравни с исходным и верни ручку на 0.
      - q: Басу стало тесно с аккордом. Что сделать?
        a: Верни Shift не выше −1. Тогда бас лежит минимум на октаву ниже аккорда.

  - id: b11
    type: practice
    preset: practice
    title: Практика — бас и аккорды в одной тональности
    task: |
      Подключи бас из 8.4 и пэд из 8.6 к каркасу.
      1. Басовый SEQ 3: `Clock 1`, `Reset`. `CV 1` → Quantizer → Octave → VCO баса. **Shift** не выше −1.
      2. `Step 1` басового SEQ 3 → `Clock` аккордового. Его `Reset` — от Clocked.
      3. Аккордовый `CV 1` → второй Quantizer → оба VCO пэда. Второй VCO не ниже 300 Hz.
      4. На обоих Quantizer поставь A-минор. Запиши тональность и ход в Notes.
    given: [audio]
    check: p9-03-bass-harmony
    hints:
      "cable:1":
        - Басовая линия не привязана к мастер-такту.
        - Какой выход Clocked ведёт на секвенсор?
        - "`Clock 1` у Clocked → вход `Clock` басового SEQ 3."
      "cable:2":
        - Басовый секвенсор не слышит общий сброс.
        - Куда идёт Reset у Clocked?
        - "`Reset` у Clocked → вход `Reset` басового SEQ 3."
      "cable:3":
        - Мелодия баса не проходит через квантизатор.
        - Какой выход SEQ 3 несёт высоту?
        - "`CV 1` басового SEQ 3 → вход `1V/octave pitch` первого Quantizer."
      "cable:4":
        - Бас берёт ноту не из квантизатора.
        - Куда идёт Pitch у Quantizer?
        - "`Pitch` первого Quantizer → вход `1V/octave pitch` у Octave."
      "cable:5":
        - Бас не получает нижнюю октаву.
        - Куда идёт Pitch у Octave?
        - "`Pitch` у Octave → вход `1V/octave pitch` VCO баса."
      "cable:6":
        - Аккорды не привязаны к такту баса.
        - Какой выход басового SEQ 3 поднимается раз за цикл?
        - "`Step 1` басового SEQ 3 → вход `Clock` аккордового SEQ 3."
      "cable:7":
        - Аккордовый секвенсор не слышит общий сброс.
        - Куда идёт Reset у Clocked?
        - "`Reset` у Clocked → вход `Reset` аккордового SEQ 3."
      "cable:8":
        - Корни аккордов не проходят через квантизатор.
        - Какой выход аккордового SEQ 3 несёт высоту?
        - "`CV 1` аккордового SEQ 3 → вход `1V/octave pitch` второго Quantizer."
      "cable:9":
        - Первый голос пэда не слышит квантизатор.
        - Откуда он берёт высоту?
        - "`Pitch` второго Quantizer → `1V/octave pitch` первого пэд-VCO."
      "cable:10":
        - Второй голос уйдёт из тональности.
        - Какой Pitch нужен второму VCO?
        - "Тот же `Pitch` второго Quantizer → `1V/octave pitch` второго пэд-VCO."
      "param:1":
        - Бас должен лежать ниже аккорда.
        - Что стоит на Shift у Octave?
        - Поставь **Shift** не выше −1.
      "param:2":
        - Второй голос должен быть выше первого хотя бы на малую терцию.
        - Сколько Hz на Frequency второго пэд-VCO?
        - Поставь **Frequency** не ниже 300 Hz при первом на 261,63.
      "probe:1":
        - Нота на выходе баса не меняется.
        - Разные ли напряжения на CV 1 step и идёт ли такт?
        - Поставь разные **CV 1 step** у басового SEQ 3 и проверь Clocked.
      "probe:2":
        - Корень аккорда не меняется.
        - Приходит ли такт на аккордовый SEQ 3, разные ли у него CV 1?
        - Подай `Step 1` басового в `Clock` аккордового, **Steps** не меньше 2, и задай разные **CV 1 step**.
    faq:
      - q: Проверка не видит клавиши шкалы. Как убедиться, что они одинаковые?
        a: "Проверь глазами: на обоих Quantizer горят одни и те же клавиши. Или прочитай Pitch обоих и посчитай номера полутонов: все должны быть из набора A-минора."
      - q: Нужно ли вручную прописывать корни аккордов?
        a: Да. Поставь на шагах 1–4 аккордового SEQ 3 напряжения 0,75, 0,4167, 0 и 0,5833 В. Это корни A, F, C, G.
      - q: Квинта получилась не такой, как в демо. Почему?
        a: Квинта зависит от Frequency первого голоса. Если он на 261,63 Гц, второй на 392 Гц. Сдвинь оба одинаково, если меняешь высоту.

  - id: b12
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Аккорд играет корень, а второй голос застрял на одной ноте и не вписывается.
      Найди одну ошибку и исправь её одним кабелем.
    modules:
      - ref: clk
        plugin: ImpromptuModular
        slug: Clocked
        params: { Master clock: { display: "120" } }
      - ref: seq
        plugin: Fundamental
        slug: SEQ3
        params:
          Steps: { raw: 4 }
          CV 1 step 1: { display: "0.75" }
          CV 1 step 2: { display: "0.4167" }
          CV 1 step 3: { display: "0" }
          CV 1 step 4: { display: "0.5833" }
      - { ref: q, plugin: Fundamental, slug: Quantizer }
      - { ref: va, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "261.63" } } }
      - { ref: vb, plugin: Fundamental, slug: VCO, params: { Frequency: { display: "392" } } }
    cables:
      - { from: [clk, Clock 1], to: [seq, Clock] }
      - { from: [clk, Reset], to: [seq, Reset] }
      - { from: [seq, CV 1], to: [q, 1V/octave pitch] }
      - { from: [q, Pitch], to: [va, 1V/octave pitch] }
      - { from: [q, Pitch], to: [vb, 1V/octave pitch] }
      - { from: [va, Sawtooth], to: [audio, "To \"device output 1\""] }
      - { from: [vb, Sawtooth], to: [audio, "To \"device output 2\""] }
    break: { remove_cable: [q, Pitch, vb, 1V/octave pitch] }
    check: { kind: fixed, expect_cable: [[q, Pitch, va, 1V/octave pitch], [q, Pitch, vb, 1V/octave pitch]] }
    hints:
      fixed:
        - Один голос идёт за корнем, другой нет.
        - Проверь, куда идёт Pitch у Quantizer.
        - Соедини `Pitch` у Quantizer с `1V/octave pitch` второго VCO.
    faq:
      - q: Почему второй голос застрял на одной ноте?
        a: Без кабеля 1V/oct VCO играет ноту, на которую повернута ручка Frequency. Он не идёт за корнем и скоро выходит из тональности.
      - q: Как услышать, что голос не идёт за корнем?
        a: "Сравни голоса по Audio: один меняется с каждым шагом, другой стоит. Аккорд перестаёт быть аккордом."

