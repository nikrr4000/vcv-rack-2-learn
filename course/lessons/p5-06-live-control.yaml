    faq:
      - q: Как вернуть нужную долю после мьюта?
        a: Подай сброс на секвенсор и на такт. Тогда все партии встанут на первую долю вместе. Это самый чистый способ собрать музыку после вариаций.
      - q: Что повторить, если сброс не работает?
        a: Проверь, что кабель идёт в Reset, а не в Clock, и что источник даёт именно триггер. Затем вернись к блоку «Два сброса».
