        options:
          - { text: "Тишина, хвост, замирание шага, падение на 0 В", correct: true, why: "Каждый мьют режет свою часть: звук, гейт, такт или напряжение высоты." }
          - { text: "Во всех случаях звук обрывается сразу", why: "Только мьют звука даёт мгновенную тишину. Остальные звучат иначе." }
          - { text: "Во всех случаях меняется темп", why: "Мьют темп не трогает. Он только блокирует сигнал." }
      - q: Чем Row N trigger отличается от Row N gate?
        options:
          - { text: "Trigger — короткий импульс, gate — пока держишь кнопку", correct: true, why: "Для сброса нужен триггер, для длинных событий — гейт." }
          - { text: "Gate короче триггера", why: "Наоборот: триггер — короткий импульс." }
