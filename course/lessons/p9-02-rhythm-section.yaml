id: p9-02-rhythm-section
num: "9.2"
part: 9
title: Ритм-секция
goal: Запустить бочку, снейр и хэт от одного мастер-такта и сделать два паттерна, A и B.
builds: Ритм-секция трека. В уроке 9.4 между паттернами будут переключаться секции.
minutes: 50
requires: [p9-01-track-architecture, p8-01-kick, p8-02-snare-clap, p8-03-hihats]
glossary: [бар и доля, паттерн, бочка на каждую долю и бэкбит, офбит, ряд триггеров, шаг, длина гейта, деление такта]
sources: [omri-techno, sos-34, impromptu-clocked]

blocks:
  - id: b1
    type: cover
    preset: cover
    title: Ритм-секция
    page: |
      # 9.2 Ритм-секция
      **Ты научишься:** запускать бочку, снейр и хэт от одного такта и читать [[паттерн]] по [[шаг|шагам]].
      **Ты соберёшь:** бочку от SEQ 3, снейр от Gates и хэт от второго Gates. Плюс паттерн B.
      **Понадобится:** 50 минут, каркас из урока 9.1 и ударные из уроков 8.1–8.3.
      В 9.4 между паттернами A и B будет переключать сам трек.
    figure:
      template: flow
      layout: two-rows
      nodes:
        - { id: clk, label: Clocked, kind: gate }
        - { id: seq, label: SEQ 3, kind: gate }
        - { id: kick, label: Бочка, kind: cv }
        - { id: gb, label: Gates, kind: gate }
        - { id: snare, label: Снейр, kind: cv }
        - { id: gh, label: Gates, kind: gate }
        - { id: hat, label: Хэт, kind: cv }
      edges:
        - { from: clk, to: seq, kind: gate }
        - { from: seq, to: kick, kind: gate }
        - { from: clk, to: gb, kind: gate }
        - { from: gb, to: snare, kind: gate }
        - { from: clk, to: gh, kind: gate }
        - { from: gh, to: hat, kind: gate }
      caption: Один такт, три способа превратить его в удары.
    faq:
      - q: Зачем разные модули для бочки, снейра и хэта?
        a: Так ты видишь три способа получить ритм. Бочка — это рисунок на шагах SEQ 3. Снейр и хэт — деление и обрезка гейтов. В каркасе хватает двух видов модулей.
      - q: Нужны ли настоящие барабаны из части 8?
        a: Да. В практике ты перенесёшь их из патчей 8.1–8.3. Здесь они запускаются новыми кабелями от трека, а не кнопкой Push.
      - q: Что такое паттерн A и B?
        a: Два рисунка бочки, которые отличаются включёнными шагами. В уроке 9.4 трек будет переключаться между ними.

  - id: b2
    type: quiz
    preset: quiz
    title: Что ты уже знаешь
    lead: |
      # Сначала угадай
      Три вопроса про шаги, Flip и Flop и огибающие. Ответы подскажут, что повторить.
    questions:
      - q: У SEQ 3 включены шаги 1, 3, 5, 7 из восьми, шаг равен восьмой доле. Что слышно?
        free: true
        options:
          - { text: "Четыре удара на бар, по одному на каждую долю", correct: true, why: "Восьмая — половина доли. Включён каждый второй шаг, поэтому удар приходится на каждую долю." }
          - { text: "Восемь ударов, потому что шагов восемь", why: "Звучат только включённые шаги. Выключенные дают паузу." }
          - { text: "Два удара на бар, потому что включена половина", why: "Половина шагов — это четыре удара из восьми. Шаг равен восьмой, а не доле." }
      - q: Flip у Gates переключается на каждом фронте входа. Что даёт Flop при такте в доли?
        options:
          - { text: "Гейт, который поднимается на каждой второй доле", correct: true, why: "Flop — зеркало Flip. Его фронт приходится на вторую и четвёртую доли: это бэкбит." }
          - { text: "Тот же такт, только сдвинутый", why: "Flip и Flop делят частоту пополам. Задержки в них нет." }
          - { text: "Короткий триггер на каждой доле", why: "Триггер на каждом фронте даёт другой выход — Rising edge trigger. Flop реже." }
      - q: Почему длинный Decay у огибающей закрытого хэта портит ритм?
        options:
          - { text: "Звук ещё идёт, когда приходит следующий удар, и хэты сливаются", correct: true, why: "Закрытый хэт — короткий щелчок. Длинный хвост перекрывает следующий и превращает ритм в шум." }
          - { text: "Огибающая с длинным Decay не слышит новый гейт", why: "Слышит и перезапускается. Проблема в хвосте, а не в том, что огибающая занята." }
          - { text: "Decay меняет темп", why: "Темп задаёт Master clock. Decay отвечает только за длину хвоста." }

  - id: b3
    type: story
    preset: story
    title: Бар и доля
    page: |
      # Бар и доля
      Слово «такт» у нас уже занято: так мы называем clock, импульсы Clocked. Музыкальный такт мы зовём **баром**.
      [[бар и доля|Доля]] — один удар метронома. [[бар и доля|Бар]] — четыре доли.
      При 120 BPM доля идёт 0,5 с, а бар — 2 с. Темп один, а скорости разные получаются [[деление такта|делением]].
    figure: { template: clock, bpm: 120, divisions: [1, 2, 4], bars: 2, caption: "Одна сетка в трёх скоростях: доли, восьмые и шестнадцатые." }
    simpler: Метроном щёлкает на каждую долю. Если считать «раз-и, два-и», получатся восьмые. Темп не меняется, мы просто делим доли пополам.
    faq:
      - q: Чем бар отличается от такта в Rack?
        a: Такт (clock) — это сигнал Clocked, ровные импульсы. Бар — музыкальная единица в четыре доли. Один бар состоит из нескольких тактов, как слово из букв.
      - q: Сколько секунд идёт бар при 140 BPM?
        a: "Примерно 1,7 с. Считай так: бар равен четырём долям, одна доля — 60 делить на BPM секунд. При 140 это 0,43 с, а четыре доли дают 1,7 с."
      - q: Почему восьмых в баре восемь?
        a: Доля делится пополам, а в баре четыре доли. Четыре раза по две — восемь. Поэтому SEQ 3 с восемью шагами по восьмым играет ровно один бар.

  - id: b4
    type: story
    preset: story
    title: Три рисунка
    page: |
      # Три рисунка
      Любому танцевальному треку нужны три рисунка.
      **[[бочка на каждую долю и бэкбит|Бочка на каждую долю]]:** удары на 1, 2, 3, 4.
      **Бэкбит:** снейр на второй и четвёртой доле.
      **Офбит:** события между долями, на «и». Классический случай — открытый хэт.
    figure: { template: steps, values: [0, 0, 0, 0, 0, 0, 0, 0], gates: [1, 0, 1, 0, 1, 0, 1, 0], caption: "Бочка на 8 шагах по восьмым: горят шаги 1, 3, 5 и 7, то есть каждая доля." }
    simpler: Представь, что ты хлопаешь в такт музыке. Бочка — шаги ногой на каждую долю. Снейр — хлопок на два и четыре. Хэт — быстрый шорох между ними.
    faq:
      - q: Почему бочка на каждую долю считается основой танцевальной музыки?
        a: Четыре ровных удара в баре дают опору, под которую удобно двигаться. На неё накладываются остальные партии. Поэтому с неё обычно и начинают трек.
      - q: Что делает бэкбит именно бэкбитом?
        a: Удар приходится на слабые доли, вторую и четвёртую. Бочка держит ровную опору, а снейр отвечает ей в промежутках. Разница между ними создаёт ощущение движения.
      - q: Чем офбит отличается от доли?
        a: Доля — это 1, 2, 3, 4. Офбит стоит между ними, на «и». Хэт на офбите даёт ритму подъём без лишних ударов.

  - id: b5
    type: story
    preset: story
    title: Как собрать ритм
    page: |
      # Как собрать ритм
      Бочку ведёт **SEQ 3**. Восемь шагов по восьмым дают один бар. Кнопки [[ряд триггеров|ряда триггеров]] решают, где удар.
      Снейр делает **Gates**: Flip и Flop делят такт пополам. Фронт Flop приходится на каждую вторую долю.
      Хэт берёт гейт восьмых напрямую. **Gate length** ([[длина гейта]]) обрезает его до короткого щелчка.
    figure: { template: table, rows: [[Инструмент, Модуль, Выход], [бочка, SEQ 3, Trigger], [снейр, Gates 1, Flop], [хэт, Gates 2, Gate]], caption: "Три инструмента, два вида модулей, один такт." }
    simpler: Один метроном и три музыканта. Первый играет по записанным нотам, второй хлопает через раз, третий отбивает быстро и коротко.
    faq:
      - q: Почему снейр не делают вторым секвенсором?
        a: Можно, но Flop проще. Он делит такт пополам и сам попадает на вторую и четвёртую доли. Один Gates заменяет целый секвенсор.
      - q: Что нужно, чтобы Flop попадал на 2 и 4?
        a: Такт на его входе должен идти в долю, а Reset flip/flop должен приходить вместе с началом бара. Иначе Flop сядет на первую и третью.
      - q: Что делает Gate length у хэта?
        a: Он задаёт, сколько гейт остаётся высоким. Для закрытого хэта хватает 10–150 мс. Если Decay огибающей короче гейта, гейт уже не влияет на звук.

  - id: b6
    type: live
    preset: live
    title: Бочка по шагам
    page: |
      # Бочка по шагам
      Clocked тактирует SEQ 3. Включены шаги 1, 3, 5 и 7. Звука нет: смотри на экран ADSR.
      Сейчас **Clock 1** идёт в долю, поэтому шаг равен доле. Удар приходится через долю.
      Нажми **Reset** у Clocked. Секвенсор вернётся на первый шаг.
    modules:
      - ref: clk
        plugin: ImpromptuModular
        slug: Clocked
        params: { Master clock: { display: "120" } }
      - ref: seq
        plugin: Fundamental
        slug: SEQ3
        params:
          Steps: { display: "8" }
          Step 1 trigger: { raw: 1 }
          Step 3 trigger: { raw: 1 }
          Step 5 trigger: { raw: 1 }
          Step 7 trigger: { raw: 1 }
      - ref: envk
        plugin: Fundamental
        slug: ADSR
        params: { Attack: { display: "1" }, Decay: { display: "250" }, Sustain: { display: "0" } }
    cables:
      - { from: [clk, Clock 1], to: [seq, Clock] }
      - { from: [clk, Reset], to: [seq, Reset] }
      - { from: [seq, Trigger], to: [envk, Gate] }
    notes:
      - { after: seq, text: "**Steps** = 8: бар по восьмым.", targets: [{ module: seq, param: Steps }] }
      - { after: envk, text: "**Decay** короче шага, удары не слипаются.", targets: [{ module: envk, param: Decay }] }
    faq:
      - q: Почему удары через долю, а не на каждую?
        a: Шаг пока равен доле, а включён каждый второй шаг. Когда в блоке «Покрути сам» ты ускоришь Clock 1 вдвое, шаг станет восьмой, и удары встанут на каждую долю.
      - q: Откуда SEQ 3 знает, где начало бара?
        a: Он считает шаги от Reset. После сигнала Reset секвенсор встаёт на первый шаг. Поэтому Reset у Clocked идёт на каждый секвенсор.
      - q: Почему Trigger, а не Step 1?
        a: Trigger выдаёт импульс только на включённых шагах. Step 1 — гейт первого шага независимо от кнопки. Он нужен для других задач.

  - id: b7
    type: live
    preset: live
    title: Снейр и хэт
    page: |
      # Снейр и хэт
      **Clock 2** идёт в долю и делится в первом Gates. Выход **Flop** запускает снейр.
      **Clock 1** идёт во второй Gates. Его **Gate** запускает хэт, а **Gate length** обрезает гейт.
      Reset у Clocked выравнивает оба Gates по началу бара.
    modules:
      - ref: clk
        plugin: ImpromptuModular
        slug: Clocked
        params: { Master clock: { display: "120" } }
      - { ref: gtb, plugin: Fundamental, slug: Gates }
      - ref: envs
        plugin: Fundamental
        slug: ADSR
        params: { Attack: { display: "1" }, Decay: { display: "250" }, Sustain: { display: "0" } }
      - { ref: gth, plugin: Fundamental, slug: Gates, params: { Gate length: { display: "30" } } }
      - ref: envh
        plugin: Fundamental
        slug: ADSR
        params: { Attack: { display: "1" }, Decay: { display: "80" }, Sustain: { display: "0" } }
    cables:
      - { from: [clk, Clock 2], to: [gtb, Gate] }
      - { from: [clk, Reset], to: [gtb, Reset flip/flop] }
      - { from: [gtb, Flop], to: [envs, Gate] }
      - { from: [clk, Clock 1], to: [gth, Gate] }
      - { from: [gth, Gate], to: [envh, Gate] }
    notes:
      - { after: gtb, text: "**Flop** поднимается на каждой второй доле.", targets: [{ module: gtb, output: Flop }] }
      - { after: gth, text: "**Gate length** — длина щелчка.", targets: [{ module: gth, param: Gate length }] }
    faq:
      - q: Почему снейр берётся с Flop, а не с Flip?
        a: Flip поднимается на первой и третьей доле, Flop — на второй и четвёртой. Бэкбиту нужны вторая и четвёртая. Если фаза сбилась, поменяй выход или нажми Reset flip/flop.
      - q: Зачем второй Gates для хэта?
        a: Gate length режет импульс до нужной длины. Без обрезки гейт Clocked слишком длинный, и хэт звучит как шипение.
      - q: Почему у хэта Decay 80 мс, а у снейра 250?
        a: Закрытый хэт — короткий щелчок, а снейр звучит дольше. Хвосты разной длины помогают их различать.

  - id: b8
    type: anatomy
    preset: anatomy
    title: Панель SEQ 3
    page: |
      # Панель SEQ 3
      Для ритма нужны шаги, ряд триггеров и три входа и выхода.
    module: { ref: seq, plugin: Fundamental, slug: SEQ3 }
    notes:
      - { text: "**Steps** — длина цикла. 8 шагов по восьмым дают один бар.", targets: [{ module: seq, param: Steps }] }
      - { text: "**Step 1 trigger** … **Step 8 trigger** — кнопки ряда триггеров. Горит — удар.", targets: [{ module: seq, param: Step 1 trigger }, { module: seq, param: Step 8 trigger }] }
      - { text: "Вход **Clock** принимает такт. Каждый такт — один шаг.", targets: [{ module: seq, input: Clock }] }
      - { text: "Вход **Reset** возвращает цикл на первый шаг.", targets: [{ module: seq, input: Reset }] }
      - { text: "Выход **Trigger** даёт импульс только на включённых шагах.", targets: [{ module: seq, output: Trigger }] }
    faq:
      - q: Как узнать, какие шаги включены?
        a: По подсветке кнопок на панели. Значение параметра в Rack не всегда совпадает с подсветкой, поэтому смотри на сами кнопки.
      - q: Что, если Steps меньше 8?
        a: Цикл короче. При Steps равном 4 восьмых хватит на полбара, и паттерн повторится дважды в баре.
      - q: Зачем у SEQ 3 свой Tempo, если есть Clocked?
        a: Внешний Clock отключает внутренний темп. В треке секвенсор слышит только Clocked.

  - id: b9
    type: anatomy
    preset: anatomy
    title: Панель Gates
    page: |
      # Панель Gates
      Один вход, шесть выходов. Для ритма нужны Flip, Flop и Gate.
    module: { ref: gtb, plugin: Fundamental, slug: Gates }
    notes:
      - { text: "Вход **Gate** принимает такт.", targets: [{ module: gtb, input: Gate }] }
      - { text: "**Flip** переключается на каждом фронте. Выход делит такт пополам.", targets: [{ module: gtb, output: Flip }] }
      - { text: "**Flop** — зеркало Flip. Фронт Flop приходится на вторую и четвёртую доли.", targets: [{ module: gtb, output: Flop }] }
      - { text: "**Reset flip/flop** ставит пару в начальное положение. Подай сюда Reset Clocked.", targets: [{ module: gtb, input: Reset flip/flop }] }
      - { text: "**Gate length** — длина гейта на выходе **Gate**, от 1 мс до 10 с.", targets: [{ module: gtb, param: Gate length }, { module: gtb, output: Gate }] }
    faq:
      - q: Flip и Flop звучат одинаково?
        a: Нет. Они идут в противофазе. Когда Flip высокий, Flop низкий. Поэтому один подходит для первой и третьей долей, другой для второй и четвёртой.
      - q: Что делает кнопка Reset flip/flop?
        a: Возвращает Flip в низкое положение, а Flop в высокое. После этого следующий фронт даст Flip высокий, а у Flop будет вторая доля.
      - q: Gate length и Decay — одно и то же?
        a: Нет. Gate length — это длина гейта, Decay — длина хвоста огибающей. Если Decay короче гейта, слышен только Decay.

  - id: b10
    type: anatomy
    preset: anatomy
    title: Ручки выходов Clocked
    page: |
      # Ручки выходов Clocked
      Каждый выход Clocked имеет свои ручки. Проверяй их по экрану ADSR и по бегущим шагам SEQ 3.
    module: { ref: clk, plugin: ImpromptuModular, slug: Clocked }
    notes:
      - { text: "**Clk 1 ratio** — во сколько раз Clock 1 быстрее или медленнее мастера. Центр — в такт мастеру.", targets: [{ module: clk, param: Clk 1 ratio }] }
      - { text: "**Clk 2 ratio** — то же для Clock 2. Для снейра оставь центр: он идёт в долю.", targets: [{ module: clk, param: Clk 2 ratio }] }
      - { text: "**Swing clk 1** — «качание» Clock 1. Центр — ровный такт, в стороны — сдвиг через раз.", targets: [{ module: clk, param: Swing clk 1 }] }
      - { text: "**Pulse width clk 1** — ширина импульса Clock 1, от 0 до 1. По умолчанию 0,5.", targets: [{ module: clk, param: Pulse width clk 1 }] }
      - { text: "**Delay clk 1** — сдвиг Clock 1 по времени, от 0 до 7.", targets: [{ module: clk, param: Delay clk 1 }] }
    faq:
      - q: Какая сторона у Clk ratio делит, а какая умножает?
        a: Определи по экрану. Поверни ручку и посмотри на скорость бегущих шагов SEQ 3. Если шаги замедлились, ручка делит. Тогда поверни её в другую сторону от центра.
      - q: Зачем Swing, если ритм у меня ровный?
        a: Swing добавляет лёгкое запаздывание каждой второй ноты. Ритм становится «живым». Для строгого техно оставь центр, для хауса можно сдвинуть чуть-чуть.
      - q: Чем Pulse width отличается от Gate length?
        a: "Pulse width задаёт ширину импульса прямо на Clocked. Gate length обрезает гейт уже после Gates. Для хэта удобнее второе: ручка стоит рядом с огибающей."

  - id: b11
    type: try
    preset: try
    title: Покрути сам
    steps:
      - do: "Поверни **Clk 1 ratio** от центра вправо или влево, пока шаги SEQ 3 не пойдут вдвое быстрее."
        see: "Бочка играет на каждую долю, а хэт — на каждую восьмую. Если шаги замедлились, ручка идёт в другую сторону."
      - do: "Включи и выключи **Step 3 trigger** и **Step 5 trigger**."
        see: "На месте выключенного шага пауза. Рисунок бара меняется."
      - do: "Подними **Gate length** у хэтового Gates с 30 до 150."
        see: "Гейт растёт, но при коротком Decay огибающая заканчивается раньше него."
      - do: "Подними **Decay** хэта до 500."
        see: "Хэты начинают слипаться. Верни Decay к 80."
    modules:
      - ref: clk
        plugin: ImpromptuModular
        slug: Clocked
        params: { Master clock: { display: "120" } }
      - ref: seq
        plugin: Fundamental
        slug: SEQ3
        params:
          Steps: { display: "8" }
          Step 1 trigger: { raw: 1 }
          Step 3 trigger: { raw: 1 }
          Step 5 trigger: { raw: 1 }
          Step 7 trigger: { raw: 1 }
      - ref: envk
        plugin: Fundamental
        slug: ADSR
        params: { Attack: { display: "1" }, Decay: { display: "250" }, Sustain: { display: "0" } }
      - { ref: gth, plugin: Fundamental, slug: Gates, params: { Gate length: { display: "30" } } }
      - ref: envh
        plugin: Fundamental
        slug: ADSR
        params: { Attack: { display: "1" }, Decay: { display: "80" }, Sustain: { display: "0" } }
    cables:
      - { from: [clk, Clock 1], to: [seq, Clock] }
      - { from: [clk, Reset], to: [seq, Reset] }
      - { from: [seq, Trigger], to: [envk, Gate] }
      - { from: [clk, Clock 1], to: [gth, Gate] }
      - { from: [gth, Gate], to: [envh, Gate] }
    notes:
      - { after: clk, text: "Шаг 1: **Clk 1 ratio**.", targets: [{ module: clk, param: Clk 1 ratio }] }
    faq:
      - q: Как понять, в какую сторону крутить Clk 1 ratio?
        a: Смотри на скорость бегущих шагов SEQ 3. Если они замедлились, ручка делит. Тогда поверни её в другую сторону от центра.
      - q: Поставил Clk 1 ratio на максимум, и всё слилось.
        a: Это очень частый такт. Верни ручку к центру и сдвигай по одному щелчку, пока шаги не станут вдвое чаще долей.
      - q: Decay хэта 500, и звук стал шумом. Это поломка?
        a: Нет. Хэты просто перекрывают друг друга. Короткий Decay держит ритм чётким.

  - id: b12
    type: practice
    preset: practice
    title: Практика — два паттерна
    task: |
      Перенеси ударные из патчей 8.1–8.3 в каркас 9.1.
      1. Бочка: SEQ 3 (`Clock 1`, `Reset`), `Trigger` → огибающая бочки. Шаги 1, 3, 5, 7.
      2. Снейр: `Clock 2` → `Gate` первого Gates, `Reset` → `Reset flip/flop`, `Flop` → огибающая снейра.
      3. Хэт: `Clock 1` → второй Gates, `Gate` → огибающая хэта. **Gate length** 10–150 мс, **Decay** не больше 400 мс.
      4. Подбери **Clk 1 ratio** так, чтобы шаг равнялся восьмой.
      5. Паттерн B: второй SEQ 3 с другим рядом триггеров. Запиши A и B в Notes.
    given: [audio]
    check: p9-02-rhythm-section
    hints:
      "cable:1":
        - Бочка не слышит мастер-такт.
        - Какой выход Clocked ведёт на SEQ 3?
        - "`Clock 1` у Clocked → вход `Clock` у SEQ 3."
      "cable:2":
        - Бочка уйдёт от остальных.
        - Что возвращает все секвенсоры на первый шаг?
        - "`Reset` у Clocked → вход `Reset` у SEQ 3."
      "cable:3":
        - Бочка не запускается.
        - Какой выход SEQ 3 выдаёт триггеры по включённым шагам?
        - "`Trigger` у SEQ 3 → вход `Gate` огибающей бочки."
      "cable:4":
        - Снейр идёт от доли или от шага?
        - Какой такт у Clocked идёт в долю?
        - "`Clock 2` у Clocked → вход `Gate` первого Gates."
      "cable:5":
        - Снейр может сесть на неверные доли.
        - Что ставит Flip и Flop в начало бара?
        - "`Reset` у Clocked → вход `Reset flip/flop` первого Gates."
      "cable:6":
        - Снейр не слышен.
        - Какой выход Gates поднимается на второй и четвёртой доле?
        - "`Flop` у первого Gates → вход `Gate` огибающей снейра."
      "cable:7":
        - Откуда хэт берёт восьмые?
        - Какой такт у Clocked вдвое быстрее долей?
        - "`Clock 1` у Clocked → вход `Gate` второго Gates."
      "cable:8":
        - Хэт не запускается.
        - Какой выход Gates даёт короткий гейт?
        - "`Gate` у второго Gates → вход `Gate` огибающей хэта."
      "param:1":
        - Закрытый хэт — щелчок или звук?
        - Что стоит на Gate length сейчас?
        - Поставь **Gate length** от 10 до 150 мс.
      "param:2":
        - Сколько должен звучать закрытый хэт?
        - Сравни Decay с интервалом между восьмыми.
        - Поставь **Decay** огибающей хэта не больше 400 мс, лучше около 80.
      "probe:1":
        - Огибающая бочки не поднимается.
        - Идёт ли такт и горят ли шаги у SEQ 3?
        - Включи шаги бочки и проверь, что Clocked запущен.
      "probe:2":
        - Огибающая снейра не поднимается.
        - Идёт ли Clock 2 и приходит ли он на первый Gates?
        - Подай `Clock 2` в `Gate` первого Gates.
      "probe:3":
        - Огибающая хэта не поднимается.
        - Что приходит на `Gate` второго Gates?
        - Подай `Clock 1` в `Gate` второго Gates и проверь **Gate length**.
    faq:
      - q: Как перенести инструмент из патча 8.1?
        a: Открой патч 8.1, выдели модули инструмента и скопируй их через Cmd+C. В треке нажми Cmd+V. Проверь кабели внутри инструмента и замени запуск от Push на кабель из трека.
      - q: Проверка не видит паттерны A и B. Как её пройти?
        a: Проверка смотрит кабели и параметры. Какие кнопки горят, она не читает. Запиши рисунок в Notes и сверь его глазами.
      - q: Снейр попал на 1 и 3. Что делать?
        a: Нажми Reset flip/flop или поменяй Flop на Flip. Причина в том, что Gates стартовал с другой фазы.

  - id: b13
    type: debug
    preset: debug
    title: Найди поломку
    task: |
      Снейр после остановки иногда бьёт на первую и третью доли.
      Нажми **Reset** у Clocked. Найди одну ошибку и исправь её одним кабелем.
    modules:
      - ref: clk
        plugin: ImpromptuModular
        slug: Clocked
        params: { Master clock: { display: "120" } }
      - { ref: gtb, plugin: Fundamental, slug: Gates }
      - ref: envs
        plugin: Fundamental
        slug: ADSR
        params: { Attack: { display: "1" }, Decay: { display: "250" }, Sustain: { display: "0" } }
    cables:
      - { from: [clk, Clock 2], to: [gtb, Gate] }
      - { from: [clk, Reset], to: [gtb, Reset flip/flop] }
      - { from: [gtb, Flop], to: [envs, Gate] }
    break: { remove_cable: [clk, Reset, gtb, Reset flip/flop] }
    check: { kind: fixed, expect_cable: [clk, Reset, gtb, Reset flip/flop] }
    hints:
      fixed:
        - Flip и Flop помнят своё положение и после остановки могут встать не так.
        - Что приводит их к началу бара?
        - Соедини `Reset` у Clocked с `Reset flip/flop` у Gates.
    faq:
      - q: Почему Flop сам не знает, где начало бара?
        a: Он только переключается на каждом фронте. Начало бара ему задаёт Reset. Без него фаза зависит от того, в какой момент запустили такт.
      - q: Что, если подать Clock 2 на восьмые?
        a: Flop разделит их пополам, и снейр побежит на каждую долю. Рисунок бэкбита сломается. Вход Gates должен идти в долю.

  - id: b14
    type: recap
    preset: recap
    title: Итог
    page: |
      # Итог
      - Бар — четыре доли. 8 шагов по восьмым дают один бар.
      - Бочка идёт от шагов SEQ 3. Бочка на каждую долю — это шаги 1, 3, 5, 7.
      - Снейр на 2 и 4 даёт Flop у Gates. Reset ставит Flop в начало бара.
      - Хэт берёт гейт восьмых. Gate length и Decay держат его коротким.
      - Паттерны A и B отличаются рядом триггеров.
      **Источники:** Omri Cohen, «Building a Techno patch from scratch»; Gordon Reid, «Practical Bass Drum Synthesis» (Sound On Sound); документация Impromptu Modular.
    questions:
      - q: Почему снейр получают через Flop, а не вторым секвенсором?
        options:
          - { text: "Flop сам попадает на вторую и четвёртую доли", correct: true, why: "Flop делит такт пополам. Достаточно подать такт в долю и сбросить Gates в начале бара." }
          - { text: "Второй секвенсор не умеет запускать огибающую", why: "Умеет. Но Flop проще: один небольшой модуль вместо секвенсора." }
          - { text: "Flop громче Trigger", why: "Громкость не зависит от выхода. Выход влияет только на то, когда сигнал приходит." }
    next: |
      # Дальше: 9.3
      **Бас и гармония.** Бас и пэд из части 8 сыграют в одной тональности через квантизаторы.
    faq:
      - q: Сохранить ли патч?
        a: Да. Сохрани патч под номером 9.2. В 9.3 к нему добавятся бас и пэд.
      - q: Что повторить, если ритм не собирается?
        a: Урок 5.1 про Clocked и урок 5.2 про Gates. Чаще всего путают Flip и Flop или забывают Reset.
